<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 586" width="1140" height="586" role="img" aria-label="and what this design does NOT settle"><rect width="1140" height="586" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — checkpointing a stateful processor</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">23 loaded + 22 replayed = 45, the no-crash total</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 7 state entries · total 45</text><rect x="24" y="104" width="1092" height="336" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SCOPE</text><rect x="48" y="150" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The atomic commit of state and offset is assumed, not built. Everything in this design rests on it, and achieving it against an external sink is</text><text x="62" y="190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">ch05's two-phase commit problem.</text><rect x="48" y="216" width="1040" height="42" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="236" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">1 of the 7 state entries is never collectable here, and persistence makes that leak survive restarts rather than being cleared by one.</text><rect x="48" y="282" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="302" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Barrier alignment buffers 2 records on this 9-event stream with 2 sources. With badly skewed sources it is the dominant checkpoint cost, and</text><text x="62" y="322" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">nothing here bounds it.</text><rect x="48" y="348" width="1040" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">And recovery is only as good as the source's retention: replaying from offset 4 requires those 4 events to still exist.</text><text x="570" y="480" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and what this design does NOT settle</text><text x="570" y="512" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The first gap is the load-bearing one. Every correct recovery in this chapter assumed the state and the offset were committed together, and this</text><text x="570" y="529" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">design does not build that — it requires it. Against an internal store it is a local transaction; against an external sink it is exactly the</text><text x="570" y="546" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">distributed-commit problem ch05 recommended avoiding.</text></svg>