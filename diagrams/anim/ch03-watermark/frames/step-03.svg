oke-width="1"/><text x="137" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="194" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="247" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="304" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="357" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="414" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="467" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">01:10</text><rect x="524" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="577" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="634" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="687" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="744" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="797" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="854" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="907" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="964" y="198" width="106" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="1017" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">08:00</text><rect x="84" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:03</text><rect x="194" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="247" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="304" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="357" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="414" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="467" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="524" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="577" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="634" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="687" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="744" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="797" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">00:50</text><rect x="854" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="907" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">09:00</text><rect x="964" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">everything</text><text x="84" y="274" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">heuristic (row 2) advances to 12:03:05 by event id 4 · perfect (row 3) is stuck at 12:00:50</text><rect x="48" y="288" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="308" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The perfect watermark cannot pass 12:00:50 for 6 consecutive events, because id 7 (12:00:50) is still to come.</text><text x="62" y="328" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">The heuristic advanced to 12:03:05 in that same span. It bought 135s of apparent progress by being wrong.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — a PERFECT watermark exists — and it stalls</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is the clearest statement of what a heuristic watermark is FOR. The perfect watermark is correct and useless — it sits at 12:00:50 for 6 of</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the 9 events, so nothing can be emitted. The heuristic reaches 12:03:05 in the same span, and every bit of that 135s of progress is an unverified</text><text x="570" y="522" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">guess.</text></svg>