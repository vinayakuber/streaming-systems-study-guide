<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 1332" width="1235" height="1332" role="img" aria-label="the watermark claims a time is settled when it is not"><rect width="1235" height="1332" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Skew, a guessing watermark, and what completeness costs</text><text x="1211" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">max skew 230s (id 7) · waiting 60s drops 1 · waiting 230s drops 0</text><rect x="24" y="78" width="631" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SOURCE</text><text x="36" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 1  // primitive: len(xs) — element count.  len([1,2]) = 2</text><text x="36" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 2  // Two of an event's five fields are CLOCKS, which is the whole subject of ch01:</text><text x="36" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 3  //   et = event time, when the thing happened  ·  pt = processing time, when we saw it</text><text x="36" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 4  //   v  = the value being summed (clicks, here)  ·  key = which stream it belongs to</text><text x="36" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 5  type Event { id, key, et, pt, v }</text><text x="36" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 6  // primitive: EVENTS — the book's 9 events, in PROCESSING order (tools/stream_seed.js).</text><text x="36" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 7  //   EVENTS[0] = (id 0, key "a", et 1, pt 2, v 5)</text><text x="36" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 8  //   EVENTS[7] = (id 7, key "b", et 50, pt 280, v 4)   &lt;- the late one</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 9  // primitive: NONE — no value. Distinct from a value of 0.</text><text x="36" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">10  // primitive: MIN — seconds in a dashboard minute.  MIN = 60</text><text x="36" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">11  // primitive: LAG — the watermark's assumed worst-case skew.  LAG = 60</text><text x="36" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">12  // primitive: minOf(sec) — the START of the MIN-second minute holding sec.</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">13  //   minOf(1) = 0      minOf(280) = 240</text><text x="36" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">14  // primitive: add(m, k, n) — add n to m[k], starting from 0 when k is absent.</text><text x="36" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">15  //   add({}, 0, 5) = {0: 5}      add({0: 5}, 0, 3) = {0: 8}</text><text x="36" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">16  // primitive: keysOf(m) — m's keys, ascending.  keysOf({0: 12, 60: 7}) = [0, 60]</text><text x="36" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">17  </text><text x="36" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">18  type Split  { kept, dropped }</text><text x="36" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">19  type Budget { seconds, delayTotal }</text><text x="36" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">20  </text><text x="36" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">21  // primitive: skewOf(e) — how late an event was: pt minus et, in seconds.</text><text x="36" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">22  //   skewOf(EVENTS[0]) = 1      skewOf(EVENTS[7]) = 230</text><text x="36" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">23  // primitive: max(xs) — the largest element.  max([1, 3, 2]) = 3</text><text x="36" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">24  // primitive: WINDOWS_N — how many windows this pipeline produces.  WINDOWS_N = 4</text><text x="36" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">25  </text><text x="36" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">26  // function: watermarkAfter(i) — the completeness CLAIM after event i:</text><text x="36" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">27  //   the highest event time seen through i, minus LAG.</text><text x="36" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">28  //   watermarkAfter(0) = -59      watermarkAfter(7) = 200</text><rect x="30" y="560" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">29  fun watermarkAfter(i) {</text><text x="36" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">30      var seen = NONE</text><text x="36" y="606" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">31      for (j in 0 .. i) {</text><text x="36" y="623" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">32          if (seen == NONE) { seen = EVENTS[j].et }</text><text x="36" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">33          if (EVENTS[j].et &gt; seen) { seen = EVENTS[j].et }</text><text x="36" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">34      }</text><rect x="30" y="662" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">35      return seen - LAG</text><text x="36" y="691" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">36  }</text><text x="36" y="708" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">37  </text><text x="36" y="725" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">38  // function: waitFor(events, budget) — split events into those that arrive</text><text x="36" y="742" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">39  //   within budget seconds of happening, and those that do not.</text><text x="36" y="759" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">40  //   waitFor(EVENTS, 60).dropped = [7]</text><text x="36" y="776" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">41  //   waitFor(EVENTS, 230).dropped = []</text><text x="36" y="793" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">42  fun waitFor(events, budget) {</text><text x="36" y="810" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">43      var kept    = []</text><text x="36" y="827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">44      var dropped = []</text><text x="36" y="844" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">45      for (e in events) {</text><text x="36" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">46          if (skewOf(e) &lt;= budget) { kept.append(e.id) }</text><text x="36" y="878" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">47          if (skewOf(e) &gt; budget)  { dropped.append(e.id) }</text><text x="36" y="895" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">48      }</text><text x="36" y="912" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">49      return Split(kept, dropped)</text><text x="36" y="929" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">50  }</text><text x="36" y="946" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">51  </text><text x="36" y="963" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">52  // function: priceOf(budget) — the delay a budget adds across EVERY window.</text><text x="36" y="980" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">53  //   priceOf(60) = 240      priceOf(230) = 920</text><text x="36" y="997" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">54  fun priceOf(budget) {</text><text x="36" y="1014" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">55      return Budget(budget, budget * WINDOWS_N)</text><text x="36" y="1031" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">56  }</text><text x="36" y="1048" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">57  </text><text x="36" y="1065" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">58  // function: main() — THE CALLER: two budgets, priced against each other.</text><text x="36" y="1082" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">59  fun main() {</text><text x="36" y="1099" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">60      val claim = watermarkAfter(7)</text><text x="36" y="1116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">61      val cheap = waitFor(EVENTS, 60)</text><text x="36" y="1133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">62      val safe  = waitFor(EVENTS, 230)</text><text x="36" y="1150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">63      val extra = priceOf(230).delayTotal - priceOf(60).delayTotal</text><text x="36" y="1167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">64  }</text><rect x="671" y="78" width="244" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="681" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STACK  (grows downward)</text><rect x="681" y="92" width="224" height="98" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="691" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">main</text><text x="697" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">claim = ...</text><text x="697" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">cheap = ...</text><text x="697" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">safe = ...</text><text x="697" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">extra = ...</text><rect x="681" y="200" width="224" height="80" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="691" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">watermarkAfter</text><text x="697" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">i = 7</text><text x="697" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">seen = 260</text><text x="697" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">j = 7</text><rect x="931" y="78" width="280" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="941" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HEAP  (allocated objects)</text><text x="617.5" y="1226" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/0 — the watermark claims a time is settled when it is not</text><text x="617.5" y="1258" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">`seen` is the highest event time in the first 8 events — 260s — so the claim is 260 − 60 = 200. That asserts nothing earlier than 12:03:20 can still arrive. id</text><text x="617.5" y="1275" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">7, at 12:00:50, is arriving right now. The claim is false and the function has no way to know.</text></svg>