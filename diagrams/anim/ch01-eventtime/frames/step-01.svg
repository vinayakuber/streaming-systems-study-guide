<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 864" width="1140" height="864" role="img" aria-label="skew, measured: processing time minus event time"><rect width="1140" height="864" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Event time vs processing time — skew, watermarks, and what completeness costs</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">max skew 230s (id 7) · watermark lag 60s · waiting 60s drops 1 of 9</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="614" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HOW LATE EACH EVENT WAS, IN SECONDS</text><text x="134" y="160" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 0 · happened 12:00:01 · seen 12:00:02</text><rect x="134" y="170" width="8" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="152" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">1s</text><text x="134" y="212" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 1 · happened 12:00:03 · seen 12:00:04</text><rect x="134" y="222" width="8" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="152" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">1s</text><text x="134" y="264" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 2 · happened 12:01:30 · seen 12:01:33</text><rect x="134" y="274" width="9" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="153" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">3s</text><text x="134" y="316" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 3 · happened 12:02:10 · seen 12:02:12</text><rect x="134" y="326" width="8" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="152" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">2s</text><text x="134" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 4 · happened 12:04:05 · seen 12:04:06</text><rect x="134" y="378" width="8" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="152" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">1s</text><text x="134" y="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 5 · happened 12:04:20 · seen 12:04:25</text><rect x="134" y="430" width="15" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="159" y="448" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">5s</text><text x="134" y="472" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 6 · happened 12:03:40 · seen 12:04:30</text><rect x="134" y="482" width="152" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="296" y="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">50s</text><text x="134" y="524" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 7 · happened 12:00:50 · seen 12:04:40</text><rect x="134" y="534" width="700" height="26" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="844" y="552" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">230s</text><text x="134" y="576" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1b2430" text-anchor="start">id 8 · happened 12:09:00 · seen 12:09:02</text><rect x="134" y="586" width="8" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="152" y="604" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">2s</text><rect x="48" y="638" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="658" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Eight of the nine arrive within 50s. One — id 7 — takes 230s.</text><text x="62" y="678" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">Skew is not a constant you can look up. It is a long tail, and the tail is where correctness lives.</text><text x="570" y="758" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — skew, measured: processing time minus event time</text><text x="570" y="790" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Skew is the single measured quantity this chapter rests on. Note its SHAPE: a cluster of small values and one outlier 5× larger. Any system that</text><text x="570" y="807" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">picks a waiting time from the typical case is correct for eight events in nine and silently wrong about the ninth.</text></svg>