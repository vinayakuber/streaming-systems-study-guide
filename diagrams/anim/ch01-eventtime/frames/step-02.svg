<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 864" width="1140" height="864" role="img" aria-label="the watermark is a GUESS about skew"><rect width="1140" height="864" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Event time vs processing time — skew, watermarks, and what completeness costs</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">max skew 230s (id 7) · watermark lag 60s · waiting 60s drops 1 of 9</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="614" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE WATERMARK AFTER EACH EVENT — max event time seen, minus LAG = 60s</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">row 1 = the arriving event, in processing order  ·  row 2 = its event time  ·  row 3 = the watermark after it</text><rect x="84" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="137" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 0</text><rect x="194" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="247" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 1</text><rect x="304" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="357" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 2</text><rect x="414" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="467" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 3</text><rect x="524" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="577" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 4</text><rect x="634" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="687" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 5</text><rect x="744" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="797" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 6</text><rect x="854" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="907" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 7</text><rect x="964" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 8</text><rect x="84" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:01</text><rect x="194" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="247" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:03</text><rect x="304" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="357" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">01:30</text><rect x="414" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="467" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">02:10</text><rect x="524" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="577" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">04:05</text><rect x="634" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="687" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">04:20</text><rect x="744" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="797" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:40</text><rect x="854" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="907" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:50</text><rect x="964" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">09:00</text><rect x="84" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="194" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="247" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="304" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="357" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="414" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="467" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">01:10</text><rect x="524" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="577" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="634" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="687" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="744" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="797" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="854" y="232" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="907" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">03:20</text><rect x="964" y="232" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">08:00</text><rect x="48" y="276" width="1040" height="82" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="296" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">A watermark is one claim: "no event with an event time earlier than this will arrive." Here it is computed as the highest event time seen so far,</text><text x="62" y="316" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">minus 60s.</text><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">By the time id 7 arrives the watermark stands at 12:03:20, which already claims 12:00:50 is settled. The claim is false. Nothing detected that.</text><text x="570" y="758" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the watermark is a GUESS about skew</text><text x="570" y="790" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The watermark never stalls and never apologises — it is arithmetic on the events that did arrive, so it cannot know about one that has not. The</text><text x="570" y="807" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">60s lag is a human guess at the skew tail, and id 7's 230s is 4x it. A heuristic watermark being wrong is its normal mode, not a failure.</text></svg>