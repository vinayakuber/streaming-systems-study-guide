<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 556" width="1140" height="556" role="img" aria-label="the join must BUFFER one side while waiting for the other"><rect width="1140" height="556" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Why joins are hard on streams — no completion, and a buffer</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">5 true matches · 1 on time · 2 after a retraction · 2 never emitted</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · "a" = clicks, "b" = impressions · join window 60s</text><rect x="24" y="104" width="1092" height="306" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT IS HELD IN JOIN STATE, EVENT BY EVENT</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">rows still within 60s of the join's watermark, so a match could still arrive for them</text><rect x="84" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="137" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 0</text><rect x="194" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="247" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 1</text><rect x="304" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="357" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 2</text><rect x="414" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="467" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 3</text><rect x="524" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="577" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 4</text><rect x="634" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="687" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 5</text><rect x="744" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="797" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 6</text><rect x="854" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="907" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 7</text><rect x="964" y="168" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 8</text><rect x="84" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">1</text><rect x="194" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="247" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">2</text><rect x="304" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="357" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">3</text><rect x="414" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="467" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">4</text><rect x="524" y="200" width="106" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="577" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="middle">5</text><rect x="634" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="687" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">3</text><rect x="744" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="797" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">4</text><rect x="854" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="907" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">4</text><rect x="964" y="200" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">4</text><rect x="48" y="244" width="1040" height="82" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="264" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The buffer peaks at 5 rows on this 9-row stream, and it is bounded only because the join window is.</text><text x="62" y="284" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">Each buffered row is waiting for a counterpart that may never come. A join's state is therefore proportional to arrival rate times the join</text><text x="62" y="304" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">window.</text><text x="570" y="450" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the join must BUFFER one side while waiting for the other</text><text x="570" y="482" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Rows cannot be matched and discarded immediately — each one waits for a counterpart. The buffer peaks at 5 rows here, and the only reason it peaks</text><text x="570" y="499" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">at all rather than growing is the 60s window. That makes join state (arrival rate × join window), which is the sizing formula to carry away.</text></svg>