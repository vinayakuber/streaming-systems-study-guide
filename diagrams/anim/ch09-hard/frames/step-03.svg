<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 556" width="1140" height="556" role="img" aria-label="and the watermark is what ends the wait"><rect width="1140" height="556" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Why joins are hard on streams — no completion, and a buffer</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">5 true matches · 1 on time · 2 after a retraction · 2 never emitted</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · "a" = clicks, "b" = impressions · join window 60s</text><rect x="24" y="104" width="1092" height="306" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHEN EACH CLICK'S RESULT MAY BE EMITTED</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the join claims min(left, right) — ch03's rule, with two inputs by construction</text><rect x="48" y="156" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 0 (et 12:00:01)</text><text x="1076" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 5, when the minimum watermark passes 12:01:01</text><rect x="48" y="188" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 1 (et 12:00:03)</text><text x="1076" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 5, when the minimum watermark passes 12:01:03</text><rect x="48" y="220" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 3 (et 12:02:10)</text><text x="1076" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 8, when the minimum watermark passes 12:03:10</text><rect x="48" y="252" width="1040" height="28" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">click id 4 (et 12:04:05)</text><text x="1076" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">NEVER — the join watermark never passes 12:05:05</text><rect x="48" y="284" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 8 (et 12:09:00)</text><text x="1076" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">NEVER — the join watermark never passes 12:10:00</text><rect x="48" y="330" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">2 of the 5 clicks never emits at all, because the MINIMUM watermark never reaches its join bound.</text><text x="62" y="370" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">Those 2 rows hold 2 of the 5 true matches. They are in the state, matched, and never published.</text><text x="570" y="450" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — and the watermark is what ends the wait</text><text x="570" y="482" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is where a stream-stream join stops resembling a batch join. 3 of the 5 clicks reach an emission point; 2 never do, because the join's</text><text x="570" y="499" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">watermark is the minimum over both inputs and it stalls below their bound. 2 of the 5 true matches are computed, held in state, and never</text><text x="570" y="516" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">published.</text></svg>