<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="stream → table by aggregation"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">The duality — and the aggregate it depends on</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">sum changelog differences to [5, 3, 2, 6, 8] — exact · max changelog is consistent with ≥ 36 histories</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · table a:24 b:21 · total 45</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">FOLDING KEY "a"'S EVENTS INTO ONE VALUE</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">each row is one fold step; the last one is the table's value</text><rect x="48" y="156" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 0 (+5)</text><text x="1076" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">balance 0 → 5</text><rect x="48" y="188" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 1 (+3)</text><text x="1076" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">balance 5 → 8</text><rect x="48" y="220" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 3 (+2)</text><text x="1076" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">balance 8 → 10</text><rect x="48" y="252" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 4 (+6)</text><text x="1076" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">balance 10 → 16</text><rect x="48" y="284" width="1040" height="28" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">after id 8 (+8)</text><text x="1076" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">balance 16 → 24</text><rect x="48" y="330" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The table's value for key "a" is 24, and it is nothing but the last line of this fold.</text><text x="62" y="370" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Which means the table is not a separate thing that must be kept in sync — it is a FUNCTION of the stream, and can always be recomputed.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — stream → table by aggregation</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Stream to table is a fold, and the whole right-hand column is the proof: 24 is the last line of it. That matters architecturally — a table that is</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">a function of the stream cannot drift from it, whereas two independently-written stores can and will.</text></svg>