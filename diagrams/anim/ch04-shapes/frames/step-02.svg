<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 678" width="1140" height="678" role="img" aria-label="sliding windows overlap: one event, several windows"><rect width="1140" height="678" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Window shapes — fixed, sliding, and session</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">fixed 4 windows totalling 45 · sliding totals 78 · sessions 4/3/2/1 for key a as the gap grows</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · gap 120s · 5 sessions</text><rect x="24" y="104" width="1092" height="428" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SLIDING — 120s WIDE, STARTING EVERY 60s</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">how many windows each event belongs to, under each shape</text><rect x="48" y="168" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 0 · et 12:00:01 · v 5</text><text x="354" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:00)</text><text x="644" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">sliding: 1 window (12:00)</text><rect x="48" y="198" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 1 · et 12:00:03 · v 3</text><text x="354" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:00)</text><text x="644" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">sliding: 1 window (12:00)</text><rect x="48" y="228" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 2 · et 12:01:30 · v 7</text><text x="354" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:00)</text><text x="644" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:00, 12:01)</text><rect x="48" y="258" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 3 · et 12:02:10 · v 2</text><text x="354" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:02)</text><text x="644" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:01, 12:02)</text><rect x="48" y="288" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 4 · et 12:04:05 · v 6</text><text x="354" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:04)</text><text x="644" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:03, 12:04)</text><rect x="48" y="318" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 5 · et 12:04:20 · v 1</text><text x="354" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:04)</text><text x="644" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:03, 12:04)</text><rect x="48" y="348" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 6 · et 12:03:40 · v 9</text><text x="354" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:02)</text><text x="644" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:02, 12:03)</text><rect x="48" y="378" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 7 · et 12:00:50 · v 4</text><text x="354" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:00)</text><text x="644" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">sliding: 1 window (12:00)</text><rect x="48" y="408" width="1040" height="26" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 8 · et 12:09:00 · v 8</text><text x="354" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fixed: 1 window (12:08)</text><text x="644" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">sliding: 2 windows (12:08, 12:09)</text><rect x="48" y="452" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="472" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">6 of the 9 events land in 2 windows at once, so the sliding results total 78 against the dataset's 45.</text><text x="62" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">Output volume scales with WIN / PERIOD = 120 / 60 = 2x. That is the cost of a smooth moving measure.</text><text x="570" y="572" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — sliding windows overlap: one event, several windows</text><text x="570" y="604" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Sliding windows answer "the rolling 120s figure, refreshed every 60s". Read the third column: 6 events are in 2 windows, which is why the totals</text><text x="570" y="621" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">cannot be compared to the input. The first few events are in one window only because event time starts at 12:00 — there is no window before it.</text></svg>