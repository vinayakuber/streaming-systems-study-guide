230" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="797" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="854" y="230" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="907" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="964" y="230" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="84" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="137" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">no claim</text><rect x="194" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="247" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">no claim</text><rect x="304" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="357" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="414" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="467" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="524" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="577" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="634" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="687" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="744" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="797" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="854" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="907" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="964" y="262" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="1017" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="48" y="306" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The minimum row is the only safe claim. Until source "b" has produced anything, the stage has NO claim at all — not a generous one.</text><text x="62" y="346" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">And at the end the minimum is 12:03:20 while one source has reached 12:08:00: completeness is bounded by the slowest input, always.</text><text x="570" y="468" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — a stage cannot claim more than its least-complete input</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Propagation is a one-line rule with a sharp consequence: a stage's watermark is the minimum over its inputs. Read the first two columns — the</text><text x="570" y="517" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">stage cannot claim anything while source "b" is silent, because silence is indistinguishable from "an old event is still coming". Taking the</text><text x="570" y="534" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">maximum, or ignoring a quiet input, is how a pipeline claims completeness it has no basis for.</text></svg>