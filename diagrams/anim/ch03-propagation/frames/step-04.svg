<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 574" width="1140" height="574" role="img" aria-label="and this is what makes an event-time pipeline usable at all"><rect width="1140" height="574" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Propagation and correctness — the minimum, and what "closed" means</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">per-source min 12:03:20 vs global 12:08:00 · 2 window withheld</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · lag 60s · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="324" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WITHOUT WATERMARKS</text><rect x="48" y="150" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">With no watermark, window [12:00, 12:02) can never be emitted: on an unbounded stream there is no moment at which "everything has arrived"</text><text x="62" y="190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">becomes true.</text><rect x="48" y="216" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="236" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The alternatives are a processing-time trigger (which answers a different question) or waiting forever (which answers none). The watermark is</text><text x="62" y="256" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">what converts an unbounded stream into one with a notion of PROGRESS.</text><rect x="48" y="282" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="302" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The price, stated plainly: every on-time answer in this book is published on an estimate that was 21% wrong for this window, and would have been</text><text x="62" y="322" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">correct 34s later.</text><rect x="48" y="348" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">And the per-source minimum shows the structural limit: 2 window (11, 7) is withheld because one source went quiet, which no amount of skew tuning</text><text x="62" y="388" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">fixes.</text><text x="570" y="468" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and this is what makes an event-time pipeline usable at all</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The honest summary of the chapter: watermarks do not make event-time processing correct, they make it *possible*. Without one there is no moment</text><text x="570" y="517" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">to emit [12:00, 12:02) at all. With one, it is emitted 21% wrong and correctable — and that trade is the foundation everything later in the book</text><text x="570" y="534" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">is built on.</text></svg>