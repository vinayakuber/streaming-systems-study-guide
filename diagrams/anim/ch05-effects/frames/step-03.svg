<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 566" width="1140" height="566" role="img" aria-label="so dedup covers 1 of 3 crash windows, the key covers 3"><rect width="1140" height="566" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Side effects — where the redundancy disappears</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">dedup covers 1 of 3 crash windows · an idempotency key covers 3 of 3</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · crash at event 4</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHERE THE PIPELINE CAN CRASH WHILE CHARGING ORDER 4</text><rect x="48" y="162" width="1040" height="44" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">crash before the shuffle</text><text x="64" y="198" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="400" fill="#5b6b7f" text-anchor="start">the record is re-sent and the shuffle recognises its id</text><text x="814" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="start">dedup: covers</text><text x="1074" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">key: covers</text><rect x="48" y="210" width="1040" height="44" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">crash after the shuffle, before the charge</text><text x="64" y="246" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="400" fill="#5b6b7f" text-anchor="start">the id is already past the dedup set; the replay sends a NEW copy that dedup has not seen</text><text x="814" y="237" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">dedup: MISSES</text><text x="1074" y="237" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">key: covers</text><rect x="48" y="258" width="1040" height="44" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="277" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">crash after the charge, before the offset commit</text><text x="64" y="294" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="400" fill="#5b6b7f" text-anchor="start">the charge happened; only the external system can know that</text><text x="814" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start">dedup: MISSES</text><text x="1074" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">key: covers</text><rect x="48" y="320" width="1040" height="82" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">A deduplicating shuffle covers 1 of the 3 windows; an idempotency key covers 3 of 3.</text><text x="62" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">This is where the redundancy from the previous concept disappears: for an AGGREGATION either guard sufficed, and for a SIDE EFFECT only the</text><text x="62" y="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">external one does.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — so dedup covers 1 of 3 crash windows, the key covers 3</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is the concept's whole argument in one table. For a pure aggregation, dedup and an idempotent sink were interchangeable. For a side effect</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">they are not: dedup covers only the crash BEFORE the dedup point, and the two crash windows after it — record in flight, and charge completed —</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">are reachable only by the external system's own key. 1 of 3 against 3 of 3.</text></svg>