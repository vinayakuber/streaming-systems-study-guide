<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 566" width="1140" height="566" role="img" aria-label="and isolating the effect at the boundary shrinks its exposure"><rect width="1140" height="566" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Side effects — where the redundancy disappears</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">dedup covers 1 of 3 crash windows · an idempotency key covers 3 of 3</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · crash at event 4</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHERE TO PUT THE SIDE EFFECT IN A FOUR-STAGE PIPELINE</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">stages: source → shuffle → aggregate → sink</text><rect x="48" y="156" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">effect at stage 1 (source)</text><text x="1076" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a crash in any of 4 stages can re-run it</text><rect x="48" y="190" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">effect at stage 2 (shuffle)</text><text x="1076" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a crash in any of 3 stages can re-run it</text><rect x="48" y="224" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">effect at stage 3 (aggregate)</text><text x="1076" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a crash in any of 2 stages can re-run it</text><rect x="48" y="258" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">effect at stage 4 (sink)</text><text x="1076" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">a crash in any of 1 stage can re-run it</text><rect x="48" y="306" width="1040" height="82" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">An effect at stage 2 is exposed to crashes in 3 stages; at the last stage, 1. That is a 3x reduction from placement alone.</text><text x="62" y="346" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">It does not make the effect exactly-once — it reduces how many failures can repeat it, and keeps the computation above it pure and freely</text><text x="62" y="366" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">retryable.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and isolating the effect at the boundary shrinks its exposure</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Placement is the cheapest of the three mechanisms and the only one that needs no cooperation. An effect at stage 2 can be re-run by a crash in 3</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">stages; at stage 4 only 1 can reach it — a 3× reduction. And everything upstream stays pure, which means it can be retried without a thought.</text></svg>