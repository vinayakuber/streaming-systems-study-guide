<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="and what stays distinct: streams do not end"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Batch and streaming converge — and the one thing that does not</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">identical 4 windows · fix once, replay 9 · 1 window never final in streaming</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · 4 windows</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT THE MODEL DOES NOT UNIFY</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">identical values, and one column where they differ</text><rect x="48" y="156" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:00, 12:02)</text><text x="1076" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">batch: final at event 9 · streaming: final after event 4</text><rect x="48" y="188" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:02, 12:04)</text><text x="1076" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">batch: final at event 9 · streaming: final after event 8</text><rect x="48" y="220" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:04, 12:06)</text><text x="1076" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">batch: final at event 9 · streaming: final after event 8</text><rect x="48" y="252" width="1040" height="28" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">window [12:08, 12:10)</text><text x="1076" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">batch: final at event 9 · streaming: NEVER final</text><rect x="48" y="298" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="318" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">1 of the 4 windows is final in batch and never final in streaming — holding 8, with every one of its events already received.</text><text x="62" y="338" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">The model unifies the HOW. It does not make an unbounded input end, and that is not a gap in the model — it is the thing the model is about.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and what stays distinct: streams do not end</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The honest limit of the convergence, with a number on it: window [12:08, 12:10) holds 8, has received all of its events, and is final under batch</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">while never final under streaming. The model unifies the computation and the vocabulary; it does not give an unbounded stream an ending.</text></svg>