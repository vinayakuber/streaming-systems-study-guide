<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 686" width="1140" height="686" role="img" aria-label="the heuristic is one line: max seen, minus a guess"><rect width="1140" height="686" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Heuristic watermarks and skew — one guess, swept</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">skew 0s→15 · 60s→15 · 120s→15 · 180s→19 · correct at 141s, costing 296s</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · lag 60s · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="436" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">watermark = max event time seen so far − skew bound (here 60s)</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">every value is one subtraction; the only judgement in it is the skew bound</text><rect x="48" y="156" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 0: max seen = 12:00:01</text><text x="1076" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">1 − 60 = -59  (none yet)</text><rect x="48" y="186" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 1: max seen = 12:00:03</text><text x="1076" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">3 − 60 = -57  (none yet)</text><rect x="48" y="216" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 2: max seen = 12:01:30</text><text x="1076" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">90 − 60 = 30  (12:00:30)</text><rect x="48" y="246" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 3: max seen = 12:02:10</text><text x="1076" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">130 − 60 = 70  (12:01:10)</text><rect x="48" y="276" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">after id 4: max seen = 12:04:05</text><text x="1076" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">245 − 60 = 185  (12:03:05)</text><rect x="48" y="306" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 5: max seen = 12:04:20</text><text x="1076" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">260 − 60 = 200  (12:03:20)</text><rect x="48" y="336" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 6: max seen = 12:04:20</text><text x="1076" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">260 − 60 = 200  (12:03:20)</text><rect x="48" y="366" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 7: max seen = 12:04:20</text><text x="1076" y="384" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">260 − 60 = 200  (12:03:20)</text><rect x="48" y="396" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">after id 8: max seen = 12:09:00</text><text x="1076" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">540 − 60 = 480  (12:08:00)</text><rect x="48" y="440" width="1040" height="82" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Nothing here measures anything. The 60s is an assumption about how out-of-order the input can be.</text><text x="62" y="480" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Note the stalls: the value repeats whenever an arriving event's time is below the max already seen — the watermark is driven by the maximum, not</text><text x="62" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">by arrivals.</text><text x="570" y="580" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — the heuristic is one line: max seen, minus a guess</text><text x="570" y="612" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The whole heuristic is `max(seen) − skew`. The max is free and exact; the skew is a number a human chose. So every watermark in this book is one</text><text x="570" y="629" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">measured quantity minus one guess, and the next two steps are about what happens when the guess is too small or too large.</text></svg>