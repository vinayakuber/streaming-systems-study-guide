<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 686" width="1140" height="686" role="img" aria-label="too FAST: the guess is small, so real events look late"><rect width="1140" height="686" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Heuristic watermarks and skew — one guess, swept</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">skew 0s→15 · 60s→15 · 120s→15 · 180s→19 · correct at 141s, costing 296s</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · lag 60s · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="436" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">A SWEEP OVER THE SKEW BOUND</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">what each skew bound does to window [12:00, 12:02) — true sum 19</text><rect x="48" y="170" width="1040" height="32" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">skew = 0s</text><text x="214" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">closes at 12:02:12</text><text x="444" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start">publishes 15</text><text x="644" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">2 event(s) classified LATE: id 6, 7</text><rect x="48" y="206" width="1040" height="32" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">skew = 60s</text><text x="214" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">closes at 12:04:06</text><text x="444" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start">publishes 15</text><text x="644" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">1 event(s) classified LATE: id 7</text><rect x="48" y="242" width="1040" height="32" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">skew = 120s</text><text x="214" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">closes at 12:04:06</text><text x="444" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start">publishes 15</text><text x="644" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">1 event(s) classified LATE: id 7</text><rect x="48" y="278" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">skew = 180s</text><text x="214" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">closes at 12:09:02</text><text x="444" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="start">publishes 19</text><text x="644" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">0 event(s) classified LATE</text><rect x="48" y="314" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">skew = 141s</text><text x="214" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">closes at 12:09:02</text><text x="444" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="start">publishes 19</text><text x="644" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">0 event(s) classified LATE</text><rect x="48" y="364" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="384" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">At skew 0s the pipeline calls 2 events late; at 141s it calls none late and is correct.</text><text x="62" y="404" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">Nothing about the DATA changed between those rows. "Late" is a verdict the watermark passes, not a property of an event.</text><text x="570" y="580" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — too FAST: the guess is small, so real events look late</text><text x="570" y="612" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Read the last column down the table: 2, 1, 1, 0, then 0. The same 9 events, the same arrival times, and the number of "late" events falls from 2</text><text x="570" y="629" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">to 0 purely because a configured bound grew. An over-eager watermark does not detect lateness — it creates it.</text></svg>