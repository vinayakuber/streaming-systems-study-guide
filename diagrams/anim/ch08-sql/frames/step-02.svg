<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 546" width="1140" height="546" role="img" aria-label="relational operations map straight onto streaming transforms"><rect width="1140" height="546" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">SQL as a stream language — one addition, several consequences</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">TUMBLE(et) and TUMBLE(pt) disagree on 3 of 4 windows · 4 append-only rows vs 2 revised</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="296" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE MAPPING, WITH THIS DATASET</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">nothing new is invented; the relational algebra already has these</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">SELECT key, v</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a transform — the "what" of ch02</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHERE v &gt; 5</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a filter — 4 of 9 rows: ids 2, 4, 6, 8</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">GROUP BY key</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a keyed aggregation — 2 groups</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">GROUP BY key, TUMBLE(et, 120s)</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">keyed aggregation per WINDOW — 7 groups</text><rect x="48" y="316" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The only row with no batch equivalent is the last: TUMBLE needs a TIME column, and batch SQL has no notion of event time.</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">So streaming SQL is not a new language. It is relational SQL plus one idea: a column whose values are a clock.</text><text x="570" y="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — relational operations map straight onto streaming transforms</text><text x="570" y="472" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Three of these four rows are plain SQL doing plain SQL things. The fourth is the whole addition: `TUMBLE(et, ...)` requires a time column, and the</text><text x="570" y="489" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">number of result groups jumps from 2 to 7 because the grouping key now includes a window. Streaming SQL is relational SQL plus a column that is a</text><text x="570" y="506" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">clock.</text></svg>