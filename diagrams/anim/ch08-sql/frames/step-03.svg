<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 546" width="1140" height="546" role="img" aria-label="and the time attribute is a CHOICE with different answers"><rect width="1140" height="546" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">SQL as a stream language — one addition, several consequences</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">TUMBLE(et) and TUMBLE(pt) disagree on 3 of 4 windows · 4 append-only rows vs 2 revised</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="296" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">TUMBLE ON et VERSUS TUMBLE ON pt</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#5b6b7f" text-anchor="start">SELECT SUM(v) FROM clicks GROUP BY TUMBLE(et, INTERVAL '120' SECOND) — and the same query with pt</text><rect x="48" y="170" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:00, 12:02)</text><text x="274" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(et): 19  (ids 0,1,2,7)</text><text x="654" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">TUMBLE(pt): 15  (ids 0,1,2)</text><text x="1074" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="204" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:02, 12:04)</text><text x="274" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(et): 11  (ids 3,6)</text><text x="654" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">TUMBLE(pt): 2  (ids 3)</text><text x="1074" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="238" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:04, 12:06)</text><text x="274" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(et): 7  (ids 4,5)</text><text x="654" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">TUMBLE(pt): 20  (ids 4,5,6,7)</text><text x="1074" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="272" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:08, 12:10)</text><text x="274" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(et): 8  (ids 8)</text><text x="654" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(pt): 8  (ids 8)</text><text x="1074" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">agrees</text><rect x="48" y="320" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">3 of the 4 windows get a different answer. One token in the query — `et` or `pt` — decides which.</text><text x="62" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">And both are valid SQL producing valid results. Nothing in the engine can tell you the wrong one was chosen.</text><text x="570" y="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — and the time attribute is a CHOICE with different answers</text><text x="570" y="472" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is ch01's two-clock problem arriving as a one-token edit. `TUMBLE(et, ...)` and `TUMBLE(pt, ...)` differ by three characters and disagree on</text><text x="570" y="489" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">3 of 4 windows — window [12:00, 12:02) reads 19 against 15. Both are valid SQL and the engine cannot flag either.</text></svg>