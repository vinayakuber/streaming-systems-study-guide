<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 1315" width="1235" height="1315" role="img" aria-label="the stream is read start to finish, one change at a time"><rect width="1235" height="1315" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">One dataset, two shapes — the fold that produces a table</text><text x="1211" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">9 records → 2 rows · both total 45</text><rect x="24" y="78" width="631" height="1097" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SOURCE</text><text x="36" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 1  // primitive: len(xs) — element count.  len([1,2]) = 2</text><text x="36" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 2  // Two of an event's five fields are CLOCKS, which ch01 established:</text><text x="36" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 3  //   et = event time, when it happened  ·  pt = processing time, when we saw it</text><text x="36" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 4  //   v = the change this record applies  ·  key = whose balance it changes</text><text x="36" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 5  type Event { id, key, et, pt, v }</text><text x="36" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 6  // primitive: EVENTS — the book's 9 events, in PROCESSING order (tools/stream_seed.js).</text><text x="36" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 7  //   EVENTS[0] = (id 0, key "a", et 1, pt 2, v 5)</text><text x="36" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 8  // primitive: NONE — no value. Distinct from a value of 0.</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 9  // primitive: KEYS — the keys the table has a row for.  KEYS = ["a", "b"]</text><text x="36" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">10  // primitive: max(a, b) — the larger of two values.  max(3, 5) = 5</text><text x="36" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">11  // primitive: append(xs, x) — xs with x added at the end.  append([1], 2) = [1,2]</text><text x="36" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">12  // primitive: indexOf(e) — e's position in PROCESSING order.  indexOf(EVENTS[0]) = 0</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">13  </text><text x="36" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">14  type Table { rows }</text><text x="36" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">15  </text><text x="36" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">16  // function: streamTotal(events) — add up every CHANGE in the stream.</text><text x="36" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">17  //   streamTotal(EVENTS) = 45</text><rect x="30" y="373" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">18  fun streamTotal(events) {</text><text x="36" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">19      var t = 0</text><rect x="30" y="407" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">20      for (e in events) { t = t + e.v }</text><text x="36" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">21      return t</text><text x="36" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">22  }</text><text x="36" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">23  </text><text x="36" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">24  // function: toTable(events) — fold the stream into one row per key. This is the</text><text x="36" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">25  //   ENTIRE stream-to-table direction; there is nothing else to it.</text><text x="36" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">26  //   toTable(EVENTS).rows = {"a": 24, "b": 21}</text><text x="36" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">27  fun toTable(events) {</text><text x="36" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">28      var tbl = Table({})</text><text x="36" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">29      for (e in events) {</text><text x="36" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">30          if (tbl.rows[e.key] == NONE) { tbl.rows[e.key] = 0 }</text><text x="36" y="606" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">31          tbl.rows[e.key] = tbl.rows[e.key] + e.v</text><text x="36" y="623" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">32      }</text><text x="36" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">33      return tbl</text><text x="36" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">34  }</text><text x="36" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">35  </text><text x="36" y="691" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">36  // function: tableTotal(tbl) — add up every ROW in the table.</text><text x="36" y="708" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">37  //   tableTotal(toTable(EVENTS)) = 45</text><text x="36" y="725" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">38  fun tableTotal(tbl) {</text><text x="36" y="742" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">39      var t = 0</text><text x="36" y="759" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">40      for (k in KEYS) { t = t + tbl.rows[k] }</text><text x="36" y="776" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">41      return t</text><text x="36" y="793" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">42  }</text><text x="36" y="810" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">43  </text><text x="36" y="827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">44  // function: everWas(events, key, value) — a question only the STREAM can answer:</text><text x="36" y="844" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">45  //   did this key ever hold that value?</text><text x="36" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">46  //   everWas(EVENTS, "a", 8) = true      everWas(EVENTS, "a", 9) = false</text><text x="36" y="878" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">47  fun everWas(events, key, value) {</text><text x="36" y="895" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">48      var acc = 0</text><text x="36" y="912" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">49      for (e in events) {</text><text x="36" y="929" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">50          if (e.key != key) { continue }</text><text x="36" y="946" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">51          acc = acc + e.v</text><text x="36" y="963" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">52          if (acc == value) { return true }</text><text x="36" y="980" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">53      }</text><text x="36" y="997" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">54      return false</text><text x="36" y="1014" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">55  }</text><text x="36" y="1031" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">56  </text><text x="36" y="1048" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">57  // function: main() — THE CALLER: both views, and a history question.</text><text x="36" y="1065" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">58  fun main() {</text><text x="36" y="1082" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">59      val sTotal = streamTotal(EVENTS)</text><text x="36" y="1099" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">60      val tbl    = toTable(EVENTS)</text><text x="36" y="1116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">61      val tTotal = tableTotal(tbl)</text><text x="36" y="1133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">62      val wasIt  = everWas(EVENTS, "a", 8)</text><text x="36" y="1150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">63  }</text><rect x="671" y="78" width="244" height="1097" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="681" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STACK  (grows downward)</text><rect x="681" y="92" width="224" height="98" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="691" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">main</text><text x="697" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">sTotal = ...</text><text x="697" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">tbl = ...</text><text x="697" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">tTotal = ...</text><text x="697" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">wasIt = ...</text><rect x="681" y="200" width="224" height="80" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="691" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">streamTotal</text><text x="697" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events = EVENTS</text><text x="697" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">t = 45</text><text x="697" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">e = EVENTS[8]</text><rect x="931" y="78" width="280" height="1097" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="941" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HEAP  (allocated objects)</text><text x="617.5" y="1209" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/0 — the stream is read start to finish, one change at a time</text><text x="617.5" y="1241" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">There is no shortcut here: `t` reaches 45 only after all 9 records. A stream has no current value to look up, which is the cost side of what it gives you — and</text><text x="617.5" y="1258" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the loop is the reason a lazy query scales with history rather than with the number of keys.</text></svg>