<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 744" width="1140" height="744" role="img" aria-label="the temporal join: look up the table AS OF the row&#39;s time"><rect width="1140" height="744" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Windowed and temporal joins — two operations, not two settings</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">windowed: 5 matches, up to 5 buffered, 2 clicks never emit · temporal: 5 answered on arrival, 2 NULL, 2 short</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · "a" = clicks, "b" = impressions · join window 60s</text><rect x="24" y="104" width="1092" height="494" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">TEMPORAL (STREAM-TABLE) JOIN — the version current at click time</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one lookup per row, against the table as it stood at that event time</text><rect x="48" y="156" width="1040" height="28" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">click id 0 at 12:00:01</text><text x="1076" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">NULL — no impression exists at or before 12:00:01</text><rect x="48" y="188" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 1 at 12:00:03</text><text x="1076" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">NULL — no impression exists at or before 12:00:03</text><rect x="48" y="220" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 3 at 12:02:10</text><text x="1076" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">impression total 11, from 2,7</text><rect x="48" y="252" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 4 at 12:04:05</text><text x="1076" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">impression total 20, from 2,6,7</text><rect x="48" y="284" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">click id 8 at 12:09:00</text><text x="1076" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">impression total 21, from 2,5,6,7</text><rect x="48" y="330" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The table's state at time t is the impression total: the sum of v over every impression with et at or before t.</text><text x="62" y="370" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">No window, no buffer, no wait on the other side's watermark. 2 rows get NULL because the table had no version yet at that event time.</text><text x="62" y="390" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">What it DOES need is a VERSIONED table, complete for that time: the lookup is "as of 12:02:10", not "now".</text><text x="570" y="638" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the temporal join: look up the table AS OF the row's time</text><text x="570" y="670" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">A temporal join is a lookup, and it behaves completely differently: no buffer, and no wait on a second watermark. The price is in the note — it</text><text x="570" y="687" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">needs the table's **history**, because "as of 12:02:10" is not the same question as "now", and it needs that history to be **complete**. The</text><text x="570" y="704" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">values above are the as-of impression totals (sums of v); looked up the moment each click arrives, click 3 reads 7 instead of 11 and click 4 reads</text><text x="570" y="721" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">7 instead of 20, because impressions 6 and 7 have not arrived yet.</text></svg>