6a34a" text-anchor="end">MATCH</text><rect x="48" y="264" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 1 (12:00:03)  x  impression 2 (12:01:30)</text><text x="544" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 87s</text><text x="1074" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="288" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="303" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 1 (12:00:03)  x  impression 5 (12:04:20)</text><text x="544" y="303" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 257s</text><text x="1074" y="303" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="312" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="327" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 1 (12:00:03)  x  impression 6 (12:03:40)</text><text x="544" y="327" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 217s</text><text x="1074" y="327" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="336" width="1040" height="20" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 1 (12:00:03)  x  impression 7 (12:00:50)</text><text x="544" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 47s</text><text x="1074" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MATCH</text><rect x="48" y="360" width="1040" height="20" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 3 (12:02:10)  x  impression 2 (12:01:30)</text><text x="544" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 40s</text><text x="1074" y="375" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MATCH</text><rect x="48" y="384" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 3 (12:02:10)  x  impression 5 (12:04:20)</text><text x="544" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 130s</text><text x="1074" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="408" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="423" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 3 (12:02:10)  x  impression 6 (12:03:40)</text><text x="544" y="423" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 90s</text><text x="1074" y="423" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="432" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 3 (12:02:10)  x  impression 7 (12:00:50)</text><text x="544" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 80s</text><text x="1074" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">no</text><rect x="48" y="456" width="1040" height="20" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 4 (12:04:05)  x  impression 5 (12:04:20)</text><text x="544" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 15s</text><text x="1074" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MATCH</text><rect x="48" y="480" width="1040" height="20" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="495" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 4 (12:04:05)  x  impression 6 (12:03:40)</text><text x="544" y="495" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 25s</text><text x="1074" y="495" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MATCH</text><rect x="48" y="518" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="538" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">5 of the 20 candidate pairs are within 60s. The window bounds the buffer; the watermarks bound the wait.</text><text x="62" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Note one click matches 2 impressions — a windowed join is not one-to-one, so the output can be larger than either input.</text><text x="570" y="638" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — the windowed join: match within a time interval</text><text x="570" y="670" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The join predicate is one subtraction, and it produces 5 matches from 20 candidates. Worth noticing in the note: one click matches 2 impressions,</text><text x="570" y="687" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">so a windowed join can emit more rows than either side has — which is a capacity question people usually discover after shipping.</text></svg>