<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 744" width="1140" height="744" role="img" aria-label="the windowed join: match within a time interval"><rect width="1140" height="744" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Windowed and temporal joins — two operations, not two settings</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">windowed: 5 matches, up to 5 buffered, 2 click never emits · temporal: 5 enriched at once, 2 NULL</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · "a" = clicks, "b" = impressions · join window 60s</text><rect x="24" y="104" width="1092" height="494" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WINDOWED (INTERVAL) JOIN — |click.et − impression.et| &lt;= 60s</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">every candidate pair, and whether it matches</text><rect x="48" y="168" width="1040" height="20" rx="2" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">click 0 (12:00:01)  x  impression 2 (12:01:30)</text><text x="544" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">apart 89s</text><text x="1074" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,mono