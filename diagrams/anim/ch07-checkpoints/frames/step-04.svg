<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 552" width="1140" height="552" role="img" aria-label="and the frequency is a trade with no free point"><rect width="1140" height="552" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Checkpoints and state stores — the pair, and what it costs to write</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">full 14 vs incremental 8 entry-uploads at k=3 (43% less) · replay 0/2/4/8 at k=1/3/5/9</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 7 state entries · total 45</text><rect x="24" y="104" width="1092" height="302" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">CHECKPOINT EVERY k EVENTS — I/O AGAINST RECOVERY</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">how many checkpoints, how much is uploaded, and the worst-case replay</text><rect x="48" y="168" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">k = 1</text><text x="164" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">9 checkpoints</text><text x="354" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">9 entry-uploads (incremental)</text><text x="744" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">worst-case replay: 0 events</text><rect x="48" y="204" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">k = 3</text><text x="164" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">3 checkpoints</text><text x="354" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">8 entry-uploads (incremental)</text><text x="744" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">worst-case replay: 2 events</text><rect x="48" y="240" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">k = 5</text><text x="164" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">1 checkpoint</text><text x="354" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">4 entry-uploads (incremental)</text><text x="744" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">worst-case replay: 4 events</text><rect x="48" y="276" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">k = 9</text><text x="164" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">1 checkpoint</text><text x="354" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">7 entry-uploads (incremental)</text><text x="744" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start">worst-case replay: 8 events</text><rect x="48" y="326" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="346" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">k = 1 replays 0 events and uploads 9 times; k = 9 replays 8 and uploads 7.</text><text x="62" y="366" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">Both ends are correct. The choice is a failure-budget question: how long may recovery take, and how much steady-state I/O is affordable?</text><text x="570" y="446" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and the frequency is a trade with no free point</text><text x="570" y="478" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Four frequencies, and the trade is monotone in both directions — no setting is free. Checkpoint every event and recovery replays 0 but you pay 9</text><text x="570" y="495" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">uploads; checkpoint once and you pay 7 upload and replay 8 events. The number to start from is the recovery time you can tolerate, not the I/O you</text><text x="570" y="512" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">would prefer.</text></svg>