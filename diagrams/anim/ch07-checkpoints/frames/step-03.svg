<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 552" width="1140" height="552" role="img" aria-label="incremental checkpoints upload the churn, not the state"><rect width="1140" height="552" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Checkpoints and state stores — the pair, and what it costs to write</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">full 14 vs incremental 8 entry-uploads at k=3 (43% less) · replay 0/2/4/8 at k=1/3/5/9</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 7 state entries · total 45</text><rect x="24" y="104" width="1092" height="302" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">FULL VS INCREMENTAL, CHECKPOINTING EVERY 3 EVENTS</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">checkpoints at events 2, 5, 8 — what each one has to upload</text><rect x="48" y="168" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">checkpoint at event 2</text><text x="344" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">FULL: 2 entries (all of the state)</text><text x="724" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#16a34a" text-anchor="start">INCREMENTAL: 2 entries (changed since)</text><rect x="48" y="202" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">checkpoint at event 5</text><text x="344" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">FULL: 5 entries (all of the state)</text><text x="724" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#16a34a" text-anchor="start">INCREMENTAL: 3 entries (changed since)</text><rect x="48" y="236" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">checkpoint at event 8</text><text x="344" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">FULL: 7 entries (all of the state)</text><text x="724" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#16a34a" text-anchor="start">INCREMENTAL: 3 entries (changed since)</text><rect x="48" y="284" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="304" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Across the run: 14 entry-uploads full against 8 incremental — a 43% saving on 9 events.</text><text x="62" y="324" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">And the gap WIDENS, because full scales with total state while incremental scales with churn. On a large, mostly-idle state the difference is</text><text x="62" y="344" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">uploading 10 GB or 10 KB.</text><text x="570" y="446" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — incremental checkpoints upload the churn, not the state</text><text x="570" y="478" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The numbers make the asymmetry visible: full uploads grow every checkpoint (2, 5, 7) while incremental ones track churn (2, 3, 3). 14 against 8</text><text x="570" y="495" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">here, and the ratio keeps improving as state grows relative to how fast it changes.</text></svg>