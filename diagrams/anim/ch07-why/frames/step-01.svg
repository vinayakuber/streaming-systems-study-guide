<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 606" width="1140" height="606" role="img" aria-label="state is the aggregation in progress"><rect width="1140" height="606" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Why state must persist — and why it is only a cache</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">7 entries for 9 events · restart replays 9 without a checkpoint, 4 with one</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 7 state entries · total 45</text><rect x="24" y="104" width="1092" height="356" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT THE PROCESSOR IS HOLDING — ONE ENTRY PER (KEY, WINDOW)</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">7 entries for 9 events — this is the whole of "state"</text><rect x="48" y="156" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "a", window [12:00, 12:02)</text><text x="1076" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">8   (from ids 0, 1)</text><rect x="48" y="186" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "b", window [12:00, 12:02)</text><text x="1076" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">11   (from ids 2, 7)</text><rect x="48" y="216" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "a", window [12:02, 12:04)</text><text x="1076" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">2   (from ids 3)</text><rect x="48" y="246" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "a", window [12:04, 12:06)</text><text x="1076" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">6   (from ids 4)</text><rect x="48" y="276" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "b", window [12:04, 12:06)</text><text x="1076" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">1   (from ids 5)</text><rect x="48" y="306" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "b", window [12:02, 12:04)</text><text x="1076" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">9   (from ids 6)</text><rect x="48" y="336" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "a", window [12:08, 12:10)</text><text x="1076" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">8   (from ids 8)</text><rect x="48" y="380" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Nothing mysterious: state is 7 numbers, each the partial sum of a (key, window) group that has not finished yet.</text><text x="62" y="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Without it every event would start from zero, so the pipeline could not compute anything that spans more than one record.</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — state is the aggregation in progress</text><text x="570" y="532" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Worth making concrete before discussing how to persist it: the state here is 7 numbers. Each one is a partial aggregate for a (key, window) group</text><text x="570" y="549" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">that is still open. Everything in this chapter — checkpoints, state stores, barriers — exists to move those 7 numbers safely across a restart.</text></svg>