<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 606" width="1140" height="606" role="img" aria-label="and the bound on it is the watermark"><rect width="1140" height="606" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Why state must persist — and why it is only a cache</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">7 entries for 9 events · restart replays 9 without a checkpoint, 4 with one</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 7 state entries · total 45</text><rect x="24" y="104" width="1092" height="356" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHEN EACH ENTRY CAN BE DROPPED</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the watermark is what makes state collectable, and therefore bounded</text><rect x="48" y="156" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">a @ window 0</text><text x="1076" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 4, when the watermark reaches 12:03:05</text><rect x="48" y="186" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">b @ window 0</text><text x="1076" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 4, when the watermark reaches 12:03:05</text><rect x="48" y="216" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">a @ window 120</text><text x="1076" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 8, when the watermark reaches 12:08:00</text><rect x="48" y="246" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">a @ window 240</text><text x="1076" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 8, when the watermark reaches 12:08:00</text><rect x="48" y="276" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">b @ window 240</text><text x="1076" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 8, when the watermark reaches 12:08:00</text><rect x="48" y="306" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">b @ window 120</text><text x="1076" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">after event 8, when the watermark reaches 12:08:00</text><rect x="48" y="336" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">a @ window 480</text><text x="1076" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">NEVER — the watermark never passes its end</text><rect x="48" y="380" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">1 of the 7 entries is never collectable in this stream, so its 8 is held for the life of the job.</text><text x="62" y="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">A window that never closes is an allocation that never ends. That is the failure mode persistence makes permanent rather than transient.</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and the bound on it is the watermark</text><text x="570" y="532" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">State is bounded only by the watermark, and this stream shows the gap: 6 entries become collectable and 1 does not, because no event ever pushes</text><text x="570" y="549" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the watermark past window [12:08, …). Persisting state makes that leak survive restarts, which turns a transient memory problem into a permanent</text><text x="570" y="566" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">one.</text></svg>