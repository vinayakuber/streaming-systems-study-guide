<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 598" width="1140" height="598" role="img" aria-label="the publish sequence, with real times"><rect width="1140" height="598" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a purchase summer, fully specified</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one window, 6 firings: 8 → 15 → 15 → 15 → 15 → 19 · 11 values published under retraction</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="348" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT A CONSUMER ACTUALLY RECEIVES, IN ORDER</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one window, 6 firings, 11 published values</text><rect x="48" y="156" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">12:01:00 — EARLY pane 8</text><text x="1076" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">publishes 8  (nothing to undo yet)</text><rect x="48" y="186" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">12:02:00 — EARLY pane 15</text><text x="1076" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">publishes -8, then 15  (undo, then the new total)</text><rect x="48" y="216" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">12:03:00 — EARLY pane 15</text><text x="1076" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">publishes -15, then 15  (undo, then the new total)</text><rect x="48" y="246" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">12:04:00 — EARLY pane 15</text><text x="1076" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">publishes -15, then 15  (undo, then the new total)</text><rect x="48" y="276" width="1040" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">12:04:06 — ON-TIME pane 15</text><text x="1076" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">publishes -15, then 15  (undo, then the new total)</text><rect x="48" y="306" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">12:04:40 — LATE pane 19</text><text x="1076" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">publishes -15, then 19  (undo, then the new total)</text><rect x="48" y="352" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="372" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">A sink that only adds ends at 19 — correct — because every refinement carries its own undo.</text><text x="62" y="392" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">The "answer" to this query was published 6 times over 220s. That is not a malfunction; it is what answering a question about an unbounded stream</text><text x="62" y="412" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">looks like.</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the publish sequence, with real times</text><text x="570" y="524" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Read the column: 8, -8, 15, -15, 15, -15, 15, -15, 15, -15, 19. One query, one window, 11 published values across 220s, summing to 19 — and every</text><text x="570" y="541" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">firing was the right answer to "what do you know now?". A consumer that treats the first as final is the bug, not the pipeline.</text></svg>