<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 648" width="1140" height="648" role="img" aria-label="the 8 combinations, and what each one actually produces"><rect width="1140" height="648" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Idempotency and deduplication — and which guard is load-bearing</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">8 combinations, 3 outcomes: 23 lost · 45 correct · 67 doubled</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · crash at event 4</text><rect x="24" y="104" width="1092" height="398" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">REPLAYABLE SOURCE x DEDUP SHUFFLE x IDEMPOTENT SINK</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">after a crash at event 4, with the state committed and the offset not</text><rect x="48" y="168" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source replayable · shuffle dedups · sink idempotent</text><text x="724" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 45</text><text x="1074" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">CORRECT</text><rect x="48" y="198" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source replayable · shuffle dedups · sink adds</text><text x="724" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 45</text><text x="1074" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">CORRECT</text><rect x="48" y="228" width="1040" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source replayable · shuffle plain · sink idempotent</text><text x="724" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 45</text><text x="1074" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">CORRECT</text><rect x="48" y="258" width="1040" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source replayable · shuffle plain · sink adds</text><text x="724" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 67</text><text x="1074" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DOUBLE</text><rect x="48" y="288" width="1040" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source not replayable · shuffle dedups · sink idempotent</text><text x="724" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 23</text><text x="1074" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">LOST</text><rect x="48" y="318" width="1040" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source not replayable · shuffle dedups · sink adds</text><text x="724" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 23</text><text x="1074" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">LOST</text><rect x="48" y="348" width="1040" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source not replayable · shuffle plain · sink idempotent</text><text x="724" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 23</text><text x="1074" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">LOST</text><rect x="48" y="378" width="1040" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">source not replayable · shuffle plain · sink adds</text><text x="724" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">total 23</text><text x="1074" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">LOST</text><rect x="48" y="422" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="442" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">3 of the 8 rows reach 45. Read them: a replayable source is REQUIRED, and then dedup OR an idempotent sink is enough — they are redundant here.</text><text x="62" y="462" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Only three totals exist: 23 (lost), 45 (correct) and 67 (doubled). The source protects completeness; the other two protect accuracy.</text><text x="570" y="542" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — the 8 combinations, and what each one actually produces</text><text x="570" y="574" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Worth reading carefully, because it refines the usual claim. "End-to-end exactly-once = source + shuffle + sink, drop any one and it breaks" is</text><text x="570" y="591" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">not quite right for an aggregation: the source is load-bearing, and dedup and an idempotent sink are **redundant** — either alone reaches 45. The</text><text x="570" y="608" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">next concept is where that redundancy disappears.</text></svg>