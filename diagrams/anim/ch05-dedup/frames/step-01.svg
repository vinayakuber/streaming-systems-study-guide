<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 648" width="1140" height="648" role="img" aria-label="idempotent means &quot;twice is the same as once&quot;"><rect width="1140" height="648" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Idempotency and deduplication — and which guard is load-bearing</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">8 combinations, 3 outcomes: 23 lost · 45 correct · 67 doubled</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · crash at event 4</text><rect x="24" y="104" width="1092" height="398" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">TWO OPERATIONS, APPLIED TWICE</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the distinction is about what the operation names, not about the data</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">SET window [12:08, 12:10) = 8</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">once: 8 · twice: 8 — idempotent</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">ADD 8 to that window</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">once: 8 · twice: 16 — NOT idempotent</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what makes the difference</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">SET names the RESULT; ADD names a change to whatever is there</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">so an idempotent sink needs</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">a value that does not depend on the sink's current contents</text><rect x="48" y="316" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">An accumulating pane (ch02) is a SET: it carries the window's whole total, so re-delivering it is harmless.</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">A discarding pane is an ADD: it carries only the delta, so re-delivering it double-counts. The accumulation mode decides whether your sink can be</text><text x="62" y="376" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">idempotent at all.</text><text x="570" y="542" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — idempotent means "twice is the same as once"</text><text x="570" y="574" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The test for idempotency is whether the operation names a result or a change. `SET = 8` is a result and survives any number of retries; `ADD 8` is</text><text x="570" y="591" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">a change and does not. The note connects this back to ch02: accumulating panes are SETs and discarding panes are ADDs, so that choice decides</text><text x="570" y="608" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">whether an idempotent sink is even possible.</text></svg>