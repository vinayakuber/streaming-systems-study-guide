<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 668" width="1140" height="668" role="img" aria-label="the stream: what happened, in order"><rect width="1140" height="668" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Streams and tables — the two faces of one dataset</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">9 stream records ↔ 2 table rows · both total 45</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · table a:24 b:21 · total 45</text><rect x="24" y="104" width="1092" height="418" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE STREAM — AN APPEND-ONLY SEQUENCE OF CHANGES</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">9 records, each one a CHANGE — nothing here is a current value</text><rect x="48" y="156" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 0 · key "a" · 12:00:01</text><text x="1076" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+5</text><rect x="48" y="184" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 1 · key "a" · 12:00:03</text><text x="1076" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+3</text><rect x="48" y="212" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 2 · key "b" · 12:01:30</text><text x="1076" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+7</text><rect x="48" y="240" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 3 · key "a" · 12:02:10</text><text x="1076" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+2</text><rect x="48" y="268" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 4 · key "a" · 12:04:05</text><text x="1076" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+6</text><rect x="48" y="296" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 5 · key "b" · 12:04:20</text><text x="1076" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+1</text><rect x="48" y="324" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 6 · key "b" · 12:03:40</text><text x="1076" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+9</text><rect x="48" y="352" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 7 · key "b" · 12:00:50</text><text x="1076" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+4</text><rect x="48" y="380" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">id 8 · key "a" · 12:09:00</text><text x="1076" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">+8</text><rect x="48" y="422" width="1040" height="82" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="442" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Every row is a delta. To answer "what is key \"a\" now?" you must read all of them and add up — the stream does not hold an answer, it holds a</text><text x="62" y="462" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">history.</text><text x="62" y="482" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">What it DOES hold that a table cannot: the order, and every intermediate value that ever existed.</text><text x="570" y="562" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — the stream: what happened, in order</text><text x="570" y="594" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">A stream answers "what happened". Each of the 9 rows is a change, so the current value of anything is a computation rather than a lookup. In</text><text x="570" y="611" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">exchange you get something a table throws away: the order, and every value the system ever held.</text></svg>