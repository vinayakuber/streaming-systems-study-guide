<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 668" width="1140" height="668" role="img" aria-label="the table: what is true now"><rect width="1140" height="668" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Streams and tables — the two faces of one dataset</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">9 stream records ↔ 2 table rows · both total 45</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · table a:24 b:21 · total 45</text><rect x="24" y="104" width="1092" height="418" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE TABLE — ONE ROW PER KEY, CURRENT VALUE</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">2 rows, answering "what is true now" in one lookup</text><rect x="48" y="156" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "a"</text><text x="1076" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">24   (from 5 events: 5 + 3 + 2 + 6 + 8)</text><rect x="48" y="190" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">key "b"</text><text x="1076" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">21   (from 4 events: 7 + 1 + 9 + 4)</text><rect x="48" y="238" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="258" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">9 stream records became 2 table rows. The table is smaller, faster to query — and it has forgotten the order and every intermediate value.</text><text x="62" y="278" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Ask it "was key \"a\" ever 8?" and it cannot answer. The stream can.</text><text x="570" y="562" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the table: what is true now</text><text x="570" y="594" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">A table answers "what is true now" in a lookup rather than a fold: 9 records collapse to 2 rows. The cost is in the note — the table has forgotten</text><text x="570" y="611" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the order and every intermediate value, so a question about history is unanswerable from it even though no information was deliberately discarded.</text></svg>