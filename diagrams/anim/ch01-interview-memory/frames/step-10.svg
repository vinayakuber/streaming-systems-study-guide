<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1301 1332" width="1301" height="1332" role="img" aria-label="which is why integers are worth insisting on"><rect width="1301" height="1332" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">The average of the last W — stack and heap at every step</text><text x="1277" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">9 values, W = 3 · 21 reads vs 15 operations · 2 answers withheld · 6 of 7 drift with one value at 10000000000000000</text><rect x="24" y="78" width="697" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SOURCE</text><text x="36" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 1  // primitive: len(xs) — element count.  len(VALUES) = 9</text><text x="36" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 2  // primitive: VALUES — what arrives, in order. Written index:value.</text><text x="36" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 3  //   VALUES = 0:5  1:3  2:7  3:2  4:6  5:1  6:9  7:4  8:8</text><text x="36" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 4  // primitive: W = 3 — how many of the most recent to average.</text><text x="36" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 5  // primitive: sum — the running total of the window. One number, not a list.</text><text x="36" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 6  //   sum after all 9 arrivals = 21</text><text x="36" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 7  // primitive: NOT_YET — fewer than W values have arrived, so there is no answer.</text><text x="36" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 8  // primitive: HUGE = 10000000000000000 — one value replaced by a large one, so the window holds a</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 9  //   mixture of magnitudes. Scaling every value equally does NOT drift; the mixture does.</text><text x="36" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">10  // primitive: allWindows(f) — run f over every window in turn, for comparison.</text><text x="36" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">11  //   allWindows(recomputeAt) = [5.00, 4.00, 5.00, 3.00, 5.33, 4.67, 7.00]</text><text x="36" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">12  // primitive: runningAnswer(i) / recomputedAnswer(i) — the two methods' i-th answers.</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">13  //   runningAnswer(1) = 4.666666666666667   ·   recomputedAnswer(1) = 4</text><text x="36" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">14  </text><text x="36" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">15  // THE QUESTION, as asked:</text><text x="36" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">16  //   "Values arrive one at a time, forever. Report the average of the last W after every</text><text x="36" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">17  //    arrival. You may not re-read the window. Then: what do you report before W values</text><text x="36" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">18  //    have arrived? Then: is the running total exactly right?"</text><text x="36" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">19  </text><text x="36" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">20  // function: recomputeAt(xs, i) — the answer everyone gives first: add up the window.</text><text x="36" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">21  //   recomputeAt(VALUES, 0) = 5   ·   7 windows x 3 reads = 21</text><text x="36" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">22  fun recomputeAt(xs, i) {</text><text x="36" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">23      var total = 0</text><text x="36" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">24      var k = 0</text><text x="36" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">25      while (k &lt; W) {</text><text x="36" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">26          total = total + xs[i + k]</text><text x="36" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">27          k = k + 1</text><text x="36" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">28      }</text><text x="36" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">29      return total / W</text><text x="36" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">30  }</text><text x="36" y="606" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">31  </text><text x="36" y="623" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">32  // function: onArrival(xs, i) — add what came in, subtract what left. Two operations,</text><text x="36" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">33  //   whatever W is.</text><text x="36" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">34  //   at arrival 3: + 2 − 5 → sum 12</text><text x="36" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">35  //   9 additions and 6 subtractions in all, against 21 reads</text><text x="36" y="691" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">36  fun onArrival(xs, i) {</text><rect x="30" y="696" width="685" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="708" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">37      sum = sum + xs[i]</text><text x="36" y="725" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">38      if (i - W &gt;= 0) {</text><text x="36" y="742" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">39          sum = sum - xs[i - W]</text><text x="36" y="759" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">40      }</text><text x="36" y="776" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">41  }</text><text x="36" y="793" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">42  </text><text x="36" y="810" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">43  // function: report(i) — the answer, or NOT_YET. The guard is the one everyone forgets.</text><text x="36" y="827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">44  //   report(1) = NOT_YET   ·   report(2) = 5</text><text x="36" y="844" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">45  fun report(i) {</text><text x="36" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">46      if (i &lt; W - 1) { return NOT_YET }</text><text x="36" y="878" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">47      return sum / W</text><text x="36" y="895" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">48  }</text><text x="36" y="912" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">49  </text><text x="36" y="929" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">50  // function: driftAt(i) — how far the running total has wandered from the truth, at a</text><text x="36" y="946" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">51  //   magnitude where a double cannot hold both the total and one value.</text><text x="36" y="963" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">52  //   driftAt(1) = 0.666666666666667   ·   6 of 7 answers drift   ·   worst 0.666666666666667</text><text x="36" y="980" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">53  fun driftAt(i) {</text><text x="36" y="997" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">54      return runningAnswer(i) - recomputedAnswer(i)</text><text x="36" y="1014" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">55  }</text><text x="36" y="1031" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">56  </text><text x="36" y="1048" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">57  // function: main() — both answers, the warm-up, then the drift.</text><text x="36" y="1065" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">58  fun main() {</text><text x="36" y="1082" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">59      val slow  = allWindows(recomputeAt)   // 21 reads</text><text x="36" y="1099" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">60      val fast  = allWindows(report)        // 15 operations, same answers</text><text x="36" y="1116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">61      val early = report(1)                  // NOT_YET</text><text x="36" y="1133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">62      val same  = true                        // exact on these values</text><text x="36" y="1150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">63      val drift = 6                           // of 7 answers, with one value at 10000000000000000</text><text x="36" y="1167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">64  }</text><rect x="737" y="78" width="244" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="747" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STACK  (grows downward)</text><rect x="747" y="92" width="224" height="116" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="757" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">main</text><text x="763" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">slow = 21 reads</text><text x="763" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">fast = 15 ops</text><text x="763" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">early = NOT_YET</text><text x="763" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">same = true</text><text x="763" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">drift = 6</text><rect x="747" y="218" width="224" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="757" y="235" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">onArrival</text><text x="763" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">xs = @0x100</text><text x="763" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">i = 0</text><rect x="997" y="78" width="280" height="1114" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="1007" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HEAP  (allocated objects)</text><rect x="1007" y="92" width="260" height="41" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="1015" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x200  state : running</text><text x="1015" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">sum=21</text><text x="650.5" y="1226" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 10/0 — which is why integers are worth insisting on</text><text x="650.5" y="1258" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Integer addition and subtraction are exact and reversible, so the drift disappears entirely — which is why money is counted in pence and latencies in microseconds rather</text><text x="650.5" y="1275" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">than as fractions. If the values must be fractional, the fix is to recompute periodically, which bounds the residue to whatever accumulates between recomputations.</text></svg>