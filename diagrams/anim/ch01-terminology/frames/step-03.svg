<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 664" width="1140" height="664" role="img" aria-label="count by the wrong clock and the answer changes"><rect width="1140" height="664" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">What "streaming" means — and the two clocks underneath it</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">9 events · 3 of 6 minutes get a different answer per clock</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="414" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE SAME NINE EVENTS, COUNTED TWO WAYS</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">per-minute sum of v, by EVENT time (what users did) and by PROCESSING time (when we noticed)</text><rect x="48" y="170" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:00 minute</text><text x="254" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 12  (ids 0,1,7)</text><text x="624" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">processing time: 8  (ids 0,1)</text><text x="1074" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="204" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:01 minute</text><text x="254" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 7  (ids 2)</text><text x="624" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">processing time: 7  (ids 2)</text><text x="1074" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">agrees</text><rect x="48" y="238" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:02 minute</text><text x="254" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 2  (ids 3)</text><text x="624" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">processing time: 2  (ids 3)</text><text x="1074" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">agrees</text><rect x="48" y="272" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:03 minute</text><text x="254" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 9  (ids 6)</text><text x="624" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">processing time: 0  (ids none)</text><text x="1074" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="306" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:04 minute</text><text x="254" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 7  (ids 4,5)</text><text x="624" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">processing time: 20  (ids 4,5,6,7)</text><text x="1074" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">DIFFERENT</text><rect x="48" y="340" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">12:09 minute</text><text x="254" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">event time: 8  (ids 8)</text><text x="624" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">processing time: 8  (ids 8)</text><text x="1074" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">agrees</text><rect x="48" y="388" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="408" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">3 of the 6 minutes get a DIFFERENT answer depending on which clock you count by.</text><text x="62" y="428" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">No event was lost and no arithmetic is wrong. The two columns are counting two different questions.</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — count by the wrong clock and the answer changes</text><text x="570" y="590" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is the whole problem in one table. Bucketing by processing time says the 12:00 minute saw 8; bucketing by event time says 12. 3 of 6 minutes</text><text x="570" y="607" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">disagree. A processing-time dashboard is not a slightly-stale event-time dashboard — it answers a different question and can be arbitrarily far</text><text x="570" y="624" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">off.</text></svg>