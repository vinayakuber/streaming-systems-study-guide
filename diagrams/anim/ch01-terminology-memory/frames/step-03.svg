<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 1043" width="1235" height="1043" role="img" aria-label="so 3 of 6 minutes hold different numbers"><rect width="1235" height="1043" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">One dataset, two clocks — the same loop run twice</text><text x="1211" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">countBy(EVENTS,"et")[0] = 12 · countBy(EVENTS,"pt")[0] = 8 · 3 of 6 minutes disagree</text><rect x="24" y="78" width="631" height="825" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SOURCE</text><text x="36" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 1  // primitive: len(xs) — element count.  len([1,2]) = 2</text><text x="36" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 2  // Two of an event's five fields are CLOCKS, which is the whole subject of ch01:</text><text x="36" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 3  //   et = event time, when the thing happened  ·  pt = processing time, when we saw it</text><text x="36" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 4  //   v  = the value being summed (clicks, here)  ·  key = which stream it belongs to</text><text x="36" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 5  type Event { id, key, et, pt, v }</text><text x="36" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 6  // primitive: EVENTS — the book's 9 events, in PROCESSING order (tools/stream_seed.js).</text><text x="36" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 7  //   EVENTS[0] = (id 0, key "a", et 1, pt 2, v 5)</text><text x="36" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 8  //   EVENTS[7] = (id 7, key "b", et 50, pt 280, v 4)   &lt;- the late one</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 9  // primitive: NONE — no value. Distinct from a value of 0.</text><text x="36" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">10  // primitive: MIN — seconds in a dashboard minute.  MIN = 60</text><text x="36" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">11  // primitive: LAG — the watermark's assumed worst-case skew.  LAG = 60</text><text x="36" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">12  // primitive: minOf(sec) — the START of the MIN-second minute holding sec.</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">13  //   minOf(1) = 0      minOf(280) = 240</text><text x="36" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">14  // primitive: add(m, k, n) — add n to m[k], starting from 0 when k is absent.</text><text x="36" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">15  //   add({}, 0, 5) = {0: 5}      add({0: 5}, 0, 3) = {0: 8}</text><text x="36" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">16  // primitive: keysOf(m) — m's keys, ascending.  keysOf({0: 12, 60: 7}) = [0, 60]</text><text x="36" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">17  </text><text x="36" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">18  type Counter { byMinute }</text><text x="36" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">19  </text><text x="36" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">20  // function: countBy(events, clock) — bucket every event by ONE clock, sum v.</text><text x="36" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">21  //   countBy(EVENTS, "et").byMinute[0] = 12   (ids 0,1,7)</text><text x="36" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">22  //   countBy(EVENTS, "pt").byMinute[0] = 8   (ids 0,1)</text><text x="36" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">23  fun countBy(events, clock) {</text><text x="36" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">24      var m = {}</text><text x="36" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">25      for (e in events) {</text><text x="36" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">26          val minute = minOf(e[clock])</text><text x="36" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">27          add(m, minute, e.v)</text><text x="36" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">28      }</text><text x="36" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">29      return Counter(m)</text><text x="36" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">30  }</text><text x="36" y="606" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">31  </text><text x="36" y="623" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">32  // function: disagree(a, b) — the minutes where the two clocks give different sums.</text><text x="36" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">33  //   disagree(byEvent, byProc) = [0, 180, 240]</text><rect x="30" y="645" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">34  fun disagree(a, b) {</text><text x="36" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">35      var out = []</text><text x="36" y="691" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">36      for (minute in keysOf(a.byMinute)) {</text><rect x="30" y="696" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="708" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">37          if (a.byMinute[minute] != b.byMinute[minute]) { out.append(minute) }</text><text x="36" y="725" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">38      }</text><text x="36" y="742" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">39      return out</text><text x="36" y="759" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">40  }</text><text x="36" y="776" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">41  </text><text x="36" y="793" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">42  // function: main() — THE CALLER: one dataset, two clocks, one comparison.</text><text x="36" y="810" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">43  fun main() {</text><text x="36" y="827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">44      val byEvent = countBy(EVENTS, "et")</text><text x="36" y="844" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">45      val byProc  = countBy(EVENTS, "pt")</text><text x="36" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">46      val diff    = disagree(byEvent, byProc)</text><text x="36" y="878" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">47  }</text><rect x="671" y="78" width="244" height="825" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="681" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STACK  (grows downward)</text><rect x="681" y="92" width="224" height="80" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="691" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">main</text><text x="697" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">byEvent = @0x100</text><text x="697" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">byProc = @0x200</text><text x="697" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">diff = ...</text><rect x="681" y="182" width="224" height="98" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="691" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">disagree</text><text x="697" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">a = @0x100</text><text x="697" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">b = @0x200</text><text x="697" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">out = @0x300</text><text x="697" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">minute = 240</text><rect x="931" y="78" width="280" height="825" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="941" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HEAP  (allocated objects)</text><rect x="941" y="92" width="260" height="41" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="949" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x100  byEvent : Counter</text><text x="949" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">0:12 60:7 120:2 180:9 240:7 540:8</text><rect x="941" y="141" width="260" height="41" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="949" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x200  byProc : Counter</text><text x="949" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">0:8 60:7 120:2 240:20 540:8</text><rect x="941" y="190" width="260" height="41" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="949" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x300  diff : int[3]</text><text x="949" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">[0, 180, 240]</text><text x="617.5" y="937" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/0 — so 3 of 6 minutes hold different numbers</text><text x="617.5" y="969" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Read the two heap rows against each other: minute 0 holds 12 and 8; minute 240 holds 7 and 20. `out` collects every such minute: [0, 180, 240].</text></svg>