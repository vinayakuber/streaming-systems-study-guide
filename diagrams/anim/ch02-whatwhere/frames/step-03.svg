<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 558" width="1140" height="558" role="img" aria-label="the two axes really are independent"><rect width="1140" height="558" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">What and Where — the transformation, and the slice it runs over</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one sum, four windowings: global 45 · fixed 4 windows · sliding totals 78 · sessions a=3 b=2</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="308" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT x WHERE — EVERY COMBINATION IS LEGAL</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the grid is filled in for key a; no cell is forbidden and no cell is implied by another</text><text x="344" y="172" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="middle">global</text><text x="584" y="172" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="middle">fixed 120s</text><text x="824" y="172" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="middle">sessions 120s</text><rect x="48" y="182" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">sum(v)</text><text x="344" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">24</text><text x="584" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">8,2,6,8</text><text x="824" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">8,8,8</text><rect x="48" y="220" width="1040" height="34" rx="3" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="64" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">count</text><text x="344" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">5</text><text x="584" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">2,1,1,1</text><text x="824" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">2,2,1</text><rect x="48" y="258" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">distinct key</text><text x="344" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">1</text><text x="584" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">1,1,1,1</text><text x="824" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">1,1,1</text><rect x="48" y="304" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="324" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Nine cells, nine legal pipelines. Changing the row does not constrain the column and the reverse is also true.</text><text x="62" y="344" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">This is why the book asks the two questions separately: a design that answers only one of them is not half-specified, it is unspecified.</text><text x="570" y="452" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — the two axes really are independent</text><text x="570" y="484" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Nine cells and every one is a real pipeline you could run. The grid is the argument for separating the questions: "we sum purchases" names a row</text><text x="570" y="501" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">and leaves the answer undetermined, and "we use session windows" names a column and does the same. Both are needed before any number exists.</text></svg>