<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 558" width="1140" height="558" role="img" aria-label="WHAT is one choice: the transformation"><rect width="1140" height="558" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">What and Where — the transformation, and the slice it runs over</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one sum, four windowings: global 45 · fixed 4 windows · sliding totals 78 · sessions a=3 b=2</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="308" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT — THE COMPUTATION, WITH THE WINDOW HELD FIXED</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">four different WHATs, all over the same WHERE</text><rect x="48" y="156" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">sum of v over window [12:00, 12:02)</text><text x="1076" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">19   (ids 0, 1, 2, 7)</text><rect x="48" y="190" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">count over the same window</text><text x="1076" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">4 events</text><rect x="48" y="224" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">max of v over the same window</text><text x="1076" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">7</text><rect x="48" y="258" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">count DISTINCT key over the same window</text><text x="1076" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">2   (keys a, b)</text><rect x="48" y="300" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="320" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Every row reads the same 4 events. Only the computation changed, and the window was never mentioned.</text><text x="62" y="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">In the Beam model this is a transform in a directed graph: it says what comes out, and nothing about boundaries.</text><text x="570" y="452" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — WHAT is one choice: the transformation</text><text x="570" y="484" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Hold the window still and vary the computation: four answers from the same 4 events. That is "what" — a sum, a count, a max, a distinct count.</text><text x="570" y="501" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Notice the last row needs the KEY field while the first needs only `v`; the transform decides which fields matter, and still says nothing about</text><text x="570" y="518" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">where a boundary falls.</text></svg>