<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 558" width="1140" height="558" role="img" aria-label="batch already answers both — implicitly"><rect width="1140" height="558" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">What and Where — the transformation, and the slice it runs over</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one sum, four windowings: global 45 · fixed 4 windows · sliding totals 78 · sessions a=3 b=2</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="308" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">A MAPREDUCE JOB, IN THESE TERMS</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the same four questions, answered by a batch job without being asked</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHAT</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">the map and reduce functions — explicit, and the part everyone discusses</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">WHERE</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">the input file — ONE implicit window covering all 45 of the data</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHEN</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">end of input — implicit, and the reason it never comes up</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">HOW</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">nothing to relate: one window emits once, so there are no panes</text><rect x="48" y="316" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Batch answers all four. It just answers three of them by accident, because the input ended.</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">So the streaming model is not four new questions — it is the same four, with the defaults removed.</text><text x="570" y="452" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — batch already answers both — implicitly</text><text x="570" y="484" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is why the four questions are not streaming jargon. A MapReduce job over one file answers WHERE with "the file" and WHEN with "when I finish</text><text x="570" y="501" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">reading it", and both are correct — they are just invisible. Take away the end of the input and all three defaults stop existing at once, which is</text><text x="570" y="518" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the whole difficulty.</text></svg>