<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 598" width="1140" height="598" role="img" aria-label="and what this design does NOT settle"><rect width="1140" height="598" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a live clicks-per-minute dashboard</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">publishes 8 at 12:02:12 · truth is 12 · 148s of confident error</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="348" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SCOPE</text><rect x="48" y="150" width="1040" height="42" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The 60s lag is a GUESS. It was wrong about id 7 by 170s and nothing in the pipeline could detect that.</text><rect x="48" y="216" width="1040" height="42" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="236" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">One window here NEVER closes — [12:08, …) still holds 8. Unbounded input means unbounded STATE unless something expires it.</text><rect x="48" y="282" width="1040" height="42" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="302" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Nothing here is exactly-once. If the transport redelivers id 7, the 12:00 minute reads 16, and this design cannot tell that from a real click.</text><rect x="48" y="348" width="1040" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">And the dashboard shows 6 minutes because the seed has 9 events. Nothing here says what happens at a million per second.</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and what this design does NOT settle</text><text x="570" y="524" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Four honest gaps, and the first two are the ones that bite. The lag is unverifiable from inside the system; the state is unbounded unless</text><text x="570" y="541" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">something expires it; duplicates are indistinguishable from clicks; and the whole thing is sized for 9 events. Each gets its own chapter later —</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">which is the actual reason this book has ten of them.</text></svg>