<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 598" width="1140" height="598" role="img" aria-label="so the four questions are a completeness checklist"><rect width="1140" height="598" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">How — accumulation, retraction, and the arithmetic of refinement</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">the same two panes give 19, 34 or 4, depending only on the sink's assumption</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="348" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">ANSWER ALL FOUR, OR THE BEHAVIOUR IS NOT SPECIFIED</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one fully specified pipeline, for one result</text><rect x="48" y="156" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHAT</text><text x="1076" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">sum of v — 19 over this window</text><rect x="48" y="194" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHERE</text><text x="1076" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">fixed 120s event-time windows — [12:00, 12:02) is one of 4</text><rect x="48" y="232" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">WHEN</text><text x="1076" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">early every 60s · on-time at the watermark · late per straggler · allowed lateness &gt;= 81s</text><rect x="48" y="270" width="1040" height="34" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">HOW</text><text x="1076" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">accumulating and retracting — panes 15, -15, 19</text><rect x="48" y="320" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Omit WHEN and you cannot say when the 19 appears — or that 15 is published first.</text><text x="62" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Omit HOW and you cannot say whether the sink ends at 19, 34 or 4. Neither is a detail; each omission removes a guarantee.</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — so the four questions are a completeness checklist</text><text x="570" y="524" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Four lines fully specify one result's behaviour, and each line was shown to change an observable number. That is the test for whether a question</text><text x="570" y="541" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">belongs on the list: drop WHEN and the 81s threshold disappears along with the 15-then-19 sequence; drop HOW and the sink's value becomes</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">undetermined among three.</text></svg>