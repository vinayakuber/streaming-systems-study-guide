<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 598" width="1140" height="598" role="img" aria-label="three accumulation modes, three different pane streams"><rect width="1140" height="598" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">How — accumulation, retraction, and the arithmetic of refinement</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">the same two panes give 19, 34 or 4, depending only on the sink's assumption</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="348" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT EACH MODE ACTUALLY EMITS FOR THOSE TWO FIRINGS</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">same window, same two firings, same underlying events</text><rect x="48" y="156" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">DISCARDING</text><text x="1076" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">panes: 15, 4 — each pane is only the NEW data</text><rect x="48" y="194" width="1040" height="34" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">ACCUMULATING</text><text x="1076" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">panes: 15, 19 — each pane is the window's total so far</text><rect x="48" y="232" width="1040" height="34" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">ACCUMULATING &amp; RETRACTING</text><text x="1076" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">panes: 15, -15, 19 — the total, preceded by an undo of the old total</text><rect x="48" y="286" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="306" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Discarding's second pane is 4 — the new event's value alone. Accumulating's is 19 — the whole window.</text><text x="62" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">Retracting emits BOTH an undo (-15) and the new total (19), so a sink that can only add is still correct.</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — three accumulation modes, three different pane streams</text><text x="570" y="524" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The three modes publish three different streams from identical inputs. Discarding is cheapest — it sends 4 rather than 19 — and requires a sink</text><text x="570" y="541" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">that sums. Accumulating is simplest to read and requires a sink that overwrites. Retracting is the only one that is safe for a sink which can only</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">append, which is most of them.</text></svg>