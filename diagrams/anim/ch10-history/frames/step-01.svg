<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="MapReduce made batch tractable, and assumed an ending"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">From MapReduce to streaming — what an ending was answering</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">batch: 4 windows all final at event 9 · arrival-time pipeline: 3 of 4 wrong by 26</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · 4 windows</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">A BATCH JOB OVER THIS DATASET</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">correct, scalable, fault-tolerant — and it requires the input to stop</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what it reads</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">all 9 events, to the end of the input</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what it computes</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">4 windows: 19, 11, 7, 8 · total 45</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">when each result is final</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">at end of input — event 9 — all of them at once</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what it never needed</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">a watermark, a trigger, or an accumulation mode</text><rect x="48" y="316" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Three of the Beam model's four questions are answered by accident here: WHERE is the input file, WHEN is end of input, HOW has no panes to</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">relate.</text><text x="62" y="376" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Remove the ending and all three defaults stop existing at once. That is the whole difficulty, and it is not about latency.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — MapReduce made batch tractable, and assumed an ending</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Start from what batch actually gives you: 4 window results, all final at event 9, with no watermark and no triggers needed. It is not that batch</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">lacks these mechanisms — it is that the end of the input answers three of the four questions for free. Take the ending away and all three answers</text><text x="570" y="522" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">disappear together.</text></svg>