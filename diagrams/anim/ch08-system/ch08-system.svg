<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 566" width="1140" height="566" role="img" aria-label="animated walkthrough"><rect width="1140" height="566" fill="#ffffff"/><g><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="1;1;0;0" keyTimes="0;0.25;0.25;1"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a continuous click-count query</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one window row goes 15 → 19; none of 15, 19 or 12:04:06 appears in the SQL</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">A CONTINUOUS CLICK-COUNT QUERY — FIVE STAGES</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the sink requirement is readable from the query text</text><rect x="48" y="156" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">streams (clicks, impressions)</text><text x="1076" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">9 rows, with et and pt on every one</text><rect x="48" y="190" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">SQL engine (continuous query)</text><text x="1076" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">SELECT key, SUM(v) FROM clicks GROUP BY key, TUMBLE(et, IN…</text><rect x="48" y="224" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">watermark + window</text><text x="1076" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">TUMBLE buckets by et; the watermark decides when each bucket emits</text><rect x="48" y="258" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">updating result</text><text x="1076" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">7 rows, of which 2 window row gets revised</text><rect x="48" y="292" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">sink</text><text x="1076" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">must UPSERT — an INSERT-only sink cannot express the revision</text><rect x="48" y="340" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The last row is the design decision this query forces: a windowed GROUP BY produces an updating stream, so the sink needs UPSERT or retractions.</text><text x="62" y="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">That is known before any code is written, from the shape of the query — which is the practical value of the append-only/updating distinction.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — the pipeline, and the one line of SQL it runs</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The useful property of a SQL-first design is that the sink requirement falls out of the query text. A windowed `GROUP BY` is an updating stream —</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">2 of 4 window rows is revised here — so the sink must UPSERT. Had the query been a `WHERE`, an append-only sink would have been fine, and that is</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">decidable before anything is built.</text></g><g opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.5;0.5;1"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a continuous click-count query</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one window row goes 15 → 19; none of 15, 19 or 12:04:06 appears in the SQL</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WINDOW [12:00, 12:02) — WHAT THE SINK RECEIVES</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one output row, two values, and the SQL says nothing about either</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">rows that belong to this window</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">ids 0, 1, 2, 7 · final sum 19</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">the watermark passes 12:02 after event 4</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">at 12:04:06 — the engine emits</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what it emits then</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">15, from ids 0, 1, 2</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">then id 7 arrives at 12:04:40</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">the row is UPDATED: 15 → 19</text><rect x="48" y="316" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The query text contains neither 15 nor 19 nor the moment 12:04:06 — all three come from the watermark the engine maintains.</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">Which is the point of this chapter: SQL made the query short and left the timing semantics exactly where ch02 and ch03 put them.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the result row, as it actually changes</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Follow the one row all the way: the window finally holds 19, the watermark lets the engine emit at 12:04:06 with 15, and id 7 later revises it to</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">19. None of 15, 19 or 12:04:06 appears in the SQL. The query got shorter; the semantics did not get simpler.</text></g><g opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.75;0.75;1"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a continuous click-count query</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one window row goes 15 → 19; none of 15, 19 or 12:04:06 appears in the SQL</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHAT CHANGING ONE TOKEN DOES</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">four queries differing by a few characters, four different result shapes</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE(et, 120s) — as written</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">4 rows: 19, 11, 7, 8</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">TUMBLE(pt, 120s) — one token changed</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">4 rows: 15, 2, 20, 8 — 3 differ</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">HOP(et, 60s, 120s)</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">7 rows totalling 78, against a dataset of 45</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">SESSION(et, 120s)</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">5 rows — a count the query cannot predict</text><rect x="48" y="316" width="1040" height="82" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">None of these is wrong. They answer four different questions, and the SQL is almost identical in all four.</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">So a code review of a streaming query has to read the window and the time attribute first — they carry more meaning per character than anything</text><text x="62" y="376" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">else in the statement.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — the two choices that are still yours</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Four nearly-identical statements with four different answers: 4 rows, 4 rows disagreeing on 3 of them, 7 rows totalling 78, and 5 rows whose count</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the query cannot predict. Those few characters carry more meaning than the rest of the statement put together.</text></g><g opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;1" keyTimes="0;0.75;0.75;1"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — a continuous click-count query</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">one window row goes 15 → 19; none of 15, 19 or 12:04:06 appears in the SQL</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SCOPE</text><rect x="48" y="150" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">1 of the 4 windows is never emitted, because the watermark never passes its end. Nothing in the SQL hints at that, and the sink simply never sees</text><text x="62" y="190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">the row.</text><rect x="48" y="216" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="236" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The engine chooses the accumulation mode. If it accumulates and the sink sums rather than upserts, the window reads 34 instead of 19 — and that</text><text x="62" y="256" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">mismatch lives outside the query entirely.</text><rect x="48" y="282" width="1040" height="42" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="302" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Allowed lateness is an engine setting, not query syntax. Whether id 7 is admitted at all depends on configuration the SQL does not mention.</text><rect x="48" y="348" width="1040" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">And SESSION's row count is data-dependent (5 here), so a query that looks like the others cannot be capacity-planned like them.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and what this query does NOT settle</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The first two gaps are the ones that make SQL deceptive rather than merely incomplete. A window that never emits produces no error and no row; a</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">sink that sums accumulating panes reads 34 instead of 19. Both are invisible in the query text, which is exactly why the model underneath still</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">has to be understood.</text></g></svg>