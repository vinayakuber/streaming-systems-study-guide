<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="GROUP and TRIGGER — state per (key, window)"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">The window lifecycle — assign, merge, group and trigger, accumulate and collect</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">2 of key "b"'s arrivals merge · 5 state entries · the straggler beats collection by 1 event</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · gap 120s · 5 sessions</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STEP 3 OF 4 — GROUP BY (KEY, WINDOW), THEN TRIGGER</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one state entry per (key, window) pair — the unit everything downstream works on</text><rect x="48" y="156" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">("a", [12:00:01, 12:00:03] ids 0,1 sum 8)</text><text x="1076" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">watermark passes 12:02:03 at event 4</text><rect x="48" y="188" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">("a", [12:02:10, 12:04:05] ids 3,4 sum 8)</text><text x="1076" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">watermark passes 12:06:05 at event 8</text><rect x="48" y="220" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">("a", [12:09:00, 12:09:00] ids 8 sum 8)</text><text x="1076" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">never collected in this stream</text><rect x="48" y="252" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">("b", [12:00:50, 12:01:30] ids 7,2 sum 11)</text><text x="1076" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">watermark passes 12:03:30 at event 8</text><rect x="48" y="284" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">("b", [12:03:40, 12:04:20] ids 6,5 sum 10)</text><text x="1076" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">watermark passes 12:06:20 at event 8</text><rect x="48" y="330" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">There are 5 state entries here, one per (key, session). The number of them is data-dependent, which fixed windows never are.</text><text x="62" y="370" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">1 of them is never collected in this stream, so its memory is held until the job ends.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — GROUP and TRIGGER — state per (key, window)</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The unit of streaming state is the (key, window) pair, and for sessions the NUMBER of those pairs depends on the data. 5 entries here; a quieter</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">stream would give fewer and a burstier one more. That is the practical difference between sessions and fixed windows: you cannot size the state in</text><text x="570" y="522" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">advance.</text></svg>