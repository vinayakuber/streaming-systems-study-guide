<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="ASSIGN — by event time, and possibly to several windows"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">The window lifecycle — assign, merge, group and trigger, accumulate and collect</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">2 of key "b"'s arrivals merge · 5 state entries · the straggler beats collection by 1 event</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · gap 120s · 5 sessions</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STEP 1 OF 4 — ASSIGN</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">one event, three windowings, three different assignments</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">fixed: id 4 (et 12:04:05)</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">1 window: [12:04, 12:06)</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">sliding: the same event</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">2 windows: [12:03, 12:05), [12:04, 12:06)</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">session: the same event</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">1 window, whose BOUNDS are not known yet</text><rect x="48" y="264" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">what assign reads</text><text x="1076" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">e.et and the windowing function — never the arrival time</text><rect x="48" y="316" width="1040" height="82" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The session row is the odd one: an event is assigned to a session whose START and END are still provisional, because a later event can extend</text><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">either.</text><text x="62" y="376" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">That is the whole reason the next step exists. Fixed and sliding assignments are final at assign time; session assignments are not.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — ASSIGN — by event time, and possibly to several windows</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Assign reads `e.et` and the windowing rule, and nothing else. For fixed and sliding that settles the question permanently. For a session it does</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">not: id 4 joins a session whose bounds depend on events that have not arrived — so a session assignment is a hypothesis, and the merge step is</text><text x="570" y="522" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">what revises it.</text></svg>