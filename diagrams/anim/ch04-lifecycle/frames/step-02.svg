<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="MERGE — a later arrival can absorb an existing session"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">The window lifecycle — assign, merge, group and trigger, accumulate and collect</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">2 of key "b"'s arrivals merge · 5 state entries · the straggler beats collection by 1 event</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · gap 120s · 5 sessions</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STEP 2 OF 4 — MERGE (key "b", in processing order)</text><rect x="48" y="162" width="1040" height="36" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">id 2 arrives (et 12:01:30)</text><text x="324" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">[01:30–01:30]</text><text x="1074" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">new session</text><rect x="48" y="202" width="1040" height="36" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">id 5 arrives (et 12:04:20)</text><text x="324" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">[01:30–01:30]  [04:20–04:20]</text><text x="1074" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8a97a6" text-anchor="end">new session</text><rect x="48" y="242" width="1040" height="36" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">id 6 arrives (et 12:03:40)</text><text x="324" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">[01:30–01:30]  [03:40–04:20]</text><text x="1074" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MERGED into a session</text><rect x="48" y="282" width="1040" height="36" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">id 7 arrives (et 12:00:50)</text><text x="324" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">[00:50–01:30]  [03:40–04:20]</text><text x="1074" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">MERGED into a session</text><rect x="48" y="336" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="356" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">2 of key "b"'s 4 arrivals merge: id 6 and id 7 each arrive OUT OF ORDER and extend a session backwards.</text><text x="62" y="376" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Note what that means: a session's START moved after the session existed. No other windowing has a boundary that can change.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — MERGE — a later arrival can absorb an existing session</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Watch the second column change shape as events arrive. id 6 (et 12:03:40) arrives after a later event and pulls a session's start backwards; id 7</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">does the same to the other one. Merging is what makes sessions dynamic — and it is also why a session's value can change after it has been</text><text x="570" y="522" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">reported.</text></svg>