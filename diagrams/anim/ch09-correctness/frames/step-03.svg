<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 566" width="1140" height="566" role="img" aria-label="so the accounting is: on time, late, or never"><rect width="1140" height="566" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Correctness and state — on time, late, or never</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">1 + 2 + 2 = 5 true matches · peak buffer 5</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · "a" = clicks, "b" = impressions · join window 60s</text><rect x="24" y="104" width="1092" height="316" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">ALL 5 TRUE MATCHES, BY WHAT ACTUALLY HAPPENS TO THEM</text><rect x="48" y="162" width="1040" height="36" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">emitted ON TIME and correct</text><text x="1074" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="end">1 match</text><rect x="48" y="202" width="1040" height="36" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="64" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">emitted LATE, after a retraction</text><text x="1074" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="end">2 matches</text><rect x="48" y="242" width="1040" height="36" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">NEVER emitted at all</text><text x="1074" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="end">2 matches — the watermark never passed the bound</text><rect x="48" y="296" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="316" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">1 + 2 + 2 = 5. Only 1 of the 5 true matches is published correctly the first time.</text><text x="62" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">This is the honest picture of a stream-stream join on out-of-order data, and it is why ad attribution is hard rather than fiddly.</text><text x="570" y="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — so the accounting is: on time, late, or never</text><text x="570" y="492" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The accounting is the chapter's central result and it is not comfortable: of 5 true matches, **1** is published correctly on the first attempt,</text><text x="570" y="509" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">**2** requires a retraction, and **2** are computed, held in state and never published at all. Nothing is broken — this is what a correct windowed</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">join does on this data.</text></svg>