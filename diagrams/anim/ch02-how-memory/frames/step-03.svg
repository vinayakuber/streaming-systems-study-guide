<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1235 1264" width="1235" height="1264" role="img" aria-label="the SAME sink, given accumulating panes, double counts"><rect width="1235" height="1264" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">How — the same two panes into three sinks, and three answers</text><text x="1211" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">correct 19 · summing an accumulating stream 34 · replacing a discarding one 4</text><rect x="24" y="78" width="631" height="1046" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SOURCE</text><text x="36" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 1  // primitive: len(xs) — element count.  len([1,2]) = 2</text><text x="36" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 2  // Two of an event's five fields are CLOCKS, which ch01 established:</text><text x="36" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 3  //   et = event time, when it happened  ·  pt = processing time, when we saw it</text><text x="36" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 4  //   v = the value being summed  ·  key = which stream it belongs to</text><text x="36" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 5  type Event { id, key, et, pt, v }</text><text x="36" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 6  // primitive: EVENTS — the book's 9 events, in PROCESSING order (tools/stream_seed.js).</text><text x="36" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 7  //   EVENTS[7] = (id 7, key "b", et 50, pt 280, v 4)   &lt;- the late one</text><text x="36" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 8  // primitive: NONE — no value. Distinct from a value of 0.</text><text x="36" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve"> 9  // primitive: WIN — the fixed window width, in seconds of event time.  WIN = 120</text><text x="36" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">10  // primitive: LAG — the watermark's assumed worst-case skew.  LAG = 60</text><text x="36" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">11  // primitive: W0 — the window this chapter specifies.  W0 = 0  ([12:00, 12:02))</text><text x="36" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">12  // primitive: winOf(et) — the START of the WIN-second event-time window holding et.</text><text x="36" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">13  //   winOf(50) = 0      winOf(245) = 240</text><text x="36" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">14  // primitive: sum(ids) — total v over those event ids.</text><text x="36" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">15  //   sum([0, 1, 2, 7]) = 19      sum([0, 1, 2]) = 15</text><text x="36" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">16  // primitive: append(xs, x) — xs with x added at the end.  append([1], 2) = [1,2]</text><text x="36" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">17  </text><text x="36" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">18  type Panes { mode, values }</text><text x="36" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">19  </text><text x="36" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">20  // primitive: ONTIME — what the window held when the watermark passed.  ONTIME = 15</text><text x="36" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">21  // primitive: TRUE_SUM — what the window holds once id 7 lands.  TRUE_SUM = 19</text><text x="36" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">22  // primitive: DELTA — the late event's own value.  DELTA = TRUE_SUM - ONTIME = 4</text><text x="36" y="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">23  </text><text x="36" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">24  // function: panesFor(mode) — what the pipeline PUBLISHES for those two firings.</text><text x="36" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">25  //   panesFor("discarding")   = [15, 4]</text><text x="36" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">26  //   panesFor("accumulating") = [15, 19]</text><text x="36" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">27  //   panesFor("retracting")   = [15, -15, 19]</text><text x="36" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">28  fun panesFor(mode) {</text><text x="36" y="572" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">29      if (mode == "discarding")   { return Panes(mode, [ONTIME, DELTA]) }</text><text x="36" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">30      if (mode == "accumulating") { return Panes(mode, [ONTIME, TRUE_SUM]) }</text><text x="36" y="606" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">31      return Panes(mode, [ONTIME, 0 - ONTIME, TRUE_SUM])</text><text x="36" y="623" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">32  }</text><text x="36" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">33  </text><text x="36" y="657" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">34  // function: sinkSum(p) — a sink that can only ADD what it receives.</text><text x="36" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">35  //   sinkSum(panesFor("discarding")) = 19</text><text x="36" y="691" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">36  //   sinkSum(panesFor("accumulating")) = 34</text><text x="36" y="708" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">37  //   sinkSum(panesFor("retracting")) = 19</text><text x="36" y="725" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">38  fun sinkSum(p) {</text><text x="36" y="742" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">39      var acc = 0</text><text x="36" y="759" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">40      for (x in p.values) { acc = acc + x }</text><text x="36" y="776" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">41      return acc</text><text x="36" y="793" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">42  }</text><text x="36" y="810" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">43  </text><text x="36" y="827" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">44  // function: sinkReplace(p) — a sink that OVERWRITES on each pane.</text><text x="36" y="844" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">45  //   sinkReplace(panesFor("accumulating")) = 19</text><text x="36" y="861" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">46  //   sinkReplace(panesFor("discarding")) = 4</text><text x="36" y="878" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">47  fun sinkReplace(p) {</text><text x="36" y="895" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">48      var cur = 0</text><text x="36" y="912" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">49      for (x in p.values) { cur = x }</text><text x="36" y="929" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">50      return cur</text><text x="36" y="946" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">51  }</text><text x="36" y="963" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">52  </text><text x="36" y="980" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">53  // function: main() — THE CALLER: every mode against every sink.</text><text x="36" y="997" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">54  fun main() {</text><text x="36" y="1014" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">55      val okDisc   = sinkSum(panesFor("discarding"))</text><text x="36" y="1031" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">56      val okAcc    = sinkReplace(panesFor("accumulating"))</text><text x="36" y="1048" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">57      val okRetr   = sinkSum(panesFor("retracting"))</text><rect x="30" y="1053" width="619" height="16" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><text x="36" y="1065" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="start" xml:space="preserve">58      val badSum   = sinkSum(panesFor("accumulating"))</text><text x="36" y="1082" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">59      val badRepl  = sinkReplace(panesFor("discarding"))</text><text x="36" y="1099" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start" xml:space="preserve">60  }</text><rect x="671" y="78" width="244" height="1046" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="681" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">STACK  (grows downward)</text><rect x="681" y="92" width="224" height="116" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="691" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">main</text><text x="697" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">okDisc = 19</text><text x="697" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">okAcc = 19</text><text x="697" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">okRetr = 19</text><text x="697" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">badSum = 34</text><text x="697" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">badRepl = ...</text><rect x="681" y="218" width="224" height="80" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="691" y="235" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">sinkSum</text><text x="697" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">p = @0x200</text><text x="697" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">acc = 34</text><text x="697" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">x = 19</text><rect x="931" y="78" width="280" height="1046" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="941" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HEAP  (allocated objects)</text><rect x="941" y="92" width="260" height="41" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="949" y="109" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x100  disc : Panes</text><text x="949" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">discarding [15, 4]</text><rect x="941" y="141" width="260" height="41" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="949" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">0x200  acc : Panes</text><text x="949" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="start">accumulating [15, 19]</text><text x="617.5" y="1158" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/0 — the SAME sink, given accumulating panes, double counts</text><text x="617.5" y="1190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">15 + 19 = **34** — 79% high, because pane 2 already contained pane 1. The pipeline was right, the sink was right, and the result is wrong by 15. No error is</text><text x="617.5" y="1207" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">raised anywhere.</text></svg>