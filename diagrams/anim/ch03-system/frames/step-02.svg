<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 562" width="1140" height="562" role="img" aria-label="the naive formula goes BACKWARDS — twice"><rect width="1140" height="562" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — the watermark generator</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">max seen − 60s, per source, minimum across · naive formula regresses 2x</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · lag 60s · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="312" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">WHY max() IS IN THE FORMULA</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">row 2 = this event's own time − 60s (naive)  ·  row 3 = max seen − 60s (correct)</text><rect x="84" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="137" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 0</text><rect x="194" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="247" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 1</text><rect x="304" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="357" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 2</text><rect x="414" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="467" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 3</text><rect x="524" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="577" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 4</text><rect x="634" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="687" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 5</text><rect x="744" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="797" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 6</text><rect x="854" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="907" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 7</text><rect x="964" y="166" width="106" height="24" rx="3" fill="#eef2f7" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 8</text><rect x="84" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="194" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="247" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="304" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="357" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="414" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="467" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">01:10</text><rect x="524" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="577" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="634" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="687" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="744" y="198" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="797" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">02:40</text><rect x="854" y="198" width="106" height="26" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="907" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">none yet</text><rect x="964" y="198" width="106" height="26" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">08:00</text><rect x="84" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="137" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="194" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="247" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">none yet</text><rect x="304" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="357" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">00:30</text><rect x="414" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="467" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">01:10</text><rect x="524" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="577" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:05</text><rect x="634" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="687" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="744" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="797" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="854" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="907" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">03:20</text><rect x="964" y="230" width="106" height="26" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="1017" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#1b2430" text-anchor="middle">08:00</text><rect x="48" y="274" width="1040" height="82" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="294" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The naive row regresses 2 times: 12:03:20 → 12:02:40 (−40s) and 12:02:40 → none yet (−170s).</text><text x="62" y="314" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">A watermark that moves backwards would RE-OPEN a window that had already been closed and published, so every downstream guarantee collapses.</text><text x="62" y="334" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">`max()` is what makes that impossible.</text><text x="570" y="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — the naive formula goes BACKWARDS — twice</text><text x="570" y="488" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Two formulas differing by one function call. `e.et − skew` looks equivalent and is not: it falls back 40s at id 6 and 170s at id 7. Monotonicity</text><text x="570" y="505" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">is not a nicety — a backwards watermark un-closes a published window, and nothing downstream is prepared for that.</text></svg>