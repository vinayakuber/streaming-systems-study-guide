<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 606" width="1140" height="606" role="img" aria-label="and what this design does NOT settle"><rect width="1140" height="606" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">System design — charge a card exactly once</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">order 4, amount 6: crash after the charge, replay, charged 6 not 12</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · crash at event 4</text><rect x="24" y="104" width="1092" height="356" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">SCOPE</text><rect x="48" y="150" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The idempotency key requires the processor to support it. If it does not, this design does not degrade gracefully — it is simply unavailable, and</text><text x="62" y="190" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">2PC is the fallback.</text><rect x="48" y="216" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="236" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The key must be derived from the data ("order-4"). A key generated at send time produces a second charge with extra steps, and nothing in the</text><text x="62" y="256" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">pipeline detects that.</text><rect x="48" y="282" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="302" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The dedup seen-set is unbounded state. Bounding it by a window means dedup stops working past that horizon — so the 1-of-3 coverage is also</text><text x="62" y="322" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">time-limited.</text><rect x="48" y="348" width="1040" height="62" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="368" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">And a replayable source protects completeness only as far back as its retention. Beyond that, the 23 outcome is reachable again and no downstream</text><text x="62" y="388" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">guard helps.</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — and what this design does NOT settle</text><text x="570" y="532" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The first two gaps are the ones that silently break this design. The whole guarantee rests on a feature of someone else's system, and on a key</text><text x="570" y="549" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">being derived from data rather than generated — and a send-time key fails in a way that produces a correct-looking pipeline and a double charge.</text><text x="570" y="566" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Neither is visible from inside, which is why both belong in the design review rather than in testing.</text></svg>