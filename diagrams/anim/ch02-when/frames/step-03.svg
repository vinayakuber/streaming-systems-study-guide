<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 606" width="1140" height="606" role="img" aria-label="so a pipeline wants THREE triggers, not one"><rect width="1140" height="606" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">When — triggers, watermarks, and allowed lateness</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">processing-time trigger emits 8, 15, 15 · watermark trigger emits 15 · threshold for the fix: 81s</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · window [12:00, 12:02) = 19</text><rect x="24" y="104" width="1092" height="356" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">EARLY · ON-TIME · LATE</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">three separate triggers on one window, each answering a different need</text><rect x="48" y="156" width="1040" height="36" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">EARLY — every 60s before the watermark</text><text x="1076" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">speculative: 8, 15, 15 — fast and knowingly incomplete</text><rect x="48" y="196" width="1040" height="36" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">ON-TIME — when the watermark passes 12:02</text><text x="1076" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">15 at 12:04:06 — the pipeline's best claim</text><rect x="48" y="236" width="1040" height="36" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">LATE — once per straggler after that</text><text x="1076" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">19 at 12:04:40, when id 7 lands</text><rect x="48" y="294" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="314" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">These are not alternatives — a real pipeline fires all three on the SAME window, producing 3+ results for one answer.</text><text x="62" y="334" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Early serves a dashboard that wants something now; on-time serves a report; late serves correctness. One trigger cannot serve all three.</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — so a pipeline wants THREE triggers, not one</text><text x="570" y="532" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The reason "when" is a question rather than a setting: these three triggers serve three different consumers, and a window fires for all of them.</text><text x="570" y="549" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">One window, several published results — which is exactly the situation the fourth question ("how") exists to make safe.</text></svg>