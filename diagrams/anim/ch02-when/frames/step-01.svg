font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">fires at 12:02:00</text><text x="284" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events in the window that have arrived: ids 0,1,2</text><text x="1074" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="end">emits 15</text><rect x="48" y="230" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">fires at 12:03:00</text><text x="284" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events in the window that have arrived: ids 0,1,2</text><text x="1074" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="end">emits 15</text><rect x="48" y="264" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">fires at 12:04:00</text><text x="284" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events in the window that have arrived: ids 0,1,2</text><text x="1074" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#e11d48" text-anchor="end">emits 15</text><rect x="48" y="298" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">fires at 12:05:00</text><text x="284" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events in the window that have arrived: ids 0,1,2,7</text><text x="1074" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="end">emits 19</text><rect x="48" y="332" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="64" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">fires at 12:06:00</text><text x="284" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">events in the window that have arrived: ids 0,1,2,7</text><text x="1074" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="end">emits 19</text><rect x="48" y="380" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">The trigger fires on the CLOCK, so it emits whatever has arrived — 8, then 15, then 15, then 15, then 19, then 19.</text><text x="62" y="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">It first reaches the right answer, 19, at 12:05:00 — and it has no way to know that firing was the right one.</text><text x="570" y="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — a trigger is the thing that says "emit now"</text><text x="570" y="532" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">A processing-time trigger is the simplest possible "when": fire every 60s. It is never blocked and never wrong about its own rule — and it emits</text><text x="570" y="549" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">8, then 15, then 15. The right answer appears at 12:05:00, indistinguishable from the firings before it.</text></svg>