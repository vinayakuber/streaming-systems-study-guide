<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 582" width="1140" height="582" role="img" aria-label="and the two codebases drift, in a predictable direction"><rect width="1140" height="582" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Lambda and Kappa — two implementations, or one plus replay</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">Lambda's plausible drift: 3 of 4 windows, 26 units · the same fix lands in 2 places vs 1</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · total 45 · 4 windows</text><rect x="24" y="104" width="1092" height="332" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">THE LIKELY DIVERGENCE: THE SPEED LAYER BUCKETS ON ARRIVAL</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the batch layer has the whole input, so event time is natural; the speed layer sees arrivals</text><rect x="48" y="170" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:00, 12:02)</text><text x="284" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">batch layer: 19</text><text x="544" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">speed layer: 15</text><text x="1074" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">off by 4</text><rect x="48" y="204" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:02, 12:04)</text><text x="284" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">batch layer: 11</text><text x="544" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">speed layer: 2</text><text x="1074" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">off by 9</text><rect x="48" y="238" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:04, 12:06)</text><text x="284" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">batch layer: 7</text><text x="544" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#e11d48" text-anchor="start">speed layer: 20</text><text x="1074" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">off by 13</text><rect x="48" y="272" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">window [12:08, 12:10)</text><text x="284" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">batch layer: 8</text><text x="544" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">speed layer: 8</text><text x="1074" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">agrees</text><rect x="48" y="320" width="1040" height="82" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="340" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">3 of the 4 windows disagree, by 26 in total — and both layers are internally consistent and bug-free.</text><text x="62" y="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">The divergence is not carelessness. The batch layer has the whole input so event time is the obvious choice; the speed layer sees arrivals and</text><text x="62" y="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">arrival time is the obvious choice.</text><text x="570" y="476" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — and the two codebases drift, in a predictable direction</text><text x="570" y="508" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The drift has a direction, which is why it is predictable rather than merely possible. Each layer reaches for the clock its own context makes</text><text x="570" y="525" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">obvious — the whole input suggests event time, a stream of arrivals suggests arrival time — and the result is 3 of 4 windows disagreeing by 26,</text><text x="570" y="542" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">with no bug in either implementation.</text></svg>