<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 632" width="1140" height="632" role="img" aria-label="unbounded data as batch: slice by the WRONG clock"><rect width="1140" height="632" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Three shapes of data — and why batch is the special case</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">bounded · unbounded-as-batch (2 of 9 events misplaced) · unbounded-as-streaming</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="382" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">UNBOUNDED-AS-BATCH — sliced into 120s chunks of PROCESSING time</text><rect x="48" y="162" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">chunk [12:00, 12:02) of ARRIVALS</text><text x="424" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">holds ids 0,1,2</text><text x="1074" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">all correctly placed</text><rect x="48" y="196" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">chunk [12:02, 12:04) of ARRIVALS</text><text x="424" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">holds ids 3</text><text x="1074" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">all correctly placed</text><rect x="48" y="230" width="1040" height="30" rx="3" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="64" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">chunk [12:04, 12:06) of ARRIVALS</text><text x="424" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">holds ids 4,5,6,7</text><text x="1074" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="end">id 6,7 belongs elsewhere</text><rect x="48" y="264" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#1b2430" text-anchor="start">chunk [12:08, 12:10) of ARRIVALS</text><text x="424" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">holds ids 8</text><text x="1074" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">all correctly placed</text><rect x="48" y="312" width="1040" height="62" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="62" y="332" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">2 of the 9 events are in a chunk that is not their event-time window: ids 6 and 7.</text><text x="62" y="352" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="start">From INSIDE a chunk there is no way to notice. Each chunk is internally consistent, finishes cleanly, and reports a wrong number.</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — unbounded data as batch: slice by the WRONG clock</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">This is the pattern most "streaming" systems actually are: a batch job on a timer. It works, it is simple, and 2 of 9 events land in the wrong</text><text x="570" y="575" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">bucket — id 6 by 50s and id 7 by 230s. The chunk boundary is a fact about the pipeline's clock, and it is being used to answer a question about</text><text x="570" y="592" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">the users' clock.</text></svg>