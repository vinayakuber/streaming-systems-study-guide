<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 632" width="1140" height="632" role="img" aria-label="unbounded data as streaming: close on the watermark"><rect width="1140" height="632" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Three shapes of data — and why batch is the special case</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">bounded · unbounded-as-batch (2 of 9 events misplaced) · unbounded-as-streaming</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="382" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">UNBOUNDED-AS-STREAMING — each window closes when the watermark crosses its end</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">windows are 120s of EVENT time; closing is a PROCESSING-time moment</text><rect x="48" y="156" width="1040" height="30" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">window [12:00, 12:02)</text><text x="1076" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">closes after event id 4 (at 12:04:06)</text><rect x="48" y="190" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:02, 12:04)</text><text x="1076" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">closes after event id 8 (at 12:09:02)</text><rect x="48" y="224" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:04, 12:06)</text><text x="1076" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">closes after event id 8 (at 12:09:02)</text><rect x="48" y="258" width="1040" height="30" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:08, 12:10)</text><text x="1076" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">NEVER closes in this seed</text><rect x="48" y="306" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Window [12:00, 12:02) closes after event id 4 — and id 7 arrives 3 events later, so it is LATE by construction.</text><text x="62" y="346" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">The last window never closes at all: no event ever pushes the watermark past its end. "Unbounded" includes the state you are left holding.</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 3/4 — unbounded data as streaming: close on the watermark</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Streaming keeps the event-time windows (so the buckets are right) and makes CLOSING a separate, processing-time decision. That split is what</text><text x="570" y="575" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">batch-on-a-timer collapses. The price is visible on both ends of this table: the first window closes before id 7 shows up, and the last one is</text><text x="570" y="592" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">still open with 8 in it and nothing to trigger it.</text></svg>