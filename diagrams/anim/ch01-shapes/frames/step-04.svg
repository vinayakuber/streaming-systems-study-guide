<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 632" width="1140" height="632" role="img" aria-label="batch is the special case, not the other way round"><rect width="1140" height="632" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Three shapes of data — and why batch is the special case</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">bounded · unbounded-as-batch (2 of 9 events misplaced) · unbounded-as-streaming</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="382" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">ONE MODEL, THREE SHAPES</text><text x="48" y="148" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">the grouping key is the only thing that differs</text><rect x="48" y="156" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">bounded</text><text x="1076" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">group by event-time window · every window final at end of input (event 9)</text><rect x="48" y="192" width="1040" height="32" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="60" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">unbounded-as-batch</text><text x="1076" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end">group by PROCESSING-time chunk · 2 of 9 events misplaced</text><rect x="48" y="228" width="1040" height="32" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">unbounded-as-streaming</text><text x="1076" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">group by event-time window · each closes when the watermark crosses</text><rect x="48" y="276" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="296" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">Rows 1 and 3 use the SAME grouping key and get the SAME buckets. They differ only in WHEN they declare a window done.</text><text x="62" y="316" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Row 2 is the odd one out — and not because it is batch. It is wrong because it keyed on the arrival clock.</text><rect x="48" y="360" width="1040" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">So: bounded is unbounded data whose watermark jumps to "everything" at the end of input. One model covers both.</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 4/4 — batch is the special case, not the other way round</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">The usual framing — "batch for history, streaming for live" — makes these sound like two systems. They are one. A bounded input is an unbounded</text><text x="570" y="575" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">one whose watermark reaches infinity at EOF, which closes every window at once. Keep that and you can write a pipeline once; the shape of the</text><text x="570" y="592" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">input decides when it speaks, not what it computes.</text></svg>