<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 632" width="1140" height="632" role="img" aria-label="bounded data: it ends, so completeness is free"><rect width="1140" height="632" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Three shapes of data — and why batch is the special case</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">bounded · unbounded-as-batch (2 of 9 events misplaced) · unbounded-as-streaming</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · 9 events · lag 60s</text><rect x="24" y="104" width="1092" height="382" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">BOUNDED — ALL NINE EVENTS, AS A FINITE FILE</text><rect x="84" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="137" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 0</text><text x="137" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">00:01</text><rect x="194" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="247" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 1</text><text x="247" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">00:03</text><rect x="304" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="357" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 2</text><text x="357" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">01:30</text><rect x="414" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="467" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 3</text><text x="467" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">02:10</text><rect x="524" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="577" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 4</text><text x="577" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">04:05</text><rect x="634" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="687" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 5</text><text x="687" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">04:20</text><rect x="744" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="797" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 6</text><text x="797" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">03:40</text><rect x="854" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="907" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 7</text><text x="907" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">00:50</text><rect x="964" y="178" width="106" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="1017" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="middle">id 8</text><text x="1017" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#8a97a6" text-anchor="middle">09:00</text><text x="84" y="234" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">read to the end  →  sort by event time  →  one answer per window  →  job exits</text><text x="48" y="256" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">every window, final and correct — because the input ended</text><rect x="48" y="264" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:00, 12:02)</text><text x="1076" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">ids 0,1,2,7 · sum 19</text><rect x="48" y="296" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:02, 12:04)</text><text x="1076" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">ids 3,6 · sum 11</text><rect x="48" y="328" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:04, 12:06)</text><text x="1076" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">ids 4,5 · sum 7</text><rect x="48" y="360" width="1040" height="28" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="60" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="start">window [12:08, 12:10)</text><text x="1076" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1b2430" text-anchor="end">ids 8 · sum 8</text><rect x="48" y="406" width="1040" height="62" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="62" y="426" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">There is no watermark here and no lateness, because "has everything arrived?" has a free answer: the file ended.</text><text x="62" y="446" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Note that id 7 lands in its CORRECT window. Batch over a finished input is not approximately right — it is right.</text><text x="570" y="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 1/4 — bounded data: it ends, so completeness is free</text><text x="570" y="558" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Start here, because it is the case where none of this book's problems exist. The input ends, so you can sort by event time, and every window is</text><text x="570" y="575" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">final. id 7's 230s of skew is harmless: it was in the file before the job started. Everything difficult later comes from removing exactly one</text><text x="570" y="592" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">assumption — that the input ends.</text></svg>