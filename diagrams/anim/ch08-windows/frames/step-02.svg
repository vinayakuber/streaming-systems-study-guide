<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="1140" height="660" role="img" aria-label="HOP — overlapping, so a row appears several times"><rect width="1140" height="660" fill="#ffffff"/><text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="start">Windows in SQL — TUMBLE, HOP, SESSION, and the watermark</text><text x="24" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#8a97a6" text-anchor="start">TUMBLE 4 rows totalling 45 · HOP 7 rows totalling 78 · SESSION 5 rows, count unpredictable</text><text x="1116" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#8a97a6" text-anchor="end">seed: tools/stream_seed.js · TUMBLE(120s) gives 4 windows</text><rect x="24" y="104" width="1092" height="410" rx="4" fill="#f8fafc" stroke="#c6d0db" stroke-width="1"/><text x="34" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">HOP(et, INTERVAL '60' SECOND, INTERVAL '120' SECOND)</text><text x="48" y="150" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="start">how many output rows each input row contributes to</text><rect x="48" y="168" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 0 (et 12:00:01, v 5)</text><text x="354" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">HOP: 1 row — 12:00</text><rect x="48" y="196" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 1 (et 12:00:03, v 3)</text><text x="354" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">HOP: 1 row — 12:00</text><rect x="48" y="224" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 2 (et 12:01:30, v 7)</text><text x="354" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:00, 12:01</text><rect x="48" y="252" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 3 (et 12:02:10, v 2)</text><text x="354" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:01, 12:02</text><rect x="48" y="280" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 4 (et 12:04:05, v 6)</text><text x="354" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="297" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:03, 12:04</text><rect x="48" y="308" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 5 (et 12:04:20, v 1)</text><text x="354" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:03, 12:04</text><rect x="48" y="336" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="353" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 6 (et 12:03:40, v 9)</text><text x="354" y="353" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="353" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:02, 12:03</text><rect x="48" y="364" width="1040" height="24" rx="3" fill="#ffffff" stroke="#c6d0db" stroke-width="1"/><text x="64" y="381" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 7 (et 12:00:50, v 4)</text><text x="354" y="381" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="381" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">HOP: 1 row — 12:00</text><rect x="48" y="392" width="1040" height="24" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/><text x="64" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">id 8 (et 12:09:00, v 8)</text><text x="354" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#1b2430" text-anchor="start">TUMBLE: 1 row</text><text x="544" y="409" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">HOP: 2 rows — 12:08, 12:09</text><rect x="48" y="434" width="1040" height="62" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="62" y="454" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1b2430" text-anchor="start">7 output rows instead of 4, totalling 78 instead of 45 — because 6 input rows appear in 2 windows.</text><text x="62" y="474" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">The output volume is size / slide = 120 / 60 = 2x. That is the intent, not a bug — and it means HOP totals must never be compared to the input.</text><text x="570" y="554" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">Step 2/4 — HOP — overlapping, so a row appears several times</text><text x="570" y="586" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">HOP answers "the rolling 120s figure, refreshed every 60s" and costs 2× the rows. The column to read is the third: 6 of 9 input rows land in 2</text><text x="570" y="603" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">output rows, which is why the 78 total is correct and incomparable to the dataset's 45.</text></svg>