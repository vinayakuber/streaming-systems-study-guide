<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counting Distinct Visitors</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",

     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",

     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",

     "            if v in ever:",

     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",

     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",

     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",

     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",

     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",

     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",

     "    tens of millions of visitors this is tens of millions of slots per day, per counter, and",
     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",
     "",
     "# More inputs for the examples table -- these need `stream_of`, so they are declared here",
     "# rather than with the constants above.  They are inputs, not alternative versions of the",
     "# problem: the two sides of the sketch's k-th slot, a mid-range day, and two generated days at",
     "# the scale that forces the question (the statement says tens of millions; 12,000 is as far as",
     "# a program meant to finish in seconds can honestly go, and the sketch's state is already flat",
     "# by then).",
     "UNDER_K = stream_of(K - 1, 3)        # 255 distinct: one short of the sketch's capacity",
     "AT_K = stream_of(K, 3)               # 256 distinct: exactly full",
     "MID_STREAM = stream_of(1_000, 2)",
     "BIG_STREAM = stream_of(4_000, 1)",
     "BIGGER_STREAM = stream_of(12_000, 1)",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, views, ttl, distinct, expiry's count, sketch estimate, visitors saved).",
     "# A ttl of None means no expiry is applied on that row -- `distinct_with_expiry` rescans the",
     "# live set on every view, which is quadratic, and running it on 12,000 visitors would cost",
     "# more than the whole program.  That cost is itself part of the objection to keeping the",
     "# visitors.  Every row is asserted by show_examples(), which is why the table is data and not",
     "# a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"the chapter's 9 views, 2 visitors\",    VIEWS,         None,     2,  None,     2, None),",
     "    (\"ttl = 295, the longest silence\",       VIEWS,          295,     2,     2,     2,    0),",
     "    (\"ttl = 294, one second tighter\",        VIEWS,          294,     2,     3,     2,    0),",
     "    (\"ttl = a whole day: saves nothing\",     VIEWS,          DAY,     2,     2,     2,    0),",
     "    (\"ttl = 0: saves 2, overstates to 9\",    VIEWS,            0,     2,     9,     2,    2),",
     "    (\"an empty day -> 0, not an error\",      EMPTY_DAY,     None,     0,  None,     0, None),",
     "    (\"a single view\",                        ONE_VIEW,      None,     1,  None,     1, None),",
     "    (\"1 visitor, 1,000 views\",               ONE_VISITOR,   None,     1,  None,     1, None),",
     "    (\"255 distinct: no estimate, the set\",   UNDER_K,       None,   255,  None,   255, None),",
     "    (\"256 distinct: estimator takes over\",   AT_K,          None,   256,  None,   257, None),",
     "    (\"1,000 distinct, mid-range\",            MID_STREAM,    None, 1_000,  None,   983, None),",
     "    (\"4,000 distinct (generated)\",           BIG_STREAM,    None, 4_000,  None,  3_721, None),",
     "    (\"12,000 distinct (generated)\",          BIGGER_STREAM, None, 12_000, None, 11_544, None),",
     "]",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `exact_distinct` -- the brute-force set, which is the",
     "    reference answer and cannot be wrong -- and against the sketch, which must agree EXACTLY",
     "    below k and stay inside three of its own standard errors above it.  The two slot columns",
     "    are the costs, printed per row so the reader can see where the sketch wins: above k it",
     "    holds 256 slots against the exact set's thousands, and at or below k it holds the same",
     "    number the set does and buys nothing at all.  The `saved` column is the same story for the",
     "    expiry -- inside one day it saves zero visitors, every time.",
     "    \"\"\"",
     "    se = K ** -0.5",
     "    print(f\"{'what it exercises':36s} {'views':>7} {'ttl':>6} {'distinct':>9} {'estimate':>9} \"",
     "          f\"{'set slots':>10} {'sketch':>7} {'expiry':>7} {'saved':>6}\")",
     "    for label, views, ttl, want, want_expiry, want_est, want_saved in EXAMPLES:",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        assert exact == want, (label, exact, want)",
     "        assert est == want_est, (label, est, want_est)",
     "        if exact < K:",
     "            assert est == exact, (label, \"below k the sketch IS the set\", est, exact)",
     "            assert sketch_slots == exact_slots, (label, sketch_slots, exact_slots)",
     "        else:",
     "            assert sketch_slots == K, (label, sketch_slots)",
     "            assert abs(est - exact) / exact < 3 * se, (label, est, exact, se)",
     "        if ttl is None:",
     "            ttl_s, exp_s, sav_s = \"-\", \"-\", \"-\"",
     "        else:",
     "            got, _, _ = distinct_with_expiry(views, ttl)",
     "            end = max(t for _, t in views)",
     "            saved = max(held_at(views, INFINITY, t) - held_at(views, ttl, t)",
     "                        for t in range(end + 1))",
     "            assert got == want_expiry, (label, got, want_expiry)",
     "            assert saved == want_saved, (label, saved, want_saved)",
     "            assert got >= exact, (label, \"the expiry can only overstate\", got, exact)",
     "            ttl_s, exp_s, sav_s = str(ttl), str(got), str(saved)",
     "        print(f\"{label:36s} {len(views):>7,} {ttl_s:>6} {exact:>9,} {est:>9,} \"",
     "              f\"{exact_slots:>10,} {sketch_slots:>7,} {exp_s:>7} {sav_s:>6}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the exact set\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"VIEWS =\", \"  \".join(f\"{v}@{t}\" for v, t in VIEWS), f\"   ({len(VIEWS)} views)\")",
     "    distinct, slots = exact_distinct(VIEWS)",
     "    views_count = count_the_views(VIEWS)",
     "    print(f\"  distinct visitors      : {distinct}   ({slots} slots held)\")",
     "    print(f\"  +1 per event           : {views_count}   (1 slot held -- and the wrong question)\")",
     "    assert (distinct, slots) == (TRUE_DISTINCT, TRUE_DISTINCT)",
     "    assert views_count == len(VIEWS) == 9",
     "    assert views_count / distinct == 4.5, \"the inflation is the views per visitor\"",
     "    print(f\"  the chapter's accumulator inflates the answer {views_count / distinct:.1f}x here, and the\")",
     "    print(f\"  factor is the average views per visitor -- a number nobody reports, so the error\")",
     "    print(f\"  is not visible in the output at all.\")",
     "",
     "    # the chapter's bound, applied here: it fails upward",
     "    gap = 540 - 245                      # visitor 'a' is silent for the chapter's 295",
     "    tight, tight_slots, recounts = distinct_with_expiry(VIEWS, gap - 1)",
     "    safe, safe_slots, safe_recounts = distinct_with_expiry(VIEWS, gap)",
     "    print(f\"\\n  ttl = {gap} (the longest silence) : {safe} distinct, {safe_recounts} recounts  (correct)\")",
     "    print(f\"  ttl = {gap - 1}                      : {tight} distinct, {recounts} recount   OVERSTATED\")",
     "    assert safe == TRUE_DISTINCT and safe_recounts == 0",
     "    assert tight == 3 and recounts == 1, (tight, recounts)",
     "    assert tight > TRUE_DISTINCT, \"a dropped visitor is recounted, so the count can only rise\"",
     "    assert tight != TRUE_DISTINCT - 1, \"and it must NOT understate -- that is the other failure\"",
     "    print(f\"  the chapter's tight allowance made a TOTAL too low by what it dropped; here it\")",
     "    print(f\"  makes a COUNT too high by what it dropped, because the dropped thing was the\")",
     "    print(f\"  evidence that the visitor was not new.\")",
     "",
     "    # and the expiry buys nothing inside a day, measured at every moment",
     "    end = max(t for _, t in VIEWS)",
     "    saving = max(held_at(VIEWS, INFINITY, t) - held_at(VIEWS, DAY, t) for t in range(end + 1))",
     "    print(f\"\\n  visitors saved by a day-long ttl, at any moment in this example: {saving}\")",
     "    assert saving == 0, \"inside the window no visitor is ever stale, so there is nothing to drop\"",
     "    print(f\"  which is the real objection: the question says DISTINCT TODAY, so every visitor\")",
     "    print(f\"  seen today is still needed today.  The only thing that frees the state is the\")",
     "    print(f\"  day boundary, and that is a property of the question, not a bound you chose.\")",
     "",
     "    # the day boundary IS the bound -- measured over three days",
     "    per_day = [stream_of(c, 2, seed=s) for s, c in ((1, 400), (2, 900), (3, 300))]",
     "    all_days = [(f\"d{i}:{v}\", t) for i, day in enumerate(per_day) for v, t in day]",
     "    worst_day = max(exact_distinct(d)[1] for d in per_day)",
     "    whole_run = exact_distinct(all_days)[1]",
     "    print(f\"\\n  three days of {[len(d) for d in per_day]} views: per-day states \"",
     "          f\"{[exact_distinct(d)[0] for d in per_day]},\")",
     "    print(f\"  so the exact answer needs {worst_day} slots at a time and not {whole_run} -- the window\")",
     "    print(f\"  bounds the state, and it bounds it at the busiest day's cardinality.\")",
     "    assert worst_day == 900 and whole_run == 1600, (worst_day, whole_run)",
     "    assert worst_day < whole_run, \"the day boundary must actually release state\"",
     "",
     "    # the sketch: constant state at every cardinality",
     "    print(f\"\\n  k-minimum-values sketch, k = {K}:\")",
     "    print(f\"    {'distinct':>9} {'exact slots':>12} {'estimate':>9} {'sketch slots':>13} {'error':>7}\")",
     "    rows = []",
     "    for c in (50, 255, 256, 1_000, 4_000, 20_000):",
     "        views = stream_of(c, 2)",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",

     "    assert all(r[1] == r[0] for r in rows), \"the exact state is the cardinality, by definition\"",
     "    assert {r[3] for r in rows} == {50, 255, K}, [r[3] for r in rows]",
     "    big = [r for r in rows if r[0] >= K]",
     "    assert all(r[3] == K for r in big), \"the sketch state must not grow with the cardinality\"",
     "    # the error bar is not a guess: a k-minimum-values sketch has a standard error of",
     "    # 1/sqrt(k), so at k = 256 that is 6.25%, and the rows have to sit inside a few of those",
     "    # rather than inside a threshold picked to make them pass.",

     "    print(f\"    from the {big[0][0]:,} row to the {rows[-1][0]:,} row the exact state grows {rows[-1][1] // big[0][1]}x and the sketch state does not\")",
     "    print(f\"    grow at all; the worst error over the rows at or above k is \"",
     "          f\"{max(r[4] for r in big):.1%}, against the\")",
     "    print(f\"    sketch's own standard error of 1/sqrt({K}) = {se:.2%}.\")",
     "",
     "    # boundaries: below k the sketch is the set, at k the estimator takes over",
     "    under = kmv_sketch(stream_of(K - 1, 3))",
     "    at_k = kmv_sketch(stream_of(K, 3))",

     "    print(f\"  {K} it is full, the estimator takes over, and it already disagrees ({at_k[0]}) -- so the\")",
     "    print(f\"  exactness ends one visitor before the memory does.\")",

     "    print(f\"  exact set and the sketch -- repeats hash to a value already held, so a repeat\")",

     "",
     "    # many inputs: the sketch's error is bounded and the expiry's error has one sign",

     "        # the expiry is checked on a short stream of its own: `distinct_with_expiry` rescans",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 2 -- the unique-visitor count (looks like analytics). Standalone and runnable.",
     "",

     "                distinct it is exact; above, it estimates.",
     "",
     "  A view log carries nine views from two visitors: a@1, a@3, b@50, b@90, a@130, b@220,",
     "  a@245, b@260, a@540.  The true answer is 2.  Visitor 'a' is silent from second 245 to",
     "  second 540 -- a gap of 295 -- and that silence is what an expiry gets wrong.  At the scale",
     "  the question names there are 10**9 views a day and tens of millions of visitors.",
     "",
     "  GIVEN A DAY'S VIEWS AND AN EXPIRY, HOW MANY DISTINCT VISITORS WERE SEEN?",
     "",
     "  Worked, on the nine views above -- the input here is a log and an expiry, so no input is",
     "  \"off the end\"; what the rows pin instead are both degenerate ends and both sides of the",
     "  expiry boundary:",
     "    an EMPTY day, no expiry   -> 0    no views, so no visitors.  0, honestly, not an error",
     "    one view, no expiry       -> 1    the smallest real day",
     "    the nine views, no expiry -> 2    the true answer: two ids, nine views",
     "    1,000 views, all 'solo'   -> 1    one visitor, and the tempting answer 1,000 is the",
     "                                      count of VIEWS, which nobody asked for",
     "    the nine views, ttl = 295 -> 2    exactly the length of 'a's silence, so 'a' is still",
     "                                      remembered when it returns: still right",
     "    the nine views, ttl = 294 -> 3    one second tighter, the other side of that edge: 'a'",
     "                                      has been forgotten and is counted TWICE, so the answer",
     "                                      reads 3 for a day that had 2.  Note the direction --",
     "                                      an expiry OVERSTATES a distinct count",
     "    the nine views, ttl = 0   -> 9    every view its own visitor, which is the view count",
     "    the nine views, ttl = a whole day -> 2   right again, and it saved nothing at all: at",
     "                                      this size only ttl = 0 frees any slots (2), and it",
     "                                      overstates the count to 9 to do it",
     "  And at the sketch's own boundary, and at scale:",
     "    255 distinct visitors   -> 255     below K = 256, so the sketch is exact",
     "    256 distinct visitors   -> 257     at K, the estimator takes over and is 1 high",
     "    4,000 distinct visitors -> 3,721   7% low, in 256 slots instead of 4,000",
     "    12,000 distinct         -> 11,544  4% low, in the same 256 slots",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted against",
     "  the exact set AND against the sketch, so these answers cannot drift from what the program",
     "  returns.",
     "",
     "The chapter's bound works because a sum is ONE NUMBER: a key's accumulator is the same size",
     "after a billion events as after one.  A distinct count is not one number -- to know whether",
     "this visitor is new you must have kept the visitors -- so the state is the CARDINALITY, which",
     "is the quantity you were asked to measure and therefore the one you cannot assume is small.",
     "The expiry does not rescue it either, and fails in the opposite direction from the chapter's:",
     "there a dropped accumulator UNDERSTATED a total, here a dropped visitor is recounted and",
     "OVERSTATES the distinct count.  The way out is to stop being exact: a sketch answers \"how",
     "many distinct\" in a fixed few kilobytes at any cardinality, with a small, measurable error.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",
     "nine views, both sides of the 295-second silence the expiry turns on, a day-long allowance that",
     "saves nothing, an empty day, a single view, a thousand views from one visitor, both sides of",
     "the sketch's k-th slot, and two generated streams at 4,000 and 12,000 distinct visitors.",
     "Every row is ASSERTED against the exact set AND against the sketch, so the table cannot drift",
     "from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch07_v2.py",
     "\"\"\"",
     "import hashlib",
     "import random",
     "from bisect import insort",
     "",
     "# The chapter's nine seed events with the value column dropped -- what is left is a view log:",
     "# (visitor, event_time).  Two visitors, nine views, so the gap between \"views\" and \"visitors\"",
     "# is 9 vs 2 and a wrong answer can be attributed.  Visitor 'a' is silent from t=245 to t=540,",
     "# which is the chapter's longest gap of 295 and is what an expiry gets wrong.",
     "VIEWS = [(\"a\", 1), (\"a\", 3), (\"b\", 50), (\"b\", 90), (\"a\", 130),",
     "         (\"b\", 220), (\"a\", 245), (\"b\", 260), (\"a\", 540)]",
     "TRUE_DISTINCT = 2",
     "DAY = 86_400           # the window the question names: distinct per DAY",
     "K = 256                # the sketch's size, in retained hash values",
     "INFINITY = float(\"inf\")",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty day, one",
     "# view, and one visitor who will not stop clicking.  The generated streams the table also",
     "# needs are built just below `stream_of`, which is the function that makes them.",
     "EMPTY_DAY = []",
     "ONE_VIEW = [(\"a\", 0)]",
     "ONE_VISITOR = [(\"solo\", 0)] * 1_000",
     "",
     "",
     "def exact_distinct(views):",
     "    \"\"\"The correct answer, and the one that cannot be afforded: keep every visitor.",
     "",
     "    The state is one slot per DISTINCT visitor, so it is set by the answer's own size.  At",
     "    tens of millions of visitors this is tens of millions of slots per day, per counter, and",
     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",
     "",
     "# More inputs for the examples table -- these need `stream_of`, so they are declared here",
     "# rather than with the constants above.  They are inputs, not alternative versions of the",
     "# problem: the two sides of the sketch's k-th slot, a mid-range day, and two generated days at",
     "# the scale that forces the question (the statement says tens of millions; 12,000 is as far as",
     "# a program meant to finish in seconds can honestly go, and the sketch's state is already flat",
     "# by then).",
     "UNDER_K = stream_of(K - 1, 3)        # 255 distinct: one short of the sketch's capacity",
     "AT_K = stream_of(K, 3)               # 256 distinct: exactly full",
     "MID_STREAM = stream_of(1_000, 2)",
     "BIG_STREAM = stream_of(4_000, 1)",
     "BIGGER_STREAM = stream_of(12_000, 1)",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, views, ttl, distinct, expiry's count, sketch estimate, visitors saved).",
     "# A ttl of None means no expiry is applied on that row -- `distinct_with_expiry` rescans the",
     "# live set on every view, which is quadratic, and running it on 12,000 visitors would cost",
     "# more than the whole program.  That cost is itself part of the objection to keeping the",
     "# visitors.  Every row is asserted by show_examples(), which is why the table is data and not",
     "# a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"the chapter's 9 views, 2 visitors\",    VIEWS,         None,     2,  None,     2, None),",
     "    (\"ttl = 295, the longest silence\",       VIEWS,          295,     2,     2,     2,    0),",
     "    (\"ttl = 294, one second tighter\",        VIEWS,          294,     2,     3,     2,    0),",
     "    (\"ttl = a whole day: saves nothing\",     VIEWS,          DAY,     2,     2,     2,    0),",
     "    (\"ttl = 0: saves 2, overstates to 9\",    VIEWS,            0,     2,     9,     2,    2),",
     "    (\"an empty day -> 0, not an error\",      EMPTY_DAY,     None,     0,  None,     0, None),",
     "    (\"a single view\",                        ONE_VIEW,      None,     1,  None,     1, None),",
     "    (\"1 visitor, 1,000 views\",               ONE_VISITOR,   None,     1,  None,     1, None),",
     "    (\"255 distinct: no estimate, the set\",   UNDER_K,       None,   255,  None,   255, None),",
     "    (\"256 distinct: estimator takes over\",   AT_K,          None,   256,  None,   257, None),",
     "    (\"1,000 distinct, mid-range\",            MID_STREAM,    None, 1_000,  None,   983, None),",
     "    (\"4,000 distinct (generated)\",           BIG_STREAM,    None, 4_000,  None,  3_721, None),",
     "    (\"12,000 distinct (generated)\",          BIGGER_STREAM, None, 12_000, None, 11_544, None),",
     "]",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `exact_distinct` -- the brute-force set, which is the",
     "    reference answer and cannot be wrong -- and against the sketch, which must agree EXACTLY",
     "    below k and stay inside three of its own standard errors above it.  The two slot columns",
     "    are the costs, printed per row so the reader can see where the sketch wins: above k it",
     "    holds 256 slots against the exact set's thousands, and at or below k it holds the same",
     "    number the set does and buys nothing at all.  The `saved` column is the same story for the",
     "    expiry -- inside one day it saves zero visitors, every time.",
     "    \"\"\"",
     "    se = K ** -0.5",
     "    print(f\"{'what it exercises':36s} {'views':>7} {'ttl':>6} {'distinct':>9} {'estimate':>9} \"",
     "          f\"{'set slots':>10} {'sketch':>7} {'expiry':>7} {'saved':>6}\")",
     "    for label, views, ttl, want, want_expiry, want_est, want_saved in EXAMPLES:",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        assert exact == want, (label, exact, want)",
     "        assert est == want_est, (label, est, want_est)",
     "        if exact < K:",
     "            assert est == exact, (label, \"below k the sketch IS the set\", est, exact)",
     "            assert sketch_slots == exact_slots, (label, sketch_slots, exact_slots)",
     "        else:",
     "            assert sketch_slots == K, (label, sketch_slots)",
     "            assert abs(est - exact) / exact < 3 * se, (label, est, exact, se)",
     "        if ttl is None:",
     "            ttl_s, exp_s, sav_s = \"-\", \"-\", \"-\"",
     "        else:",
     "            got, _, _ = distinct_with_expiry(views, ttl)",
     "            end = max(t for _, t in views)",
     "            saved = max(held_at(views, INFINITY, t) - held_at(views, ttl, t)",
     "                        for t in range(end + 1))",
     "            assert got == want_expiry, (label, got, want_expiry)",
     "            assert saved == want_saved, (label, saved, want_saved)",
     "            assert got >= exact, (label, \"the expiry can only overstate\", got, exact)",
     "            ttl_s, exp_s, sav_s = str(ttl), str(got), str(saved)",
     "        print(f\"{label:36s} {len(views):>7,} {ttl_s:>6} {exact:>9,} {est:>9,} \"",
     "              f\"{exact_slots:>10,} {sketch_slots:>7,} {exp_s:>7} {sav_s:>6}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the exact set\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"VIEWS =\", \"  \".join(f\"{v}@{t}\" for v, t in VIEWS), f\"   ({len(VIEWS)} views)\")",
     "    distinct, slots = exact_distinct(VIEWS)",
     "    views_count = count_the_views(VIEWS)",
     "    print(f\"  distinct visitors      : {distinct}   ({slots} slots held)\")",
     "    print(f\"  +1 per event           : {views_count}   (1 slot held -- and the wrong question)\")",
     "    assert (distinct, slots) == (TRUE_DISTINCT, TRUE_DISTINCT)",
     "    assert views_count == len(VIEWS) == 9",
     "    assert views_count / distinct == 4.5, \"the inflation is the views per visitor\"",
     "    print(f\"  the chapter's accumulator inflates the answer {views_count / distinct:.1f}x here, and the\")",
     "    print(f\"  factor is the average views per visitor -- a number nobody reports, so the error\")",
     "    print(f\"  is not visible in the output at all.\")",
     "",
     "    # the chapter's bound, applied here: it fails upward",
     "    gap = 540 - 245                      # visitor 'a' is silent for the chapter's 295",
     "    tight, tight_slots, recounts = distinct_with_expiry(VIEWS, gap - 1)",
     "    safe, safe_slots, safe_recounts = distinct_with_expiry(VIEWS, gap)",
     "    print(f\"\\n  ttl = {gap} (the longest silence) : {safe} distinct, {safe_recounts} recounts  (correct)\")",
     "    print(f\"  ttl = {gap - 1}                      : {tight} distinct, {recounts} recount   OVERSTATED\")",
     "    assert safe == TRUE_DISTINCT and safe_recounts == 0",
     "    assert tight == 3 and recounts == 1, (tight, recounts)",
     "    assert tight > TRUE_DISTINCT, \"a dropped visitor is recounted, so the count can only rise\"",
     "    assert tight != TRUE_DISTINCT - 1, \"and it must NOT understate -- that is the other failure\"",
     "    print(f\"  the chapter's tight allowance made a TOTAL too low by what it dropped; here it\")",
     "    print(f\"  makes a COUNT too high by what it dropped, because the dropped thing was the\")",
     "    print(f\"  evidence that the visitor was not new.\")",
     "",
     "    # and the expiry buys nothing inside a day, measured at every moment",
     "    end = max(t for _, t in VIEWS)",
     "    saving = max(held_at(VIEWS, INFINITY, t) - held_at(VIEWS, DAY, t) for t in range(end + 1))",
     "    print(f\"\\n  visitors saved by a day-long ttl, at any moment in this example: {saving}\")",
     "    assert saving == 0, \"inside the window no visitor is ever stale, so there is nothing to drop\"",
     "    print(f\"  which is the real objection: the question says DISTINCT TODAY, so every visitor\")",
     "    print(f\"  seen today is still needed today.  The only thing that frees the state is the\")",
     "    print(f\"  day boundary, and that is a property of the question, not a bound you chose.\")",
     "",
     "    # the day boundary IS the bound -- measured over three days",
     "    per_day = [stream_of(c, 2, seed=s) for s, c in ((1, 400), (2, 900), (3, 300))]",
     "    all_days = [(f\"d{i}:{v}\", t) for i, day in enumerate(per_day) for v, t in day]",
     "    worst_day = max(exact_distinct(d)[1] for d in per_day)",
     "    whole_run = exact_distinct(all_days)[1]",
     "    print(f\"\\n  three days of {[len(d) for d in per_day]} views: per-day states \"",
     "          f\"{[exact_distinct(d)[0] for d in per_day]},\")",
     "    print(f\"  so the exact answer needs {worst_day} slots at a time and not {whole_run} -- the window\")",
     "    print(f\"  bounds the state, and it bounds it at the busiest day's cardinality.\")",
     "    assert worst_day == 900 and whole_run == 1600, (worst_day, whole_run)",
     "    assert worst_day < whole_run, \"the day boundary must actually release state\"",
     "",
     "    # the sketch: constant state at every cardinality",
     "    print(f\"\\n  k-minimum-values sketch, k = {K}:\")",
     "    print(f\"    {'distinct':>9} {'exact slots':>12} {'estimate':>9} {'sketch slots':>13} {'error':>7}\")",
     "    rows = []",
     "    for c in (50, 255, 256, 1_000, 4_000, 20_000):",
     "        views = stream_of(c, 2)",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        err = abs(est - exact) / exact",
     "        rows.append((exact, exact_slots, est, sketch_slots, err))",
     "        print(f\"    {exact:>9,} {exact_slots:>12,} {est:>9,} {sketch_slots:>13} {err:>6.1%}\")",
     "    assert all(r[1] == r[0] for r in rows), \"the exact state is the cardinality, by definition\"",
     "    assert {r[3] for r in rows} == {50, 255, K}, [r[3] for r in rows]",
     "    big = [r for r in rows if r[0] >= K]",
     "    assert all(r[3] == K for r in big), \"the sketch state must not grow with the cardinality\"",
     "    # the error bar is not a guess: a k-minimum-values sketch has a standard error of",
     "    # 1/sqrt(k), so at k = 256 that is 6.25%, and the rows have to sit inside a few of those",
     "    # rather than inside a threshold picked to make them pass.",
     "    se = K ** -0.5",
     "    assert max(r[4] for r in big) < 3 * se, (max(r[4] for r in big), se)",
     "    print(f\"    from the {big[0][0]:,} row to the {rows[-1][0]:,} row the exact state grows {rows[-1][1] // big[0][1]}x and the sketch state does not\")",
     "    print(f\"    grow at all; the worst error over the rows at or above k is \"",
     "          f\"{max(r[4] for r in big):.1%}, against the\")",
     "    print(f\"    sketch's own standard error of 1/sqrt({K}) = {se:.2%}.\")",
     "",
     "    # boundaries: below k the sketch is the set, at k the estimator takes over",
     "    under = kmv_sketch(stream_of(K - 1, 3))",
     "    at_k = kmv_sketch(stream_of(K, 3))",
     "    assert under == (K - 1, K - 1), under",
     "    assert at_k[1] == K and at_k[0] != K, at_k",
     "    print(f\"\\n  boundaries: at {K - 1} distinct the sketch holds every hash and is EXACT ({under[0]}); at\")",
     "    print(f\"  {K} it is full, the estimator takes over, and it already disagrees ({at_k[0]}) -- so the\")",
     "    print(f\"  exactness ends one visitor before the memory does.\")",
     "    assert kmv_sketch([]) == (0, 0), \"an empty day is 0 distinct, not an error\"",
     "    assert exact_distinct([]) == (0, 0)",
     "    assert kmv_sketch([(\"solo\", 0)] * 1000) == (1, 1), \"one visitor, a thousand views\"",
     "    assert exact_distinct([(\"solo\", 0)] * 1000) == (1, 1)",
     "    print(f\"  an empty day gives 0 and a thousand views from one visitor give 1, in both the\")",
     "    print(f\"  exact set and the sketch -- repeats hash to a value already held, so a repeat\")",
     "    print(f\"  costs nothing and needs no lookup against the past.\")",
     "",
     "    # many inputs: the sketch's error is bounded and the expiry's error has one sign",
     "    rng = random.Random(20260304)",
     "    errs, worst_case, overcounts = [], 0, 0",
     "    for trial in range(20):",
     "        c = rng.randint(300, 1_200)",
     "        views = stream_of(c, rng.randint(1, 2), seed=1000 + trial)",
     "        exact, _ = exact_distinct(views)",
     "        est, slots = kmv_sketch(views)",
     "        assert slots == K, (c, slots)",
     "        assert exact == c, (c, exact)",
     "        errs.append(abs(est - exact) / exact)",
     "        # the expiry is checked on a short stream of its own: `distinct_with_expiry` rescans",
     "        # the live set on every view, which is quadratic, and that cost is itself part of the",
     "        # objection to keeping the visitors at all.",
     "        small = [(f\"v{rng.randrange(40)}\", rng.randint(0, 500)) for _ in range(120)]",
     "        small.sort(key=lambda e: e[1])",
     "        exact_small = exact_distinct(small)[0]",
     "        # the allowance spans both regimes on purpose: 0 drops almost everybody and 600 is",
     "        # wider than any silence in a 500-hour day, so it drops nobody at all.",
     "        got, _, rec = distinct_with_expiry(small, rng.choice((0, 10, 40, 200, 600)))",
     "        assert got >= exact_small, (got, exact_small)              # it can only overstate",
     "        assert got == exact_small + rec, (got, exact_small, rec)   # by exactly the recounts",
     "        overcounts += got > exact_small",
     "    mean_err = sum(errs) / len(errs)",
     "    worst_case = max(errs)",
     "    print(f\"\\n  20 random days from 300 to 1,200 visitors: the sketch held {K} slots every time,\")",
     "    print(f\"  mean error {mean_err:.2%} against the predicted {se:.2%}, worst {worst_case:.2%}.\")",
     "    # CORRECTED CLAIM.  The first version asserted the expiring counter overstates on EVERY",

     "def exact_distinct(views):",

     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",

     "def exact_distinct(views):",
     "    \"\"\"The correct answer, and the one that cannot be afforded: keep every visitor.",

     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",

     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",

     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",

     "def exact_distinct(views):",

     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",
     "",
     "# More inputs for the examples table -- these need `stream_of`, so they are declared here",
     "# rather than with the constants above.  They are inputs, not alternative versions of the",
     "# problem: the two sides of the sketch's k-th slot, a mid-range day, and two generated days at",
     "# the scale that forces the question (the statement says tens of millions; 12,000 is as far as",
     "# a program meant to finish in seconds can honestly go, and the sketch's state is already flat",
     "# by then).",
     "UNDER_K = stream_of(K - 1, 3)        # 255 distinct: one short of the sketch's capacity",
     "AT_K = stream_of(K, 3)               # 256 distinct: exactly full",
     "MID_STREAM = stream_of(1_000, 2)",
     "BIG_STREAM = stream_of(4_000, 1)",
     "BIGGER_STREAM = stream_of(12_000, 1)",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, views, ttl, distinct, expiry's count, sketch estimate, visitors saved).",
     "# A ttl of None means no expiry is applied on that row -- `distinct_with_expiry` rescans the",
     "# live set on every view, which is quadratic, and running it on 12,000 visitors would cost",
     "# more than the whole program.  That cost is itself part of the objection to keeping the",
     "# visitors.  Every row is asserted by show_examples(), which is why the table is data and not",
     "# a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"the chapter's 9 views, 2 visitors\",    VIEWS,         None,     2,  None,     2, None),",
     "    (\"ttl = 295, the longest silence\",       VIEWS,          295,     2,     2,     2,    0),",
     "    (\"ttl = 294, one second tighter\",        VIEWS,          294,     2,     3,     2,    0),",
     "    (\"ttl = a whole day: saves nothing\",     VIEWS,          DAY,     2,     2,     2,    0),",
     "    (\"ttl = 0: saves 2, overstates to 9\",    VIEWS,            0,     2,     9,     2,    2),",
     "    (\"an empty day -> 0, not an error\",      EMPTY_DAY,     None,     0,  None,     0, None),",
     "    (\"a single view\",                        ONE_VIEW,      None,     1,  None,     1, None),",
     "    (\"1 visitor, 1,000 views\",               ONE_VISITOR,   None,     1,  None,     1, None),",
     "    (\"255 distinct: no estimate, the set\",   UNDER_K,       None,   255,  None,   255, None),",
     "    (\"256 distinct: estimator takes over\",   AT_K,          None,   256,  None,   257, None),",
     "    (\"1,000 distinct, mid-range\",            MID_STREAM,    None, 1_000,  None,   983, None),",
     "    (\"4,000 distinct (generated)\",           BIG_STREAM,    None, 4_000,  None,  3_721, None),",
     "    (\"12,000 distinct (generated)\",          BIGGER_STREAM, None, 12_000, None, 11_544, None),",
     "]",

     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `exact_distinct` -- the brute-force set, which is the",
     "    reference answer and cannot be wrong -- and against the sketch, which must agree EXACTLY",
     "    below k and stay inside three of its own standard errors above it.  The two slot columns",
     "    are the costs, printed per row so the reader can see where the sketch wins: above k it",
     "    holds 256 slots against the exact set's thousands, and at or below k it holds the same",
     "    number the set does and buys nothing at all.  The `saved` column is the same story for the",
     "    expiry -- inside one day it saves zero visitors, every time.",
     "    \"\"\"",
     "    se = K ** -0.5",
     "    print(f\"{'what it exercises':36s} {'views':>7} {'ttl':>6} {'distinct':>9} {'estimate':>9} \"",
     "          f\"{'set slots':>10} {'sketch':>7} {'expiry':>7} {'saved':>6}\")",
     "    for label, views, ttl, want, want_expiry, want_est, want_saved in EXAMPLES:",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        assert exact == want, (label, exact, want)",
     "        assert est == want_est, (label, est, want_est)",
     "        if exact < K:",
     "            assert est == exact, (label, \"below k the sketch IS the set\", est, exact)",
     "            assert sketch_slots == exact_slots, (label, sketch_slots, exact_slots)",
     "        else:",
     "            assert sketch_slots == K, (label, sketch_slots)",
     "            assert abs(est - exact) / exact < 3 * se, (label, est, exact, se)",
     "        if ttl is None:",
     "            ttl_s, exp_s, sav_s = \"-\", \"-\", \"-\"",

     "            got, _, _ = distinct_with_expiry(views, ttl)",

     "                        for t in range(end + 1))",
     "            assert got == want_expiry, (label, got, want_expiry)",
     "            assert saved == want_saved, (label, saved, want_saved)",
     "            assert got >= exact, (label, \"the expiry can only overstate\", got, exact)",

     "              f\"{exact_slots:>10,} {sketch_slots:>7,} {exp_s:>7} {sav_s:>6}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the exact set\")",
     "    print()",

     "def main():",

     "    # the chapter's bound, applied here: it fails upward",

     "    assert safe == TRUE_DISTINCT and safe_recounts == 0",
     "    assert tight == 3 and recounts == 1, (tight, recounts)",
     "    assert tight > TRUE_DISTINCT, \"a dropped visitor is recounted, so the count can only rise\"",
     "    assert tight != TRUE_DISTINCT - 1, \"and it must NOT understate -- that is the other failure\"",

     "    print(f\"  evidence that the visitor was not new.\")",
     "",
     "    # and the expiry buys nothing inside a day, measured at every moment",
     "    end = max(t for _, t in VIEWS)",
     "    saving = max(held_at(VIEWS, INFINITY, t) - held_at(VIEWS, DAY, t) for t in range(end + 1))",
     "    print(f\"\\n  visitors saved by a day-long ttl, at any moment in this example: {saving}\")",
     "    assert saving == 0, \"inside the window no visitor is ever stale, so there is nothing to drop\"",

     "    print(f\"  seen today is still needed today.  The only thing that frees the state is the\")",

     "",
     "    # the day boundary IS the bound -- measured over three days",
     "    per_day = [stream_of(c, 2, seed=s) for s, c in ((1, 400), (2, 900), (3, 300))]",
     "    all_days = [(f\"d{i}:{v}\", t) for i, day in enumerate(per_day) for v, t in day]",

     "          f\"{[exact_distinct(d)[0] for d in per_day]},\")",

     "    assert worst_day == 900 and whole_run == 1600, (worst_day, whole_run)",

     "",
     "    # the sketch: constant state at every cardinality",
     "    print(f\"\\n  k-minimum-values sketch, k = {K}:\")",
     "    print(f\"    {'distinct':>9} {'exact slots':>12} {'estimate':>9} {'sketch slots':>13} {'error':>7}\")",
