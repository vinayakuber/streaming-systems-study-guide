     "there a dropped accumulator UNDERSTATED a total, here a dropped visitor is recounted and",
     "OVERSTATES the distinct count.  The way out is to stop being exact: a sketch answers \"how",
     "many distinct\" in a fixed few kilobytes at any cardinality, with a small, measurable error.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",
     "nine views, both sides of the 295-second silence the expiry turns on, a day-long allowance that",
     "saves nothing, an empty day, a single view, a thousand views from one visitor, both sides of",
     "the sketch's k-th slot, and two generated streams at 4,000 and 12,000 distinct visitors.",
     "Every row is ASSERTED against the exact set AND against the sketch, so the table cannot drift",
     "from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch07_v2.py",
     "\"\"\"",
     "import hashlib",
     "import random",
     "from bisect import insort",
     "",
     "# The chapter's nine seed events with the value column dropped -- what is left is a view log:",
     "# (visitor, event_time).  Two visitors, nine views, so the gap between \"views\" and \"visitors\"",
     "# is 9 vs 2 and a wrong answer can be attributed.  Visitor 'a' is silent from t=245 to t=540,",
     "# which is the chapter's longest gap of 295 and is what an expiry gets wrong.",
     "VIEWS = [(\"a\", 1), (\"a\", 3), (\"b\", 50), (\"b\", 90), (\"a\", 130),",
     "         (\"b\", 220), (\"a\", 245), (\"b\", 260), (\"a\", 540)]",
     "TRUE_DISTINCT = 2",
     "DAY = 86_400           # the window the question names: distinct per DAY",
     "K = 256                # the sketch's size, in retained hash values",
     "INFINITY = float(\"inf\")",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty day, one",
     "# view, and one visitor who will not stop clicking.  The generated streams the table also",
     "# needs are built just below `stream_of`, which is the function that makes them.",
     "EMPTY_DAY = []",
     "ONE_VIEW = [(\"a\", 0)]",
     "ONE_VISITOR = [(\"solo\", 0)] * 1_000",
     "",
     "",
     "def exact_distinct(views):",
     "    \"\"\"The correct answer, and the one that cannot be afforded: keep every visitor.",
     "",
     "    The state is one slot per DISTINCT visitor, so it is set by the answer's own size.  At",
     "    tens of millions of visitors this is tens of millions of slots per day, per counter, and",
     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",
     "",
     "# More inputs for the examples table -- these need `stream_of`, so they are declared here",
     "# rather than with the constants above.  They are inputs, not alternative versions of the",
     "# problem: the two sides of the sketch's k-th slot, a mid-range day, and two generated days at",
     "# the scale that forces the question (the statement says tens of millions; 12,000 is as far as",
     "# a program meant to finish in seconds can honestly go, and the sketch's state is already flat",
     "# by then).",
     "UNDER_K = stream_of(K - 1, 3)        # 255 distinct: one short of the sketch's capacity",
     "AT_K = stream_of(K, 3)               # 256 distinct: exactly full",
     "MID_STREAM = stream_of(1_000, 2)",
     "BIG_STREAM = stream_of(4_000, 1)",
     "BIGGER_STREAM = stream_of(12_000, 1)",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, views, ttl, distinct, expiry's count, sketch estimate, visitors saved).",
     "# A ttl of None means no expiry is applied on that row -- `distinct_with_expiry` rescans the",
     "# live set on every view, which is quadratic, and running it on 12,000 visitors would cost",
     "# more than the whole program.  That cost is itself part of the objection to keeping the",
     "# visitors.  Every row is asserted by show_examples(), which is why the table is data and not",
     "# a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"the chapter's 9 views, 2 visitors\",    VIEWS,         None,     2,  None,     2, None),",
     "    (\"ttl = 295, the longest silence\",       VIEWS,          295,     2,     2,     2,    0),",
     "    (\"ttl = 294, one second tighter\",        VIEWS,          294,     2,     3,     2,    0),",
     "    (\"ttl = a whole day: saves nothing\",     VIEWS,          DAY,     2,     2,     2,    0),",
     "    (\"ttl = 0: saves 2, overstates to 9\",    VIEWS,            0,     2,     9,     2,    2),",
     "    (\"an empty day -> 0, not an error\",      EMPTY_DAY,     None,     0,  None,     0, None),",
     "    (\"a single view\",                        ONE_VIEW,      None,     1,  None,     1, None),",
     "    (\"1 visitor, 1,000 views\",               ONE_VISITOR,   None,     1,  None,     1, None),",
     "    (\"255 distinct: no estimate, the set\",   UNDER_K,       None,   255,  None,   255, None),",
     "    (\"256 distinct: estimator takes over\",   AT_K,          None,   256,  None,   257, None),",
     "    (\"1,000 distinct, mid-range\",            MID_STREAM,    None, 1_000,  None,   983, None),",
     "    (\"4,000 distinct (generated)\",           BIG_STREAM,    None, 4_000,  None,  3_721, None),",
     "    (\"12,000 distinct (generated)\",          BIGGER_STREAM, None, 12_000, None, 11_544, None),",
     "]",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `exact_distinct` -- the brute-force set, which is the",
     "    reference answer and cannot be wrong -- and against the sketch, which must agree EXACTLY",
     "    below k and stay inside three of its own standard errors above it.  The two slot columns",
     "    are the costs, printed per row so the reader can see where the sketch wins: above k it",
     "    holds 256 slots against the exact set's thousands, and at or below k it holds the same",
     "    number the set does and buys nothing at all.  The `saved` column is the same story for the",
     "    expiry -- inside one day it saves zero visitors, every time.",
     "    \"\"\"",
     "    se = K ** -0.5",
     "    print(f\"{'what it exercises':36s} {'views':>7} {'ttl':>6} {'distinct':>9} {'estimate':>9} \"",
     "          f\"{'set slots':>10} {'sketch':>7} {'expiry':>7} {'saved':>6}\")",
     "    for label, views, ttl, want, want_expiry, want_est, want_saved in EXAMPLES:",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        assert exact == want, (label, exact, want)",
     "        assert est == want_est, (label, est, want_est)",
     "        if exact < K:",
     "            assert est == exact, (label, \"below k the sketch IS the set\", est, exact)",
     "            assert sketch_slots == exact_slots, (label, sketch_slots, exact_slots)",
     "        else:",
     "            assert sketch_slots == K, (label, sketch_slots)",
     "            assert abs(est - exact) / exact < 3 * se, (label, est, exact, se)",
     "        if ttl is None:",
     "            ttl_s, exp_s, sav_s = \"-\", \"-\", \"-\"",
     "        else:",
     "            got, _, _ = distinct_with_expiry(views, ttl)",
     "            end = max(t for _, t in views)",
     "            saved = max(held_at(views, INFINITY, t) - held_at(views, ttl, t)",
     "                        for t in range(end + 1))",
     "            assert got == want_expiry, (label, got, want_expiry)",
     "            assert saved == want_saved, (label, saved, want_saved)",
     "            assert got >= exact, (label, \"the expiry can only overstate\", got, exact)",
     "            ttl_s, exp_s, sav_s = str(ttl), str(got), str(saved)",
     "        print(f\"{label:36s} {len(views):>7,} {ttl_s:>6} {exact:>9,} {est:>9,} \"",
     "              f\"{exact_slots:>10,} {sketch_slots:>7,} {exp_s:>7} {sav_s:>6}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the exact set\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"VIEWS =\", \"  \".join(f\"{v}@{t}\" for v, t in VIEWS), f\"   ({len(VIEWS)} views)\")",
     "    distinct, slots = exact_distinct(VIEWS)",
     "    views_count = count_the_views(VIEWS)",
     "    print(f\"  distinct visitors      : {distinct}   ({slots} slots held)\")",
     "    print(f\"  +1 per event           : {views_count}   (1 slot held -- and the wrong question)\")",
     "    assert (distinct, slots) == (TRUE_DISTINCT, TRUE_DISTINCT)",
     "    assert views_count == len(VIEWS) == 9",
     "    assert views_count / distinct == 4.5, \"the inflation is the views per visitor\"",
     "    print(f\"  the chapter's accumulator inflates the answer {views_count / distinct:.1f}x here, and the\")",
     "    print(f\"  factor is the average views per visitor -- a number nobody reports, so the error\")",
     "    print(f\"  is not visible in the output at all.\")",
     "",
     "    # the chapter's bound, applied here: it fails upward",
     "    gap = 540 - 245                      # visitor 'a' is silent for the chapter's 295",
     "    tight, tight_slots, recounts = distinct_with_expiry(VIEWS, gap - 1)",
     "    safe, safe_slots, safe_recounts = distinct_with_expiry(VIEWS, gap)",
     "    print(f\"\\n  ttl = {gap} (the longest silence) : {safe} distinct, {safe_recounts} recounts  (correct)\")",
     "    print(f\"  ttl = {gap - 1}                      : {tight} distinct, {recounts} recount   OVERSTATED\")",
     "    assert safe == TRUE_DISTINCT and safe_recounts == 0",
     "    assert tight == 3 and recounts == 1, (tight, recounts)",
     "    assert tight > TRUE_DISTINCT, \"a dropped visitor is recounted, so the count can only rise\"",
     "    assert tight != TRUE_DISTINCT - 1, \"and it must NOT understate -- that is the other failure\"",
     "    print(f\"  the chapter's tight allowance made a TOTAL too low by what it dropped; here it\")",
     "    print(f\"  makes a COUNT too high by what it dropped, because the dropped thing was the\")",
     "    print(f\"  evidence that the visitor was not new.\")",
     "",
     "    # and the expiry buys nothing inside a day, measured at every moment",
     "    end = max(t for _, t in VIEWS)",
     "    saving = max(held_at(VIEWS, INFINITY, t) - held_at(VIEWS, DAY, t) for t in range(end + 1))",
     "    print(f\"\\n  visitors saved by a day-long ttl, at any moment in this example: {saving}\")",
     "    assert saving == 0, \"inside the window no visitor is ever stale, so there is nothing to drop\"",
     "    print(f\"  which is the real objection: the question says DISTINCT TODAY, so every visitor\")",
     "    print(f\"  seen today is still needed today.  The only thing that frees the state is the\")",
     "    print(f\"  day boundary, and that is a property of the question, not a bound you chose.\")",
     "",
     "    # the day boundary IS the bound -- measured over three days",
     "    per_day = [stream_of(c, 2, seed=s) for s, c in ((1, 400), (2, 900), (3, 300))]",
     "    all_days = [(f\"d{i}:{v}\", t) for i, day in enumerate(per_day) for v, t in day]",
     "    worst_day = max(exact_distinct(d)[1] for d in per_day)",
     "    whole_run = exact_distinct(all_days)[1]",
     "    print(f\"\\n  three days of {[len(d) for d in per_day]} views: per-day states \"",
     "          f\"{[exact_distinct(d)[0] for d in per_day]},\")",
     "    print(f\"  so the exact answer needs {worst_day} slots at a time and not {whole_run} -- the window\")",
     "    print(f\"  bounds the state, and it bounds it at the busiest day's cardinality.\")",
     "    assert worst_day == 900 and whole_run == 1600, (worst_day, whole_run)",
     "    assert worst_day < whole_run, \"the day boundary must actually release state\"",
     "",
     "    # the sketch: constant state at every cardinality",
     "    print(f\"\\n  k-minimum-values sketch, k = {K}:\")",
     "    print(f\"    {'distinct':>9} {'exact slots':>12} {'estimate':>9} {'sketch slots':>13} {'error':>7}\")",
     "    rows = []",
     "    for c in (50, 255, 256, 1_000, 4_000, 20_000):",
     "        views = stream_of(c, 2)",
     "        exact, exact_slots = exact_distinct(views)",
     "        est, sketch_slots = kmv_sketch(views)",
     "        err = abs(est - exact) / exact",
     "        rows.append((exact, exact_slots, est, sketch_slots, err))",
     "        print(f\"    {exact:>9,} {exact_slots:>12,} {est:>9,} {sketch_slots:>13} {err:>6.1%}\")",
     "    assert all(r[1] == r[0] for r in rows), \"the exact state is the cardinality, by definition\"",
     "    assert {r[3] for r in rows} == {50, 255, K}, [r[3] for r in rows]",
     "    big = [r for r in rows if r[0] >= K]",
     "    assert all(r[3] == K for r in big), \"the sketch state must not grow with the cardinality\"",
     "    # the error bar is not a guess: a k-minimum-values sketch has a standard error of",
     "    # 1/sqrt(k), so at k = 256 that is 6.25%, and the rows have to sit inside a few of those",
     "    # rather than inside a threshold picked to make them pass.",
     "    se = K ** -0.5",
     "    assert max(r[4] for r in big) < 3 * se, (max(r[4] for r in big), se)",
     "    print(f\"    from the {big[0][0]:,} row to the {rows[-1][0]:,} row the exact state grows {rows[-1][1] // big[0][1]}x and the sketch state does not\")",
     "    print(f\"    grow at all; the worst error over the rows at or above k is \"",
     "          f\"{max(r[4] for r in big):.1%}, against the\")",
     "    print(f\"    sketch's own standard error of 1/sqrt({K}) = {se:.2%}.\")",
     "",
     "    # boundaries: below k the sketch is the set, at k the estimator takes over",
     "    under = kmv_sketch(stream_of(K - 1, 3))",
     "    at_k = kmv_sketch(stream_of(K, 3))",
     "    assert under == (K - 1, K - 1), under",
     "    assert at_k[1] == K and at_k[0] != K, at_k",
     "    print(f\"\\n  boundaries: at {K - 1} distinct the sketch holds every hash and is EXACT ({under[0]}); at\")",
     "    print(f\"  {K} it is full, the estimator takes over, and it already disagrees ({at_k[0]}) -- so the\")",
     "    print(f\"  exactness ends one visitor before the memory does.\")",
     "    assert kmv_sketch([]) == (0, 0), \"an empty day is 0 distinct, not an error\"",
     "    assert exact_distinct([]) == (0, 0)",
     "    assert kmv_sketch([(\"solo\", 0)] * 1000) == (1, 1), \"one visitor, a thousand views\"",
     "    assert exact_distinct([(\"solo\", 0)] * 1000) == (1, 1)",
     "    print(f\"  an empty day gives 0 and a thousand views from one visitor give 1, in both the\")",
     "    print(f\"  exact set and the sketch -- repeats hash to a value already held, so a repeat\")",
     "    print(f\"  costs nothing and needs no lookup against the past.\")",
     "",
     "    # many inputs: the sketch's error is bounded and the expiry's error has one sign",
     "    rng = random.Random(20260304)",
     "    errs, worst_case, overcounts = [], 0, 0",
     "    for trial in range(20):",
     "        c = rng.randint(300, 1_200)",
     "        views = stream_of(c, rng.randint(1, 2), seed=1000 + trial)",
     "        exact, _ = exact_distinct(views)",
     "        est, slots = kmv_sketch(views)",
     "        assert slots == K, (c, slots)",
     "        assert exact == c, (c, exact)",
     "        errs.append(abs(est - exact) / exact)",
     "        # the expiry is checked on a short stream of its own: `distinct_with_expiry` rescans",
     "        # the live set on every view, which is quadratic, and that cost is itself part of the",
     "        # objection to keeping the visitors at all.",
     "        small = [(f\"v{rng.randrange(40)}\", rng.randint(0, 500)) for _ in range(120)]",
     "        small.sort(key=lambda e: e[1])",
     "        exact_small = exact_distinct(small)[0]",
     "        # the allowance spans both regimes on purpose: 0 drops almost everybody and 600 is",
     "        # wider than any silence in a 500-hour day, so it drops nobody at all.",
     "        got, _, rec = distinct_with_expiry(small, rng.choice((0, 10, 40, 200, 600)))",
     "        assert got >= exact_small, (got, exact_small)              # it can only overstate",
     "        assert got == exact_small + rec, (got, exact_small, rec)   # by exactly the recounts",
     "        overcounts += got > exact_small",
     "    mean_err = sum(errs) / len(errs)",
     "    worst_case = max(errs)",
     "    print(f\"\\n  20 random days from 300 to 1,200 visitors: the sketch held {K} slots every time,\")",
     "    print(f\"  mean error {mean_err:.2%} against the predicted {se:.2%}, worst {worst_case:.2%}.\")",
     "    # CORRECTED CLAIM.  The first version asserted the expiring counter overstates on EVERY",
     "    # random day, and the measurement refused it: an allowance wider than every silence in a",
     "    # day's stream drops nobody and is therefore exact.  What survives is the directional",
     "    # claim, which is the one that matters -- the expiry never understates, and when it is",
     "    # wrong it is wrong by exactly the number of visitors it met twice.",
     "    print(f\"  the expiring exact counter overstated on {overcounts} of 20 days and understated on 0;\")",
     "    print(f\"  on the other {20 - overcounts} the allowance exceeded every silence in that day, so it dropped\")",
     "    print(f\"  nobody -- the bound is only ever as safe as the quietest visitor, and widening it\")",
     "    print(f\"  until it is safe is the same as not bounding it.\")",
     "    assert 0.3 * se < mean_err < 2.0 * se, (mean_err, se)",
     "    assert worst_case < 4 * se, (worst_case, se)",
     "    assert 0 < overcounts < 20, overcounts",

     "import hashlib",

     "def exact_distinct(views):",
     "    \"\"\"The correct answer, and the one that cannot be afforded: keep every visitor.",
     "",
     "    The state is one slot per DISTINCT visitor, so it is set by the answer's own size.  At",
     "    tens of millions of visitors this is tens of millions of slots per day, per counter, and",
     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",
     "",

     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `exact_distinct` -- the brute-force set, which is the",
     "    reference answer and cannot be wrong -- and against the sketch, which must agree EXACTLY",

     "    \"\"\"",

     "    for label, views, ttl, want, want_expiry, want_est, want_saved in EXAMPLES:",
     "        exact, exact_slots = exact_distinct(views)",

     "        if exact < K:",
     "            assert est == exact, (label, \"below k the sketch IS the set\", est, exact)",

     "        else:",

     "            assert abs(est - exact) / exact < 3 * se, (label, est, exact, se)",
     "        if ttl is None:",
     "            ttl_s, exp_s, sav_s = \"-\", \"-\", \"-\"",

     "            got, _, _ = distinct_with_expiry(views, ttl)",

     "    print()",
     "",
     "",

     "",
     "    # and the expiry buys nothing inside a day, measured at every moment",
     "    end = max(t for _, t in VIEWS)",

     "import hashlib",

     "# The chapter's nine seed events with the value column dropped -- what is left is a view log:",

     "def exact_distinct(views):",
     "    \"\"\"The correct answer, and the one that cannot be afforded: keep every visitor.",
     "",
     "    The state is one slot per DISTINCT visitor, so it is set by the answer's own size.  At",
     "    tens of millions of visitors this is tens of millions of slots per day, per counter, and",
     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",

     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",

     "",

     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",

     "    there is no constant to tune: the thing that makes it big is the thing being measured.",
     "    Returns (count, slots_held).",
     "    \"\"\"",
     "    seen = set()",
     "    for v, _ in views:",
     "        seen.add(v)",
     "    return len(seen), len(seen)",
     "",
     "",
     "def count_the_views(views):",
     "    \"\"\"The answer that arrives first because it is the chapter's: one accumulator, +1 per",
     "    event.  It is a perfectly good counter of VIEWS, which is a different question, and the",
     "    inflation is the average views per visitor -- invisible unless somebody checks.\"\"\"",
     "    total = 0",
     "    for _ in views:",
     "        total += 1",
     "    return total",
     "",
     "",
     "def distinct_with_expiry(views, ttl):",
     "    \"\"\"Exact counting with the chapter's bound bolted on: increment when the visitor is not",
     "    in the set, and drop any visitor untouched for longer than `ttl`.",
     "",
     "    This is the chapter's `dropStale` doing exactly what it did there, and the failure has",
     "    the OPPOSITE SIGN.  A visitor dropped a moment ago is indistinguishable from one never",
     "    seen, so when they come back they are counted again -- the count can only rise above the",
     "    truth, never fall below it.  Returns (count, max_slots_held, recounts).",
     "    \"\"\"",
     "    seen, last = set(), {}",
     "    count, high_water, recounts = 0, 0, 0",
     "    ever = set()",
     "    for v, t in views:",
     "        for old in [k for k in seen if t - last[k] > ttl]:",
     "            seen.discard(old)",
     "            del last[old]",
     "        if v not in seen:",
     "            count += 1",
     "            if v in ever:",
     "                recounts += 1",
     "            seen.add(v)",
     "        ever.add(v)",
     "        last[v] = t",
     "        high_water = max(high_water, len(seen))",
     "    return count, high_water, recounts",
     "",
     "",
     "def hashed(visitor):",
     "    \"\"\"A visitor id to a number in [0, 1).  sha1 so the result is identical on every run and",
     "    on every machine -- the sketch's error must be reproducible or it cannot be asserted.\"\"\"",
     "    return int(hashlib.sha1(str(visitor).encode()).hexdigest()[:16], 16) / float(1 << 64)",
     "",
     "",
     "def kmv_sketch(views, k=K):",
     "    \"\"\"A k-minimum-values sketch: keep the k SMALLEST distinct hashes and nothing else.",
     "",
     "    The mechanism is that hashing spreads n distinct visitors evenly over [0, 1), so the",
     "    k-th smallest hash lands near k/n.  Reading that backwards, n is about k divided by the",
     "    k-th smallest hash -- (k-1)/h is the unbiased form.  Repeats hash to a value already",
     "    held, so they change nothing, which is why no visitor has to be remembered.  The state is",
     "    k slots whatever the cardinality, so the memory question is answered once and for all.",
     "    Returns (estimate, slots_held).",
     "    \"\"\"",
     "    mins, held = [], set()",
     "    for v, _ in views:",
     "        h = hashed(v)",
     "        if h in held:",
     "            continue",
     "        if len(mins) < k:",
     "            insort(mins, h)",
     "            held.add(h)",
     "        elif h < mins[-1]:",
     "            held.discard(mins.pop())",
     "            insort(mins, h)",
     "            held.add(h)",
     "    if len(mins) < k:",
     "        return len(mins), len(mins)          # fewer than k distinct: the sketch IS the set",
     "    return int((k - 1) / mins[-1]), len(mins)",
     "",
     "",
     "def held_at(views, ttl, t):",
     "    \"\"\"How many visitors an expiring set holds at moment t, if no view arrives then.  The",
     "    end-of-run count is the wrong measurement, because an expiry is immediately followed by",
     "    the view that re-creates the entry; observing a quiet moment shows it.\"\"\"",
     "    last = {}",
     "    for v, at in views:",
     "        if at <= t:",
     "            last[v] = at",
     "    return sum(1 for v in last if t - last[v] <= ttl)",
     "",
     "",
     "def stream_of(cardinality, repeats, seed=20260303):",
     "    \"\"\"A day of views with a known number of distinct visitors, shuffled so arrival order",
     "    carries no information.  Seeded, so every number printed below is reproducible.\"\"\"",
     "    rng = random.Random(seed)",
     "    views = [(f\"visitor{i}\", 0) for i in range(cardinality)] * repeats",
     "    rng.shuffle(views)",
     "    return views",
     "",

     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",

 Object.values(g.N).forEach(n=>{if(!n.values)return;const t=$('[data-val="'+CSS.escape(n.id)+'"]',svg);let s='';
  for(let j=0;j<=k&&j<n.values.length;j++)if(n.values[j]!=null)s=n.values[j];t.textContent=k<0?'':s});
 packets(g,k)}
function packets(g,k){g.gen++;clearTimeout(g.timer);const gen=g.gen;$('.pkts',g.svg).innerHTML='';if(k<0)return;
 const hot=g.E.filter(e=>e.step===k);if(!hot.length)return;
 const fire=()=>{if(gen!==g.gen)return;hot.forEach((e,j)=>setTimeout(()=>runPacket(g,e,gen),j*260));g.timer=setTimeout(fire,2900)};
 g.timer=setTimeout(fire,900)}
function runPacket(g,e,gen){if(gen!==g.gen)return;const c=document.createElementNS(NS,'circle');c.setAttribute('r',5.5);c.setAttribute('class','pkt');
 c.setAttribute('fill',css(KIND_VAR[e.kind]||'--acc'));$('.pkts',g.svg).appendChild(c);
 const D=Math.max(900,e.len*3.2),t0=performance.now();
 (function f(n){if(gen!==g.gen){c.remove();return}const q=Math.min(1,(n-t0)/D),ez=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
  const P=e.el.getPointAtLength(e.len*ez);c.setAttribute('cx',P.x);c.setAttribute('cy',P.y);c.setAttribute('opacity',q>.92?(1-q)*12:1);
  if(q<1)requestAnimationFrame(f);else c.remove()})(t0)}
function svgLink(el,v){const s=srcInfo(v);if(!s||el.closest('a'))return null;
 const a=document.createElementNS(NS,'a');a.setAttribute('href',s.url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');
 const ti=document.createElementNS(NS,'title');ti.textContent='Source: '+s.label+(s.unv?' · UNVERIFIED: '+s.unv:'');a.appendChild(ti);
 el.parentNode.insertBefore(a,el);a.appendChild(el);return a}
function svgText(parent,x,y,cls,txt,anc){const t=document.createElementNS(NS,'text');t.setAttribute('class',cls);t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anc||'end');t.textContent=txt;parent.appendChild(t);return t}

/* ---------------- sequence engine ---------------- */
function buildSeq(svg,cfg){const A=cfg.actors,M=cfg.messages,W=1500,sp=W/A.length,bw=Math.min(170,sp-16),rh=cfg.rowHeight||38,H=92+M.length*rh+10;
 svg.setAttribute('viewBox','0 0 '+W+' '+H);const X=i=>sp*(i+.5),idx={};A.forEach((a,i)=>idx[a.name]=i);let h='';
 A.forEach((a,i)=>{h+='<g class="actor'+(a.highlight?' new':'')+'"><rect x="'+(X(i)-bw/2)+'" y="8" width="'+bw+'" height="48" rx="3"/><text x="'+X(i)+'" y="29" text-anchor="middle" font-weight="600">'+esc(a.name)+'</text><text class="lbl" x="'+X(i)+'" y="46" text-anchor="middle">'+esc(a.sub||'')+'</text></g><line class="life" x1="'+X(i)+'" x2="'+X(i)+'" y1="56" y2="'+(H-6)+'"/>'});
 M.forEach((m,i)=>{const a=idx[m.from],b=idx[m.to];if(a==null||b==null||a===b){console.warn('[deck] bad sequence message',m);return}
  const y=92+i*rh,x1=X(a),x2=X(b),k=m.step||0;
  h+='<path class="msg" data-k="'+k+'" data-m="'+i+'" d="M'+x1+','+y+' L'+(x2+(x2>x1?-6:6))+','+y+'"/><text class="mt lbl" data-k="'+k+'" data-m="'+i+'" x="'+((x1+x2)/2)+'" y="'+(y-8)+'" text-anchor="middle">'+(i+1)+'. '+esc(m.label)+'</text>'});
 svg.innerHTML=h+'<g class="ahs"></g>';
 let ah='';const f=v=>v.toFixed(2);
 $$('.msg',svg).forEach(p=>{const L=p.getTotalLength();p.style.setProperty('--len',Math.ceil(L)+4);
  const E=p.getPointAtLength(L),P=p.getPointAtLength(Math.max(0,L-1));let ux=E.x-P.x,uy=E.y-P.y;const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n;
  const tx=E.x+ux*1.3,ty=E.y+uy*1.3,bx=tx-ux*12.6,by=ty-uy*12.6;
  ah+='<path class="ah" data-k="'+p.dataset.k+'" d="M'+f(tx)+','+f(ty)+'L'+f(bx-uy*6.3)+','+f(by+ux*6.3)+'L'+f(bx+uy*6.3)+','+f(by-ux*6.3)+'z"/>'});
 $('.ahs',svg).innerHTML=ah;
 $$('.actor',svg).forEach((g,i)=>{const v=A[i].src;if(!v)return;const r=g.querySelector('rect');
  svgText(g,+r.getAttribute('x')+(+r.getAttribute('width'))-5,+r.getAttribute('y')+11,Array.isArray(v)?'unvt':'lnk',Array.isArray(v)?'UNVERIFIED ↗':'↗');svgLink(g,v)});
 $$('.mt',svg).forEach(t=>{const v=M[+t.dataset.m].src;if(v)svgLink(t,v)})}

/* ---------------- counters ---------------- */
function count(el){const t=+el.dataset.count,d=+el.dataset.dec||0,p=el.dataset.pre||'',s=el.dataset.suf||'';
 const t0=performance.now(),D=+el.dataset.ms||1900;const host=el.closest('.v')||el;host.classList.add('ticking');host.classList.remove('landed');
 (function f(n){if(!el._run)return;const q=Math.min(1,(n-t0)/D),e=1-Math.pow(1-q,4);el.textContent=fmt(t*e,d,p,s);
  if(q<1)requestAnimationFrame(f);else{el.textContent=fmt(t,d,p,s);host.classList.remove('ticking');host.classList.add('landed')}})(t0)}
function counters(slide,k){$$('[data-count]',slide).forEach(c=>{const host=c.closest('[data-st]');const on=host?+host.dataset.st<=k:k>=0;
 if(on&&!c._run){c._run=1;count(c)}else if(!on&&c._run){c._run=0;c.textContent=fmt(0,+c.dataset.dec||0,c.dataset.pre||'',c.dataset.suf||'')}})}

/* ---------------- build the deck from DECK ---------------- */
document.title=DECK.title||document.title;$('#deckEyebrow').innerHTML=rich(DECK.eyebrow||'');
const deckEl=$('#deck');
DECK.slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.dataset.title=s.title||('Slide '+(i+1));
 const r=RENDER[s.layout];if(!r){console.warn('[deck] unknown layout "'+s.layout+'" on slide '+(i+1));sec.innerHTML=head(s)}else sec.innerHTML=r(s);deckEl.appendChild(sec)});
const S=$$('.slide',deckEl);
const NARR=DECK.slides.map(s=>(s.narration&&s.narration.length?s.narration:['']).map(String));
const SPEECH=DECK.slides.map(s=>s.speech||[]);   // optional per-line spoken text, if it should differ from the bar
/* per-slide hooks for diagrams that need JS: stage(k) shows step k, reset() clears */
DECK.slides.forEach((s,i)=>{const sec=S[i];sec._hooks=[];
 if(s.layout==='graph'){const g=buildGraph($('svg.g',sec),s.graph);sec._hooks.push({stage:k=>graphStage(g,k),reset:()=>{g.gen++;clearTimeout(g.timer);graphStage(g,-1)}})}
 if(s.layout==='sequence'){const svg=$('svg.seq',sec);buildSeq(svg,s.sequence);
  const lit=k=>$$('.msg,.mt,.ah',svg).forEach(e=>e.classList.toggle('lit',+e.dataset.k<=k));sec._hooks.push({stage:lit,reset:()=>lit(-1)})}
 if(s.layout==='timeline'){const ms=$$('.ms',sec),T=s.timeline||[],fill=$('.fillbar',sec),tk=$$('.tkt',sec),sp=s.strip;
  sec._hooks.push({stage:k=>{let c=-1;T.forEach((m,j)=>{if((m.step||0)<=k)c=j});
    ms.forEach((m,j)=>{const state=j<c?'done':j===c?'now':'next';m.classList.remove('done','now','next');m.classList.add(state);const ch=$('.state',m);ch.textContent=state;ch.className='chip state'+(state==='done'?' u':state==='now'?' a':'')});
    fill.style.width=c<0?'0':(tlPos(c,T.length)-8)+'%';
    if(sp){if(k>=sp.step&&!sec._dropped){sec._dropped=1;tk.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),300+j*520)})}
     else if(k<sp.step){sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}}},
   reset:()=>{sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')});fill.style.width='0';ms.forEach(m=>m.classList.remove('done','now'))}})}
 if(s.layout==='cards'&&(s.tokens||s.bars)){const tks=$$('.tk',sec),fills=$$('.bars .fill',sec);
  sec._hooks.push({stage:k=>{if(s.tokens){if(k>=s.tokens.step&&!sec._tok){sec._tok=1;tks.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),j*90)})}
     else if(k<s.tokens.step){sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}
     tks.forEach(t=>t.classList.toggle('fade',s.tokens.fadeStep!=null&&k>=s.tokens.fadeStep))}
    if(s.bars)fills.forEach(f=>f.style.width=(k>=s.bars.step?f.dataset.w:0)+'%')},
   reset:()=>{sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in','fade')});fills.forEach(f=>f.style.width='0')}})}
 /* extension: ask — answering is the only way past the question step */
 if(s.question){const q=s.question,fb=$('.fb',sec),bs=$$('.opt',sec),L=j=>String.fromCharCode(65+j);
  const reset=()=>{sec._answered=false;bs.forEach(b=>{b.className='opt';b.disabled=false});fb.innerHTML=''};
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();if(sec._answered)return;const j=+b.dataset.j,o=q.options[j],ok=!!o.correct,ci=q.options.findIndex(x=>x.correct),c=q.options[ci];
   sec._answered=true;bs.forEach((x,m)=>{x.disabled=true;x.classList.add(q.options[m].correct?'right':m===j?'wrong':'dim')});
   fb.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</p><p>'+rich(o.why)+'</p>'+(ok?'':'<p><b>The answer is '+L(ci)+'.</b> '+rich(c.why)+'</p>');
   if(voice&&HAS_TTS)speakLine((ok?'Right. ':'Not quite. ')+plain(o.why)+(ok?'':' The answer is '+plain(c.text)+'. '+plain(c.why)));
   else if(playing){clearTimeout(timer);timer=setTimeout(next,Math.max(4000,plain(fb.textContent).length*55))}});
  sec._hooks.push({stage:()=>{},reset})}
 /* extension: code — keep the newest lines in view as they appear */
 if(s.layout==='code'){const pane=$('.codep',sec),fr=$$('.ln.fresh',sec);
  sec._hooks.push({stage:k=>{const first=fr.find(e=>e.classList.contains('lit')||!e.hasAttribute('data-st'));
    if(first&&pane)pane.scrollTop=Math.max(0,first.offsetTop-pane.offsetTop-pane.clientHeight*0.25)},
   reset:()=>{if(pane)pane.scrollTop=0}})}
 /* extension: array — show, pick and sweep, each tied to a narration step */
 if(s.layout==='array'){const a=s.array,A=a.actions||[],cell=(r,c)=>$('.ac[data-r="'+r+'"][data-c="'+c+'"]',sec),M=$$('.am b',sec);
  let gen=0;const fmt0=v=>Number(v).toLocaleString('en-US'),setM=(i,v)=>{if(i!=null&&M[i])M[i].textContent=fmt0(v)};
  const rowsOf=x=>x.rows!=null?x.rows:x.row!=null?[x.row]:a.rows.map((_,r)=>r);
  const clear=()=>{gen++;$$('.ac',sec).forEach(e=>e.classList.remove('in','seen','hit','pick','ptr'));$$('.ai',sec).forEach(e=>e.classList.remove('pick'));M.forEach(m=>m.textContent='0')};
  const sweepTo=(x,upto)=>{const r=x.row,vals=a.rows[r].values;let read=0,acc=0,hits=0;
   for(let c=0;c<=upto;c++){const el=cell(r,c),v=Number(vals[c]);read++;el.classList.add('seen');
    if(x.mode==='sum')acc+=v;else if(x.mode==='match'&&String(vals[c])===String(x.match)){hits++;el.classList.add('hit')}}
   setM(x.readMeter,read);if(x.mode==='sum')setM(x.resultMeter,acc);if(x.mode==='match')setM(x.resultMeter,hits)};
  const stageA=k=>{clear();const g=gen;
   A.filter(x=>x.step<=k).forEach(x=>{const live=x.step===k;
    if(x.do==='show')rowsOf(x).forEach(r=>a.rows[r].values.forEach((_,c)=>{const el=cell(r,c);if(live){el._t=setTimeout(()=>{if(g===gen)el.classList.add('in')},c*45+r*120)}else el.classList.add('in')}));
    if(x.do==='pick')(x.slots||[]).forEach(c=>{rowsOf(x).forEach(r=>cell(r,c).classList.add('pick'));const i=$('.ai[data-c="'+c+'"]',sec);if(i)i.classList.add('pick')});
    if(x.do==='sweep'){const n=a.rows[x.row].values.length;
     if(!live)sweepTo(x,n-1);else{let c=0;(function tick(){if(g!==gen)return;$$('.ac.ptr',sec).forEach(e=>e.classList.remove('ptr'));
      if(c>=n)return;sweepTo(x,c);cell(x.row,c).classList.add('ptr');c++;setTimeout(tick,x.speed||140)})()}}})};
  sec._hooks.push({stage:stageA,reset:clear})}
});
/* authoring check: warns (console only) when a step number has no narration line */
DECK.slides.forEach((s,i)=>{let mx=-1;JSON.stringify(s,(k,v)=>{if((k==='step'||k==='fadeStep')&&typeof v==='number')mx=Math.max(mx,v);return v});
 if(mx>=NARR[i].length)console.warn('[deck] slide '+(i+1)+' uses step '+mx+' but has only '+NARR[i].length+' narration lines')});

/* ---------------- scaling, theme, tabs ---------------- */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
fit();addEventListener('resize',fit);
const tt=$('#tt');function setTheme(m){document.documentElement.dataset.theme=m;tt.textContent=m==='dark'?'Light':'Dark'}
setTheme(DECK.theme==='dark'?'dark':'light');tt.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const tabs=$('#tabs');S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+esc(s.dataset.title);b.onclick=()=>go(i);tabs.appendChild(b)});

/* ---------------- voice-over ----------------
   Fixed voice by name (any word order), silent fallback through DECK.voice.fallbackLangs, then the
   browser default. Voices load asynchronously in Chrome, so the choice is redone on "voiceschanged".
   Each sentence is spoken as its own utterance (avoids Chrome cutting long utterances off). */
const V=DECK.voice||{},AUTO=DECK.auto||{},HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
const WANT=String(V.preferred||'').toLowerCase().split(/\s+/).filter(Boolean);
const isPreferred=v=>{const n=(v.name||'').toLowerCase();return WANT.length>0&&WANT.every(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))};
const normLang=l=>String(l||'').toLowerCase().replace('_','-');
function chooseVoice(list){const p=list.find(isPreferred);if(p)return p;
 for(const lang of (V.fallbackLangs||[])){const L=normLang(lang),m=list.find(v=>normLang(v.lang)===L||normLang(v.lang).startsWith(L+'-')||normLang(v.lang).startsWith(L));if(m)return m}
 return null}   // null = let the browser use its default voice
function loadVoices(){if(!HAS_TTS)return;VOICE=chooseVoice(speechSynthesis.getVoices()||[])}
if(HAS_TTS){loadVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);else speechSynthesis.onvoiceschanged=loadVoices}
function speakable(s){let t=String(s);Object.entries(V.sayAs||{}).forEach(([a,b])=>{t=t.split(a).join(b)});
 return t.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d+(?:\.\d+)?)%/g,'$1 percent')}
function rateFor(v){const R=V.rate||{};if(v&&/^google/i.test(v.name))return R.google||1;if(v&&/^microsoft/i.test(v.name))return R.microsoft||1;return R.other||1}
let speechGen=0,pauseT=null;
function stopSpeech(){speechGen++;clearTimeout(pauseT);if(HAS_TTS)speechSynthesis.cancel()}
function speakLine(text){stopSpeech();const gen=speechGen;if(!VOICE)loadVoices();const v=VOICE;
 const parts=speakable(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[text];let i=0;
 (function nextSentence(){if(gen!==speechGen)return;
  if(i>=parts.length){if(playing)timer=setTimeout(next,AUTO.afterSpeechMs==null?700:AUTO.afterSpeechMs);return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());if(v){u.voice=v;u.lang=v.lang}u.rate=rateFor(v);u.pitch=V.pitch||1;u.volume=1;
  const pause=/[?!]["')]*$/.test(u.text)?(V.questionPauseMs||420):(V.sentencePauseMs||320);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(gen!==speechGen)return;pauseT=setTimeout(nextSentence,pause)};
  const wd=setTimeout(fin,Math.max(8000,u.text.length*200));   // watchdog: some browsers never fire "end"
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})()}

/* ---------------- stepping, narration bar, auto-play ---------------- */
let cur=0,line=0,playing=false,timer=null,t0=0,dur=1,voice=false,sayGen=0;
function stage(i,k){const s=S[i];$$('[data-st]',s).forEach(e=>e.classList.toggle('lit',+e.dataset.st<=k));counters(s,k);s._hooks.forEach(h=>h.stage(k))}
function dots(){$('#ndots').innerHTML=NARR[cur].map((_,j)=>'<i class="'+(j<=line?'on':'')+'"></i>').join('')}
function go(i,startLine){if(i<0||i>=S.length)return;stopSpeech();clearTimeout(timer);
 S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);s._hooks.forEach(h=>h.reset())});
 $$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 $$('[data-st]',S[i]).forEach(e=>e.classList.remove('lit'));counters(S[i],-1);
 cur=i;line=Math.max(0,Math.min(startLine||0,NARR[i].length-1));history.replaceState(null,'','#'+(i+1));
 const g=++sayGen;setTimeout(()=>{if(g===sayGen)say()},350)}
function say(){clearTimeout(timer);const g=++sayGen,L=NARR[cur],tx=$('#ntxt');tx.style.opacity=0;
 setTimeout(()=>{if(g!==sayGen)return;tx.textContent=L[line];tx.style.opacity=1;
  $('#ncount').textContent='slide '+(cur+1)+'/'+S.length+' · step '+(line+1)+'/'+L.length;dots();stage(cur,line);
  dur=Math.max(AUTO.minStepMs||5200,L[line].length*(AUTO.msPerChar||62));t0=performance.now();
  if(voice&&HAS_TTS)speakLine(SPEECH[cur][line]||L[line]);else if(playing)timer=setTimeout(next,dur)},250)}
/* extension: an unanswered question holds the deck on its question step */
function blocked(){const s=DECK.slides[cur];return !!s.question&&line===s.question.step&&!S[cur]._answered}
function nudge(){const s=S[cur];s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge');
 const fb=$('.fb',s);if(fb&&!fb.textContent.trim())fb.innerHTML='<p class="hint">Choose an answer to carry on.</p>'}
function next(){if(blocked()){nudge();return}stopSpeech();if(line<NARR[cur].length-1){line++;say()}else if(cur<S.length-1)go(cur+1);else{playing=false;upd()}}
function prev(){stopSpeech();if(line>0){line--;say()}else if(cur>0)go(cur-1,NARR[cur-1].length-1)}
(function prog(){const p=playing?Math.min(1,(performance.now()-t0)/dur):0;$('#nprog').style.width=(p*100)+'%';requestAnimationFrame(prog)})();
function upd(){$('#bplay').textContent=playing?'❚❚ auto':'▶ auto';$('#bplay').classList.toggle('on',playing)}
function toggleAuto(){playing=!playing;upd();clearTimeout(timer);if(playing){if(voice&&HAS_TTS)say();else timer=setTimeout(next,AUTO.firstStepDelayMs||1200)}}
function toggleVoice(){voice=!voice;const b=$('#bvoice');b.textContent=voice?'Voice on':'Voice off';b.setAttribute('aria-pressed',String(voice));b.classList.toggle('on',voice);
 if(!voice){stopSpeech();if(playing){clearTimeout(timer);timer=setTimeout(next,dur)}}else say()}
$('#bplay').onclick=toggleAuto;$('#bnext').onclick=next;$('#bprev').onclick=prev;$('#bvoice').onclick=toggleVoice;

/* keyboard: → / space next · ← back · PageDown/PageUp slide · Home/End · 1–9, 0 = slide 10 · A auto · V voice */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'){e.preventDefault();prev()}
 else if(k==='PageDown')go(cur+1);else if(k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
 else if(/^[1-9]$/.test(k))go(+k-1);else if(k==='0')go(9);else if(k==='a'||k==='A')toggleAuto();else if(k==='v'||k==='V')toggleVoice()});
/* click anywhere on the slide to advance — but not on links, buttons or while selecting text */
let clickLock=0;
deckEl.addEventListener('click',e=>{if(e.button!==0||e.target.closest('button,a,input,select,textarea,label,.ctl,.tabs'))return;
 const sel=window.getSelection&&String(window.getSelection());if(sel&&sel.trim())return;const now=performance.now();if(now-clickLock<450)return;clickLock=now;next()});
/* links (HTML or SVG) never advance the slide: stop the event in the capture phase; the link still opens */
['click','pointerdown','mousedown','pointerup','mouseup'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('a[href]'))e.stopPropagation()},true));

/* small read-only hook for automated checks */
window.__deck={go,next,prev,toggleAuto,toggleVoice,slides:S.length,narrLen:i=>NARR[i].length,
 state:()=>({cur,line,playing,voice,voiceName:VOICE?VOICE.name:null,text:$('#ntxt').textContent})};

const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=S.length?h0-1:0);
})();
</script>
