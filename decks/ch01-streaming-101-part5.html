<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Largest of the Last Three</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "",

     "",
     "def brute_max(xs, i, w=W):",

     "    best = xs[i]",
     "    for k in range(1, w):",
     "        if xs[i + k] > best:",
     "            best = xs[i + k]",
     "    return best",
     "",
     "",
     "def all_maxima(xs, w=W):",
     "    \"\"\"brute_max over every window, for comparison.\"\"\"",
     "    return [brute_max(xs, i, w) for i in range(len(xs) - w + 1)]",
     "",
     "",
     "def running_total(xs, w=W):",
     "    \"\"\"The average's machine, kept here as the CONTRAST: one accumulator, +arriving and",
     "    -departing.  It works because subtraction undoes addition exactly.\"\"\"",
     "    total, out = 0, []",
     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",
     "",
     "",
     "def running_max_single(xs, w=W):",
     "    \"\"\"The appealing wrong answer: keep ONE number and max the arrival into it.",
     "",
     "    The departure has no line to write -- there is no un-max -- so the kept number is",
     "    really the maximum of the whole PREFIX, which can only be too high, never too low.",
     "    Returned so the comparison is run rather than described.\"\"\"",
     "    best, out = None, []",
     "    for i, v in enumerate(xs):",
     "        best = v if best is None else max(best, v)",
     "        # the departing value xs[i - w] would have to be removed here, and cannot be",
     "        if i >= w - 1:",
     "            out.append(best)",
     "    return out",
     "",
     "",
     "def running_max_rescan(xs, w=W):",
     "    \"\"\"The second attempt, and it is CORRECT: keep one number, and when the departing",
     "    value is the one being kept, rescan the window to find the next.",
     "",
     "    The cost is what fails.  Returns (answers, rescans): on a decreasing stream the",
     "    maximum departs every single tick, so this is the full re-read the question forbids,",
     "    recovered under a different name.\"\"\"",
     "    out, rescans = [], 0",
     "    best = None",
     "    for i, v in enumerate(xs):",
     "        if i < w - 1:",
     "            best = v if best is None else max(best, v)",
     "            continue",
     "        if best is None or i == w - 1:",
     "            best = brute_max(xs, 0, w)",
     "            rescans += 1",
     "        else:",
     "            if xs[i - w] == best:          # the kept number just left the window",
     "                best = brute_max(xs, i - w + 1, w)",
     "                rescans += 1",
     "            else:",
     "                best = max(best, v)",
     "        out.append(best)",
     "    return out, rescans",
     "",
     "",
     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",

     "            expiries += 1",

     "def find_max_collision(rng, w=W, tries=20000):",
     "    \"\"\"Search for the proof that no incremental maximum exists.",
     "",
     "    Two windows with the SAME kept maximum, the SAME departing value and the SAME",
     "    arriving value, whose next maxima differ.  Any update function f(kept, out, in) must",
     "    return one number for one argument triple, so finding this pair rules out every such",
     "    function at once -- including ones nobody has thought of yet.  The same search over",
     "    SUMS can never succeed, which is what invertible means, and that is checked too.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (max(win), win[0], arriving)",
     "        nxt = max(win[1:] + [arriving])",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",
     "",
     "def find_sum_collision(rng, w=W, tries=20000):",
     "    \"\"\"The same search over sums.  It must come back empty: kept - out + in is a",
     "    function, so two windows agreeing on the triple cannot disagree on the answer.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (sum(win), win[0], arriving)",
     "        nxt = sum(win[1:]) + arriving",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",

     "",

     "",
     "def brute_max(xs, i, w=W):",
     "    \"\"\"Window i, read in full.  The reference: w reads per window, exact by construction",
     "    because nothing is ever removed from a kept quantity.\"\"\"",
     "    best = xs[i]",
     "    for k in range(1, w):",
     "        if xs[i + k] > best:",
     "            best = xs[i + k]",

     "",

     "def all_maxima(xs, w=W):",
     "    \"\"\"brute_max over every window, for comparison.\"\"\"",

     "def running_total(xs, w=W):",
     "    \"\"\"The average's machine, kept here as the CONTRAST: one accumulator, +arriving and",
     "    -departing.  It works because subtraction undoes addition exactly.\"\"\"",
     "    total, out = 0, []",
     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",
     "",
     "",

     "    \"\"\"The appealing wrong answer: keep ONE number and max the arrival into it.",

     "    The departure has no line to write -- there is no un-max -- so the kept number is",
     "    really the maximum of the whole PREFIX, which can only be too high, never too low.",

     "",
     "",
     "def running_max_rescan(xs, w=W):",
     "    \"\"\"The second attempt, and it is CORRECT: keep one number, and when the departing",
     "    value is the one being kept, rescan the window to find the next.",

     "    The cost is what fails.  Returns (answers, rescans): on a decreasing stream the",
     "    maximum departs every single tick, so this is the full re-read the question forbids,",
     "    recovered under a different name.\"\"\"",
     "    out, rescans = [], 0",
     "    best = None",
     "    for i, v in enumerate(xs):",
     "        if i < w - 1:",
     "            best = v if best is None else max(best, v)",
     "            continue",

     "            best = brute_max(xs, 0, w)",
     "            rescans += 1",
     "        else:",
     "            if xs[i - w] == best:          # the kept number just left the window",
     "                best = brute_max(xs, i - w + 1, w)",
     "                rescans += 1",
     "            else:",

     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",
     "        while dq and xs[dq[-1]] <= v:",
     "            dq.pop()",
     "            pops += 1",
     "        dq.append(i)",
     "        pushes += 1",
     "        if dq[0] <= i - w:",
     "            dq.pop(0)",
     "            expiries += 1",
     "        if i >= w - 1:",
     "            out.append(xs[dq[0]])",
     "    return out, pushes, pops, expiries",

     "def find_max_collision(rng, w=W, tries=20000):",
     "    \"\"\"Search for the proof that no incremental maximum exists.",

     "    return one number for one argument triple, so finding this pair rules out every such",
     "    function at once -- including ones nobody has thought of yet.  The same search over",
     "    SUMS can never succeed, which is what invertible means, and that is checked too.\"\"\"",
     "    seen = {}",

     "        arriving = rng.randint(0, 9)",

     "    return None",

     "        key = (sum(win), win[0], arriving)",
     "        nxt = sum(win[1:]) + arriving",

     "    (\"flat stream, `<=` keeps one entry\",    FLAT,       3,   0,    4),",
     "    (\"a single event, W = 1\",                ONE_EVENT,  1,   0,    42),",
     "    (\"W > N -> no window, so no answer\",     TOO_SHORT,  3,   0,    None),",
     "    (\"falling stream, last window\",          FALLING,    3,   17,   3),",
     "    (\"mixture of magnitudes, still exact\",   MIXTURE,    3,   0,    1e16),",
     "    (\"uniform scaling, still exact\",         UNIFORM,    3,   3,    6e16),",
     "    (\"5,000 events, W = 500, first\",         BIG_STREAM, 500, 0,    997916),",
     "    (\"5,000 events, W = 500, last\",          BIG_STREAM, 500, 4500, 998567),",
     "    (\"5,000 events, W = 1, deque LOSES\",     BIG_STREAM, 1,   2500, -48956),",
     "]",
     "",
     "",
     "def brute_max(xs, i, w=W):",
     "    \"\"\"Window i, read in full.  The reference: w reads per window, exact by construction",
     "    because nothing is ever removed from a kept quantity.\"\"\"",
     "    best = xs[i]",
     "    for k in range(1, w):",
     "        if xs[i + k] > best:",
     "            best = xs[i + k]",
     "    return best",
     "",
     "",
     "def all_maxima(xs, w=W):",
     "    \"\"\"brute_max over every window, for comparison.\"\"\"",
     "    return [brute_max(xs, i, w) for i in range(len(xs) - w + 1)]",
     "",
     "",
     "def running_total(xs, w=W):",
     "    \"\"\"The average's machine, kept here as the CONTRAST: one accumulator, +arriving and",
     "    -departing.  It works because subtraction undoes addition exactly.\"\"\"",
     "    total, out = 0, []",
     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",
     "",
     "",
     "def running_max_single(xs, w=W):",
     "    \"\"\"The appealing wrong answer: keep ONE number and max the arrival into it.",
     "",
     "    The departure has no line to write -- there is no un-max -- so the kept number is",
     "    really the maximum of the whole PREFIX, which can only be too high, never too low.",
     "    Returned so the comparison is run rather than described.\"\"\"",
     "    best, out = None, []",
     "    for i, v in enumerate(xs):",
     "        best = v if best is None else max(best, v)",
     "        # the departing value xs[i - w] would have to be removed here, and cannot be",
     "        if i >= w - 1:",
     "            out.append(best)",
     "    return out",
     "",
     "",
     "def running_max_rescan(xs, w=W):",
     "    \"\"\"The second attempt, and it is CORRECT: keep one number, and when the departing",
     "    value is the one being kept, rescan the window to find the next.",
     "",
     "    The cost is what fails.  Returns (answers, rescans): on a decreasing stream the",
     "    maximum departs every single tick, so this is the full re-read the question forbids,",
     "    recovered under a different name.\"\"\"",
     "    out, rescans = [], 0",
     "    best = None",
     "    for i, v in enumerate(xs):",
     "        if i < w - 1:",
     "            best = v if best is None else max(best, v)",
     "            continue",
     "        if best is None or i == w - 1:",
     "            best = brute_max(xs, 0, w)",
     "            rescans += 1",
     "        else:",
     "            if xs[i - w] == best:          # the kept number just left the window",
     "                best = brute_max(xs, i - w + 1, w)",
     "                rescans += 1",
     "            else:",
     "                best = max(best, v)",
     "        out.append(best)",
     "    return out, rescans",
     "",
     "",
     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",
     "        while dq and xs[dq[-1]] <= v:",
     "            dq.pop()",
     "            pops += 1",
     "        dq.append(i)",
     "        pushes += 1",
     "        if dq[0] <= i - w:",
     "            dq.pop(0)",
     "            expiries += 1",
     "        if i >= w - 1:",
     "            out.append(xs[dq[0]])",
     "    return out, pushes, pops, expiries",
     "",
     "",
     "def find_max_collision(rng, w=W, tries=20000):",
     "    \"\"\"Search for the proof that no incremental maximum exists.",
     "",
     "    Two windows with the SAME kept maximum, the SAME departing value and the SAME",
     "    arriving value, whose next maxima differ.  Any update function f(kept, out, in) must",
     "    return one number for one argument triple, so finding this pair rules out every such",
     "    function at once -- including ones nobody has thought of yet.  The same search over",
     "    SUMS can never succeed, which is what invertible means, and that is checked too.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (max(win), win[0], arriving)",
     "        nxt = max(win[1:] + [arriving])",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",
     "",
     "def find_sum_collision(rng, w=W, tries=20000):",
     "    \"\"\"The same search over sums.  It must come back empty: kept - out + in is a",
     "    function, so two windows agreeing on the triple cannot disagree on the answer.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (sum(win), win[0], arriving)",
     "        nxt = sum(win[1:]) + arriving",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked THREE ways -- the deque, the brute force read of that one window,",
     "    and the rescan-on-departure -- so an expected value has to be wrong in three places at",
     "    once to slip through.  The deque's total steps are printed beside the brute force's",
     "    total reads, which is the honest cost comparison: at W = 1 and at W = N the deque does",
     "    MORE work than re-reading, because every tick pushes, pops and expires to answer a",
     "    window that was never worth a structure.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'n':>5} {'W':>4} {'win':>5} {'max':>9} \"",
     "          f\"{'steps':>7} {'reads':>9}\")",
     "    for label, xs, w, idx, want in EXAMPLES:",
     "        answers, pushes, pops, expiries = slide_max(xs, w)",
     "        nwin = len(xs) - w + 1",
     "        got = answers[idx] if 0 <= idx < len(answers) else None",
     "        ref = brute_max(xs, idx, w) if 0 <= idx < nwin else None",
     "        rescan = running_max_rescan(xs, w)[0]",
     "        reg = rescan[idx] if 0 <= idx < len(rescan) else None",
     "        assert got == want, (label, got, want)",
     "        assert ref == want, (label, 'the brute force disagrees', ref, want)",
     "        assert reg == want, (label, 'the rescan disagrees', reg, want)",
     "        steps = pushes + pops + expiries",
     "        reads = max(0, nwin) * w",
     "        shown = 'None' if got is None else f\"{got:g}\"",
     "        print(f\"{label:37s} {len(xs):>5} {w:>4} {idx:>5} {shown:>9} {steps:>7} {reads:>9}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the brute force and the rescan\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"VALUES =\", \"  \".join(f\"{i}:{v}\" for i, v in enumerate(VALUES)), f\"   W = {W}\")",
     "    truth = all_maxima(VALUES)",
     "    single = running_max_single(VALUES)",
     "    rescan, rescans = running_max_rescan(VALUES)",
     "    deque_out, pushes, pops, expiries = slide_max(VALUES)",
     "    brute_reads = NWIN * W",
     "    steps = pushes + pops + expiries",
     "",
     "    print()",
     "    print(f\"  brute force  : {truth}   ({NWIN} windows x {W} = {brute_reads} reads)\")",
     "    print(f\"  one number   : {single}   <- WRONG\")",
     "    print(f\"  rescan on departure: {rescan}   ({rescans} rescans, correct)\")",
     "    print(f\"  deque        : {deque_out}   ({pushes}p + {pops}e + {expiries}x = {steps} steps)\")",
     "",
     "    assert deque_out == truth, (deque_out, truth)",
     "    assert truth == [7, 7, 7, 6, 9, 9, 9], truth",
     "    assert (pushes, pops, expiries) == (9, 6, 1), (pushes, pops, expiries)",
     "    assert steps < brute_reads, (steps, brute_reads)",
     "    assert pushes == N, \"every index must be pushed exactly once for the amortised claim\"",
     "",
     "    # the one-number answer must be CAUGHT, and caught in the predicted direction",
     "    wrong = [i for i, (a, b) in enumerate(zip(single, truth)) if a != b]",
     "    assert wrong == [3], f\"the one-number maximum differs at windows {wrong}\"",
     "    assert all(a >= b for a, b in zip(single, truth)), \"the prefix maximum can only read HIGH\"",
     "    assert single[3] == 7 and truth[3] == 6, (single[3], truth[3])",
     "    # the correction: the stale number is not wrong FOREVER, it is wrong until a larger",
     "    # value arrives.  Window 4 agrees again because 9 > 7, not because 7 expired.",
     "    assert single[4] == truth[4] == 9 and max(VALUES[4:7]) == 9",
     "    assert single[2] == truth[2], \"window 2 still holds 7 legitimately\"",
     "    print(f\"\\n  the one number is high at window {wrong[0]} only: it reports {single[3]} for \"",
     "          f\"[{', '.join(str(v) for v in VALUES[3:6])}], whose maximum is {truth[3]}.\")",
     "    print(f\"  7 left the window at that tick and nothing could put it back.  It is right again\")",
     "    print(f\"  at window 4 only because 9 arrives and exceeds the stale number -- the error ends\")",
     "    print(f\"  when a bigger value happens along, not when the window moves on.\")",
     "",
     "    # the rescan answer is correct, and its cost is the thing the question forbids",
     "    assert rescan == truth, (rescan, truth)",
     "    falling = list(range(20, 0, -1))",
     "    _, fall_rescans = running_max_rescan(falling)",
     "    assert running_max_rescan(falling)[0] == all_maxima(falling)",
     "    assert fall_rescans == len(falling) - W + 1, fall_rescans",
     "    rising = list(range(1, 21))",
     "    _, rise_rescans = running_max_rescan(rising)",
     "    assert rise_rescans == 1, rise_rescans",
     "    print(f\"\\n  rescan-on-departure is correct and costs {rescans} rescans here, {rise_rescans} on a\")",
     "    print(f\"  rising stream, and {fall_rescans} of {len(falling) - W + 1} windows on a falling one -- the\")",
     "    print(f\"  full re-read, back again under another name.\")",
     "",
     "    # ---- the impossibility, measured rather than argued",
     "    rng = random.Random(20260303)",
     "    hit = find_max_collision(rng)",
     "    assert hit is not None, \"no collision found; the impossibility argument is unproven\"",

     "    assert max(w1[1:] + [in_v]) == n1 and max(w2[1:] + [in_v]) == n2",
     "    print(f\"\\n  no f(kept, departing, arriving) can exist for the maximum:\")",
     "    print(f\"    window {w1} keeps {kept}, {out_v} departs, {in_v} arrives -> {n1}\")",
     "    print(f\"    window {w2} keeps {kept}, {out_v} departs, {in_v} arrives -> {n2}\")",
     "    print(f\"    identical arguments, {n1} != {n2} -- so EVERY such function is ruled out at once\")",
     "    assert find_sum_collision(random.Random(20260303)) is None, (",
     "        \"a sum collision was found, which would mean addition is not invertible\")",
     "    print(f\"  the same search over SUMS comes back empty, which is what invertible means.\")",
     "    assert running_total(VALUES) == [sum(VALUES[i:i + W]) for i in range(NWIN)]",
     "",
     "    # ---- and the second half: addition is invertible in arithmetic, not in float64",
     "    mixture = [HUGE] + VALUES[1:]              # ONE value replaced: magnitudes mixed",
     "    uniform = [v * HUGE for v in VALUES]       # every value scaled: magnitudes shared",
     "    mix_drift = [r - e for r, e in zip(running_total(mixture),",
     "                                       [sum(mixture[i:i + W]) for i in range(NWIN)])]",
     "    uni_drift = [r - e for r, e in zip(running_total(uniform),",
     "                                       [sum(uniform[i:i + W]) for i in range(NWIN)])]",
     "    mix_bad = sum(1 for d in mix_drift if d != 0)",
     "    uni_bad = sum(1 for d in uni_drift if d != 0)",
     "    print(f\"\\n  one value replaced by {HUGE:.0e}: {mix_bad} of {NWIN} running totals drift, worst \"",
     "          f\"{max(abs(d) for d in mix_drift)!r}\")",
     "    print(f\"  EVERY value scaled by {HUGE:.0e}:   {uni_bad} of {NWIN} drift -- scaling is not the cause\")",
     "    assert mix_bad == 6, f\"measured {mix_bad} drifting totals\"",
     "    assert mix_drift[0] == 0.0, \"window 0 precedes the first subtraction, so it cannot drift\"",
     "    # the opposite outcome is forbidden: uniform scaling must drift on NOTHING.  If this",
     "    # ever fires, the claim 'it is the mixture, not the magnitude' is what changes.",
     "    assert uni_bad == 0, f\"uniform scaling drifted on {uni_bad} answers\"",
     "    assert all(d == 0 for d in uni_drift)",
     "    # the deque never subtracts, so it is exact in BOTH cases -- the structure buys that",
     "    assert slide_max(mixture)[0] == all_maxima(mixture)",
     "    assert slide_max(uniform)[0] == all_maxima(uniform)",
     "    print(f\"  the deque is exact on both, because it never removes anything from a number.\")",
     "",
     "    # ---- boundaries",
     "    assert slide_max(VALUES, 1)[0] == VALUES, \"W = 1 must return the stream itself\"",
     "    assert slide_max(VALUES, N)[0] == [max(VALUES)], \"W = N must give one answer\"",
     "    flat = [4] * 6",

     "    # still answers correctly, but it grows -- so the cost claim, not the answer, is what",
     "    # that comparison protects.  Measured here on a flat stream.",
     "    dq_len = []",
     "    dq = []",

     "    assert max(dq_len) == W, f\"with `<` the deque reached {max(dq_len)} on a flat stream\"",
     "    print(f\"\\n  W = 1 -> the stream itself; W = {N} -> one answer; a flat stream keeps the deque\")",
     "    print(f\"  at 1 entry with `<=` and at {max(dq_len)} with `<` -- the comparison buys space, not answers.\")",

     "",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 2 — the rolling maximum (looks like risk). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    tick     -- one arrival.  Ticks are numbered 0, 1, 2, ... in arrival order, so \"tick 3\"",
     "                is the 4th value the screen ever saw.",
     "    exposure -- the number a tick carries.  Here, one position's size in lakh.",
     "    window   -- the last W ticks, and W = 3 here.  Window i is ticks i, i+1, i+2, INCLUSIVE",
     "                at both ends, so window 0 is the first three ticks and no window exists at",
     "                all until three have arrived.",
     "    maximum  -- the largest of the three exposures in that window.  Not a total and not an",
     "                average: one of the values that is actually sitting there.",
     "",
     "  A risk screen watches nine exposures arrive, in this order: 5, 3, 7, 2, 6, 1, 9, 4, 8.",
     "  After each arrival it must show the largest of the last three.  It may not re-read the",
     "  window -- one value arrives, one value leaves, and an answer is due immediately.",
     "",
     "  GIVEN A WINDOW INDEX i, WHAT IS THE LARGEST EXPOSURE IN WINDOW i?",
     "",
     "  Worked, on the nine exposures above -- which between them define only windows 0..6:",
     "    window 0 -> 7    ticks 5, 3, 7: the first window there is, and 7 is in it",
     "    window 2 -> 7    ticks 7, 2, 6: 7 is the oldest member, so this is the LAST window it is in",
     "    window 3 -> 6    ticks 2, 6, 1: 7 has just left, and no single kept number could say so",
     "    window 4 -> 9    ticks 6, 1, 9: the arriving value is itself the answer",
     "    window 6 -> 9    ticks 9, 4, 8: the last window these nine ticks define at all",
     "    window 7 -> no maximum: nine ticks and W = 3 give seven windows, 0..6, so 7 is off the",
     "               end.  The answer is \"undefined\", NOT 8 -- answering from the two ticks that",
     "               do exist would report a maximum of a window that never happened.",
     "  And on a generated 5,000-tick stream with W = 500:",
     "    window 0    -> 997916   the largest of the first 500 exposures",
     "    window 4500 -> 998567   the largest of the last 500",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted three",
     "  ways -- deque, brute force, rescan -- so these answers cannot drift from what the program",
     "  returns.  (The off-the-end line is asserted in the form the table can hold it: a stream",
     "  shorter than its own window, whose expected answer is None.)",
     "",
     "The trick does not transfer, and seeing exactly why is the whole exercise.  A total can",
     "have a value subtracted out of it because addition is invertible; a maximum cannot --",
     "once the maximum leaves the window, no single kept number can produce the next one.  So",
     "an incremental window needs an INVERTIBLE COMBINE, which sums and counts have and",
     "extremes do not, and the replacement is a structure (the values that could still become",
     "the maximum) rather than an accumulator.  The impossibility is proved below by running",
     "it, not argued: two windows agree on (kept maximum, departing value, arriving value) and",
     "disagree on the answer, so no update function of those three arguments can exist.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 18 input/output pairs -- the first and the",
     "last window of the chapter's stream, both sides of the tick where the stale maximum stops",
     "being right, W = 1 and W = N, a flat stream (the `<=` eviction), a single event, a stream",
     "shorter than its own window (no answer at all), a falling stream, the mixture-versus-uniform",
     "float pair, and a generated 5,000-event stream.  Each row prints the deque's steps beside",
     "the brute force's reads, so the rows where the deque LOSES are visible rather than claimed.",
     "Every row is ASSERTED three ways -- deque, brute force, rescan -- so the table cannot drift",
     "from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch01_v2.py",
     "\"\"\"",
     "",
     "import random",
     "",
     "# The chapter's own stream, reused unchanged: these are the nine seed values in arrival",
     "# order, all DISTINCT so a wrong window cannot be mistaken for a right one, and they rise",
     "# AND fall, which a monotone input would hide.  Here they are exposures in lakh.",
     "VALUES = [5, 3, 7, 2, 6, 1, 9, 4, 8]",
     "",
     "# W = 3, the chapter's window: large enough that a value departs, small enough to trace.",
     "W = 3",
     "",
     "# HUGE = 1e16 is the chapter's constant too, and for the same reason: a float64 carries",
     "# ~15-16 significant decimal digits, so a total near 1e16 cannot also hold a unit value",
     "# exactly.  It is used here for the SECOND half of the invertibility point -- addition is",
     "# invertible in arithmetic but not in float64, and only for a MIXTURE of magnitudes.",
     "HUGE = 1e16",
     "",
     "N = len(VALUES)",
     "NWIN = N - W + 1",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: a flat stream, a",
     "# single event, a stream shorter than its own window, a strictly falling stream (where the",
     "# maximum departs on every tick), the two float cases the chapter's finding is about, and",
     "# one GENERATED stream at the scale a real risk screen runs at.",
     "FLAT = [4] * 6",
     "ONE_EVENT = [42]",
     "TOO_SHORT = [5, 3]",
     "FALLING = list(range(20, 0, -1))",
     "MIXTURE = [HUGE] + VALUES[1:]              # ONE value replaced: magnitudes mixed",
     "UNIFORM = [v * HUGE for v in VALUES]       # every value scaled: magnitudes shared",
     "_BIG_RNG = random.Random(20260303)         # seeded, so the expected values below are fixed",
     "BIG_STREAM = [_BIG_RNG.randint(-10**6, 10**6) for _ in range(5000)]",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, stream, W, window index, expected maximum).  The window index is the",
     "# window's position, so window i covers xs[i:i+W]; a window that does not exist has no",
     "# maximum and the expected value is None rather than a guessed number.  Every row is",
     "# asserted by show_examples() against the deque, the brute force and the rescan, which is",
     "# why this table is data and not a comment: a comment can go stale silently, this cannot.",
     "EXAMPLES = [",
     "    (\"first window of all\",                  VALUES,     3,   0,    7),",
     "    (\"ordinary window, maximum inside\",      VALUES,     3,   1,    7),",
     "    (\"stale maximum STILL right (7 in it)\",  VALUES,     3,   2,    7),",
     "    (\"stale maximum now WRONG (7 left)\",     VALUES,     3,   3,    6),",
     "    (\"a bigger arrival heals the staleness\", VALUES,     3,   4,    9),",
     "    (\"last window of all\",                   VALUES,     3,   6,    9),",
     "    (\"W = 1 -> the stream itself, first\",    VALUES,     1,   0,    5),",
     "    (\"W = 1 -> the stream itself, last\",     VALUES,     1,   8,    8),",
     "    (\"W = N -> one window, one answer\",      VALUES,     9,   0,    9),",
     "    (\"flat stream, `<=` keeps one entry\",    FLAT,       3,   0,    4),",
     "    (\"a single event, W = 1\",                ONE_EVENT,  1,   0,    42),",
     "    (\"W > N -> no window, so no answer\",     TOO_SHORT,  3,   0,    None),",
     "    (\"falling stream, last window\",          FALLING,    3,   17,   3),",
     "    (\"mixture of magnitudes, still exact\",   MIXTURE,    3,   0,    1e16),",
     "    (\"uniform scaling, still exact\",         UNIFORM,    3,   3,    6e16),",
     "    (\"5,000 events, W = 500, first\",         BIG_STREAM, 500, 0,    997916),",
     "    (\"5,000 events, W = 500, last\",          BIG_STREAM, 500, 4500, 998567),",
     "    (\"5,000 events, W = 1, deque LOSES\",     BIG_STREAM, 1,   2500, -48956),",
     "]",
     "",
     "",
     "def brute_max(xs, i, w=W):",
     "    \"\"\"Window i, read in full.  The reference: w reads per window, exact by construction",
     "    because nothing is ever removed from a kept quantity.\"\"\"",
     "    best = xs[i]",
     "    for k in range(1, w):",
     "        if xs[i + k] > best:",
     "            best = xs[i + k]",
     "    return best",
     "",
     "",
     "def all_maxima(xs, w=W):",
     "    \"\"\"brute_max over every window, for comparison.\"\"\"",
     "    return [brute_max(xs, i, w) for i in range(len(xs) - w + 1)]",
     "",
     "",
     "def running_total(xs, w=W):",
     "    \"\"\"The average's machine, kept here as the CONTRAST: one accumulator, +arriving and",
     "    -departing.  It works because subtraction undoes addition exactly.\"\"\"",
     "    total, out = 0, []",
     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",
     "",
     "",
     "def running_max_single(xs, w=W):",
     "    \"\"\"The appealing wrong answer: keep ONE number and max the arrival into it.",
     "",
     "    The departure has no line to write -- there is no un-max -- so the kept number is",
     "    really the maximum of the whole PREFIX, which can only be too high, never too low.",
     "    Returned so the comparison is run rather than described.\"\"\"",
     "    best, out = None, []",
     "    for i, v in enumerate(xs):",
     "        best = v if best is None else max(best, v)",
     "        # the departing value xs[i - w] would have to be removed here, and cannot be",
     "        if i >= w - 1:",
     "            out.append(best)",
     "    return out",
     "",
     "",
     "def running_max_rescan(xs, w=W):",
     "    \"\"\"The second attempt, and it is CORRECT: keep one number, and when the departing",
     "    value is the one being kept, rescan the window to find the next.",
     "",
     "    The cost is what fails.  Returns (answers, rescans): on a decreasing stream the",
     "    maximum departs every single tick, so this is the full re-read the question forbids,",
     "    recovered under a different name.\"\"\"",
     "    out, rescans = [], 0",
     "    best = None",
     "    for i, v in enumerate(xs):",
     "        if i < w - 1:",
     "            best = v if best is None else max(best, v)",
     "            continue",
     "        if best is None or i == w - 1:",
     "            best = brute_max(xs, 0, w)",
     "            rescans += 1",
     "        else:",
     "            if xs[i - w] == best:          # the kept number just left the window",
     "                best = brute_max(xs, i - w + 1, w)",
     "                rescans += 1",
     "            else:",
     "                best = max(best, v)",
     "        out.append(best)",
     "    return out, rescans",
     "",
     "",
     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",
     "        while dq and xs[dq[-1]] <= v:",
     "            dq.pop()",
     "            pops += 1",
     "        dq.append(i)",
     "        pushes += 1",
     "        if dq[0] <= i - w:",
     "            dq.pop(0)",
     "            expiries += 1",
     "        if i >= w - 1:",
     "            out.append(xs[dq[0]])",
     "    return out, pushes, pops, expiries",
     "",
     "",
     "def find_max_collision(rng, w=W, tries=20000):",
     "    \"\"\"Search for the proof that no incremental maximum exists.",
     "",
     "    Two windows with the SAME kept maximum, the SAME departing value and the SAME",
     "    arriving value, whose next maxima differ.  Any update function f(kept, out, in) must",
     "    return one number for one argument triple, so finding this pair rules out every such",
     "    function at once -- including ones nobody has thought of yet.  The same search over",
     "    SUMS can never succeed, which is what invertible means, and that is checked too.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (max(win), win[0], arriving)",
     "        nxt = max(win[1:] + [arriving])",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",
     "",
     "def find_sum_collision(rng, w=W, tries=20000):",
     "    \"\"\"The same search over sums.  It must come back empty: kept - out + in is a",
     "    function, so two windows agreeing on the triple cannot disagree on the answer.\"\"\"",
     "    seen = {}",
     "    for _ in range(tries):",
     "        win = [rng.randint(0, 9) for _ in range(w)]",
     "        arriving = rng.randint(0, 9)",
     "        key = (sum(win), win[0], arriving)",
     "        nxt = sum(win[1:]) + arriving",
     "        if key in seen and seen[key][0] != nxt:",
     "            return key, seen[key], (nxt, win)",
     "        seen.setdefault(key, (nxt, win))",
     "    return None",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked THREE ways -- the deque, the brute force read of that one window,",
     "    and the rescan-on-departure -- so an expected value has to be wrong in three places at",
     "    once to slip through.  The deque's total steps are printed beside the brute force's",
     "    total reads, which is the honest cost comparison: at W = 1 and at W = N the deque does",
     "    MORE work than re-reading, because every tick pushes, pops and expires to answer a",
     "    window that was never worth a structure.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'n':>5} {'W':>4} {'win':>5} {'max':>9} \"",
     "          f\"{'steps':>7} {'reads':>9}\")",
     "    for label, xs, w, idx, want in EXAMPLES:",
     "        answers, pushes, pops, expiries = slide_max(xs, w)",
     "        nwin = len(xs) - w + 1",
     "        got = answers[idx] if 0 <= idx < len(answers) else None",
     "        ref = brute_max(xs, idx, w) if 0 <= idx < nwin else None",
     "        rescan = running_max_rescan(xs, w)[0]",
     "        reg = rescan[idx] if 0 <= idx < len(rescan) else None",
     "        assert got == want, (label, got, want)",
     "        assert ref == want, (label, 'the brute force disagrees', ref, want)",
     "        assert reg == want, (label, 'the rescan disagrees', reg, want)",
     "        steps = pushes + pops + expiries",
     "        reads = max(0, nwin) * w",
     "        shown = 'None' if got is None else f\"{got:g}\"",
     "        print(f\"{label:37s} {len(xs):>5} {w:>4} {idx:>5} {shown:>9} {steps:>7} {reads:>9}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the brute force and the rescan\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"VALUES =\", \"  \".join(f\"{i}:{v}\" for i, v in enumerate(VALUES)), f\"   W = {W}\")",
     "    truth = all_maxima(VALUES)",
     "    single = running_max_single(VALUES)",
     "    rescan, rescans = running_max_rescan(VALUES)",
     "    deque_out, pushes, pops, expiries = slide_max(VALUES)",
     "    brute_reads = NWIN * W",
     "    steps = pushes + pops + expiries",
     "",
     "    print()",
     "    print(f\"  brute force  : {truth}   ({NWIN} windows x {W} = {brute_reads} reads)\")",
     "    print(f\"  one number   : {single}   <- WRONG\")",
     "    print(f\"  rescan on departure: {rescan}   ({rescans} rescans, correct)\")",
     "    print(f\"  deque        : {deque_out}   ({pushes}p + {pops}e + {expiries}x = {steps} steps)\")",
     "",
     "    assert deque_out == truth, (deque_out, truth)",
     "    assert truth == [7, 7, 7, 6, 9, 9, 9], truth",
     "    assert (pushes, pops, expiries) == (9, 6, 1), (pushes, pops, expiries)",
     "    assert steps < brute_reads, (steps, brute_reads)",
     "    assert pushes == N, \"every index must be pushed exactly once for the amortised claim\"",
     "",
     "    # the one-number answer must be CAUGHT, and caught in the predicted direction",
     "    wrong = [i for i, (a, b) in enumerate(zip(single, truth)) if a != b]",
     "    assert wrong == [3], f\"the one-number maximum differs at windows {wrong}\"",
     "    assert all(a >= b for a, b in zip(single, truth)), \"the prefix maximum can only read HIGH\"",
     "    assert single[3] == 7 and truth[3] == 6, (single[3], truth[3])",
     "    # the correction: the stale number is not wrong FOREVER, it is wrong until a larger",
     "    # value arrives.  Window 4 agrees again because 9 > 7, not because 7 expired.",
     "    assert single[4] == truth[4] == 9 and max(VALUES[4:7]) == 9",
     "    assert single[2] == truth[2], \"window 2 still holds 7 legitimately\"",
     "    print(f\"\\n  the one number is high at window {wrong[0]} only: it reports {single[3]} for \"",
     "          f\"[{', '.join(str(v) for v in VALUES[3:6])}], whose maximum is {truth[3]}.\")",
     "    print(f\"  7 left the window at that tick and nothing could put it back.  It is right again\")",
     "    print(f\"  at window 4 only because 9 arrives and exceeds the stale number -- the error ends\")",
     "    print(f\"  when a bigger value happens along, not when the window moves on.\")",
     "",
     "    # the rescan answer is correct, and its cost is the thing the question forbids",
     "    assert rescan == truth, (rescan, truth)",
     "    falling = list(range(20, 0, -1))",
     "    _, fall_rescans = running_max_rescan(falling)",
     "    assert running_max_rescan(falling)[0] == all_maxima(falling)",
     "    assert fall_rescans == len(falling) - W + 1, fall_rescans",
     "    rising = list(range(1, 21))",
     "    _, rise_rescans = running_max_rescan(rising)",
     "    assert rise_rescans == 1, rise_rescans",
     "    print(f\"\\n  rescan-on-departure is correct and costs {rescans} rescans here, {rise_rescans} on a\")",
     "    print(f\"  rising stream, and {fall_rescans} of {len(falling) - W + 1} windows on a falling one -- the\")",
     "    print(f\"  full re-read, back again under another name.\")",
     "",
     "    # ---- the impossibility, measured rather than argued",
     "    rng = random.Random(20260303)",
     "    hit = find_max_collision(rng)",
     "    assert hit is not None, \"no collision found; the impossibility argument is unproven\"",
     "    key, (n1, w1), (n2, w2) = hit",
     "    kept, out_v, in_v = key",
     "    assert n1 != n2",
     "    assert max(w1) == max(w2) == kept and w1[0] == w2[0] == out_v",
     "    assert max(w1[1:] + [in_v]) == n1 and max(w2[1:] + [in_v]) == n2",
     "    print(f\"\\n  no f(kept, departing, arriving) can exist for the maximum:\")",
     "    print(f\"    window {w1} keeps {kept}, {out_v} departs, {in_v} arrives -> {n1}\")",
     "    print(f\"    window {w2} keeps {kept}, {out_v} departs, {in_v} arrives -> {n2}\")",
     "    print(f\"    identical arguments, {n1} != {n2} -- so EVERY such function is ruled out at once\")",
     "    assert find_sum_collision(random.Random(20260303)) is None, (",
     "        \"a sum collision was found, which would mean addition is not invertible\")",
     "    print(f\"  the same search over SUMS comes back empty, which is what invertible means.\")",
     "    assert running_total(VALUES) == [sum(VALUES[i:i + W]) for i in range(NWIN)]",
     "",
     "    # ---- and the second half: addition is invertible in arithmetic, not in float64",
     "    mixture = [HUGE] + VALUES[1:]              # ONE value replaced: magnitudes mixed",
     "    uniform = [v * HUGE for v in VALUES]       # every value scaled: magnitudes shared",
     "    mix_drift = [r - e for r, e in zip(running_total(mixture),",
     "                                       [sum(mixture[i:i + W]) for i in range(NWIN)])]",
     "    uni_drift = [r - e for r, e in zip(running_total(uniform),",
     "                                       [sum(uniform[i:i + W]) for i in range(NWIN)])]",
     "    mix_bad = sum(1 for d in mix_drift if d != 0)",
     "    uni_bad = sum(1 for d in uni_drift if d != 0)",
     "    print(f\"\\n  one value replaced by {HUGE:.0e}: {mix_bad} of {NWIN} running totals drift, worst \"",
     "          f\"{max(abs(d) for d in mix_drift)!r}\")",
     "    print(f\"  EVERY value scaled by {HUGE:.0e}:   {uni_bad} of {NWIN} drift -- scaling is not the cause\")",
     "    assert mix_bad == 6, f\"measured {mix_bad} drifting totals\"",
     "    assert mix_drift[0] == 0.0, \"window 0 precedes the first subtraction, so it cannot drift\"",
     "    # the opposite outcome is forbidden: uniform scaling must drift on NOTHING.  If this",
     "    # ever fires, the claim 'it is the mixture, not the magnitude' is what changes.",
     "    assert uni_bad == 0, f\"uniform scaling drifted on {uni_bad} answers\"",
     "    assert all(d == 0 for d in uni_drift)",
     "    # the deque never subtracts, so it is exact in BOTH cases -- the structure buys that",
     "    assert slide_max(mixture)[0] == all_maxima(mixture)",
     "    assert slide_max(uniform)[0] == all_maxima(uniform)",
     "    print(f\"  the deque is exact on both, because it never removes anything from a number.\")",
     "",
     "    # ---- boundaries",
     "    assert slide_max(VALUES, 1)[0] == VALUES, \"W = 1 must return the stream itself\"",
     "    assert slide_max(VALUES, N)[0] == [max(VALUES)], \"W = N must give one answer\"",
     "    flat = [4] * 6",
     "    assert slide_max(flat)[0] == [4] * (6 - W + 1), \"equal values must not break the eviction\"",
     "    # `<=` not `<` in the eviction: with `<` the deque keeps duplicates of the maximum and",
     "    # still answers correctly, but it grows -- so the cost claim, not the answer, is what",
     "    # that comparison protects.  Measured here on a flat stream.",
     "    dq_len = []",
     "    dq = []",
     "    for i, v in enumerate(flat):",
     "        while dq and flat[dq[-1]] < v:       # deliberately the weaker comparison",
     "            dq.pop()",
     "        dq.append(i)",
     "        if dq[0] <= i - W:",
     "            dq.pop(0)",
     "        dq_len.append(len(dq))",
     "    assert max(dq_len) == W, f\"with `<` the deque reached {max(dq_len)} on a flat stream\"",
     "    print(f\"\\n  W = 1 -> the stream itself; W = {N} -> one answer; a flat stream keeps the deque\")",
     "    print(f\"  at 1 entry with `<=` and at {max(dq_len)} with `<` -- the comparison buys space, not answers.\")",
     "",
     "    # ---- many inputs, against the brute force",
     "    rng = random.Random(20260303)",
     "    caught = 0",
     "    for _ in range(800):",
     "        w = rng.randint(1, 6)",
     "        n = rng.randint(w, 22)",
     "        xs = [rng.randint(-30, 30) for _ in range(n)]",
     "        want = all_maxima(xs, w)",
     "        assert slide_max(xs, w)[0] == want, (xs, w)",
     "        assert running_max_rescan(xs, w)[0] == want, (xs, w)",
     "        if running_max_single(xs, w) != want:",
     "            caught += 1",
     "    print(f\"\\n  800 random (values, W) pairs: the deque and the rescan both equal the brute\")",
     "    print(f\"  force on all of them; the one-number version is wrong on {caught} of 800.\")",
     "    assert caught > 400, f\"the one-number version was only wrong {caught} times\"",
     "",
     "    print(\"\\nall assertions passed\")",
     "",
     "",
     "if __name__ == \"__main__\":",
     "    main()"

     "def brute_max(xs, i, w=W):",

     "def running_total(xs, w=W):",

     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",

     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",
     "        while dq and xs[dq[-1]] <= v:",

     "            pops += 1",

     "        pushes += 1",
     "        if dq[0] <= i - w:",

     "            expiries += 1",
     "        if i >= w - 1:",
     "            out.append(xs[dq[0]])",

     "def find_max_collision(rng, w=W, tries=20000):",
     "    \"\"\"Search for the proof that no incremental maximum exists.",

     "    return None",
     "",

     "def brute_max(xs, i, w=W):",
     "    \"\"\"Window i, read in full.  The reference: w reads per window, exact by construction",
     "    because nothing is ever removed from a kept quantity.\"\"\"",
     "    best = xs[i]",
     "    for k in range(1, w):",

     "            best = xs[i + k]",
     "    return best",
     "",
     "",
     "def all_maxima(xs, w=W):",
     "    \"\"\"brute_max over every window, for comparison.\"\"\"",

     "",
     "",
     "def running_total(xs, w=W):",
     "    \"\"\"The average's machine, kept here as the CONTRAST: one accumulator, +arriving and",
     "    -departing.  It works because subtraction undoes addition exactly.\"\"\"",
     "    total, out = 0, []",
     "    for i, v in enumerate(xs):",
     "        total += v",
     "        if i - w >= 0:",
     "            total -= xs[i - w]",
     "        if i >= w - 1:",
     "            out.append(total)",
     "    return out",
     "",
     "",
     "def running_max_single(xs, w=W):",
     "    \"\"\"The appealing wrong answer: keep ONE number and max the arrival into it.",
     "",
     "    The departure has no line to write -- there is no un-max -- so the kept number is",
     "    really the maximum of the whole PREFIX, which can only be too high, never too low.",
     "    Returned so the comparison is run rather than described.\"\"\"",
     "    best, out = None, []",
     "    for i, v in enumerate(xs):",
     "        best = v if best is None else max(best, v)",
     "        # the departing value xs[i - w] would have to be removed here, and cannot be",
     "        if i >= w - 1:",
     "            out.append(best)",
     "    return out",
     "",
     "",
     "def running_max_rescan(xs, w=W):",
     "    \"\"\"The second attempt, and it is CORRECT: keep one number, and when the departing",
     "    value is the one being kept, rescan the window to find the next.",
     "",
     "    The cost is what fails.  Returns (answers, rescans): on a decreasing stream the",
     "    maximum departs every single tick, so this is the full re-read the question forbids,",
     "    recovered under a different name.\"\"\"",
     "    out, rescans = [], 0",
     "    best = None",
     "    for i, v in enumerate(xs):",
     "        if i < w - 1:",
     "            best = v if best is None else max(best, v)",
     "            continue",
     "        if best is None or i == w - 1:",
     "            best = brute_max(xs, 0, w)",
     "            rescans += 1",
     "        else:",
     "            if xs[i - w] == best:          # the kept number just left the window",
     "                best = brute_max(xs, i - w + 1, w)",
     "                rescans += 1",
     "            else:",
     "                best = max(best, v)",
     "        out.append(best)",
     "    return out, rescans",
     "",
     "",
     "def slide_max(xs, w=W):",
     "    \"\"\"The answer: keep the INDEXES that could still become the maximum, decreasing.",
     "",
     "    An arriving value makes every smaller-or-equal entry behind it dead -- the newcomer",
     "    is both larger and newer, so while any of them is in the window so is it, and it is",
     "    the bigger.  Indexes rather than values, because only an index says whether an entry",
     "    has left.  The front is the answer in one read; at most one entry can expire per tick",
     "    because the window moves by one.  Returns (answers, pushes, pops, expiries).\"\"\"",
     "    dq, out = [], []",
     "    pushes = pops = expiries = 0",
     "    for i, v in enumerate(xs):",
     "        while dq and xs[dq[-1]] <= v:",
     "            dq.pop()",
     "            pops += 1",
     "        dq.append(i)",
     "        pushes += 1",
     "        if dq[0] <= i - w:",
     "            dq.pop(0)",
     "            expiries += 1",
     "        if i >= w - 1:",
     "            out.append(xs[dq[0]])",
     "    return out, pushes, pops, expiries",

     "def find_max_collision(rng, w=W, tries=20000):",

     "",
     "",

     "",
