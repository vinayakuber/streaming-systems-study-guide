     "# A one-item queue, an empty queue, and a 20,000-item queue at the scale a real notification",
     "# backlog reaches.  ALL means \"crashed at every item in one run\".  These are inputs for the",
     "# examples table, not alternative versions of the problem.",
     "ONE_ITEM = [(0, 5)]",
     "EMPTY_QUEUE = []",
     "BIG_QUEUE = [(i, 1 + i % 7) for i in range(20_000)]",
     "BIG_MID = len(BIG_QUEUE) // 2",
     "ALL = \"all\"",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, items, ordering, crash point, far-end key, (duplicated ids, lost ids)).",
     "# Every row is asserted by show_examples() against the program AND against a closed form for",
     "# the send sequence the ordering forces, which is why the table is data and not a comment: a",
     "# comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"effect-first, crash on the FIRST item\",   ITEMS,       \"effect_then_position\", 0,       False, ([0], [])),",
     "    (\"effect-first, the traced middle item\",    ITEMS,       \"effect_then_position\", C,       False, ([3], [])),",
     "    (\"effect-first, crash on the LAST item\",    ITEMS,       \"effect_then_position\", N - 1,   False, ([8], [])),",
     "    (\"effect-first, no crash at all\",           ITEMS,       \"effect_then_position\", None,    False, ([], [])),",
     "    (\"crash point past the end never fires\",    ITEMS,       \"effect_then_position\", 99,      False, ([], [])),",
     "    (\"position-first, FIRST item (mirrored)\",   ITEMS,       \"position_then_effect\", 0,       False, ([], [0])),",
     "    (\"position-first, crash on the LAST item\",  ITEMS,       \"position_then_effect\", N - 1,   False, ([], [8])),",
     "    (\"position-first, no crash at all\",         ITEMS,       \"position_then_effect\", None,    False, ([], [])),",
     "    (\"send-then-remember == effect-first\",      ITEMS,       \"send_then_dedupe\",     C,       False, ([3], [])),",
     "    (\"remember-then-send == position-first\",    ITEMS,       \"dedupe_then_send\",     C,       False, ([], [3])),",
     "    (\"effect-first, crashed at EVERY item\",     ITEMS,       \"effect_then_position\", ALL,     False, ([0, 1, 2, 3, 4, 5, 6, 7, 8], [])),",
     "    (\"position-first, crashed at EVERY item\",   ITEMS,       \"position_then_effect\", ALL,     False, ([], [0, 1, 2, 3, 4, 5, 6, 7, 8])),",
     "    (\"far-end key rescues effect-first\",        ITEMS,       \"effect_then_position\", C,       True,  ([], [])),",
     "    (\"far-end key does NOT rescue position\",    ITEMS,       \"position_then_effect\", C,       True,  ([], [3])),",
     "    (\"far-end key, crashed at EVERY item\",      ITEMS,       \"effect_then_position\", ALL,     True,  ([], [])),",
     "    (\"empty queue: nothing to send\",            EMPTY_QUEUE, \"effect_then_position\", 0,       False, ([], [])),",
     "    (\"one item, effect-first, crash on it\",     ONE_ITEM,    \"effect_then_position\", 0,       False, ([0], [])),",
     "    (\"one item, position-first, crash on it\",   ONE_ITEM,    \"position_then_effect\", 0,       False, ([], [0])),",
     "    (\"20,000 items, effect-first, midway\",      BIG_QUEUE,   \"effect_then_position\", BIG_MID, False, ([10000], [])),",
     "    (\"20,000 items, position-first, midway\",    BIG_QUEUE,   \"position_then_effect\", BIG_MID, False, ([], [10000])),",
     "    (\"20,000 items, far-end key, midway\",       BIG_QUEUE,   \"effect_then_position\", BIG_MID, True,  ([], [])),",
     "]",
     "",
     "",
     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return list(ids)                      # the far end swallows the repeat",
     "        if order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return ids[:crash_at + 1] + ids[crash_at:]",
     "        return ids[:crash_at] + ids[crash_at + 1:]",
     "",
     "    def short(ids):",
     "        return str(ids) if len(ids) <= 3 else f\"{len(ids)} items\"",
     "",
     "    print(f\"{'what it exercises':42s} {'items':>6} {'ordering':>20} {'crash':>5} {'key':>5} \"",
     "          f\"{'duplicated':>11} {'lost':>11} {'parcel':>7} {'charge':>7} {'better for':>10}\")",
     "    for label, items, order, crash_at, key, want in EXAMPLES:",
     "        ids = [eid for eid, _ in items]",
     "        crashes = (set(range(len(items))) if crash_at == ALL",
     "                   else set() if crash_at is None else {crash_at})",
     "        sent = run(items, order, crashes, far_end_key=key)",
     "        dups, lost = tally(items, sent)",
     "        assert (dups, lost) == want, (label, (dups, lost), want)",
     "",
     "        if crash_at != ALL:",
     "            ref = closed_form(ids, order, crash_at, key)",
     "            assert sent == ref, (label, 'the rule disagrees', sent[:12], ref[:12])",
     "",
     "        p, ch = price(dups, lost, parcel), price(dups, lost, charged)",
     "        better = 'parcel' if p < ch else 'charge' if ch < p else 'either'",
     "        shown = 'all' if crash_at == ALL else 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:42s} {len(items):>6} {order:>20} {shown:>5} {str(key):>5} \"",
     "              f\"{short(dups):>11} {short(lost):>11} {p:>7} {ch:>7} {better:>10}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the send sequence their ordering forces\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    clean = {o: run(ITEMS, o, set()) for o in",
     "             (\"effect_then_position\", \"position_then_effect\", \"dedupe_then_send\", \"send_then_dedupe\")}",
     "    want = [eid for eid, _ in ITEMS]",
     "    for o, s in clean.items():",
     "        assert s == want, (o, s)",
     "    print(f\"ITEMS = {[eid for eid, _ in ITEMS]}, values {[v for _, v in ITEMS]}\")",
     "    print(f\"  with no crash, all four orderings send exactly {want}\\n\")",
     "",
     "    at_least = run(ITEMS, \"effect_then_position\", {C})",
     "    at_most = run(ITEMS, \"position_then_effect\", {C})",
     "    print(f\"  crash during item {C}:\")",
     "    print(f\"    effect then position : {at_least}   -> {tally(ITEMS, at_least)}\")",
     "    print(f\"    position then effect : {at_most}   -> {tally(ITEMS, at_most)}\")",
     "    assert tally(ITEMS, at_least) == ([C], []), tally(ITEMS, at_least)",
     "    assert tally(ITEMS, at_most) == ([], [C]), tally(ITEMS, at_most)",
     "    assert at_least.count(C) == 2 and C not in at_most",
     "",
     "    # ---- every crash point, and the two guarantees are exactly complementary",
     "    for c in range(N):",
     "        dl, ll = tally(ITEMS, run(ITEMS, \"effect_then_position\", {c}))",
     "        dm, lm = tally(ITEMS, run(ITEMS, \"position_then_effect\", {c}))",
     "        assert (dl, ll) == ([c], []), (c, dl, ll)",
     "        assert (dm, lm) == ([], [c]), (c, dm, lm)",
     "    print(f\"\\n  at all {N} crash points: effect-first duplicates exactly the straddling item and\")",
     "    print(f\"  loses nothing; position-first loses exactly it and duplicates nothing.  Neither\")",
     "    print(f\"  ever gets both right, and no crash point escapes either way.\")",
     "    # the opposite outcome is forbidden",
     "    assert not any(tally(ITEMS, run(ITEMS, \"effect_then_position\", {c})) == ([], []) for c in range(N))",
     "    assert not any(tally(ITEMS, run(ITEMS, \"position_then_effect\", {c})) == ([], []) for c in range(N))",
     "    # and crashing at EVERY item in one run duplicates or loses every one of them",
     "    all_dup = tally(ITEMS, run(ITEMS, \"effect_then_position\", set(range(N))))",
     "    all_lost = tally(ITEMS, run(ITEMS, \"position_then_effect\", set(range(N))))",
     "    assert all_dup == (want, []), all_dup",
     "    assert all_lost == ([], want), all_lost",
     "    print(f\"  crashed at every item in one run: {len(all_dup[0])} duplicates and 0 losses one way,\")",
     "    print(f\"  0 duplicates and {len(all_lost[1])} losses the other -- {N} of {N} either way.\")",
     "",
     "    # ---- the local dedupe set, which looks like a third option",
     "    same_a = same_b = 0",
     "    for c in range(N):",
     "        a1 = run(ITEMS, \"send_then_dedupe\", {c})",
     "        a2 = run(ITEMS, \"effect_then_position\", {c})",
     "        b1 = run(ITEMS, \"dedupe_then_send\", {c})",
     "        b2 = run(ITEMS, \"position_then_effect\", {c})",
     "        assert a1 == a2, (c, a1, a2)",
     "        assert b1 == b2, (c, b1, b2)",
     "        same_a += a1 == a2",
     "        same_b += b1 == b2",
     "    print(f\"\\n  'just remember what you already sent': the dedupe set is itself a write, so the\")",
     "    print(f\"  same two instants come back one level down.  Measured over all {N} crash points, the\")",
     "    print(f\"  phone receives an IDENTICAL sequence:\")",
     "    print(f\"    send-then-remember == effect-then-position on {same_a}/{N} crash points\")",
     "    print(f\"    remember-then-send == position-then-effect on {same_b}/{N} crash points\")",
     "    assert same_a == same_b == N",
     "    print(f\"  so it is not a third option: it is the same choice with the record moved, which is\")",
     "    print(f\"  what 'the problem is the instant between two writes' means in practice.\")",
     "",
     "    # ---- what WOULD fix it is a property of the far end",
     "    for c in range(N):",
     "        fixed = run(ITEMS, \"effect_then_position\", {c}, far_end_key=True)",
     "        assert tally(ITEMS, fixed) == ([], []), (c, fixed)",
     "        assert fixed == want, (c, fixed)",
     "    assert run(ITEMS, \"effect_then_position\", set(range(N)), far_end_key=True) == want",
     "    print(f\"\\n  give the push service an idempotency key and effect-first becomes exact at all {N}\")",
     "    print(f\"  crash points, and at every item at once.  The missing feature is the problem; no\")",
     "    print(f\"  arrangement of the worker's two writes substitutes for it.\")",
     "    # with the key, effect-first becomes exact -- but the ORDER still matters: the key cannot",
     "    # recover an item position-first skipped",
     "    assert run(ITEMS, \"effect_then_position\", {C}, far_end_key=True) == want",
     "    assert tally(ITEMS, run(ITEMS, \"position_then_effect\", {C}, far_end_key=True)) == ([], [C])",
     "    print(f\"  note it only rescues the at-least-once side: a key cannot un-skip an item that was\")",
     "    print(f\"  recorded as handled and never sent, so position-first still loses item {C}.\")",
     "",
     "    # ---- so the choice is the message's, and the answer flips",
     "    print(f\"\\n  expected cost of one crash, averaged over all {N} crash points:\")",
     "    print(f\"    {'message':>24}  {'dup':>4} {'loss':>5}  {'at-least-once':>14}  {'at-most-once':>13}  best\")",
     "    best = {}",
     "    for msg, profile in PROFILES.items():",
     "        cheap = expected_cost(ITEMS, \"effect_then_position\", profile)",
     "        safe = expected_cost(ITEMS, \"position_then_effect\", profile)",
     "        best[msg] = \"at-least-once\" if cheap < safe else \"at-most-once\"",
     "        print(f\"    {msg:>24}  {profile['duplicate']:>4} {profile['loss']:>5}  {cheap:>14.1f}  \"",
     "              f\"{safe:>13.1f}  {best[msg]}\")",
     "    assert best[\"your parcel has arrived\"] == \"at-least-once\", best",
     "    assert best[\"you have been charged\"] == \"at-most-once\", best",
     "    assert len(set(best.values())) == 2, (",
     "        \"the two messages must choose DIFFERENTLY, or the whole answer collapses\")",
     "    print(f\"  the same nine items, the same two programs, and the better design is opposite for\")",
     "    print(f\"  the two messages.  Nothing in the code decides it, which is why the answer to this\")",
     "    print(f\"  question is a question.\")",
     "    # and the flip happens at the obvious place, measured rather than assumed",
     "    flip = [d for d in range(1, 60)",
     "            if expected_cost(ITEMS, \"effect_then_position\", {\"duplicate\": d, \"loss\": 20})",
     "            > expected_cost(ITEMS, \"position_then_effect\", {\"duplicate\": d, \"loss\": 20})]",
     "    assert flip and min(flip) == 21, min(flip) if flip else None",
     "    tie = min(flip) - 1",
     "    assert (expected_cost(ITEMS, \"effect_then_position\", {\"duplicate\": tie, \"loss\": 20})",
     "            == expected_cost(ITEMS, \"position_then_effect\", {\"duplicate\": tie, \"loss\": 20})), tie",
     "    print(f\"  holding the cost of a loss at 20, the two designs tie when a duplicate costs {tie}\")",
     "    print(f\"  and at-least-once starts losing at {min(flip)} -- the crossover is exactly where the\")",
     "    print(f\"  two costs cross, because each design fails on exactly one item per crash.\")",
     "",
     "    # ---- boundaries",
     "    assert run([], \"effect_then_position\", {0}) == []",
     "    one = [(0, 5)]",
     "    assert run(one, \"effect_then_position\", {0}) == [0, 0], run(one, \"effect_then_position\", {0})",
     "    assert run(one, \"position_then_effect\", {0}) == []",
     "    assert tally(one, run(one, \"effect_then_position\", {0})) == ([0], [])",
     "    print(f\"\\n  boundaries: an empty queue sends nothing under either design; a one-item queue\")",
     "    print(f\"  crashed on its only item sends it twice one way and never the other -- there is no\")",
     "    print(f\"  stream short enough for the problem to disappear.\")",
     "",
     "    # ---- many queues, every crash point, all four orderings",
     "    rng = random.Random(20260303)",
     "    for _ in range(300):",
     "        n = rng.randint(1, 10)",
     "        items = [(i, rng.randint(1, 40)) for i in range(n)]",
     "        ids = [eid for eid, _ in items]",
     "        for c in range(n):",
     "            a = run(items, \"effect_then_position\", {c})",
     "            b = run(items, \"position_then_effect\", {c})",
     "            assert tally(items, a) == ([c], []), (items, c, a)",
     "            assert tally(items, b) == ([], [c]), (items, c, b)",
     "            assert run(items, \"send_then_dedupe\", {c}) == a, (items, c)",
     "            assert run(items, \"dedupe_then_send\", {c}) == b, (items, c)",
     "            assert run(items, \"effect_then_position\", {c}, far_end_key=True) == ids",
     "        # crashed at every item in one run: every id duplicated one way, every id lost the",
     "        # other.  Written as a tally rather than a sequence, because the send ORDER after",
     "        # repeated restarts is an implementation detail and the guarantee is not.",
     "        assert tally(items, run(items, \"effect_then_position\", set(range(n)))) == (ids, [])",
     "        assert tally(items, run(items, \"position_then_effect\", set(range(n)))) == ([], ids)",

     "    print(f\"  and loses none, position-first the mirror image, the two dedupe variants are\")",
     "    print(f\"  byte-identical to them, and a far-end key makes effect-first exact every time.\")",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",

     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",

     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",

     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return list(ids)                      # the far end swallows the repeat",
     "        if order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return ids[:crash_at + 1] + ids[crash_at:]",
     "        return ids[:crash_at] + ids[crash_at + 1:]",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",

     "",
     "    def short(ids):",

     "",
     "    print(f\"{'what it exercises':42s} {'items':>6} {'ordering':>20} {'crash':>5} {'key':>5} \"",

     "        if crash_at != ALL:",
     "            ref = closed_form(ids, order, crash_at, key)",

     "",
     "        p, ch = price(dups, lost, parcel), price(dups, lost, charged)",
     "        better = 'parcel' if p < ch else 'charge' if ch < p else 'either'",
     "        shown = 'all' if crash_at == ALL else 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:42s} {len(items):>6} {order:>20} {shown:>5} {str(key):>5} \"",
     "              f\"{short(dups):>11} {short(lost):>11} {p:>7} {ch:>7} {better:>10}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the send sequence their ordering forces\")",
     "    print()",

 const fire=()=>{if(gen!==g.gen)return;hot.forEach((e,j)=>setTimeout(()=>runPacket(g,e,gen),j*260));g.timer=setTimeout(fire,2900)};
 g.timer=setTimeout(fire,900)}
function runPacket(g,e,gen){if(gen!==g.gen)return;const c=document.createElementNS(NS,'circle');c.setAttribute('r',5.5);c.setAttribute('class','pkt');
 c.setAttribute('fill',css(KIND_VAR[e.kind]||'--acc'));$('.pkts',g.svg).appendChild(c);
 const D=Math.max(900,e.len*3.2),t0=performance.now();
 (function f(n){if(gen!==g.gen){c.remove();return}const q=Math.min(1,(n-t0)/D),ez=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
  const P=e.el.getPointAtLength(e.len*ez);c.setAttribute('cx',P.x);c.setAttribute('cy',P.y);c.setAttribute('opacity',q>.92?(1-q)*12:1);
  if(q<1)requestAnimationFrame(f);else c.remove()})(t0)}
function svgLink(el,v){const s=srcInfo(v);if(!s||el.closest('a'))return null;
 const a=document.createElementNS(NS,'a');a.setAttribute('href',s.url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');
 const ti=document.createElementNS(NS,'title');ti.textContent='Source: '+s.label+(s.unv?' · UNVERIFIED: '+s.unv:'');a.appendChild(ti);
 el.parentNode.insertBefore(a,el);a.appendChild(el);return a}
function svgText(parent,x,y,cls,txt,anc){const t=document.createElementNS(NS,'text');t.setAttribute('class',cls);t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anc||'end');t.textContent=txt;parent.appendChild(t);return t}

/* ---------------- sequence engine ---------------- */
function buildSeq(svg,cfg){const A=cfg.actors,M=cfg.messages,W=1500,sp=W/A.length,bw=Math.min(170,sp-16),rh=cfg.rowHeight||38,H=92+M.length*rh+10;
 svg.setAttribute('viewBox','0 0 '+W+' '+H);const X=i=>sp*(i+.5),idx={};A.forEach((a,i)=>idx[a.name]=i);let h='';
 A.forEach((a,i)=>{h+='<g class="actor'+(a.highlight?' new':'')+'"><rect x="'+(X(i)-bw/2)+'" y="8" width="'+bw+'" height="48" rx="3"/><text x="'+X(i)+'" y="29" text-anchor="middle" font-weight="600">'+esc(a.name)+'</text><text class="lbl" x="'+X(i)+'" y="46" text-anchor="middle">'+esc(a.sub||'')+'</text></g><line class="life" x1="'+X(i)+'" x2="'+X(i)+'" y1="56" y2="'+(H-6)+'"/>'});
 M.forEach((m,i)=>{const a=idx[m.from],b=idx[m.to];if(a==null||b==null||a===b){console.warn('[deck] bad sequence message',m);return}
  const y=92+i*rh,x1=X(a),x2=X(b),k=m.step||0;
  h+='<path class="msg" data-k="'+k+'" data-m="'+i+'" d="M'+x1+','+y+' L'+(x2+(x2>x1?-6:6))+','+y+'"/><text class="mt lbl" data-k="'+k+'" data-m="'+i+'" x="'+((x1+x2)/2)+'" y="'+(y-8)+'" text-anchor="middle">'+(i+1)+'. '+esc(m.label)+'</text>'});
 svg.innerHTML=h+'<g class="ahs"></g>';
 let ah='';const f=v=>v.toFixed(2);
 $$('.msg',svg).forEach(p=>{const L=p.getTotalLength();p.style.setProperty('--len',Math.ceil(L)+4);
  const E=p.getPointAtLength(L),P=p.getPointAtLength(Math.max(0,L-1));let ux=E.x-P.x,uy=E.y-P.y;const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n;
  const tx=E.x+ux*1.3,ty=E.y+uy*1.3,bx=tx-ux*12.6,by=ty-uy*12.6;
  ah+='<path class="ah" data-k="'+p.dataset.k+'" d="M'+f(tx)+','+f(ty)+'L'+f(bx-uy*6.3)+','+f(by+ux*6.3)+'L'+f(bx+uy*6.3)+','+f(by-ux*6.3)+'z"/>'});
 $('.ahs',svg).innerHTML=ah;
 $$('.actor',svg).forEach((g,i)=>{const v=A[i].src;if(!v)return;const r=g.querySelector('rect');
  svgText(g,+r.getAttribute('x')+(+r.getAttribute('width'))-5,+r.getAttribute('y')+11,Array.isArray(v)?'unvt':'lnk',Array.isArray(v)?'UNVERIFIED ↗':'↗');svgLink(g,v)});
 $$('.mt',svg).forEach(t=>{const v=M[+t.dataset.m].src;if(v)svgLink(t,v)})}

/* ---------------- counters ---------------- */
function count(el){const t=+el.dataset.count,d=+el.dataset.dec||0,p=el.dataset.pre||'',s=el.dataset.suf||'';
 const t0=performance.now(),D=+el.dataset.ms||1900;const host=el.closest('.v')||el;host.classList.add('ticking');host.classList.remove('landed');
 (function f(n){if(!el._run)return;const q=Math.min(1,(n-t0)/D),e=1-Math.pow(1-q,4);el.textContent=fmt(t*e,d,p,s);
  if(q<1)requestAnimationFrame(f);else{el.textContent=fmt(t,d,p,s);host.classList.remove('ticking');host.classList.add('landed')}})(t0)}
function counters(slide,k){$$('[data-count]',slide).forEach(c=>{const host=c.closest('[data-st]');const on=host?+host.dataset.st<=k:k>=0;
 if(on&&!c._run){c._run=1;count(c)}else if(!on&&c._run){c._run=0;c.textContent=fmt(0,+c.dataset.dec||0,c.dataset.pre||'',c.dataset.suf||'')}})}

/* ---------------- build the deck from DECK ---------------- */
document.title=DECK.title||document.title;$('#deckEyebrow').innerHTML=rich(DECK.eyebrow||'');
const deckEl=$('#deck');
DECK.slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.dataset.title=s.title||('Slide '+(i+1));
 const r=RENDER[s.layout];if(!r){console.warn('[deck] unknown layout "'+s.layout+'" on slide '+(i+1));sec.innerHTML=head(s)}else sec.innerHTML=r(s);deckEl.appendChild(sec)});
const S=$$('.slide',deckEl);
const NARR=DECK.slides.map(s=>(s.narration&&s.narration.length?s.narration:['']).map(String));
const SPEECH=DECK.slides.map(s=>s.speech||[]);   // optional per-line spoken text, if it should differ from the bar
/* per-slide hooks for diagrams that need JS: stage(k) shows step k, reset() clears */
DECK.slides.forEach((s,i)=>{const sec=S[i];sec._hooks=[];
 if(s.layout==='graph'){const g=buildGraph($('svg.g',sec),s.graph);sec._hooks.push({stage:k=>graphStage(g,k),reset:()=>{g.gen++;clearTimeout(g.timer);graphStage(g,-1)}})}
 if(s.layout==='sequence'){const svg=$('svg.seq',sec);buildSeq(svg,s.sequence);
  const lit=k=>$$('.msg,.mt,.ah',svg).forEach(e=>e.classList.toggle('lit',+e.dataset.k<=k));sec._hooks.push({stage:lit,reset:()=>lit(-1)})}
 if(s.layout==='timeline'){const ms=$$('.ms',sec),T=s.timeline||[],fill=$('.fillbar',sec),tk=$$('.tkt',sec),sp=s.strip;
  sec._hooks.push({stage:k=>{let c=-1;T.forEach((m,j)=>{if((m.step||0)<=k)c=j});
    ms.forEach((m,j)=>{const state=j<c?'done':j===c?'now':'next';m.classList.remove('done','now','next');m.classList.add(state);const ch=$('.state',m);ch.textContent=state;ch.className='chip state'+(state==='done'?' u':state==='now'?' a':'')});
    fill.style.width=c<0?'0':(tlPos(c,T.length)-8)+'%';
    if(sp){if(k>=sp.step&&!sec._dropped){sec._dropped=1;tk.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),300+j*520)})}
     else if(k<sp.step){sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}}},
   reset:()=>{sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')});fill.style.width='0';ms.forEach(m=>m.classList.remove('done','now'))}})}
 if(s.layout==='cards'&&(s.tokens||s.bars)){const tks=$$('.tk',sec),fills=$$('.bars .fill',sec);
  sec._hooks.push({stage:k=>{if(s.tokens){if(k>=s.tokens.step&&!sec._tok){sec._tok=1;tks.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),j*90)})}
     else if(k<s.tokens.step){sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}
     tks.forEach(t=>t.classList.toggle('fade',s.tokens.fadeStep!=null&&k>=s.tokens.fadeStep))}
    if(s.bars)fills.forEach(f=>f.style.width=(k>=s.bars.step?f.dataset.w:0)+'%')},
   reset:()=>{sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in','fade')});fills.forEach(f=>f.style.width='0')}})}
 /* extension: ask — answering is the only way past the question step */
 if(s.question){const q=s.question,fb=$('.fb',sec),bs=$$('.opt',sec),L=j=>String.fromCharCode(65+j);
  const reset=()=>{sec._answered=false;bs.forEach(b=>{b.className='opt';b.disabled=false});fb.innerHTML=''};
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();if(sec._answered)return;const j=+b.dataset.j,o=q.options[j],ok=!!o.correct,ci=q.options.findIndex(x=>x.correct),c=q.options[ci];
   sec._answered=true;bs.forEach((x,m)=>{x.disabled=true;x.classList.add(q.options[m].correct?'right':m===j?'wrong':'dim')});
   fb.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</p><p>'+rich(o.why)+'</p>'+(ok?'':'<p><b>The answer is '+L(ci)+'.</b> '+rich(c.why)+'</p>');
   if(voice&&HAS_TTS)speakLine((ok?'Right. ':'Not quite. ')+plain(o.why)+(ok?'':' The answer is '+plain(c.text)+'. '+plain(c.why)));
   else if(playing){clearTimeout(timer);timer=setTimeout(next,Math.max(4000,plain(fb.textContent).length*55))}});
  sec._hooks.push({stage:()=>{},reset})}
 /* extension: code — keep the newest lines in view as they appear */
 if(s.layout==='code'){const pane=$('.codep',sec),fr=$$('.ln.fresh',sec);
  sec._hooks.push({stage:k=>{const first=fr.find(e=>e.classList.contains('lit')||!e.hasAttribute('data-st'));
    if(first&&pane)pane.scrollTop=Math.max(0,first.offsetTop-pane.offsetTop-pane.clientHeight*0.25)},
   reset:()=>{if(pane)pane.scrollTop=0}})}
 /* extension: array — show, pick and sweep, each tied to a narration step */
 if(s.layout==='array'){const a=s.array,A=a.actions||[],cell=(r,c)=>$('.ac[data-r="'+r+'"][data-c="'+c+'"]',sec),M=$$('.am b',sec);
  let gen=0;const fmt0=v=>Number(v).toLocaleString('en-US'),setM=(i,v)=>{if(i!=null&&M[i])M[i].textContent=fmt0(v)};
  const rowsOf=x=>x.rows!=null?x.rows:x.row!=null?[x.row]:a.rows.map((_,r)=>r);
  const clear=()=>{gen++;$$('.ac',sec).forEach(e=>e.classList.remove('in','seen','hit','pick','ptr'));$$('.ai',sec).forEach(e=>e.classList.remove('pick'));M.forEach(m=>m.textContent='0')};
  const sweepTo=(x,upto)=>{const r=x.row,vals=a.rows[r].values;let read=0,acc=0,hits=0;
   for(let c=0;c<=upto;c++){const el=cell(r,c),v=Number(vals[c]);read++;el.classList.add('seen');
    if(x.mode==='sum')acc+=v;else if(x.mode==='match'&&String(vals[c])===String(x.match)){hits++;el.classList.add('hit')}}
   setM(x.readMeter,read);if(x.mode==='sum')setM(x.resultMeter,acc);if(x.mode==='match')setM(x.resultMeter,hits)};
  const stageA=k=>{clear();const g=gen;
   A.filter(x=>x.step<=k).forEach(x=>{const live=x.step===k;
    if(x.do==='show')rowsOf(x).forEach(r=>a.rows[r].values.forEach((_,c)=>{const el=cell(r,c);if(live){el._t=setTimeout(()=>{if(g===gen)el.classList.add('in')},c*45+r*120)}else el.classList.add('in')}));
    if(x.do==='pick')(x.slots||[]).forEach(c=>{rowsOf(x).forEach(r=>cell(r,c).classList.add('pick'));const i=$('.ai[data-c="'+c+'"]',sec);if(i)i.classList.add('pick')});
    if(x.do==='sweep'){const n=a.rows[x.row].values.length;
     if(!live)sweepTo(x,n-1);else{let c=0;(function tick(){if(g!==gen)return;$$('.ac.ptr',sec).forEach(e=>e.classList.remove('ptr'));
      if(c>=n)return;sweepTo(x,c);cell(x.row,c).classList.add('ptr');c++;setTimeout(tick,x.speed||140)})()}}})};
  sec._hooks.push({stage:stageA,reset:clear})}
});
/* authoring check: warns (console only) when a step number has no narration line */
DECK.slides.forEach((s,i)=>{let mx=-1;JSON.stringify(s,(k,v)=>{if((k==='step'||k==='fadeStep')&&typeof v==='number')mx=Math.max(mx,v);return v});
 if(mx>=NARR[i].length)console.warn('[deck] slide '+(i+1)+' uses step '+mx+' but has only '+NARR[i].length+' narration lines')});

/* ---------------- scaling, theme, tabs ---------------- */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
fit();addEventListener('resize',fit);
const tt=$('#tt');function setTheme(m){document.documentElement.dataset.theme=m;tt.textContent=m==='dark'?'Light':'Dark'}
setTheme(DECK.theme==='dark'?'dark':'light');tt.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const tabs=$('#tabs');S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+esc(s.dataset.title);b.onclick=()=>go(i);tabs.appendChild(b)});

/* ---------------- voice-over ----------------
   Fixed voice by name (any word order), silent fallback through DECK.voice.fallbackLangs, then the
   browser default. Voices load asynchronously in Chrome, so the choice is redone on "voiceschanged".
   Each sentence is spoken as its own utterance (avoids Chrome cutting long utterances off). */
const V=DECK.voice||{},AUTO=DECK.auto||{},HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
const WANT=String(V.preferred||'').toLowerCase().split(/\s+/).filter(Boolean);
const isPreferred=v=>{const n=(v.name||'').toLowerCase();return WANT.length>0&&WANT.every(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))};
const normLang=l=>String(l||'').toLowerCase().replace('_','-');
function chooseVoice(list){const p=list.find(isPreferred);if(p)return p;
 for(const lang of (V.fallbackLangs||[])){const L=normLang(lang),m=list.find(v=>normLang(v.lang)===L||normLang(v.lang).startsWith(L+'-')||normLang(v.lang).startsWith(L));if(m)return m}
 return null}   // null = let the browser use its default voice
function loadVoices(){if(!HAS_TTS)return;VOICE=chooseVoice(speechSynthesis.getVoices()||[])}
if(HAS_TTS){loadVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);else speechSynthesis.onvoiceschanged=loadVoices}
function speakable(s){let t=String(s);Object.entries(V.sayAs||{}).forEach(([a,b])=>{t=t.split(a).join(b)});
 return t.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d+(?:\.\d+)?)%/g,'$1 percent')}
function rateFor(v){const R=V.rate||{};if(v&&/^google/i.test(v.name))return R.google||1;if(v&&/^microsoft/i.test(v.name))return R.microsoft||1;return R.other||1}
let speechGen=0,pauseT=null;
function stopSpeech(){speechGen++;clearTimeout(pauseT);if(HAS_TTS)speechSynthesis.cancel()}
function speakLine(text){stopSpeech();const gen=speechGen;if(!VOICE)loadVoices();const v=VOICE;
 const parts=speakable(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[text];let i=0;
 (function nextSentence(){if(gen!==speechGen)return;
  if(i>=parts.length){if(playing)timer=setTimeout(next,AUTO.afterSpeechMs==null?700:AUTO.afterSpeechMs);return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());if(v){u.voice=v;u.lang=v.lang}u.rate=rateFor(v);u.pitch=V.pitch||1;u.volume=1;
  const pause=/[?!]["')]*$/.test(u.text)?(V.questionPauseMs||420):(V.sentencePauseMs||320);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(gen!==speechGen)return;pauseT=setTimeout(nextSentence,pause)};
  const wd=setTimeout(fin,Math.max(8000,u.text.length*200));   // watchdog: some browsers never fire "end"
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})()}

/* ---------------- stepping, narration bar, auto-play ---------------- */
let cur=0,line=0,playing=false,timer=null,t0=0,dur=1,voice=false,sayGen=0;
function stage(i,k){const s=S[i];$$('[data-st]',s).forEach(e=>e.classList.toggle('lit',+e.dataset.st<=k));counters(s,k);s._hooks.forEach(h=>h.stage(k))}
function dots(){$('#ndots').innerHTML=NARR[cur].map((_,j)=>'<i class="'+(j<=line?'on':'')+'"></i>').join('')}
function go(i,startLine){if(i<0||i>=S.length)return;stopSpeech();clearTimeout(timer);
 S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);s._hooks.forEach(h=>h.reset())});
 $$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 $$('[data-st]',S[i]).forEach(e=>e.classList.remove('lit'));counters(S[i],-1);
 cur=i;line=Math.max(0,Math.min(startLine||0,NARR[i].length-1));history.replaceState(null,'','#'+(i+1));
 const g=++sayGen;setTimeout(()=>{if(g===sayGen)say()},350)}
function say(){clearTimeout(timer);const g=++sayGen,L=NARR[cur],tx=$('#ntxt');tx.style.opacity=0;
 setTimeout(()=>{if(g!==sayGen)return;tx.textContent=L[line];tx.style.opacity=1;
  $('#ncount').textContent='slide '+(cur+1)+'/'+S.length+' · step '+(line+1)+'/'+L.length;dots();stage(cur,line);
  dur=Math.max(AUTO.minStepMs||5200,L[line].length*(AUTO.msPerChar||62));t0=performance.now();
  if(voice&&HAS_TTS)speakLine(SPEECH[cur][line]||L[line]);else if(playing)timer=setTimeout(next,dur)},250)}
/* extension: an unanswered question holds the deck on its question step */
function blocked(){const s=DECK.slides[cur];return !!s.question&&line===s.question.step&&!S[cur]._answered}
function nudge(){const s=S[cur];s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge');
 const fb=$('.fb',s);if(fb&&!fb.textContent.trim())fb.innerHTML='<p class="hint">Choose an answer to carry on.</p>'}
function next(){if(blocked()){nudge();return}stopSpeech();if(line<NARR[cur].length-1){line++;say()}else if(cur<S.length-1)go(cur+1);else{playing=false;upd()}}
function prev(){stopSpeech();if(line>0){line--;say()}else if(cur>0)go(cur-1,NARR[cur-1].length-1)}
(function prog(){const p=playing?Math.min(1,(performance.now()-t0)/dur):0;$('#nprog').style.width=(p*100)+'%';requestAnimationFrame(prog)})();
function upd(){$('#bplay').textContent=playing?'❚❚ auto':'▶ auto';$('#bplay').classList.toggle('on',playing)}
function toggleAuto(){playing=!playing;upd();clearTimeout(timer);if(playing){if(voice&&HAS_TTS)say();else timer=setTimeout(next,AUTO.firstStepDelayMs||1200)}}
function toggleVoice(){voice=!voice;const b=$('#bvoice');b.textContent=voice?'Voice on':'Voice off';b.setAttribute('aria-pressed',String(voice));b.classList.toggle('on',voice);
 if(!voice){stopSpeech();if(playing){clearTimeout(timer);timer=setTimeout(next,dur)}}else say()}
$('#bplay').onclick=toggleAuto;$('#bnext').onclick=next;$('#bprev').onclick=prev;$('#bvoice').onclick=toggleVoice;

/* keyboard: → / space next · ← back · PageDown/PageUp slide · Home/End · 1–9, 0 = slide 10 · A auto · V voice */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'){e.preventDefault();prev()}
 else if(k==='PageDown')go(cur+1);else if(k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
 else if(/^[1-9]$/.test(k))go(+k-1);else if(k==='0')go(9);else if(k==='a'||k==='A')toggleAuto();else if(k==='v'||k==='V')toggleVoice()});
/* click anywhere on the slide to advance — but not on links, buttons or while selecting text */
let clickLock=0;
deckEl.addEventListener('click',e=>{if(e.button!==0||e.target.closest('button,a,input,select,textarea,label,.ctl,.tabs'))return;
 const sel=window.getSelection&&String(window.getSelection());if(sel&&sel.trim())return;const now=performance.now();if(now-clickLock<450)return;clickLock=now;next()});
/* links (HTML or SVG) never advance the slide: stop the event in the capture phase; the link still opens */
['click','pointerdown','mousedown','pointerup','mouseup'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('a[href]'))e.stopPropagation()},true));

/* small read-only hook for automated checks */
window.__deck={go,next,prev,toggleAuto,toggleVoice,slides:S.length,narrLen:i=>NARR[i].length,
 state:()=>({cur,line,playing,voice,voiceName:VOICE?VOICE.name:null,text:$('#ntxt').textContent})};

const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=S.length?h0-1:0);
})();
</script>
