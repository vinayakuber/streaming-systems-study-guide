<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Notification Sent Twice</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",

     "    seen_at_far_end = set()",
     "",

     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",

     "                    break",

     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",

     "def tally(items, sent):",

     "        dups, lost = tally(items, run(items, order, {c}))",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return list(ids)                      # the far end swallows the repeat",
     "        if order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return ids[:crash_at + 1] + ids[crash_at:]",
     "        return ids[:crash_at] + ids[crash_at + 1:]",
     "",
     "    def short(ids):",
     "        return str(ids) if len(ids) <= 3 else f\"{len(ids)} items\"",
     "",
     "    print(f\"{'what it exercises':42s} {'items':>6} {'ordering':>20} {'crash':>5} {'key':>5} \"",

     "    for label, items, order, crash_at, key, want in EXAMPLES:",
     "        ids = [eid for eid, _ in items]",
     "        crashes = (set(range(len(items))) if crash_at == ALL",

     "        sent = run(items, order, crashes, far_end_key=key)",

     "",
     "        if crash_at != ALL:",
     "            ref = closed_form(ids, order, crash_at, key)",

     "",
     "        p, ch = price(dups, lost, parcel), price(dups, lost, charged)",
     "        better = 'parcel' if p < ch else 'charge' if ch < p else 'either'",
     "        shown = 'all' if crash_at == ALL else 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:42s} {len(items):>6} {order:>20} {shown:>5} {str(key):>5} \"",
     "              f\"{short(dups):>11} {short(lost):>11} {p:>7} {ch:>7} {better:>10}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the send sequence their ordering forces\")",
     "    print()",
     "",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 4 — the retry that must not re-send (looks like notifications). Standalone and",
     "runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    item       -- one entry in the queue, needing one push notification.  Items are numbered",
     "                  0, 1, 2, ... in queue order, nine of them here.",
     "    send       -- hand the notification to the push service.  It cannot be undone, it cannot",
     "                  be made invisible, and a PERSON reads it.",
     "    position   -- the worker's record of how far it has got, so a restart knows where to",
     "                  resume.  Writing it and sending are two separate steps.",
     "    ordering   -- which of those two steps goes first.  \"Effect first\" sends and then records",
     "                  the position; \"position first\" records and then sends.  There is no third",
     "                  option and no transaction to put them in.",
     "    crash at k -- the worker is killed between its two steps for item k, then restarted from",
     "                  the position it had recorded.  \"No crash\" means it ran to the end.",
     "    duplicate  -- an item whose notification a person received TWICE.",
     "    loss       -- an item whose notification was never sent at all.",
     "    the answer -- always a pair: (which items were duplicated, which items were lost).",
     "    far-end key -- an idempotency key the push service itself honours, so a second send of",
     "                  the same item is swallowed.  The statement says there is none; the table",
     "                  asks what changes if there were.",
     "",
     "  A worker reads nine items off a queue and sends one push notification per item.  A crash",
     "  must not send any of them twice.  The push service offers NO transaction and NO idempotency",
     "  key, and a person reads the notification, so a duplicate is not harmless either.",
     "",
     "  GIVEN A CRASH POINT AND AN ORDERING, WHICH ITEMS ARE DUPLICATED AND WHICH ARE LOST?",
     "",
     "  Worked, as (duplicated, lost) on the nine items above -- which between them define crash",
     "  points 0..8 only:",
     "    effect first, crash at 0  -> ([0], [])   the earliest crash: item 0 was sent, the",
     "                                             position was not written, so the restart sends",
     "                                             it again",
     "    effect first, crash at 3  -> ([3], [])   an ordinary middle crash, same shape",
     "    effect first, crash at 8  -> ([8], [])   the last item there is, same shape again",
     "    effect first, no crash    -> ([], [])    nothing duplicated, nothing lost",
     "    effect first, crash at 99 -> ([], [])    off the end: there is no item 99, so the kill",
     "                                             never fires.  The honest answer is the",
     "                                             uninterrupted run, NOT the worst case -- a",
     "                                             crash that cannot happen does nothing",
     "    position first, crash at 0 -> ([], [0])  the SAME crash, the other ordering: the failure",
     "                                             mirrors exactly, from a duplicate to a loss",
     "    position first, crash at 8 -> ([], [8])  and it mirrors at the last item too",
     "    effect first, crash at 3, far-end key  -> ([], [])    the key rescues this ordering",
     "    position first, crash at 3, far-end key -> ([], [3])  and does NOT rescue the other one:",
     "                                             a notification that was never sent cannot be",
     "                                             de-duplicated by anybody",
     "    an EMPTY queue, crash at 0 -> ([], [])   no items, so nothing to send and nothing to",
     "                                             duplicate -- not an error",
     "  And on a 20,000-item queue killed at item 10,000:",
     "    effect first   -> ([10000], [])   exactly one person told twice",
     "    position first -> ([], [10000])   exactly one person never told",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the program and against a closed form for the send sequence that ordering forces --",
     "  so these answers cannot drift from what the program returns.",
     "",
     "Every tool the chapter had is gone: no transaction, no idempotency at the far end, and an",
     "effect that cannot be made invisible.  So the question is not how to avoid the choice but WHICH",
     "GUARANTEE TO GIVE UP, and the answer depends on the message rather than on the code -- for \"your",
     "parcel has arrived\" a duplicate is mild and a loss is bad, so at-least-once; for \"you have been",
     "charged\" the reverse, so at-most-once with the record written BEFORE sending.  Arriving at",
     "\"there is no correct answer without knowing what the message is\" is the answer, and it is the",
     "opposite of what the first reading of the question invites.  The local dedupe set that looks",
     "like a third option is measured below and shown to be the same two orderings renamed.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 21 input/output pairs -- the first and last",
     "item of the queue as crash points, the middle one the trace follows, both sides of the crash",
     "boundary (a crash versus no crash) in both orderings, a crash point past the end that never",
     "fires, both sides of the dedupe boundary (remember-then-send against send-then-remember), both",
     "sides of the far-end idempotency key including the case where the key does NOT rescue the",
     "design, an empty queue and a one-item queue, a run crashed at every item at once, and a",
     "20,000-item queue at scale; each row prices its own outcome for both messages, so the row",
     "shows which message it is acceptable for.",
     "",
     "Run it:  python3 programs/ch05_v4.py",
     "\"\"\"",
     "",
     "import random",
     "from collections import Counter",
     "",
     "# The chapter's nine items, unchanged.  Values DISTINCT and non-zero for the chapter's reason:",
     "# here the value is the notification's content, so two identical messages would make a",
     "# duplicate unattributable.",
     "ITEMS = [(0, 5), (1, 3), (2, 7), (3, 2), (4, 6), (5, 1), (6, 9), (7, 4), (8, 8)]",
     "N = len(ITEMS)",
     "C = 3                                       # the crash point the printed trace follows",
     "",
     "# What a duplicate and a loss are WORTH, for two real messages.  These are the only numbers in",
     "# this file that are not derived from the data, and that is the point: they come from the",
     "# product, not from the code, and they are what decides the design.",
     "PROFILES = {",
     "    \"your parcel has arrived\": {\"duplicate\": 1, \"loss\": 20},",
     "    \"you have been charged\":   {\"duplicate\": 50, \"loss\": 2},",
     "}",
     "",
     "# A one-item queue, an empty queue, and a 20,000-item queue at the scale a real notification",
     "# backlog reaches.  ALL means \"crashed at every item in one run\".  These are inputs for the",
     "# examples table, not alternative versions of the problem.",
     "ONE_ITEM = [(0, 5)]",
     "EMPTY_QUEUE = []",
     "BIG_QUEUE = [(i, 1 + i % 7) for i in range(20_000)]",
     "BIG_MID = len(BIG_QUEUE) // 2",
     "ALL = \"all\"",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, items, ordering, crash point, far-end key, (duplicated ids, lost ids)).",
     "# Every row is asserted by show_examples() against the program AND against a closed form for",
     "# the send sequence the ordering forces, which is why the table is data and not a comment: a",
     "# comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"effect-first, crash on the FIRST item\",   ITEMS,       \"effect_then_position\", 0,       False, ([0], [])),",
     "    (\"effect-first, the traced middle item\",    ITEMS,       \"effect_then_position\", C,       False, ([3], [])),",
     "    (\"effect-first, crash on the LAST item\",    ITEMS,       \"effect_then_position\", N - 1,   False, ([8], [])),",
     "    (\"effect-first, no crash at all\",           ITEMS,       \"effect_then_position\", None,    False, ([], [])),",
     "    (\"crash point past the end never fires\",    ITEMS,       \"effect_then_position\", 99,      False, ([], [])),",
     "    (\"position-first, FIRST item (mirrored)\",   ITEMS,       \"position_then_effect\", 0,       False, ([], [0])),",
     "    (\"position-first, crash on the LAST item\",  ITEMS,       \"position_then_effect\", N - 1,   False, ([], [8])),",
     "    (\"position-first, no crash at all\",         ITEMS,       \"position_then_effect\", None,    False, ([], [])),",
     "    (\"send-then-remember == effect-first\",      ITEMS,       \"send_then_dedupe\",     C,       False, ([3], [])),",
     "    (\"remember-then-send == position-first\",    ITEMS,       \"dedupe_then_send\",     C,       False, ([], [3])),",
     "    (\"effect-first, crashed at EVERY item\",     ITEMS,       \"effect_then_position\", ALL,     False, ([0, 1, 2, 3, 4, 5, 6, 7, 8], [])),",
     "    (\"position-first, crashed at EVERY item\",   ITEMS,       \"position_then_effect\", ALL,     False, ([], [0, 1, 2, 3, 4, 5, 6, 7, 8])),",
     "    (\"far-end key rescues effect-first\",        ITEMS,       \"effect_then_position\", C,       True,  ([], [])),",
     "    (\"far-end key does NOT rescue position\",    ITEMS,       \"position_then_effect\", C,       True,  ([], [3])),",
     "    (\"far-end key, crashed at EVERY item\",      ITEMS,       \"effect_then_position\", ALL,     True,  ([], [])),",
     "    (\"empty queue: nothing to send\",            EMPTY_QUEUE, \"effect_then_position\", 0,       False, ([], [])),",
     "    (\"one item, effect-first, crash on it\",     ONE_ITEM,    \"effect_then_position\", 0,       False, ([0], [])),",
     "    (\"one item, position-first, crash on it\",   ONE_ITEM,    \"position_then_effect\", 0,       False, ([], [0])),",
     "    (\"20,000 items, effect-first, midway\",      BIG_QUEUE,   \"effect_then_position\", BIG_MID, False, ([10000], [])),",
     "    (\"20,000 items, position-first, midway\",    BIG_QUEUE,   \"position_then_effect\", BIG_MID, False, ([], [10000])),",
     "    (\"20,000 items, far-end key, midway\",       BIG_QUEUE,   \"effect_then_position\", BIG_MID, True,  ([], [])),",
     "]",
     "",
     "",
     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return list(ids)                      # the far end swallows the repeat",
     "        if order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return ids[:crash_at + 1] + ids[crash_at:]",
     "        return ids[:crash_at] + ids[crash_at + 1:]",
     "",
     "    def short(ids):",
     "        return str(ids) if len(ids) <= 3 else f\"{len(ids)} items\"",
     "",
     "    print(f\"{'what it exercises':42s} {'items':>6} {'ordering':>20} {'crash':>5} {'key':>5} \"",
     "          f\"{'duplicated':>11} {'lost':>11} {'parcel':>7} {'charge':>7} {'better for':>10}\")",
     "    for label, items, order, crash_at, key, want in EXAMPLES:",
     "        ids = [eid for eid, _ in items]",
     "        crashes = (set(range(len(items))) if crash_at == ALL",
     "                   else set() if crash_at is None else {crash_at})",
     "        sent = run(items, order, crashes, far_end_key=key)",
     "        dups, lost = tally(items, sent)",
     "        assert (dups, lost) == want, (label, (dups, lost), want)",
     "",
     "        if crash_at != ALL:",
     "            ref = closed_form(ids, order, crash_at, key)",
     "            assert sent == ref, (label, 'the rule disagrees', sent[:12], ref[:12])",
     "",
     "        p, ch = price(dups, lost, parcel), price(dups, lost, charged)",
     "        better = 'parcel' if p < ch else 'charge' if ch < p else 'either'",
     "        shown = 'all' if crash_at == ALL else 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:42s} {len(items):>6} {order:>20} {shown:>5} {str(key):>5} \"",
     "              f\"{short(dups):>11} {short(lost):>11} {p:>7} {ch:>7} {better:>10}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the send sequence their ordering forces\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    clean = {o: run(ITEMS, o, set()) for o in",
     "             (\"effect_then_position\", \"position_then_effect\", \"dedupe_then_send\", \"send_then_dedupe\")}",
     "    want = [eid for eid, _ in ITEMS]",
     "    for o, s in clean.items():",
     "        assert s == want, (o, s)",
     "    print(f\"ITEMS = {[eid for eid, _ in ITEMS]}, values {[v for _, v in ITEMS]}\")",
     "    print(f\"  with no crash, all four orderings send exactly {want}\\n\")",
     "",
     "    at_least = run(ITEMS, \"effect_then_position\", {C})",
     "    at_most = run(ITEMS, \"position_then_effect\", {C})",
     "    print(f\"  crash during item {C}:\")",
     "    print(f\"    effect then position : {at_least}   -> {tally(ITEMS, at_least)}\")",
     "    print(f\"    position then effect : {at_most}   -> {tally(ITEMS, at_most)}\")",
     "    assert tally(ITEMS, at_least) == ([C], []), tally(ITEMS, at_least)",
     "    assert tally(ITEMS, at_most) == ([], [C]), tally(ITEMS, at_most)",
     "    assert at_least.count(C) == 2 and C not in at_most",
     "",
     "    # ---- every crash point, and the two guarantees are exactly complementary",
     "    for c in range(N):",
     "        dl, ll = tally(ITEMS, run(ITEMS, \"effect_then_position\", {c}))",
     "        dm, lm = tally(ITEMS, run(ITEMS, \"position_then_effect\", {c}))",
     "        assert (dl, ll) == ([c], []), (c, dl, ll)",
     "        assert (dm, lm) == ([], [c]), (c, dm, lm)",
     "    print(f\"\\n  at all {N} crash points: effect-first duplicates exactly the straddling item and\")",
     "    print(f\"  loses nothing; position-first loses exactly it and duplicates nothing.  Neither\")",
     "    print(f\"  ever gets both right, and no crash point escapes either way.\")",
     "    # the opposite outcome is forbidden",
     "    assert not any(tally(ITEMS, run(ITEMS, \"effect_then_position\", {c})) == ([], []) for c in range(N))",
     "    assert not any(tally(ITEMS, run(ITEMS, \"position_then_effect\", {c})) == ([], []) for c in range(N))",
     "    # and crashing at EVERY item in one run duplicates or loses every one of them",
     "    all_dup = tally(ITEMS, run(ITEMS, \"effect_then_position\", set(range(N))))",
     "    all_lost = tally(ITEMS, run(ITEMS, \"position_then_effect\", set(range(N))))",
     "    assert all_dup == (want, []), all_dup",
     "    assert all_lost == ([], want), all_lost",
     "    print(f\"  crashed at every item in one run: {len(all_dup[0])} duplicates and 0 losses one way,\")",
     "    print(f\"  0 duplicates and {len(all_lost[1])} losses the other -- {N} of {N} either way.\")",
     "",
     "    # ---- the local dedupe set, which looks like a third option",
     "    same_a = same_b = 0",
     "    for c in range(N):",
     "        a1 = run(ITEMS, \"send_then_dedupe\", {c})",
     "        a2 = run(ITEMS, \"effect_then_position\", {c})",
     "        b1 = run(ITEMS, \"dedupe_then_send\", {c})",
     "        b2 = run(ITEMS, \"position_then_effect\", {c})",
     "        assert a1 == a2, (c, a1, a2)",
     "        assert b1 == b2, (c, b1, b2)",
     "        same_a += a1 == a2",
     "        same_b += b1 == b2",
     "    print(f\"\\n  'just remember what you already sent': the dedupe set is itself a write, so the\")",
     "    print(f\"  same two instants come back one level down.  Measured over all {N} crash points, the\")",
     "    print(f\"  phone receives an IDENTICAL sequence:\")",
     "    print(f\"    send-then-remember == effect-then-position on {same_a}/{N} crash points\")",
     "    print(f\"    remember-then-send == position-then-effect on {same_b}/{N} crash points\")",
     "    assert same_a == same_b == N",
     "    print(f\"  so it is not a third option: it is the same choice with the record moved, which is\")",
     "    print(f\"  what 'the problem is the instant between two writes' means in practice.\")",
     "",
     "    # ---- what WOULD fix it is a property of the far end",
     "    for c in range(N):",
     "        fixed = run(ITEMS, \"effect_then_position\", {c}, far_end_key=True)",
     "        assert tally(ITEMS, fixed) == ([], []), (c, fixed)",
     "        assert fixed == want, (c, fixed)",
     "    assert run(ITEMS, \"effect_then_position\", set(range(N)), far_end_key=True) == want",
     "    print(f\"\\n  give the push service an idempotency key and effect-first becomes exact at all {N}\")",
     "    print(f\"  crash points, and at every item at once.  The missing feature is the problem; no\")",
     "    print(f\"  arrangement of the worker's two writes substitutes for it.\")",
     "    # with the key, effect-first becomes exact -- but the ORDER still matters: the key cannot",
     "    # recover an item position-first skipped",
     "    assert run(ITEMS, \"effect_then_position\", {C}, far_end_key=True) == want",
     "    assert tally(ITEMS, run(ITEMS, \"position_then_effect\", {C}, far_end_key=True)) == ([], [C])",
     "    print(f\"  note it only rescues the at-least-once side: a key cannot un-skip an item that was\")",
     "    print(f\"  recorded as handled and never sent, so position-first still loses item {C}.\")",
     "",
     "    # ---- so the choice is the message's, and the answer flips",
     "    print(f\"\\n  expected cost of one crash, averaged over all {N} crash points:\")",
     "    print(f\"    {'message':>24}  {'dup':>4} {'loss':>5}  {'at-least-once':>14}  {'at-most-once':>13}  best\")",
     "    best = {}",
     "    for msg, profile in PROFILES.items():",
     "        cheap = expected_cost(ITEMS, \"effect_then_position\", profile)",
     "        safe = expected_cost(ITEMS, \"position_then_effect\", profile)",
     "        best[msg] = \"at-least-once\" if cheap < safe else \"at-most-once\"",
     "        print(f\"    {msg:>24}  {profile['duplicate']:>4} {profile['loss']:>5}  {cheap:>14.1f}  \"",
     "              f\"{safe:>13.1f}  {best[msg]}\")",
     "    assert best[\"your parcel has arrived\"] == \"at-least-once\", best",
     "    assert best[\"you have been charged\"] == \"at-most-once\", best",
     "    assert len(set(best.values())) == 2, (",
     "        \"the two messages must choose DIFFERENTLY, or the whole answer collapses\")",
     "    print(f\"  the same nine items, the same two programs, and the better design is opposite for\")",
     "    print(f\"  the two messages.  Nothing in the code decides it, which is why the answer to this\")",
     "    print(f\"  question is a question.\")",
     "    # and the flip happens at the obvious place, measured rather than assumed",
     "    flip = [d for d in range(1, 60)",
     "            if expected_cost(ITEMS, \"effect_then_position\", {\"duplicate\": d, \"loss\": 20})",
     "            > expected_cost(ITEMS, \"position_then_effect\", {\"duplicate\": d, \"loss\": 20})]",
     "    assert flip and min(flip) == 21, min(flip) if flip else None",
     "    tie = min(flip) - 1",
     "    assert (expected_cost(ITEMS, \"effect_then_position\", {\"duplicate\": tie, \"loss\": 20})",
     "            == expected_cost(ITEMS, \"position_then_effect\", {\"duplicate\": tie, \"loss\": 20})), tie",
     "    print(f\"  holding the cost of a loss at 20, the two designs tie when a duplicate costs {tie}\")",
     "    print(f\"  and at-least-once starts losing at {min(flip)} -- the crossover is exactly where the\")",
     "    print(f\"  two costs cross, because each design fails on exactly one item per crash.\")",
     "",
     "    # ---- boundaries",
     "    assert run([], \"effect_then_position\", {0}) == []",
     "    one = [(0, 5)]",
     "    assert run(one, \"effect_then_position\", {0}) == [0, 0], run(one, \"effect_then_position\", {0})",
     "    assert run(one, \"position_then_effect\", {0}) == []",
     "    assert tally(one, run(one, \"effect_then_position\", {0})) == ([0], [])",
     "    print(f\"\\n  boundaries: an empty queue sends nothing under either design; a one-item queue\")",
     "    print(f\"  crashed on its only item sends it twice one way and never the other -- there is no\")",
     "    print(f\"  stream short enough for the problem to disappear.\")",
     "",
     "    # ---- many queues, every crash point, all four orderings",
     "    rng = random.Random(20260303)",
     "    for _ in range(300):",
     "        n = rng.randint(1, 10)",
     "        items = [(i, rng.randint(1, 40)) for i in range(n)]",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 4 — the retry that must not re-send (looks like notifications). Standalone and",

     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    item       -- one entry in the queue, needing one push notification.  Items are numbered",

     "    send       -- hand the notification to the push service.  It cannot be undone, it cannot",

     "    ordering   -- which of those two steps goes first.  \"Effect first\" sends and then records",
     "                  the position; \"position first\" records and then sends.  There is no third",
     "                  option and no transaction to put them in.",
     "    crash at k -- the worker is killed between its two steps for item k, then restarted from",
     "                  the position it had recorded.  \"No crash\" means it ran to the end.",
     "    duplicate  -- an item whose notification a person received TWICE.",
     "    loss       -- an item whose notification was never sent at all.",
     "    the answer -- always a pair: (which items were duplicated, which items were lost).",
     "    far-end key -- an idempotency key the push service itself honours, so a second send of",
     "                  the same item is swallowed.  The statement says there is none; the table",
     "                  asks what changes if there were.",
     "",
     "  A worker reads nine items off a queue and sends one push notification per item.  A crash",
     "  must not send any of them twice.  The push service offers NO transaction and NO idempotency",
     "  key, and a person reads the notification, so a duplicate is not harmless either.",
     "",
     "  GIVEN A CRASH POINT AND AN ORDERING, WHICH ITEMS ARE DUPLICATED AND WHICH ARE LOST?",
     "",
     "  Worked, as (duplicated, lost) on the nine items above -- which between them define crash",
     "  points 0..8 only:",
     "    effect first, crash at 0  -> ([0], [])   the earliest crash: item 0 was sent, the",
     "                                             position was not written, so the restart sends",
     "                                             it again",
     "    effect first, crash at 3  -> ([3], [])   an ordinary middle crash, same shape",
     "    effect first, crash at 8  -> ([8], [])   the last item there is, same shape again",
     "    effect first, no crash    -> ([], [])    nothing duplicated, nothing lost",
     "    effect first, crash at 99 -> ([], [])    off the end: there is no item 99, so the kill",
     "                                             never fires.  The honest answer is the",
     "                                             uninterrupted run, NOT the worst case -- a",
     "                                             crash that cannot happen does nothing",
     "    position first, crash at 0 -> ([], [0])  the SAME crash, the other ordering: the failure",
     "                                             mirrors exactly, from a duplicate to a loss",
     "    position first, crash at 8 -> ([], [8])  and it mirrors at the last item too",
     "    effect first, crash at 3, far-end key  -> ([], [])    the key rescues this ordering",
     "    position first, crash at 3, far-end key -> ([], [3])  and does NOT rescue the other one:",
     "                                             a notification that was never sent cannot be",
     "                                             de-duplicated by anybody",
     "    an EMPTY queue, crash at 0 -> ([], [])   no items, so nothing to send and nothing to",
     "                                             duplicate -- not an error",
     "  And on a 20,000-item queue killed at item 10,000:",
     "    effect first   -> ([10000], [])   exactly one person told twice",
     "    position first -> ([], [10000])   exactly one person never told",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the program and against a closed form for the send sequence that ordering forces --",
     "  so these answers cannot drift from what the program returns.",
     "",
     "Every tool the chapter had is gone: no transaction, no idempotency at the far end, and an",
     "effect that cannot be made invisible.  So the question is not how to avoid the choice but WHICH",
     "GUARANTEE TO GIVE UP, and the answer depends on the message rather than on the code -- for \"your",
     "parcel has arrived\" a duplicate is mild and a loss is bad, so at-least-once; for \"you have been",
     "charged\" the reverse, so at-most-once with the record written BEFORE sending.  Arriving at",
     "\"there is no correct answer without knowing what the message is\" is the answer, and it is the",

     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 21 input/output pairs -- the first and last",
     "item of the queue as crash points, the middle one the trace follows, both sides of the crash",

     "import random",

     "ITEMS = [(0, 5), (1, 3), (2, 7), (3, 2), (4, 6), (5, 1), (6, 9), (7, 4), (8, 8)]",

     "# ------------------------------------------------------------------- WORKED EXAMPLES",

     "    (\"position-first, no crash at all\",         ITEMS,       \"position_then_effect\", None,    False, ([], [])),",
     "    (\"send-then-remember == effect-first\",      ITEMS,       \"send_then_dedupe\",     C,       False, ([3], [])),",
     "    (\"remember-then-send == position-first\",    ITEMS,       \"dedupe_then_send\",     C,       False, ([], [3])),",
     "    (\"effect-first, crashed at EVERY item\",     ITEMS,       \"effect_then_position\", ALL,     False, ([0, 1, 2, 3, 4, 5, 6, 7, 8], [])),",
     "    (\"position-first, crashed at EVERY item\",   ITEMS,       \"position_then_effect\", ALL,     False, ([], [0, 1, 2, 3, 4, 5, 6, 7, 8])),",
     "    (\"far-end key rescues effect-first\",        ITEMS,       \"effect_then_position\", C,       True,  ([], [])),",
     "    (\"far-end key does NOT rescue position\",    ITEMS,       \"position_then_effect\", C,       True,  ([], [3])),",
     "    (\"far-end key, crashed at EVERY item\",      ITEMS,       \"effect_then_position\", ALL,     True,  ([], [])),",
     "    (\"empty queue: nothing to send\",            EMPTY_QUEUE, \"effect_then_position\", 0,       False, ([], [])),",
     "    (\"one item, effect-first, crash on it\",     ONE_ITEM,    \"effect_then_position\", 0,       False, ([0], [])),",
     "    (\"one item, position-first, crash on it\",   ONE_ITEM,    \"position_then_effect\", 0,       False, ([], [0])),",
     "    (\"20,000 items, effect-first, midway\",      BIG_QUEUE,   \"effect_then_position\", BIG_MID, False, ([10000], [])),",

     "",
     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",
     "",
     "",
     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
     "    return dups, lost",
     "",
     "",
     "def expected_cost(items, order, profile):",
     "    \"\"\"The average cost of one crash, over every crash point, for one ordering and one message.",
     "",
     "    Averaging over crash points is the honest model: a crash lands where it lands, and the",
     "    design has to be chosen before knowing where.\"\"\"",
     "    total = 0.0",
     "    for c in range(len(items)):",
     "        dups, lost = tally(items, run(items, order, {c}))",
     "        total += len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "    return total / len(items)",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is a closed form for the send sequence: effect-first repeats the",
     "    straddling item, so the phone sees ids[:c+1] + ids[c:], and position-first skips it, so it",
     "    sees ids[:c] + ids[c+1:].  It is written out here with no reference to `run`, so a row has",
     "    to agree with the program and with the rule the program claims to implement.  A run",
     "    crashed at EVERY item has no closed form -- the send order after repeated restarts is an",
     "    implementation detail -- so those rows are checked on the tally alone.",
     "",
     "    The two cost columns price the SAME outcome for BOTH messages, which is the whole point of",
     "    the variation: a duplicate is cheap for a parcel notice and expensive for a charge notice,",
     "    so the identical row is acceptable under one message and not the other.  Rows that cost",
     "    nothing either way -- a clean run, or an effect-first crash under a far-end key -- are the",
     "    ties, and they are the only rows where the choice does not have to be made.",
     "    \"\"\"",
     "    parcel, charged = PROFILES[\"your parcel has arrived\"], PROFILES[\"you have been charged\"]",
     "",
     "    def price(dups, lost, profile):",
     "        return len(dups) * profile[\"duplicate\"] + len(lost) * profile[\"loss\"]",
     "",
     "    def closed_form(ids, order, crash_at, key):",
     "        \"\"\"What the phone must see, derived from the ordering rather than from `run`.\"\"\"",
     "        if crash_at is None or crash_at >= len(ids):",
     "            return list(ids)",
     "        if key and order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return list(ids)                      # the far end swallows the repeat",
     "        if order in (\"effect_then_position\", \"send_then_dedupe\"):",
     "            return ids[:crash_at + 1] + ids[crash_at:]",
     "        return ids[:crash_at] + ids[crash_at + 1:]",
     "",
     "    def short(ids):",
     "        return str(ids) if len(ids) <= 3 else f\"{len(ids)} items\"",
     "",
     "    print(f\"{'what it exercises':42s} {'items':>6} {'ordering':>20} {'crash':>5} {'key':>5} \"",
     "          f\"{'duplicated':>11} {'lost':>11} {'parcel':>7} {'charge':>7} {'better for':>10}\")",
     "    for label, items, order, crash_at, key, want in EXAMPLES:",
     "        ids = [eid for eid, _ in items]",
     "        crashes = (set(range(len(items))) if crash_at == ALL",
     "                   else set() if crash_at is None else {crash_at})",
     "        sent = run(items, order, crashes, far_end_key=key)",
     "        dups, lost = tally(items, sent)",
     "        assert (dups, lost) == want, (label, (dups, lost), want)",
     "",
     "        if crash_at != ALL:",
     "            ref = closed_form(ids, order, crash_at, key)",
     "            assert sent == ref, (label, 'the rule disagrees', sent[:12], ref[:12])",
     "",
     "        p, ch = price(dups, lost, parcel), price(dups, lost, charged)",
     "        better = 'parcel' if p < ch else 'charge' if ch < p else 'either'",
     "        shown = 'all' if crash_at == ALL else 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:42s} {len(items):>6} {order:>20} {shown:>5} {str(key):>5} \"",
     "              f\"{short(dups):>11} {short(lost):>11} {p:>7} {ch:>7} {better:>10}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the send sequence their ordering forces\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    clean = {o: run(ITEMS, o, set()) for o in",
     "             (\"effect_then_position\", \"position_then_effect\", \"dedupe_then_send\", \"send_then_dedupe\")}",
     "    want = [eid for eid, _ in ITEMS]",

     "        assert s == want, (o, s)",
     "    print(f\"ITEMS = {[eid for eid, _ in ITEMS]}, values {[v for _, v in ITEMS]}\")",
     "    print(f\"  with no crash, all four orderings send exactly {want}\\n\")",
     "",
     "    at_least = run(ITEMS, \"effect_then_position\", {C})",
     "    at_most = run(ITEMS, \"position_then_effect\", {C})",
     "    print(f\"  crash during item {C}:\")",

     "def run(items, order, crash_at, far_end_key=False):",
     "    \"\"\"Run the worker, crash it at the listed items, restart it, and return what the PHONE",
     "    received -- a list of item ids in send order, which is what a person sees.",
     "",
     "    order:",
     "      \"effect_then_position\" -- push, then record the position.  A crash in between has sent",
     "          the notification with no record of it, so the restart sends it again: at-least-once.",
     "      \"position_then_effect\" -- record the position, then push.  A crash in between has",
     "          recorded the item as handled without sending it, and nothing will ever notice:",
     "          at-most-once.",
     "      \"dedupe_then_send\"     -- remember the id in a durable set first, then push.",
     "      \"send_then_dedupe\"     -- push, then remember the id.",
     "    The last two are the local-dedupe idea, which looks like a third option.",
     "",
     "    `far_end_key` models the feature the question says is absent: the push service itself",
     "    dropping a repeat of a key it has already seen.  It is here to show that what fixes this is",
     "    a property of the far end and not a cleverer worker.",
     "    \"\"\"",
     "    pos, sent, marks, fired = 0, [], set(), set()",
     "    seen_at_far_end = set()",
     "",
     "    def push(eid, value):",
     "        if far_end_key and eid in seen_at_far_end:",
     "            return                            # the far end swallows the repeat",
     "        seen_at_far_end.add(eid)",
     "        sent.append(eid)",
     "",
     "    while pos < len(items):",
     "        crashed = False",
     "        for i in range(pos, len(items)):",
     "            eid, v = items[i]",
     "            die = i in crash_at and i not in fired",
     "            if order == \"effect_then_position\":",
     "                push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                pos = i + 1",
     "            elif order == \"position_then_effect\":",
     "                pos = i + 1",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "            elif order == \"send_then_dedupe\":",
     "                if eid not in marks:",
     "                    push(eid, v)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                marks.add(eid)",
     "                pos = i + 1",
     "            else:                             # dedupe_then_send",
     "                if eid in marks:",
     "                    pos = i + 1",
     "                    continue",
     "                marks.add(eid)",
     "                if die:",
     "                    fired.add(i)",
     "                    crashed = True",
     "                    break",
     "                push(eid, v)",
     "                pos = i + 1",
     "        if not crashed:",
     "            break",
     "    return sent",

     "def tally(items, sent):",
     "    \"\"\"(duplicates, losses) as lists of item ids.  A duplicate is an id a person saw more than",
     "    once; a loss is one they never saw.  Counted rather than inferred from a total, because a",
     "    total cannot tell a duplicate of 5 from a loss of 5 plus a duplicate of 10.\"\"\"",
     "    counts = Counter(sent)",
     "    dups = [eid for eid, _ in items if counts[eid] > 1]",
     "    lost = [eid for eid, _ in items if counts[eid] == 0]",
