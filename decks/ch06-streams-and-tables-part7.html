<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Counter Log</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",
     "    t = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = t.get(k, 0) + d",
     "    return t",
     "",
     "",
     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",
     "def compact_sum(log):",
     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",
     "    return [(k, total[k]) for k in sorted(total)]",
     "",
     "",
     "def to_states(log):",
     "    \"\"\"fold, then emit: the two chapter functions composed, which converts a delta log into",
     "    a state log.  After this the chapter's compaction is legal again, and so is replay.\"\"\"",
     "    return emit(fold_add(log))",
     "",
     "",
     "def _tot(t):",
     "    \"\"\"Totals narrow enough for a column.  Fifty counters print as a count and one value.\"\"\"",
     "    if not t:",
     "        return \"{}\"",
     "    if len(t) <= 2:",
     "        return \" \".join(f\"{k}={v}\" for k, v in sorted(t.items()))",
     "    k, v = min(t.items())",
     "    return f\"{len(t)} counters, {k}={v}\"",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked three ways: the fold with +, the fold of the summed compaction, and",
     "    an independent per-counter reference that slices the log instead of making one pass.",
     "    Both compactions' sizes are printed, because the size is NOT what separates them -- they",
     "    usually tie, and the last two rows show the same 20,000 entries reduced to the same 50",
     "    either way, right in one case and wrong in the other.  The last row is the uncomfortable",
     "    one: increments that cancel make the wrong compaction exactly right.",
     "    \"\"\"",
     "    def reference(log):",
     "        \"\"\"Per counter, the increments AFTER the last delete, summed.  A different mechanism",
     "        from fold_add -- it slices per key where fold_add makes a single pass.\"\"\"",
     "        out = {}",
     "        for key in {k for k, _ in log}:",
     "            ds = [d for k, d in log if k == key]",
     "            after = ds[max((i for i, d in enumerate(ds) if d is TOMBSTONE), default=-1) + 1:]",
     "            if after:",
     "                out[key] = sum(after)",
     "        return out",
     "",
     "    print(f\"{'what it exercises':34s} {'in':>7} {'sum':>5} {'last':>5} \"",

     "    for label, log, want, naive_ok in EXAMPLES:",
     "        totals = fold_add(log)",

     "        summed, naive = compact_sum(log), compact_last(log)",

     "          f\"safe compactions\")",
     "    print()",

     "",

     "    show_examples()",
     "    print(\"DELTAS =\", \"  \".join(f\"{k}{d:+d}\" for k, d in DELTAS), f\"   ({N} entries)\")",

     "    cancels = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",

     "                 assigning.  Order does not matter to a sum, which is why the same log",
     "                 reversed gives the same totals.",

     "                 it removes the counter entirely rather than setting it to 0.",

     "                                       different entries and gets a different wrong answer",

     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",
     "    t = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = t.get(k, 0) + d",
     "    return t",
     "",
     "",
     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",
     "def compact_sum(log):",
     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",
     "    return [(k, total[k]) for k in sorted(total)]",
     "",
     "",
     "def to_states(log):",
     "    \"\"\"fold, then emit: the two chapter functions composed, which converts a delta log into",
     "    a state log.  After this the chapter's compaction is legal again, and so is replay.\"\"\"",
     "    return emit(fold_add(log))",
     "",
     "",
     "def _tot(t):",
     "    \"\"\"Totals narrow enough for a column.  Fifty counters print as a count and one value.\"\"\"",
     "    if not t:",
     "        return \"{}\"",
     "    if len(t) <= 2:",
     "        return \" \".join(f\"{k}={v}\" for k, v in sorted(t.items()))",
     "    k, v = min(t.items())",
     "    return f\"{len(t)} counters, {k}={v}\"",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked three ways: the fold with +, the fold of the summed compaction, and",
     "    an independent per-counter reference that slices the log instead of making one pass.",
     "    Both compactions' sizes are printed, because the size is NOT what separates them -- they",
     "    usually tie, and the last two rows show the same 20,000 entries reduced to the same 50",
     "    either way, right in one case and wrong in the other.  The last row is the uncomfortable",
     "    one: increments that cancel make the wrong compaction exactly right.",
     "    \"\"\"",
     "    def reference(log):",
     "        \"\"\"Per counter, the increments AFTER the last delete, summed.  A different mechanism",
     "        from fold_add -- it slices per key where fold_add makes a single pass.\"\"\"",

     "last entry, and cannot be replayed twice -- it can only be compacted by summing per key, and",
     "that result is safe to apply once, to an empty state.  Both failures are the same fact: an",
     "assignment is idempotent and an addition is not.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 12 input/output pairs -- an empty log and a",
     "single increment, one entry per counter (nothing to compact), the chapter's log and the same",
     "log reversed, both sides of the condition that decides whether keeping the last increment is",
     "harmless (increments that cancel before the last one, and increments that do not), a counter",
     "that cancels to zero, a delete, a log that is ONLY a delete, and two at the 20,000-increment",
     "scale -- one of which the wrong compaction gets exactly right.  Every row is ASSERTED three",
     "ways, so the table cannot drift from the code: change the answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch06_v4.py",
     "\"\"\"",
     "import random",
     "",
     "# The delta log, from the chapter's changelog read as increments: the chapter's entries for",
     "# 'a' were 5, 8, 10, 16, 24, so the increments are +5, +3, +2, +6, +8, and for 'b' 7, 8, 17,",
     "# 21 give +7, +1, +9, +4.  Kept in the chapter's own order, so the totals come out at the",
     "# chapter's 24 and 21 -- the same arithmetic, stated the other way round.",
     "DELTAS = [(\"errors\", 5), (\"errors\", 3), (\"hits\", 7), (\"errors\", 2), (\"errors\", 6),",
     "          (\"hits\", 1), (\"hits\", 9), (\"hits\", 4), (\"errors\", 8)]",
     "TRUE = {\"errors\": 24, \"hits\": 21}",
     "N = len(DELTAS)",
     "TOMBSTONE = None          # the entry that means \"this counter is gone\"",
     "",
     "# An empty log, a single increment, one entry per counter, a log whose earlier increments",
     "# cancel, increments that cancel to zero, a delete, a log that is only a delete, the",
     "# chapter's log reversed, and two at the scale that gets compaction scheduled.  These are",
     "# inputs for the examples table, not alternative versions of the problem.",
     "EMPTY_LOG = []",
     "ONE_DELTA = [(\"errors\", 5)]",
     "ONE_PER_KEY = [(\"errors\", 5), (\"hits\", 7)]",
     "NEGATIVE = [(\"errors\", 5), (\"errors\", -2)]",
     "LUCKY = [(\"drops\", 0), (\"drops\", 5)]       # earlier increments sum to 0: the naive one works",
     "CANCELLING = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",
     "WITH_DELETE = DELTAS + [(\"hits\", TOMBSTONE)]",
     "ONLY_A_DELETE = [(\"hits\", TOMBSTONE)]",
     "REVERSED = DELTAS[::-1]",
     "BIG_KEY_COUNT, BIG_ENTRY_COUNT = 50, 20_000",
     "BIG_DELTAS = [(f\"m{i % BIG_KEY_COUNT}\", 1 + (i % 3)) for i in range(BIG_ENTRY_COUNT)]",
     "# the same shape with increments that cycle -3..3, which per counter sum to zero over any",
     "# 7 entries -- so the LAST increment happens to equal the total and the wrong compaction",
     "# comes out exact.  An accidental cancellation is the one case where it looks right.",
     "BIG_CANCELS = [(f\"m{i % BIG_KEY_COUNT}\", (i % 7) - 3) for i in range(BIG_ENTRY_COUNT)]",
     "BIG_TRUE = {f\"m{j}\": 799 + (j % 3) for j in range(BIG_KEY_COUNT)}",
     "BIG_CANCELS_TRUE = {f\"m{j}\": (j % 7) - 3 for j in range(BIG_KEY_COUNT)}",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, delta log, expected totals, does compact_last agree?).  Every row is",
     "# asserted by show_examples(), which is why the table is data and not a comment: a comment",
     "# can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"an empty log: no counters at all\", EMPTY_LOG,     {},                             True),",
     "    (\"a single increment\",               ONE_DELTA,     {\"errors\": 5},                  True),",
     "    (\"one entry per counter\",            ONE_PER_KEY,   {\"errors\": 5, \"hits\": 7},       True),",
     "    (\"the chapter's log\",                DELTAS,        {\"errors\": 24, \"hits\": 21},     False),",
     "    (\"the chapter's log, reversed\",      REVERSED,      {\"errors\": 24, \"hits\": 21},     False),",
     "    (\"two increments, one negative\",     NEGATIVE,      {\"errors\": 3},                  False),",
     "    (\"earlier increments cancel: LUCKY\", LUCKY,         {\"drops\": 5},                   True),",
     "    (\"a counter that cancels to zero\",   CANCELLING,    {\"retries\": 0, \"errors\": 1},    False),",
     "    (\"a delete at the end of the log\",   WITH_DELETE,   {\"errors\": 24},                 False),",
     "    (\"a log that is only a delete\",      ONLY_A_DELETE, {},                             True),",
     "    (\"20,000 increments, 50 counters\",   BIG_DELTAS,    BIG_TRUE,                       False),",
     "    (\"20,000 that cancel: naive EXACT\",  BIG_CANCELS,   BIG_CANCELS_TRUE,               True),",
     "]",
     "",
     "",
     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",
     "    t = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = t.get(k, 0) + d",
     "    return t",
     "",
     "",
     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",
     "def compact_sum(log):",
     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",
     "    return [(k, total[k]) for k in sorted(total)]",
     "",
     "",
     "def to_states(log):",
     "    \"\"\"fold, then emit: the two chapter functions composed, which converts a delta log into",
     "    a state log.  After this the chapter's compaction is legal again, and so is replay.\"\"\"",
     "    return emit(fold_add(log))",
     "",
     "",
     "def _tot(t):",
     "    \"\"\"Totals narrow enough for a column.  Fifty counters print as a count and one value.\"\"\"",
     "    if not t:",
     "        return \"{}\"",
     "    if len(t) <= 2:",
     "        return \" \".join(f\"{k}={v}\" for k, v in sorted(t.items()))",
     "    k, v = min(t.items())",
     "    return f\"{len(t)} counters, {k}={v}\"",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked three ways: the fold with +, the fold of the summed compaction, and",
     "    an independent per-counter reference that slices the log instead of making one pass.",
     "    Both compactions' sizes are printed, because the size is NOT what separates them -- they",
     "    usually tie, and the last two rows show the same 20,000 entries reduced to the same 50",
     "    either way, right in one case and wrong in the other.  The last row is the uncomfortable",
     "    one: increments that cancel make the wrong compaction exactly right.",
     "    \"\"\"",
     "    def reference(log):",
     "        \"\"\"Per counter, the increments AFTER the last delete, summed.  A different mechanism",
     "        from fold_add -- it slices per key where fold_add makes a single pass.\"\"\"",
     "        out = {}",
     "        for key in {k for k, _ in log}:",
     "            ds = [d for k, d in log if k == key]",
     "            after = ds[max((i for i, d in enumerate(ds) if d is TOMBSTONE), default=-1) + 1:]",
     "            if after:",
     "                out[key] = sum(after)",
     "        return out",
     "",
     "    print(f\"{'what it exercises':34s} {'in':>7} {'sum':>5} {'last':>5} \"",
     "          f\"{'the totals':>22} {'off by':>7}  verdict\")",
     "    for label, log, want, naive_ok in EXAMPLES:",
     "        totals = fold_add(log)",
     "        assert totals == want, (label, totals, want)",
     "        assert reference(log) == want, (label, \"the reference disagrees\", reference(log))",
     "        summed, naive = compact_sum(log), compact_last(log)",
     "        assert fold_add(summed) == want, (label, \"summing the increments must preserve the fold\")",
     "        assert fold_assign(to_states(log)) == want, (label, \"converting to states must too\")",
     "        from_naive = fold_add(naive)",
     "        assert (from_naive == want) == naive_ok, (label, from_naive, want)",
     "        off = max((abs(want[k] - from_naive.get(k, 0)) for k in want), default=0)",
     "        size = (\"tie\" if len(summed) == len(naive) else",
     "                \"sum smaller\" if len(summed) < len(naive) else \"last smaller\")",
     "        verdict = f\"{size}, \" + (\"naive agrees\" if naive_ok else f\"naive WRONG by {off}\")",
     "        print(f\"{label:34s} {len(log):>7} {len(summed):>5} {len(naive):>5} \"",
     "              f\"{_tot(totals):>22} {off:>7}  {verdict}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with a per-counter reference sum and with both \"",
     "          f\"safe compactions\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"DELTAS =\", \"  \".join(f\"{k}{d:+d}\" for k, d in DELTAS), f\"   ({N} entries)\")",
     "    totals = fold_add(DELTAS)",
     "    naive = compact_last(DELTAS)",
     "    summed = compact_sum(DELTAS)",
     "    states = to_states(DELTAS)",
     "    print(f\"  fold with +            -> {totals}\")",
     "    print(f\"  compact_last(deltas)   -> {naive}  folds to {fold_add(naive)}   WRONG\")",
     "    print(f\"  compact_sum(deltas)    -> {summed}  folds to {fold_add(summed)}   right\")",
     "    print(f\"  to_states = fold+emit  -> {states}  folds to {fold_assign(states)}   right\")",
     "",
     "    assert totals == TRUE, totals",
     "    assert fold_add(naive) == {\"errors\": 8, \"hits\": 4} != TRUE, fold_add(naive)",
     "    assert fold_add(summed) == TRUE, \"summing the increments must preserve the fold\"",
     "    assert fold_assign(states) == TRUE, \"and so must converting to states first\"",
     "    lost = {k: TRUE[k] - fold_add(naive)[k] for k in TRUE}",
     "    assert lost == {\"errors\": 16, \"hits\": 17}, lost",
     "    assert all(v > 0 for v in lost.values()), \"keeping the last delta can only ever understate\"",
     "    print(f\"\\n  keeping the last increment understates by {lost} -- the dropped entries were\")",
     "    print(f\"  not superseded, they were summands, so the error is the size of the history.\")",
     "",
     "    # the entries of compact_sum and to_states are IDENTICAL bytes and different meanings",
     "    assert summed == states == [(\"errors\", 24), (\"hits\", 21)], (summed, states)",
     "    print(f\"\\n  compact_sum and to_states produce the same entries, {summed},\")",
     "    print(f\"  and they are not the same log: one is 'add 24' and the other is 'it is 24'.\")",
     "    twice_delta = fold_add(summed + summed)",
     "    twice_state = fold_assign(states + states)",
     "    print(f\"  replayed twice: as deltas {twice_delta}, as states {twice_state}\")",
     "    assert twice_delta == {\"errors\": 48, \"hits\": 42} != TRUE, twice_delta",
     "    assert twice_state == TRUE, \"a state log must survive replay, that is the point of one\"",
     "    assert twice_delta != twice_state",
     "    print(f\"  so a consumer that re-reads the log double-counts the delta log and is unharmed\")",
     "    print(f\"  by the state log.  Compaction and replay-safety are the same property.\")",
     "",
     "    # the asymmetry in the other direction: order",
     "    rng = random.Random(20260303)",
     "    shuffled = DELTAS[:]",
     "    rng.shuffle(shuffled)",
     "    shuffled_states = states[:]",
     "    rng.shuffle(shuffled_states)",
     "    assert fold_add(shuffled) == TRUE, \"addition commutes, so a delta log may be reordered\"",
     "    reordered_state_log = [(\"errors\", 5), (\"errors\", 24), (\"errors\", 8)]",
     "    assert fold_assign(reordered_state_log) == {\"errors\": 8} != TRUE",
     "    print(f\"\\n  a delta log may be shuffled freely (still {fold_add(shuffled)}); a state log may\")",
     "    print(f\"  not -- reordering {reordered_state_log} gives\")",
     "    print(f\"  {fold_assign(reordered_state_log)}.  Each format is robust to exactly what the\")",
     "    print(f\"  other is not: deltas to order, states to duplication.\")",
     "",
     "    # boundary: a counter whose increments cancel.  Zero is a VALUE, absence is not.",
     "    cancels = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",
     "    zero_sum = compact_sum(cancels)",
     "    pruned = [(k, v) for k, v in zero_sum if v != 0]        # \"drop the no-ops\"",
     "    assert fold_add(cancels) == {\"retries\": 0, \"errors\": 1}",
     "    assert zero_sum == [(\"errors\", 1), (\"retries\", 0)], zero_sum",
     "    assert fold_add(pruned) == {\"errors\": 1} != fold_add(cancels), fold_add(pruned)",
     "    print(f\"\\n  increments that cancel: {cancels}\")",
     "    print(f\"  compact_sum keeps {zero_sum}; dropping the zero as a no-op gives\")",
     "    print(f\"  {fold_add(pruned)} and loses the fact that the counter EXISTS -- 'retries = 0'\")",
     "    print(f\"  and 'no retries counter' are different dashboards.\")",
     "",
     "    # a tombstone is still the one entry no compaction may drop, in either format",
     "    with_tomb = DELTAS + [(\"hits\", TOMBSTONE)]",

     "    assert fold_add(compact_sum(with_tomb)) == fold_add(with_tomb), \"the tombstone was dropped\"",
     "    last_live = {}",
     "    for k, d in with_tomb:",

     "    print(f\"\\n  with a delete for 'hits': {fold_add(with_tomb)}; a compactor that sums only the\")",
     "    print(f\"  non-tombstone entries -- i.e. reads the delete as an absence -- brings it back as\")",
     "    print(f\"  {fold_add(resurrecting)}.  The delete is a fact, not a gap in the data.\")",
     "",
     "    # many inputs, and the precise condition under which the naive compaction is harmless",
     "    def naive_is_harmless(log):",
     "        \"\"\"CORRECTED CLAIM.  The first guess was \"it agrees exactly when every counter has",

     "        [('drops', 0), ('drops', 5)] has two entries and compacts correctly.  The real",

     "        for k, d in log:",

     "        return all(sum(ds[:-1]) == 0 for ds in per.values())",
     "",
     "    ok, broken, checked, once = 0, 0, 0, 0",
     "    for _ in range(1500):",
     "        n = rng.randint(1, 16)",
     "        log = [(rng.choice((\"errors\", \"hits\", \"retries\", \"drops\")),",
     "                rng.randint(-9, 9)) for _ in range(n)]",
     "        want = fold_add(log)",

     "        shuf = log[:]",
     "        rng.shuffle(shuf)",
     "        assert fold_add(shuf) == want, log                      # order-free, always",
     "    print(f\"\\n  {checked} random delta logs: summing the increments and converting to states both\")",
     "    print(f\"  always reproduce the totals.  Keeping the last increment agreed in {ok} cases and\")",
     "    print(f\"  broke in {broken}, and it agreed in EXACTLY the logs where every counter's earlier\")",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 4 -- the counter changelog (looks like metrics). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    counter   -- a named number: \"errors\", \"hits\".  It starts at nothing, not at 0 -- a",
     "                 counter no entry has ever mentioned is ABSENT, which is not the same as a",
     "                 counter whose value is 0.",
     "    entry     -- one line of the log, written \"errors +5\".  It says what CHANGED, not what",
     "                 the counter became, so every entry contributes and none supersedes another.",
     "    fold      -- apply the entries in order to get the current counters.  For a delta log",
     "                 that means ADDING them up; for the chapter's log of states it meant",
     "                 assigning.  Order does not matter to a sum, which is why the same log",
     "                 reversed gives the same totals.",
     "    tombstone -- an entry whose value is None.  It means \"this counter is gone\", so folding",
     "                 it removes the counter entirely rather than setting it to 0.",
     "    compaction -- dropping entries you believe you no longer need.  On a log of STATES,",
     "                 keeping the last entry per key is safe.  That is the thing to test here.",
     "",
     "  A service ships nine entries: errors +5, errors +3, hits +7, errors +2, errors +6, hits",
     "  +1, hits +9, hits +4, errors +8.  Fold them and you have errors=24 and hits=21.  Then the",
     "  log gets too long to keep, and somebody compacts it the way the chapter's log was",
     "  compacted -- keeping the last entry per counter, which here is errors +8 and hits +4.",
     "",
     "  GIVEN A DELTA LOG, WHAT ARE THE CURRENT COUNTERS?",
     "",
     "  Worked, on logs of the entries above:",
     "    errors +5                       -> errors=5         one entry, the smallest real log",
     "    the nine entries above          -> errors=24, hits=21    5+3+2+6+8 and 7+1+9+4",
     "    the same nine REVERSED          -> errors=24, hits=21    addition does not care about",
     "                                       order, so the fold is unchanged.  Compaction is what",
     "                                       cares: keeping the last entry per counter now keeps",
     "                                       different entries and gets a different wrong answer",
     "    errors +5, errors -2            -> errors=3         deltas may be negative",
     "    drops +0, drops +5              -> drops=5          and here keeping only the LAST entry",
     "                                       happens to be exactly right, because everything",
     "                                       before it summed to zero.  Luck, not correctness",
     "    retries +5, retries -5, errors +1 -> retries=0, errors=1    a counter at 0 that EXISTS",
     "    the nine, then hits DELETED     -> errors=24        and \"hits\" is absent, not 0",
     "    a log that is ONLY a delete     -> no counters at all",
     "    an EMPTY log                    -> no counters at all",
     "    ask the result for \"disk\"       -> NOT PRESENT.  No entry ever mentioned it, so there is",
     "                                       nothing to report.  The answer is \"absent\", NOT 0 --",
     "                                       0 is a measurement and this is the absence of one",
     "  And on a 20,000-entry log over 50 counters:",
     "    increments of 1, 2, 3 cycling   -> 50 counters, m0=799",
     "    increments cycling -3..+3       -> 50 counters, m0=-3, and here the wrong compaction is",
     "                                       EXACT: each counter's earlier increments cancel, so",
     "                                       its last one equals its total",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted three",
     "  ways -- against a per-counter reference sum and against both safe compactions -- so these",
     "  answers cannot drift from what the program returns.",
     "",
     "The fold needs addition where the chapter's needed assignment, which still works and is",
     "barely a change.  The chapter's compaction BREAKS: you cannot keep \"the last +5\" and drop",
     "the earlier ones, because every entry contributes.  The repair is to turn the log into absolute values",
     "first -- fold, then emit -- which is the chapter's two functions composed, and it shows that",
     "the log's FORMAT was the first thing stated for a reason.  A log of states can be compacted",
     "by keeping the last entry and replayed; a log of deltas cannot be compacted by keeping the",
     "last entry, and cannot be replayed twice -- it can only be compacted by summing per key, and",
     "that result is safe to apply once, to an empty state.  Both failures are the same fact: an",
     "assignment is idempotent and an addition is not.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 12 input/output pairs -- an empty log and a",
     "single increment, one entry per counter (nothing to compact), the chapter's log and the same",
     "log reversed, both sides of the condition that decides whether keeping the last increment is",
     "harmless (increments that cancel before the last one, and increments that do not), a counter",
     "that cancels to zero, a delete, a log that is ONLY a delete, and two at the 20,000-increment",
     "scale -- one of which the wrong compaction gets exactly right.  Every row is ASSERTED three",
     "ways, so the table cannot drift from the code: change the answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch06_v4.py",
     "\"\"\"",
     "import random",
     "",
     "# The delta log, from the chapter's changelog read as increments: the chapter's entries for",
     "# 'a' were 5, 8, 10, 16, 24, so the increments are +5, +3, +2, +6, +8, and for 'b' 7, 8, 17,",
     "# 21 give +7, +1, +9, +4.  Kept in the chapter's own order, so the totals come out at the",
     "# chapter's 24 and 21 -- the same arithmetic, stated the other way round.",
     "DELTAS = [(\"errors\", 5), (\"errors\", 3), (\"hits\", 7), (\"errors\", 2), (\"errors\", 6),",
     "          (\"hits\", 1), (\"hits\", 9), (\"hits\", 4), (\"errors\", 8)]",
     "TRUE = {\"errors\": 24, \"hits\": 21}",
     "N = len(DELTAS)",
     "TOMBSTONE = None          # the entry that means \"this counter is gone\"",
     "",
     "# An empty log, a single increment, one entry per counter, a log whose earlier increments",
     "# cancel, increments that cancel to zero, a delete, a log that is only a delete, the",
     "# chapter's log reversed, and two at the scale that gets compaction scheduled.  These are",
     "# inputs for the examples table, not alternative versions of the problem.",
     "EMPTY_LOG = []",
     "ONE_DELTA = [(\"errors\", 5)]",
     "ONE_PER_KEY = [(\"errors\", 5), (\"hits\", 7)]",
     "NEGATIVE = [(\"errors\", 5), (\"errors\", -2)]",
     "LUCKY = [(\"drops\", 0), (\"drops\", 5)]       # earlier increments sum to 0: the naive one works",
     "CANCELLING = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",
     "WITH_DELETE = DELTAS + [(\"hits\", TOMBSTONE)]",
     "ONLY_A_DELETE = [(\"hits\", TOMBSTONE)]",
     "REVERSED = DELTAS[::-1]",
     "BIG_KEY_COUNT, BIG_ENTRY_COUNT = 50, 20_000",
     "BIG_DELTAS = [(f\"m{i % BIG_KEY_COUNT}\", 1 + (i % 3)) for i in range(BIG_ENTRY_COUNT)]",
     "# the same shape with increments that cycle -3..3, which per counter sum to zero over any",
     "# 7 entries -- so the LAST increment happens to equal the total and the wrong compaction",
     "# comes out exact.  An accidental cancellation is the one case where it looks right.",
     "BIG_CANCELS = [(f\"m{i % BIG_KEY_COUNT}\", (i % 7) - 3) for i in range(BIG_ENTRY_COUNT)]",
     "BIG_TRUE = {f\"m{j}\": 799 + (j % 3) for j in range(BIG_KEY_COUNT)}",
     "BIG_CANCELS_TRUE = {f\"m{j}\": (j % 7) - 3 for j in range(BIG_KEY_COUNT)}",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, delta log, expected totals, does compact_last agree?).  Every row is",
     "# asserted by show_examples(), which is why the table is data and not a comment: a comment",
     "# can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"an empty log: no counters at all\", EMPTY_LOG,     {},                             True),",
     "    (\"a single increment\",               ONE_DELTA,     {\"errors\": 5},                  True),",
     "    (\"one entry per counter\",            ONE_PER_KEY,   {\"errors\": 5, \"hits\": 7},       True),",
     "    (\"the chapter's log\",                DELTAS,        {\"errors\": 24, \"hits\": 21},     False),",
     "    (\"the chapter's log, reversed\",      REVERSED,      {\"errors\": 24, \"hits\": 21},     False),",
     "    (\"two increments, one negative\",     NEGATIVE,      {\"errors\": 3},                  False),",
     "    (\"earlier increments cancel: LUCKY\", LUCKY,         {\"drops\": 5},                   True),",
     "    (\"a counter that cancels to zero\",   CANCELLING,    {\"retries\": 0, \"errors\": 1},    False),",
     "    (\"a delete at the end of the log\",   WITH_DELETE,   {\"errors\": 24},                 False),",
     "    (\"a log that is only a delete\",      ONLY_A_DELETE, {},                             True),",
     "    (\"20,000 increments, 50 counters\",   BIG_DELTAS,    BIG_TRUE,                       False),",
     "    (\"20,000 that cancel: naive EXACT\",  BIG_CANCELS,   BIG_CANCELS_TRUE,               True),",
     "]",
     "",
     "",
     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",
     "    t = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = t.get(k, 0) + d",
     "    return t",
     "",
     "",
     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",
     "def compact_sum(log):",
     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",
     "    return [(k, total[k]) for k in sorted(total)]",
     "",
     "",
     "def to_states(log):",
     "    \"\"\"fold, then emit: the two chapter functions composed, which converts a delta log into",
     "    a state log.  After this the chapter's compaction is legal again, and so is replay.\"\"\"",
     "    return emit(fold_add(log))",
     "",
     "",
     "def _tot(t):",
     "    \"\"\"Totals narrow enough for a column.  Fifty counters print as a count and one value.\"\"\"",
     "    if not t:",
     "        return \"{}\"",
     "    if len(t) <= 2:",
     "        return \" \".join(f\"{k}={v}\" for k, v in sorted(t.items()))",
     "    k, v = min(t.items())",
     "    return f\"{len(t)} counters, {k}={v}\"",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row.",
     "",
     "    Each row is checked three ways: the fold with +, the fold of the summed compaction, and",
     "    an independent per-counter reference that slices the log instead of making one pass.",
     "    Both compactions' sizes are printed, because the size is NOT what separates them -- they",
     "    usually tie, and the last two rows show the same 20,000 entries reduced to the same 50",
     "    either way, right in one case and wrong in the other.  The last row is the uncomfortable",
     "    one: increments that cancel make the wrong compaction exactly right.",
     "    \"\"\"",
     "    def reference(log):",
     "        \"\"\"Per counter, the increments AFTER the last delete, summed.  A different mechanism",
     "        from fold_add -- it slices per key where fold_add makes a single pass.\"\"\"",
     "        out = {}",
     "        for key in {k for k, _ in log}:",
     "            ds = [d for k, d in log if k == key]",
     "            after = ds[max((i for i, d in enumerate(ds) if d is TOMBSTONE), default=-1) + 1:]",
     "            if after:",
     "                out[key] = sum(after)",
     "        return out",
     "",
     "    print(f\"{'what it exercises':34s} {'in':>7} {'sum':>5} {'last':>5} \"",
     "          f\"{'the totals':>22} {'off by':>7}  verdict\")",
     "    for label, log, want, naive_ok in EXAMPLES:",
     "        totals = fold_add(log)",
     "        assert totals == want, (label, totals, want)",
     "        assert reference(log) == want, (label, \"the reference disagrees\", reference(log))",
     "        summed, naive = compact_sum(log), compact_last(log)",
     "        assert fold_add(summed) == want, (label, \"summing the increments must preserve the fold\")",
     "        assert fold_assign(to_states(log)) == want, (label, \"converting to states must too\")",
     "        from_naive = fold_add(naive)",
     "        assert (from_naive == want) == naive_ok, (label, from_naive, want)",
     "        off = max((abs(want[k] - from_naive.get(k, 0)) for k in want), default=0)",
     "        size = (\"tie\" if len(summed) == len(naive) else",
     "                \"sum smaller\" if len(summed) < len(naive) else \"last smaller\")",
     "        verdict = f\"{size}, \" + (\"naive agrees\" if naive_ok else f\"naive WRONG by {off}\")",
     "        print(f\"{label:34s} {len(log):>7} {len(summed):>5} {len(naive):>5} \"",
     "              f\"{_tot(totals):>22} {off:>7}  {verdict}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with a per-counter reference sum and with both \"",
     "          f\"safe compactions\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    print(\"DELTAS =\", \"  \".join(f\"{k}{d:+d}\" for k, d in DELTAS), f\"   ({N} entries)\")",
     "    totals = fold_add(DELTAS)",
     "    naive = compact_last(DELTAS)",
     "    summed = compact_sum(DELTAS)",
     "    states = to_states(DELTAS)",
     "    print(f\"  fold with +            -> {totals}\")",
     "    print(f\"  compact_last(deltas)   -> {naive}  folds to {fold_add(naive)}   WRONG\")",
     "    print(f\"  compact_sum(deltas)    -> {summed}  folds to {fold_add(summed)}   right\")",
     "    print(f\"  to_states = fold+emit  -> {states}  folds to {fold_assign(states)}   right\")",
     "",
     "    assert totals == TRUE, totals",
     "    assert fold_add(naive) == {\"errors\": 8, \"hits\": 4} != TRUE, fold_add(naive)",
     "    assert fold_add(summed) == TRUE, \"summing the increments must preserve the fold\"",
     "    assert fold_assign(states) == TRUE, \"and so must converting to states first\"",
     "    lost = {k: TRUE[k] - fold_add(naive)[k] for k in TRUE}",
     "    assert lost == {\"errors\": 16, \"hits\": 17}, lost",
     "    assert all(v > 0 for v in lost.values()), \"keeping the last delta can only ever understate\"",
     "    print(f\"\\n  keeping the last increment understates by {lost} -- the dropped entries were\")",
     "    print(f\"  not superseded, they were summands, so the error is the size of the history.\")",
     "",
     "    # the entries of compact_sum and to_states are IDENTICAL bytes and different meanings",
     "    assert summed == states == [(\"errors\", 24), (\"hits\", 21)], (summed, states)",
     "    print(f\"\\n  compact_sum and to_states produce the same entries, {summed},\")",
     "    print(f\"  and they are not the same log: one is 'add 24' and the other is 'it is 24'.\")",
     "    twice_delta = fold_add(summed + summed)",
     "    twice_state = fold_assign(states + states)",
     "    print(f\"  replayed twice: as deltas {twice_delta}, as states {twice_state}\")",
     "    assert twice_delta == {\"errors\": 48, \"hits\": 42} != TRUE, twice_delta",
     "    assert twice_state == TRUE, \"a state log must survive replay, that is the point of one\"",
     "    assert twice_delta != twice_state",
     "    print(f\"  so a consumer that re-reads the log double-counts the delta log and is unharmed\")",
     "    print(f\"  by the state log.  Compaction and replay-safety are the same property.\")",
     "",
     "    # the asymmetry in the other direction: order",
     "    rng = random.Random(20260303)",
     "    shuffled = DELTAS[:]",
     "    rng.shuffle(shuffled)",
     "    shuffled_states = states[:]",
     "    rng.shuffle(shuffled_states)",
     "    assert fold_add(shuffled) == TRUE, \"addition commutes, so a delta log may be reordered\"",
     "    reordered_state_log = [(\"errors\", 5), (\"errors\", 24), (\"errors\", 8)]",
     "    assert fold_assign(reordered_state_log) == {\"errors\": 8} != TRUE",
     "    print(f\"\\n  a delta log may be shuffled freely (still {fold_add(shuffled)}); a state log may\")",
     "    print(f\"  not -- reordering {reordered_state_log} gives\")",
     "    print(f\"  {fold_assign(reordered_state_log)}.  Each format is robust to exactly what the\")",
     "    print(f\"  other is not: deltas to order, states to duplication.\")",
     "",
     "    # boundary: a counter whose increments cancel.  Zero is a VALUE, absence is not.",
     "    cancels = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",
     "    zero_sum = compact_sum(cancels)",
     "    pruned = [(k, v) for k, v in zero_sum if v != 0]        # \"drop the no-ops\"",
     "    assert fold_add(cancels) == {\"retries\": 0, \"errors\": 1}",
     "    assert zero_sum == [(\"errors\", 1), (\"retries\", 0)], zero_sum",
     "    assert fold_add(pruned) == {\"errors\": 1} != fold_add(cancels), fold_add(pruned)",
     "    print(f\"\\n  increments that cancel: {cancels}\")",
     "    print(f\"  compact_sum keeps {zero_sum}; dropping the zero as a no-op gives\")",
     "    print(f\"  {fold_add(pruned)} and loses the fact that the counter EXISTS -- 'retries = 0'\")",
     "    print(f\"  and 'no retries counter' are different dashboards.\")",
     "",
     "    # a tombstone is still the one entry no compaction may drop, in either format",
     "    with_tomb = DELTAS + [(\"hits\", TOMBSTONE)]",
     "    assert fold_add(with_tomb) == {\"errors\": 24}, fold_add(with_tomb)",
     "    assert fold_add(compact_sum(with_tomb)) == fold_add(with_tomb), \"the tombstone was dropped\"",
     "    last_live = {}",
     "    for k, d in with_tomb:",
     "        if d is not TOMBSTONE:",
     "            last_live[k] = last_live.get(k, 0) + d",
     "    resurrecting = [(k, last_live[k]) for k in sorted(last_live)]",
     "    assert fold_add(resurrecting) == TRUE != fold_add(with_tomb), fold_add(resurrecting)",
     "    print(f\"\\n  with a delete for 'hits': {fold_add(with_tomb)}; a compactor that sums only the\")",
     "    print(f\"  non-tombstone entries -- i.e. reads the delete as an absence -- brings it back as\")",
     "    print(f\"  {fold_add(resurrecting)}.  The delete is a fact, not a gap in the data.\")",
     "",
     "    # many inputs, and the precise condition under which the naive compaction is harmless",
     "    def naive_is_harmless(log):",
     "        \"\"\"CORRECTED CLAIM.  The first guess was \"it agrees exactly when every counter has",
     "        one entry, i.e. when there was nothing to compact\", and a random case refused it:",
     "        [('drops', 0), ('drops', 5)] has two entries and compacts correctly.  The real",
     "        condition is that for every counter the increments BEFORE the last one sum to zero",
     "        -- having only one entry is the common way for that to happen, not the only one.",
     "        \"\"\"",
     "        per = {}",
     "        for k, d in log:",
     "            per.setdefault(k, []).append(d)",
     "        return all(sum(ds[:-1]) == 0 for ds in per.values())",
     "",
     "    ok, broken, checked, once = 0, 0, 0, 0",
     "    for _ in range(1500):",
     "        n = rng.randint(1, 16)",
     "        log = [(rng.choice((\"errors\", \"hits\", \"retries\", \"drops\")),",
     "                rng.randint(-9, 9)) for _ in range(n)]",
     "        want = fold_add(log)",
     "        assert fold_add(compact_sum(log)) == want, log          # always safe",
     "        assert fold_assign(to_states(log)) == want, log         # always safe",
     "        assert fold_assign(compact_last(to_states(log))) == want, log",
     "        once_only = len({k for k, _ in log}) == len(log)",
     "        agrees = fold_add(compact_last(log)) == want",
     "        assert agrees == naive_is_harmless(log), (log, agrees)   # the exact condition",
     "        if once_only:",
     "            assert agrees, log                                   # one entry per key: trivial",
     "        checked += 1",
     "        ok += agrees",
     "        once += once_only",
     "        broken += not agrees",
     "        shuf = log[:]",
     "        rng.shuffle(shuf)",
     "        assert fold_add(shuf) == want, log                      # order-free, always",
     "    print(f\"\\n  {checked} random delta logs: summing the increments and converting to states both\")",
     "    print(f\"  always reproduce the totals.  Keeping the last increment agreed in {ok} cases and\")",
     "    print(f\"  broke in {broken}, and it agreed in EXACTLY the logs where every counter's earlier\")",
     "    print(f\"  increments sum to zero -- {once} of those had one entry per counter (nothing to\")",
     "    print(f\"  compact) and the other {ok - once} cancelled out by luck, which is the worse case:\")",
     "    print(f\"  a test built from short logs can pass for both reasons.\")",
     "    assert (ok, broken, once) == (238, 1262, 223), (ok, broken, once)",
     "    assert broken > ok, \"the naive compaction must be wrong on most real logs\"",
     "    assert once < ok, \"and some agreements are luck, not triviality\"",
     "",
     "    # the scale that makes compaction worth doing at all",
     "    BIG_KEYS, BIG_ENTRIES = 50, 20_000",
     "    # increments are positive here, as a counter's are: the first attempt used increments",
     "    # cycling through -3..3, and at 400 entries per counter the first 399 cancelled exactly, so",
     "    # the last increment equalled the total and compact_last came out EXACT at scale and the comparison said nothing.  An accidental",
     "    # cancellation is the one case where the wrong compaction looks right, and it is easier",
     "    # to build by accident than it sounds.",
     "    big = [(f\"m{i % BIG_KEYS}\", 1 + (i % 3)) for i in range(BIG_ENTRIES)]",
     "    big_sum = compact_sum(big)",
     "    big_naive = compact_last(big)",
     "    big_true = fold_add(big)",
     "    worst = max(abs(big_true[k] - fold_add(big_naive).get(k, 0)) for k in big_true)",
     "    print(f\"\\n  at {BIG_ENTRIES:,} increments over {BIG_KEYS} counters:\")",
     "    print(f\"    compact_sum  -> {len(big_sum)} entries, totals exact \"",
     "          f\"({len(big) // len(big_sum)}x smaller)\")",
     "    print(f\"    compact_last -> {len(big_naive)} entries, worst counter off by {worst}\")",
     "    print(f\"    both logs are the same SIZE, so the saving was never the thing in question --\")",
     "    print(f\"    the question was what the entries mean.\")",
     "    assert len(big_sum) == len(big_naive) == BIG_KEYS",
     "    assert fold_add(big_sum) == big_true, \"exact at scale\"",
     "    assert worst > 0 and fold_add(big_naive) != big_true",
     "    print(\"\\nall assertions passed\")",
     "",

     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",
     "    t = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = t.get(k, 0) + d",
     "    return t",
     "",
     "",
     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",
     "def compact_sum(log):",
     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",
     "    return [(k, total[k]) for k in sorted(total)]",
     "",
     "",
     "def to_states(log):",
     "    \"\"\"fold, then emit: the two chapter functions composed, which converts a delta log into",
     "    a state log.  After this the chapter's compaction is legal again, and so is replay.\"\"\"",
     "    return emit(fold_add(log))",
     "",

     "def _tot(t):",
     "    \"\"\"Totals narrow enough for a column.  Fifty counters print as a count and one value.\"\"\"",
     "    if not t:",
     "        return \"{}\"",
     "    if len(t) <= 2:",
     "        return \" \".join(f\"{k}={v}\" for k, v in sorted(t.items()))",
     "    k, v = min(t.items())",
     "    return f\"{len(t)} counters, {k}={v}\"",

     "",
     "    # the asymmetry in the other direction: order",
     "    rng = random.Random(20260303)",
     "    shuffled = DELTAS[:]",
     "    rng.shuffle(shuffled)",

     "    rng.shuffle(shuffled_states)",

     "    reordered_state_log = [(\"errors\", 5), (\"errors\", 24), (\"errors\", 8)]",

     "    print(f\"\\n  a delta log may be shuffled freely (still {fold_add(shuffled)}); a state log may\")",

     "",
     "    # boundary: a counter whose increments cancel.  Zero is a VALUE, absence is not.",
     "    cancels = [(\"retries\", 5), (\"retries\", -5), (\"errors\", 1)]",

     "",
     "    # many inputs, and the precise condition under which the naive compaction is harmless",
     "    def naive_is_harmless(log):",
     "        \"\"\"CORRECTED CLAIM.  The first guess was \"it agrees exactly when every counter has",
     "        one entry, i.e. when there was nothing to compact\", and a random case refused it:",
     "        [('drops', 0), ('drops', 5)] has two entries and compacts correctly.  The real",

     "        \"\"\"",

     "            per.setdefault(k, []).append(d)",

     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",

     "def fold_assign(log):",
     "    \"\"\"The chapter's fold, for a log of STATES: later entries overwrite earlier ones.  Order",
     "    is the whole content of the answer, and applying an entry twice changes nothing.\"\"\"",
     "    t = {}",
     "    for k, v in log:",
     "        if v is TOMBSTONE:",
     "            t.pop(k, None)",
     "        else:",
     "            t[k] = v",
     "    return t",
     "",
     "",
     "def emit(table):",
     "    \"\"\"The table back out as one entry per key.  For a state log this is a legal log; it is",
     "    how a delta log becomes a compactable one.\"\"\"",
     "    return [(k, table[k]) for k in sorted(table)]",
     "",
     "",
     "def compact_last(log):",
     "    \"\"\"Keep the last entry per key -- the chapter's compaction, applied to deltas.",
     "",
     "    For a state log every dropped entry was superseded.  For a delta log nothing is ever",
     "    superseded, so this keeps the last increment and throws away the counter.  It is not a",
     "    smaller log of the same thing, it is a log of something else.",
     "    \"\"\"",
     "    last = {}",
     "    for k, d in log:",
     "        last[k] = d",
     "    return [(k, last[k]) for k in sorted(last)]",
     "",
     "",

     "    \"\"\"The compaction a delta log actually admits: ADD the increments per key instead of",
     "    keeping the last one.",
     "",
     "    One entry per key, same as the chapter's, and the fold is unchanged -- so delta logs are",
     "    compactable after all.  What is not preserved is the thing the chapter's compaction kept",
     "    for free: the result may only ever be applied to an empty state, because re-applying it",
     "    adds the whole history again.  The entries look identical to `emit`'s and mean something",
     "    different, which is the trap.",
     "    \"\"\"",
     "    total = {}",
     "    for k, d in log:",
     "        if d is TOMBSTONE:",
     "            total.pop(k, None)",
     "        else:",
     "            total[k] = total.get(k, 0) + d",

     "def fold_add(log):",
     "    \"\"\"The fold for a DELTA log: + where the chapter had =.  Every entry contributes, so",
     "    nothing in the log is redundant and a missing entry is a silently wrong total.  Addition",
     "    commutes, so unlike the chapter's fold this one does not care about order.\"\"\"",

     "    for k, v in log:",

     "        else:",
     "            t[k] = v",
     "    return t",

     "",
