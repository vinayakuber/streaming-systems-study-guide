     "    (\"warehouse-first, FIRST event (sign flip)\", ITEMS,        \"warehouse_first\", 0,     (0, 5)),",
     "    (\"warehouse-first, crash on the LAST event\", ITEMS,        \"warehouse_first\", 8,     (37, 45)),",
     "    (\"derived@3, crash before anything ran\",     ITEMS,        \"derived@3\",       0,     (0, 0)),",
     "    (\"derived@3, middle event, lag 1\",           ITEMS,        \"derived@3\",       4,     (15, 17)),",
     "    (\"derived@3, LAST event, lag 2 (the bound)\", ITEMS,        \"derived@3\",       8,     (24, 37)),",
     "    (\"derived@3, no crash -> caught up\",         ITEMS,        \"derived@3\",       None,  (45, 45)),",
     "    (\"derived@1, rebuild every event, lag 0\",    ITEMS,        \"derived@1\",       8,     (37, 37)),",
     "    (\"derived@20, interval > whole stream\",      ITEMS,        \"derived@20\",      None,  (0, 45)),",
     "    (\"a ZERO-valued event: the pair AGREES\",     WITH_ZERO,    \"counter_first\",   4,     (17, 17)),",
     "    (\"one-event stream, crash on it\",            ONE_EVENT,    \"counter_first\",   0,     (5, 0)),",
     "    (\"empty stream: nothing to split\",           EMPTY_STREAM, \"counter_first\",   0,     (0, 0)),",
     "    (\"3,000 events, counter-first, midway\",      BIG_ITEMS,    \"counter_first\",   1500,  (10507, 10500)),",
     "    (\"3,000 events, derived@500, lag 200\",       BIG_ITEMS,    \"derived@500\",     1700,  (10500, 11900)),",
     "    (\"3,000 events, derived@500, no crash\",      BIG_ITEMS,    \"derived@500\",     None,  (21000, 21000)),",
     "]",
     "",
     "",
     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",
     "    out, run = [0], 0",
     "    for _, v in items:",
     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",
     "    with no reference to dual_write or derived -- so a row has to agree with the program and",
     "    with the rule the program claims to implement.",
     "",
     "    The two cost columns are for the SAME input on BOTH designs, so each row shows which one",
     "    is cheaper for it.  `dual` counts durable writes (two per event, one for the event the",
     "    crash straddles).  `derv` counts the one write per event PLUS the rows each rebuild has to",
     "    re-read, because rebuild() sums the whole warehouse every time.  That is why the derived",
     "    design LOSES on every row that runs to the end with a rebuild, on the every-event rebuild",
     "    and on the long-stream rows: its correctness is free and its freshness is not, and a short",
     "    rebuild interval on a long stream is the expensive corner.  Where it wins, few or no",
     "    rebuilds had been paid for yet -- an early crash, or an interval longer than the stream.",
     "    The tally of the `cheaper` column is printed under the table rather than asserted here.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':40s} {'events':>6} {'design':>15} {'crash':>5} \"",
     "          f\"{'counter':>8} {'wh':>8} {'lag':>4} {'dual':>6} {'derv':>7} {'cheaper':>8}\")",
     "    tally = {'derived': 0, 'dual': 0, 'tie': 0}",
     "    for label, items, design, crash_at, want in EXAMPLES:",
     "        vals = [v for _, v in items]",
     "        n = len(items)",
     "        m = n if crash_at is None else min(crash_at, n)      # events that completed a row",
     "        every = int(design.split(\"@\")[1]) if \"@\" in design else REBUILD_EVERY",
     "",
     "        if design.startswith(\"derived\"):",
     "            counter, rows, lag = derived(items, crash_at, every)",
     "            wh = rebuild(rows)",
     "            caught = (m // every) * every",
     "            ref = (sum(vals[:caught]), sum(vals[:m]))",
     "            assert lag == m - caught, (label, lag, m - caught)",
     "        else:",
     "            first = design == \"counter_first\"",
     "            counter, wh, rows = dual_write(items, crash_at, counter_first=first)",
     "            lag = 0",
     "            if m < n:                                        # the crash really landed",
     "                ahead, behind = sum(vals[:m + 1]), sum(vals[:m])",
     "                ref = (ahead, behind) if first else (behind, ahead)",
     "            else:",
     "                ref = (sum(vals), sum(vals))",
     "",
     "        assert (counter, wh) == want, (label, (counter, wh), want)",
     "        assert ref == want, (label, 'the rule disagrees', ref, want)",
     "        assert wh == sum(v for _, v in rows), (label, wh, rows)",
     "",
     "        dual = 2 * m + (1 if m < n else 0)",
     "        r = m // every",
     "        derv = m + every * r * (r + 1) // 2",
     "        cheaper = 'derived' if derv < dual else 'dual' if dual < derv else 'tie'",
     "        tally[cheaper] += 1",
     "        crash = 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:40s} {n:>6} {design:>15} {crash:>5} \"",
     "              f\"{counter:>8} {wh:>8} {lag:>4} {dual:>6} {derv:>7} {cheaper:>8}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the prefix sums of their own stream\")",
     "    assert sum(tally.values()) == len(EXAMPLES), tally",
     "    print(f\"cheaper: derived on {tally['derived']} rows, dual on {tally['dual']}, \"",
     "          f\"tie on {tally['tie']}\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    legal = prefixes(ITEMS)",
     "    print(\"ITEMS =\", \"  \".join(f\"{e}:{v}\" for e, v in ITEMS), f\"  total {CORRECT}\")",
     "    print(f\"the {len(legal)} totals the stream legitimately passes through: {legal}\\n\")",
     "",
     "    # ---- the dual write, at every crash point and in both orders",
     "    print(f\"  {'crash':>5}  {'counter-first':>22}  {'warehouse-first':>22}\")",
     "    split_c, split_w = [], []",
     "    for c in range(N):",
     "        cc, wc, _ = dual_write(ITEMS, c, counter_first=True)",
     "        cw, ww, _ = dual_write(ITEMS, c, counter_first=False)",
     "        split_c.append((cc, wc))",
     "        split_w.append((cw, ww))",
     "        print(f\"  {c:>5}  counter {cc:>3}  wh {wc:>3} ({cc - wc:+d})  \"",
     "              f\"counter {cw:>3}  wh {ww:>3} ({cw - ww:+d})\")",
     "    assert all(a - b == ITEMS[c][1] for c, (a, b) in enumerate(split_c)), split_c",
     "    assert all(b - a == ITEMS[c][1] for c, (a, b) in enumerate(split_w)), split_w",
     "    print(f\"\\n  the gap is always exactly the straddling event's value, and its SIGN is the write\")",
     "    print(f\"  order: counter-first leaves the dashboard high, warehouse-first leaves it low.\")",
     "    # and no crash point escapes, in either order",
     "    assert not any(a == b for a, b in split_c) and not any(a == b for a, b in split_w)",
     "    assert max(a - b for a, b in split_c) == 9 == max(v for _, v in ITEMS)",
     "",
     "    # ---- the precise difference between inconsistency and staleness",
     "    impossible = [(c, p) for c, p in enumerate(split_c) if p[0] != p[1]]",
     "    not_a_moment = [(c, p) for c, p in enumerate(split_c)",
     "                    if not any(p[0] == t and p[1] == t for t in legal)]",
     "    print(f\"\\n  of the {N} dual-write crash states, {len(not_a_moment)} correspond to NO moment in the\")",
     "    print(f\"  stream: the pair (counter, warehouse) is not (T, T) for any legal total T.\")",
     "    assert len(not_a_moment) == N and len(impossible) == N",
     "    # the derived design: every crash state is a PAST moment, which is the whole claim",
     "    lags = []",
     "    for c in range(N + 1):",
     "        cnt, rows, lag = derived(ITEMS, c if c < N else None)",
     "        wh = rebuild(rows)",
     "        assert cnt in legal and wh in legal, (c, cnt, wh)",
     "        assert cnt <= wh, (c, cnt, wh)",
     "        assert legal.index(cnt) == legal.index(wh) - lag, (c, cnt, wh, lag)",
     "        lags.append(lag)",
     "    print(f\"  of the {N} derived crash states and the uninterrupted run, ALL are a legal total\")",
     "    print(f\"  paired with an earlier legal total -- the counter is behind by {min(lags)} to {max(lags)}\")",
     "    print(f\"  events and never wrong.\")",
     "    assert max(lags) == REBUILD_EVERY - 1, (lags, REBUILD_EVERY)",
     "    assert min(lags) == 0, lags",
     "    print(f\"  the lag is bounded by the rebuild interval ({REBUILD_EVERY}), so it is a number you choose,\")",
     "    print(f\"  not a number you discover after an incident.\")",
     "    # the bound is the parameter, measured across several intervals",
     "    for every in (1, 2, 3, 5, 9, 20):",
     "        worst = max(derived(ITEMS, c, every)[2] for c in range(N + 1))",
     "        assert worst == min(every - 1, N), (every, worst)",
     "    print(f\"  rebuild every 1,2,3,5,9,20 events -> worst lag 0,1,2,4,8,{min(20 - 1, N)} events: exactly the\")",
     "    print(f\"  interval minus one, until the interval exceeds the stream.\")",
     "",
     "    # ---- the retry, which is the fix everybody reaches for",
     "    r_counter, r_wh, r_rows = retry_until_written(ITEMS, crash_at=4, attempts=2)",
     "    print(f\"\\n  retrying the writes for event 4 twice: counter {r_counter}, warehouse {r_wh}\")",
     "    assert r_wh == CORRECT, r_wh",
     "    assert r_counter == CORRECT + ITEMS[4][1], (r_counter, CORRECT)",
     "    print(f\"  the warehouse is still {r_wh} because its row is keyed by event id, so writing it\")",
     "    print(f\"  twice is writing it once.  The counter is {r_counter}, high by {r_counter - CORRECT} -- an increment\")",
     "    print(f\"  has no key, so a retry is a second event.  THAT asymmetry is what decides which\")",
     "    print(f\"  store can be the source of truth: the one whose write can be repeated safely.\")",
     "    for c in range(N):",

     "        assert retry_until_written(ITEMS, c, attempts=3)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[0] == CORRECT + 2 * ITEMS[c][1], c",
     "    print(f\"  at every crash point and for 2 or 3 attempts: the warehouse is always {CORRECT}, and the\")",
     "    print(f\"  counter is high by one or two copies of the retried event.\")",
     "",
     "    # ---- reconciliation, and which direction it has to run",
     "    for c in range(N):",
     "        cc, wc, rows = dual_write(ITEMS, c, counter_first=True)",
     "        g_cnt, g_total, g_rows = reconcile(cc, rows, \"from_warehouse\")",
     "        b_cnt, b_total, b_rows = reconcile(cc, rows, \"from_counter\")",
     "        assert g_cnt == g_total == rebuild(g_rows) and g_total in legal, (c, g_total)",
     "        assert b_cnt == b_total, \"writing the counter into the warehouse does make them agree\"",
     "        # CORRECTED.  The expectation was that this lands on a total the stream never had.  It",
     "        # does not: counter-first leaves the counter holding prefix total c+1, which IS a legal",

     "    print(f\"\\n  repairing the {N} split pairs: recomputing the counter FROM the warehouse makes the\")",
     "    print(f\"  pair agree and leaves the warehouse's total equal to the sum of its own rows.\")",

     "    # ---- the boundary a zero-valued event creates",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 3 — the counter in two places (looks like analytics). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    event      -- one thing that happened, carrying a number to count.  Events are numbered",
     "                  0, 1, 2, ... in arrival order; here their values are 5, 3, 7, 2, 6, 1, 9,",
     "                  4, 8, which add up to 45.",
     "    counter    -- a single running total in a fast store, read by the live dashboard.",
     "    warehouse  -- an append-only table of rows, one per event, read by the monthly report.",
     "                  \"The warehouse total\" means the sum of the rows it holds.",
     "    the answer -- always a PAIR: (what the counter says, what the warehouse total says).",
     "                  They agree only when both writes for every event landed.",
     "    crash at k -- the worker is killed between its TWO writes for event k, so one store has",
     "                  event k and the other does not.  \"No crash\" means it ran to the end.",
     "    derived@m  -- the alternative design: only the warehouse is written per event, and the",
     "                  counter is REBUILT from it every m events.  Its disagreement is a lag.",
     "",
     "  Every event has to increment the counter, for the dashboard, and append a row to the",
     "  warehouse, for the report, and the two live in different systems so there is no",
     "  transaction to put them in.  BOTH MUST AGREE.  The nine events above let the stream pass",
     "  legitimately through exactly ten totals: 0, 5, 8, 15, 17, 23, 24, 33, 37, 45.",
     "",
     "  GIVEN A CRASH POINT AND A DESIGN, WHAT DOES EACH STORE SAY AFTERWARDS?",
     "",
     "  Worked, as (counter, warehouse) on the nine events above -- which between them define",
     "  crash points 0..8 only:",
     "    counter first, crash at 0   -> (5, 0)      the earliest crash: the counter has the first",
     "                                               event and the warehouse has nothing",
     "    counter first, crash at 4   -> (23, 17)    an ordinary middle crash.  BOTH numbers are",
     "                                               legitimate totals, and the pair is not: no",
     "                                               moment in the stream ever had those two",
     "    counter first, crash at 8   -> (45, 37)    the last event there is: the dashboard is",
     "                                               complete and the report is one event short",
     "    counter first, no crash     -> (45, 45)    they agree, which is the only acceptable end",
     "    counter first, crash at 99  -> (45, 45)    off the end: there is no event 99, so the",
     "                                               kill never fires.  The honest answer is the",
     "                                               uninterrupted run, NOT the last real crash's",
     "                                               pair -- a crash that cannot happen does nothing",
     "    warehouse first, crash at 0 -> (0, 5)      the same crash, the other write order: the",
     "                                               disagreement flips sign and does not go away",
     "    derived@3, crash at 8       -> (24, 37)    the cache is two events behind, which is its",
     "                                               bound, and 24 was a real total two events ago",
     "    derived@20, no crash        -> (0, 45)     a rebuild interval longer than the whole",
     "                                               stream: the cache never ran, and is honestly",
     "                                               stale rather than wrong",
     "    a ZERO-valued event, crash at 4 -> (17, 17)   split exactly as above, and the two stores",
     "                                               AGREE anyway -- so agreement does not prove",
     "                                               the two writes both landed",
     "  And on 3,000 events of 7 each (21,000 in all):",
     "    counter first, crash at 1500 -> (10507, 10500)   off by one event out of three thousand",
     "    derived@500, crash at 1700   -> (10500, 11900)   200 events of lag, inside its bound of",
     "                                                      499 (the interval minus one)",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the program and against an independent formula for the same pair -- so these",
     "  answers cannot drift from what the program returns.",
     "",
     "Two outputs rather than one output and a position, so there is no store the bookkeeping can",
     "live in and the chapter's transaction is genuinely unavailable -- `together` has nothing to be",
     "together IN.  The honest answer is that it cannot be made exact, and the useful answer is to",
     "pick one store as the source of truth and DERIVE the other from it: the fast counter becomes a",
     "cache rebuilt from the warehouse rather than a second authority, so disagreement becomes",
     "STALENESS instead of INCONSISTENCY.  The difference is made precise below -- a dual-written",
     "pair can land in a state that corresponds to no moment in the event stream at all, while a",
     "derived pair always corresponds to some earlier moment.  The skill is noticing that \"both must",
     "agree\" is a request to have two sources of truth, and declining it.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 19 input/output pairs -- the first and last",
     "event of the stream as crash points, an ordinary middle one, both sides of the crash boundary",
     "(the last event versus no crash at all) in both write orders, a crash point past the end that",
     "never fires, the rebuild interval on both sides of the staleness bound (every event, every 3,",
     "and an interval longer than the whole stream), the zero-valued event that makes the two stores",
     "AGREE while still being split, a one-event stream, an empty stream that has nothing to split,",
     "and a 3,000-event stream at scale; each row prints what both designs cost for that same input.",
     "",
     "Run it:  python3 programs/ch05_v3.py",
     "\"\"\"",
     "",
     "import random",
     "",
     "# The chapter's nine items, unchanged.  All values DISTINCT and none zero, for the chapter's",
     "# reason: an event with no effect would make a disagreement invisible, and two equal values",
     "# would stop a wrong total from identifying which event was lost.  A zero IS injected further",
     "# down, precisely to show what it hides.",
     "ITEMS = [(0, 5), (1, 3), (2, 7), (3, 2), (4, 6), (5, 1), (6, 9), (7, 4), (8, 8)]",
     "CORRECT = sum(v for _, v in ITEMS)          # 45, the chapter's total",
     "N = len(ITEMS)",
     "",
     "# How many events between cache rebuilds, for the derived design.  3 is small enough to trace",
     "# and large enough that the cache is visibly behind.",
     "REBUILD_EVERY = 3",
     "",
     "# A stream with a zero-valued event, a one-event stream, an empty stream, and a 3,000-event",
     "# stream at scale.  These are inputs for the examples table, not alternative versions of the",
     "# problem.  The big stream's values are all equal, which is fine because those rows test SCALE",
     "# and not whether a wrong total identifies which event was lost.",
     "WITH_ZERO = ITEMS[:4] + [(99, 0)] + ITEMS[4:]",
     "ONE_EVENT = [(0, 5)]",
     "EMPTY_STREAM = []",
     "BIG_ITEMS = [(i, 7) for i in range(3_000)]",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, items, design, crash_at, (counter, warehouse total)).  \"derived@k\"",
     "# rebuilds the cache every k events.  Every row is asserted by show_examples() against the",
     "# program AND against an independent formula for the same pair, which is why the table is data",
     "# and not a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"counter-first, crash on the FIRST event\",  ITEMS,        \"counter_first\",   0,     (5, 0)),",
     "    (\"counter-first, ordinary middle event\",     ITEMS,        \"counter_first\",   4,     (23, 17)),",
     "    (\"counter-first, crash on the LAST event\",   ITEMS,        \"counter_first\",   8,     (45, 37)),",
     "    (\"counter-first, no crash at all\",           ITEMS,        \"counter_first\",   None,  (45, 45)),",
     "    (\"crash point past the end never fires\",     ITEMS,        \"counter_first\",   99,    (45, 45)),",
     "    (\"warehouse-first, FIRST event (sign flip)\", ITEMS,        \"warehouse_first\", 0,     (0, 5)),",
     "    (\"warehouse-first, crash on the LAST event\", ITEMS,        \"warehouse_first\", 8,     (37, 45)),",
     "    (\"derived@3, crash before anything ran\",     ITEMS,        \"derived@3\",       0,     (0, 0)),",
     "    (\"derived@3, middle event, lag 1\",           ITEMS,        \"derived@3\",       4,     (15, 17)),",
     "    (\"derived@3, LAST event, lag 2 (the bound)\", ITEMS,        \"derived@3\",       8,     (24, 37)),",
     "    (\"derived@3, no crash -> caught up\",         ITEMS,        \"derived@3\",       None,  (45, 45)),",
     "    (\"derived@1, rebuild every event, lag 0\",    ITEMS,        \"derived@1\",       8,     (37, 37)),",
     "    (\"derived@20, interval > whole stream\",      ITEMS,        \"derived@20\",      None,  (0, 45)),",
     "    (\"a ZERO-valued event: the pair AGREES\",     WITH_ZERO,    \"counter_first\",   4,     (17, 17)),",
     "    (\"one-event stream, crash on it\",            ONE_EVENT,    \"counter_first\",   0,     (5, 0)),",
     "    (\"empty stream: nothing to split\",           EMPTY_STREAM, \"counter_first\",   0,     (0, 0)),",
     "    (\"3,000 events, counter-first, midway\",      BIG_ITEMS,    \"counter_first\",   1500,  (10507, 10500)),",
     "    (\"3,000 events, derived@500, lag 200\",       BIG_ITEMS,    \"derived@500\",     1700,  (10500, 11900)),",
     "    (\"3,000 events, derived@500, no crash\",      BIG_ITEMS,    \"derived@500\",     None,  (21000, 21000)),",
     "]",
     "",
     "",
     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",
     "    out, run = [0], 0",
     "    for _, v in items:",
     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",
     "    with no reference to dual_write or derived -- so a row has to agree with the program and",
     "    with the rule the program claims to implement.",
     "",
     "    The two cost columns are for the SAME input on BOTH designs, so each row shows which one",
     "    is cheaper for it.  `dual` counts durable writes (two per event, one for the event the",
     "    crash straddles).  `derv` counts the one write per event PLUS the rows each rebuild has to",
     "    re-read, because rebuild() sums the whole warehouse every time.  That is why the derived",
     "    design LOSES on every row that runs to the end with a rebuild, on the every-event rebuild",
     "    and on the long-stream rows: its correctness is free and its freshness is not, and a short",
     "    rebuild interval on a long stream is the expensive corner.  Where it wins, few or no",
     "    rebuilds had been paid for yet -- an early crash, or an interval longer than the stream.",
     "    The tally of the `cheaper` column is printed under the table rather than asserted here.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':40s} {'events':>6} {'design':>15} {'crash':>5} \"",
     "          f\"{'counter':>8} {'wh':>8} {'lag':>4} {'dual':>6} {'derv':>7} {'cheaper':>8}\")",
     "    tally = {'derived': 0, 'dual': 0, 'tie': 0}",
     "    for label, items, design, crash_at, want in EXAMPLES:",
     "        vals = [v for _, v in items]",
     "        n = len(items)",
     "        m = n if crash_at is None else min(crash_at, n)      # events that completed a row",
     "        every = int(design.split(\"@\")[1]) if \"@\" in design else REBUILD_EVERY",
     "",
     "        if design.startswith(\"derived\"):",
     "            counter, rows, lag = derived(items, crash_at, every)",
     "            wh = rebuild(rows)",
     "            caught = (m // every) * every",
     "            ref = (sum(vals[:caught]), sum(vals[:m]))",
     "            assert lag == m - caught, (label, lag, m - caught)",
     "        else:",
     "            first = design == \"counter_first\"",
     "            counter, wh, rows = dual_write(items, crash_at, counter_first=first)",
     "            lag = 0",
     "            if m < n:                                        # the crash really landed",
     "                ahead, behind = sum(vals[:m + 1]), sum(vals[:m])",
     "                ref = (ahead, behind) if first else (behind, ahead)",
     "            else:",
     "                ref = (sum(vals), sum(vals))",
     "",
     "        assert (counter, wh) == want, (label, (counter, wh), want)",
     "        assert ref == want, (label, 'the rule disagrees', ref, want)",
     "        assert wh == sum(v for _, v in rows), (label, wh, rows)",
     "",
     "        dual = 2 * m + (1 if m < n else 0)",
     "        r = m // every",
     "        derv = m + every * r * (r + 1) // 2",
     "        cheaper = 'derived' if derv < dual else 'dual' if dual < derv else 'tie'",
     "        tally[cheaper] += 1",
     "        crash = 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:40s} {n:>6} {design:>15} {crash:>5} \"",
     "              f\"{counter:>8} {wh:>8} {lag:>4} {dual:>6} {derv:>7} {cheaper:>8}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the prefix sums of their own stream\")",
     "    assert sum(tally.values()) == len(EXAMPLES), tally",
     "    print(f\"cheaper: derived on {tally['derived']} rows, dual on {tally['dual']}, \"",
     "          f\"tie on {tally['tie']}\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    legal = prefixes(ITEMS)",
     "    print(\"ITEMS =\", \"  \".join(f\"{e}:{v}\" for e, v in ITEMS), f\"  total {CORRECT}\")",
     "    print(f\"the {len(legal)} totals the stream legitimately passes through: {legal}\\n\")",
     "",
     "    # ---- the dual write, at every crash point and in both orders",
     "    print(f\"  {'crash':>5}  {'counter-first':>22}  {'warehouse-first':>22}\")",
     "    split_c, split_w = [], []",
     "    for c in range(N):",
     "        cc, wc, _ = dual_write(ITEMS, c, counter_first=True)",
     "        cw, ww, _ = dual_write(ITEMS, c, counter_first=False)",
     "        split_c.append((cc, wc))",
     "        split_w.append((cw, ww))",
     "        print(f\"  {c:>5}  counter {cc:>3}  wh {wc:>3} ({cc - wc:+d})  \"",
     "              f\"counter {cw:>3}  wh {ww:>3} ({cw - ww:+d})\")",
     "    assert all(a - b == ITEMS[c][1] for c, (a, b) in enumerate(split_c)), split_c",
     "    assert all(b - a == ITEMS[c][1] for c, (a, b) in enumerate(split_w)), split_w",
     "    print(f\"\\n  the gap is always exactly the straddling event's value, and its SIGN is the write\")",
     "    print(f\"  order: counter-first leaves the dashboard high, warehouse-first leaves it low.\")",
     "    # and no crash point escapes, in either order",
     "    assert not any(a == b for a, b in split_c) and not any(a == b for a, b in split_w)",
     "    assert max(a - b for a, b in split_c) == 9 == max(v for _, v in ITEMS)",
     "",
     "    # ---- the precise difference between inconsistency and staleness",
     "    impossible = [(c, p) for c, p in enumerate(split_c) if p[0] != p[1]]",
     "    not_a_moment = [(c, p) for c, p in enumerate(split_c)",
     "                    if not any(p[0] == t and p[1] == t for t in legal)]",
     "    print(f\"\\n  of the {N} dual-write crash states, {len(not_a_moment)} correspond to NO moment in the\")",
     "    print(f\"  stream: the pair (counter, warehouse) is not (T, T) for any legal total T.\")",
     "    assert len(not_a_moment) == N and len(impossible) == N",
     "    # the derived design: every crash state is a PAST moment, which is the whole claim",
     "    lags = []",
     "    for c in range(N + 1):",
     "        cnt, rows, lag = derived(ITEMS, c if c < N else None)",
     "        wh = rebuild(rows)",
     "        assert cnt in legal and wh in legal, (c, cnt, wh)",
     "        assert cnt <= wh, (c, cnt, wh)",
     "        assert legal.index(cnt) == legal.index(wh) - lag, (c, cnt, wh, lag)",
     "        lags.append(lag)",
     "    print(f\"  of the {N} derived crash states and the uninterrupted run, ALL are a legal total\")",
     "    print(f\"  paired with an earlier legal total -- the counter is behind by {min(lags)} to {max(lags)}\")",
     "    print(f\"  events and never wrong.\")",
     "    assert max(lags) == REBUILD_EVERY - 1, (lags, REBUILD_EVERY)",
     "    assert min(lags) == 0, lags",
     "    print(f\"  the lag is bounded by the rebuild interval ({REBUILD_EVERY}), so it is a number you choose,\")",
     "    print(f\"  not a number you discover after an incident.\")",
     "    # the bound is the parameter, measured across several intervals",
     "    for every in (1, 2, 3, 5, 9, 20):",
     "        worst = max(derived(ITEMS, c, every)[2] for c in range(N + 1))",
     "        assert worst == min(every - 1, N), (every, worst)",
     "    print(f\"  rebuild every 1,2,3,5,9,20 events -> worst lag 0,1,2,4,8,{min(20 - 1, N)} events: exactly the\")",
     "    print(f\"  interval minus one, until the interval exceeds the stream.\")",
     "",
     "    # ---- the retry, which is the fix everybody reaches for",
     "    r_counter, r_wh, r_rows = retry_until_written(ITEMS, crash_at=4, attempts=2)",
     "    print(f\"\\n  retrying the writes for event 4 twice: counter {r_counter}, warehouse {r_wh}\")",
     "    assert r_wh == CORRECT, r_wh",
     "    assert r_counter == CORRECT + ITEMS[4][1], (r_counter, CORRECT)",
     "    print(f\"  the warehouse is still {r_wh} because its row is keyed by event id, so writing it\")",
     "    print(f\"  twice is writing it once.  The counter is {r_counter}, high by {r_counter - CORRECT} -- an increment\")",
     "    print(f\"  has no key, so a retry is a second event.  THAT asymmetry is what decides which\")",
     "    print(f\"  store can be the source of truth: the one whose write can be repeated safely.\")",
     "    for c in range(N):",
     "        assert retry_until_written(ITEMS, c, attempts=2)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[0] == CORRECT + 2 * ITEMS[c][1], c",
     "    print(f\"  at every crash point and for 2 or 3 attempts: the warehouse is always {CORRECT}, and the\")",
     "    print(f\"  counter is high by one or two copies of the retried event.\")",
     "",
     "    # ---- reconciliation, and which direction it has to run",
     "    for c in range(N):",
     "        cc, wc, rows = dual_write(ITEMS, c, counter_first=True)",
     "        g_cnt, g_total, g_rows = reconcile(cc, rows, \"from_warehouse\")",
     "        b_cnt, b_total, b_rows = reconcile(cc, rows, \"from_counter\")",
     "        assert g_cnt == g_total == rebuild(g_rows) and g_total in legal, (c, g_total)",
     "        assert b_cnt == b_total, \"writing the counter into the warehouse does make them agree\"",
     "        # CORRECTED.  The expectation was that this lands on a total the stream never had.  It",
     "        # does not: counter-first leaves the counter holding prefix total c+1, which IS a legal",
     "        # total -- what was illegal was the PAIR, not either number.  The real damage is one",
     "        # level down: the warehouse's reported total no longer equals the sum of its own rows,",
     "        # so the corruption is invisible to any check that compares the two stores.",
     "        assert b_total in legal, (c, b_total)",
     "        assert b_total != rebuild(b_rows), (c, b_total, rebuild(b_rows))",
     "        assert b_total - rebuild(b_rows) == ITEMS[c][1], (c, b_total)",
     "    print(f\"\\n  repairing the {N} split pairs: recomputing the counter FROM the warehouse makes the\")",
     "    print(f\"  pair agree and leaves the warehouse's total equal to the sum of its own rows.\")",
     "    print(f\"  Copying the counter INTO the warehouse also makes the pair agree, on a total that\")",
     "    print(f\"  is even a legal one -- but the warehouse's total is then high by the missing row's\")",
     "    print(f\"  value at every crash point, so comparing the two stores can no longer detect it.\")",
     "    print(f\"  and note what the working repair reads: the warehouse.  It was the source of\")",
     "    print(f\"  truth all along, and the reconcile job is the derived design with extra steps.\")",
     "",
     "    # ---- the boundary a zero-valued event creates",
     "    with_zero = ITEMS[:4] + [(99, 0)] + ITEMS[4:]",
     "    zc, zw, _ = dual_write(with_zero, 4, counter_first=True)",
     "    print(f\"\\n  inject one event with value 0 and crash on it: counter {zc}, warehouse {zw} -- they\")",
     "    print(f\"  AGREE, and the process still died between two writes.\")",
     "    assert zc == zw, (zc, zw)",
     "    assert dual_write(with_zero, 4)[0] == dual_write(with_zero, 4)[1]",
     "    # ...and the agreement is not consistency: the row is missing from the warehouse",
     "    _, _, zrows = dual_write(with_zero, 4, counter_first=True)",
     "    assert (99, 0) not in zrows, zrows",
     "    assert len(zrows) == 4, zrows",
     "    print(f\"  the row {(99, 0)} is missing from the warehouse all the same, so the row COUNT is\")",
     "    print(f\"  wrong while the total is right.  Equal totals are evidence of nothing, which is\")",
     "    print(f\"  why the chapter's items are all non-zero and distinct.\")",
     "",
     "    # ---- many streams, every crash point, both designs",
     "    rng = random.Random(20260303)",
     "    for _ in range(400):",
     "        n = rng.randint(1, 12)",

     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",

     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",

     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",

     "    total still equals the sum of the detail.",

     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",

     "    return counter, counter, rows",

     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",
     "    out, run = [0], 0",
     "    for _, v in items:",
     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",

     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",

     "        out.append(run)",

     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",

     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",

     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",

     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",

 (cfg.cols||[]).forEach(c=>h+='<text class="gcol" x="'+c.x+'" y="'+c.y+'">'+esc(c.text)+'</text>');
 cfg.nodes.forEach(n=>{N[n.id]={kind:'main',step:0,...n}});
 const E=cfg.edges.map(e=>{const A=N[e.from],B=N[e.to];if(!A||!B){console.warn('[deck] edge with unknown box',e);return null}
  let d;const ac=[A.x+A.w/2,A.y+A.h/2],bc=[B.x+B.w/2,B.y+B.h/2];
  if(e.loop){const x=A.x+A.w*0.5,y=A.y;d='M'+(x-30)+','+(y-2)+' C'+(x-44)+','+(y-62)+' '+(x+44)+','+(y-62)+' '+(x+30)+','+(y-4)}
  else{const mx=(ac[0]+bc[0])/2,my=(ac[1]+bc[1])/2,L=Math.hypot(bc[0]-ac[0],bc[1]-ac[1])||1,b=e.bend||0;
   const cx=mx-(bc[1]-ac[1])/L*b,cy=my+(bc[0]-ac[0])/L*b;
   const p=rectHit(A,b?cx:bc[0],b?cy:bc[1]),q=rectHit(B,b?cx:ac[0],b?cy:ac[1]);

  const ty=hasVal?n.y+24:(subs.length?n.y+n.h/2-(n.kind==='hub'?4:3)-(subs.length-1)*6:n.y+n.h/2+5);

  if(hasVal)h+='<text class="val" x="'+cx+'" y="'+(n.y+n.h-14)+'" text-anchor="middle" data-val="'+esc(n.id)+'"></text>';

function packets(g,k){g.gen++;clearTimeout(g.timer);const gen=g.gen;$('.pkts',g.svg).innerHTML='';if(k<0)return;

  if(q<1)requestAnimationFrame(f);else{el.textContent=fmt(t,d,p,s);host.classList.remove('ticking');host.classList.add('landed')}})(t0)}
function counters(slide,k){$$('[data-count]',slide).forEach(c=>{const host=c.closest('[data-st]');const on=host?+host.dataset.st<=k:k>=0;
 if(on&&!c._run){c._run=1;count(c)}else if(!on&&c._run){c._run=0;c.textContent=fmt(0,+c.dataset.dec||0,c.dataset.pre||'',c.dataset.suf||'')}})}

/* ---------------- build the deck from DECK ---------------- */
document.title=DECK.title||document.title;$('#deckEyebrow').innerHTML=rich(DECK.eyebrow||'');
const deckEl=$('#deck');
DECK.slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.dataset.title=s.title||('Slide '+(i+1));
 const r=RENDER[s.layout];if(!r){console.warn('[deck] unknown layout "'+s.layout+'" on slide '+(i+1));sec.innerHTML=head(s)}else sec.innerHTML=r(s);deckEl.appendChild(sec)});
const S=$$('.slide',deckEl);
const NARR=DECK.slides.map(s=>(s.narration&&s.narration.length?s.narration:['']).map(String));
const SPEECH=DECK.slides.map(s=>s.speech||[]);   // optional per-line spoken text, if it should differ from the bar
/* per-slide hooks for diagrams that need JS: stage(k) shows step k, reset() clears */
DECK.slides.forEach((s,i)=>{const sec=S[i];sec._hooks=[];
 if(s.layout==='graph'){const g=buildGraph($('svg.g',sec),s.graph);sec._hooks.push({stage:k=>graphStage(g,k),reset:()=>{g.gen++;clearTimeout(g.timer);graphStage(g,-1)}})}
 if(s.layout==='sequence'){const svg=$('svg.seq',sec);buildSeq(svg,s.sequence);
  const lit=k=>$$('.msg,.mt,.ah',svg).forEach(e=>e.classList.toggle('lit',+e.dataset.k<=k));sec._hooks.push({stage:lit,reset:()=>lit(-1)})}
 if(s.layout==='timeline'){const ms=$$('.ms',sec),T=s.timeline||[],fill=$('.fillbar',sec),tk=$$('.tkt',sec),sp=s.strip;
  sec._hooks.push({stage:k=>{let c=-1;T.forEach((m,j)=>{if((m.step||0)<=k)c=j});
    ms.forEach((m,j)=>{const state=j<c?'done':j===c?'now':'next';m.classList.remove('done','now','next');m.classList.add(state);const ch=$('.state',m);ch.textContent=state;ch.className='chip state'+(state==='done'?' u':state==='now'?' a':'')});
    fill.style.width=c<0?'0':(tlPos(c,T.length)-8)+'%';
    if(sp){if(k>=sp.step&&!sec._dropped){sec._dropped=1;tk.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),300+j*520)})}
     else if(k<sp.step){sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}}},
   reset:()=>{sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')});fill.style.width='0';ms.forEach(m=>m.classList.remove('done','now'))}})}
 if(s.layout==='cards'&&(s.tokens||s.bars)){const tks=$$('.tk',sec),fills=$$('.bars .fill',sec);
  sec._hooks.push({stage:k=>{if(s.tokens){if(k>=s.tokens.step&&!sec._tok){sec._tok=1;tks.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),j*90)})}
     else if(k<s.tokens.step){sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}
     tks.forEach(t=>t.classList.toggle('fade',s.tokens.fadeStep!=null&&k>=s.tokens.fadeStep))}
    if(s.bars)fills.forEach(f=>f.style.width=(k>=s.bars.step?f.dataset.w:0)+'%')},
   reset:()=>{sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in','fade')});fills.forEach(f=>f.style.width='0')}})}
 /* extension: ask — answering is the only way past the question step */
 if(s.question){const q=s.question,fb=$('.fb',sec),bs=$$('.opt',sec),L=j=>String.fromCharCode(65+j);
  const reset=()=>{sec._answered=false;bs.forEach(b=>{b.className='opt';b.disabled=false});fb.innerHTML=''};
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();if(sec._answered)return;const j=+b.dataset.j,o=q.options[j],ok=!!o.correct,ci=q.options.findIndex(x=>x.correct),c=q.options[ci];
   sec._answered=true;bs.forEach((x,m)=>{x.disabled=true;x.classList.add(q.options[m].correct?'right':m===j?'wrong':'dim')});
   fb.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</p><p>'+rich(o.why)+'</p>'+(ok?'':'<p><b>The answer is '+L(ci)+'.</b> '+rich(c.why)+'</p>');
   if(voice&&HAS_TTS)speakLine((ok?'Right. ':'Not quite. ')+plain(o.why)+(ok?'':' The answer is '+plain(c.text)+'. '+plain(c.why)));
   else if(playing){clearTimeout(timer);timer=setTimeout(next,Math.max(4000,plain(fb.textContent).length*55))}});
  sec._hooks.push({stage:()=>{},reset})}
 /* extension: code — keep the newest lines in view as they appear */
 if(s.layout==='code'){const pane=$('.codep',sec),fr=$$('.ln.fresh',sec);
  sec._hooks.push({stage:k=>{const first=fr.find(e=>e.classList.contains('lit')||!e.hasAttribute('data-st'));
    if(first&&pane)pane.scrollTop=Math.max(0,first.offsetTop-pane.offsetTop-pane.clientHeight*0.25)},
   reset:()=>{if(pane)pane.scrollTop=0}})}
 /* extension: array — show, pick and sweep, each tied to a narration step */
 if(s.layout==='array'){const a=s.array,A=a.actions||[],cell=(r,c)=>$('.ac[data-r="'+r+'"][data-c="'+c+'"]',sec),M=$$('.am b',sec);
  let gen=0;const fmt0=v=>Number(v).toLocaleString('en-US'),setM=(i,v)=>{if(i!=null&&M[i])M[i].textContent=fmt0(v)};
  const rowsOf=x=>x.rows!=null?x.rows:x.row!=null?[x.row]:a.rows.map((_,r)=>r);
  const clear=()=>{gen++;$$('.ac',sec).forEach(e=>e.classList.remove('in','seen','hit','pick','ptr'));$$('.ai',sec).forEach(e=>e.classList.remove('pick'));M.forEach(m=>m.textContent='0')};
  const sweepTo=(x,upto)=>{const r=x.row,vals=a.rows[r].values;let read=0,acc=0,hits=0;
   for(let c=0;c<=upto;c++){const el=cell(r,c),v=Number(vals[c]);read++;el.classList.add('seen');
    if(x.mode==='sum')acc+=v;else if(x.mode==='match'&&String(vals[c])===String(x.match)){hits++;el.classList.add('hit')}}
   setM(x.readMeter,read);if(x.mode==='sum')setM(x.resultMeter,acc);if(x.mode==='match')setM(x.resultMeter,hits)};
  const stageA=k=>{clear();const g=gen;
   A.filter(x=>x.step<=k).forEach(x=>{const live=x.step===k;
    if(x.do==='show')rowsOf(x).forEach(r=>a.rows[r].values.forEach((_,c)=>{const el=cell(r,c);if(live){el._t=setTimeout(()=>{if(g===gen)el.classList.add('in')},c*45+r*120)}else el.classList.add('in')}));
    if(x.do==='pick')(x.slots||[]).forEach(c=>{rowsOf(x).forEach(r=>cell(r,c).classList.add('pick'));const i=$('.ai[data-c="'+c+'"]',sec);if(i)i.classList.add('pick')});
    if(x.do==='sweep'){const n=a.rows[x.row].values.length;
     if(!live)sweepTo(x,n-1);else{let c=0;(function tick(){if(g!==gen)return;$$('.ac.ptr',sec).forEach(e=>e.classList.remove('ptr'));
      if(c>=n)return;sweepTo(x,c);cell(x.row,c).classList.add('ptr');c++;setTimeout(tick,x.speed||140)})()}}})};
  sec._hooks.push({stage:stageA,reset:clear})}
});
/* authoring check: warns (console only) when a step number has no narration line */
DECK.slides.forEach((s,i)=>{let mx=-1;JSON.stringify(s,(k,v)=>{if((k==='step'||k==='fadeStep')&&typeof v==='number')mx=Math.max(mx,v);return v});
 if(mx>=NARR[i].length)console.warn('[deck] slide '+(i+1)+' uses step '+mx+' but has only '+NARR[i].length+' narration lines')});

/* ---------------- scaling, theme, tabs ---------------- */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
fit();addEventListener('resize',fit);
const tt=$('#tt');function setTheme(m){document.documentElement.dataset.theme=m;tt.textContent=m==='dark'?'Light':'Dark'}
setTheme(DECK.theme==='dark'?'dark':'light');tt.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const tabs=$('#tabs');S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+esc(s.dataset.title);b.onclick=()=>go(i);tabs.appendChild(b)});

/* ---------------- voice-over ----------------
   Fixed voice by name (any word order), silent fallback through DECK.voice.fallbackLangs, then the
   browser default. Voices load asynchronously in Chrome, so the choice is redone on "voiceschanged".
   Each sentence is spoken as its own utterance (avoids Chrome cutting long utterances off). */
const V=DECK.voice||{},AUTO=DECK.auto||{},HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
const WANT=String(V.preferred||'').toLowerCase().split(/\s+/).filter(Boolean);
const isPreferred=v=>{const n=(v.name||'').toLowerCase();return WANT.length>0&&WANT.every(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))};
const normLang=l=>String(l||'').toLowerCase().replace('_','-');
function chooseVoice(list){const p=list.find(isPreferred);if(p)return p;
 for(const lang of (V.fallbackLangs||[])){const L=normLang(lang),m=list.find(v=>normLang(v.lang)===L||normLang(v.lang).startsWith(L+'-')||normLang(v.lang).startsWith(L));if(m)return m}
 return null}   // null = let the browser use its default voice
function loadVoices(){if(!HAS_TTS)return;VOICE=chooseVoice(speechSynthesis.getVoices()||[])}
if(HAS_TTS){loadVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);else speechSynthesis.onvoiceschanged=loadVoices}
function speakable(s){let t=String(s);Object.entries(V.sayAs||{}).forEach(([a,b])=>{t=t.split(a).join(b)});
 return t.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d+(?:\.\d+)?)%/g,'$1 percent')}
function rateFor(v){const R=V.rate||{};if(v&&/^google/i.test(v.name))return R.google||1;if(v&&/^microsoft/i.test(v.name))return R.microsoft||1;return R.other||1}
let speechGen=0,pauseT=null;
function stopSpeech(){speechGen++;clearTimeout(pauseT);if(HAS_TTS)speechSynthesis.cancel()}
function speakLine(text){stopSpeech();const gen=speechGen;if(!VOICE)loadVoices();const v=VOICE;
 const parts=speakable(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[text];let i=0;
 (function nextSentence(){if(gen!==speechGen)return;
  if(i>=parts.length){if(playing)timer=setTimeout(next,AUTO.afterSpeechMs==null?700:AUTO.afterSpeechMs);return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());if(v){u.voice=v;u.lang=v.lang}u.rate=rateFor(v);u.pitch=V.pitch||1;u.volume=1;
  const pause=/[?!]["')]*$/.test(u.text)?(V.questionPauseMs||420):(V.sentencePauseMs||320);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(gen!==speechGen)return;pauseT=setTimeout(nextSentence,pause)};
  const wd=setTimeout(fin,Math.max(8000,u.text.length*200));   // watchdog: some browsers never fire "end"
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})()}

/* ---------------- stepping, narration bar, auto-play ---------------- */
let cur=0,line=0,playing=false,timer=null,t0=0,dur=1,voice=false,sayGen=0;
function stage(i,k){const s=S[i];$$('[data-st]',s).forEach(e=>e.classList.toggle('lit',+e.dataset.st<=k));counters(s,k);s._hooks.forEach(h=>h.stage(k))}
function dots(){$('#ndots').innerHTML=NARR[cur].map((_,j)=>'<i class="'+(j<=line?'on':'')+'"></i>').join('')}
function go(i,startLine){if(i<0||i>=S.length)return;stopSpeech();clearTimeout(timer);
 S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);s._hooks.forEach(h=>h.reset())});
 $$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 $$('[data-st]',S[i]).forEach(e=>e.classList.remove('lit'));counters(S[i],-1);
 cur=i;line=Math.max(0,Math.min(startLine||0,NARR[i].length-1));history.replaceState(null,'','#'+(i+1));
 const g=++sayGen;setTimeout(()=>{if(g===sayGen)say()},350)}
function say(){clearTimeout(timer);const g=++sayGen,L=NARR[cur],tx=$('#ntxt');tx.style.opacity=0;
 setTimeout(()=>{if(g!==sayGen)return;tx.textContent=L[line];tx.style.opacity=1;
  $('#ncount').textContent='slide '+(cur+1)+'/'+S.length+' · step '+(line+1)+'/'+L.length;dots();stage(cur,line);
  dur=Math.max(AUTO.minStepMs||5200,L[line].length*(AUTO.msPerChar||62));t0=performance.now();
  if(voice&&HAS_TTS)speakLine(SPEECH[cur][line]||L[line]);else if(playing)timer=setTimeout(next,dur)},250)}
/* extension: an unanswered question holds the deck on its question step */
function blocked(){const s=DECK.slides[cur];return !!s.question&&line===s.question.step&&!S[cur]._answered}
function nudge(){const s=S[cur];s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge');
 const fb=$('.fb',s);if(fb&&!fb.textContent.trim())fb.innerHTML='<p class="hint">Choose an answer to carry on.</p>'}
function next(){if(blocked()){nudge();return}stopSpeech();if(line<NARR[cur].length-1){line++;say()}else if(cur<S.length-1)go(cur+1);else{playing=false;upd()}}
function prev(){stopSpeech();if(line>0){line--;say()}else if(cur>0)go(cur-1,NARR[cur-1].length-1)}
(function prog(){const p=playing?Math.min(1,(performance.now()-t0)/dur):0;$('#nprog').style.width=(p*100)+'%';requestAnimationFrame(prog)})();
function upd(){$('#bplay').textContent=playing?'❚❚ auto':'▶ auto';$('#bplay').classList.toggle('on',playing)}
function toggleAuto(){playing=!playing;upd();clearTimeout(timer);if(playing){if(voice&&HAS_TTS)say();else timer=setTimeout(next,AUTO.firstStepDelayMs||1200)}}
function toggleVoice(){voice=!voice;const b=$('#bvoice');b.textContent=voice?'Voice on':'Voice off';b.setAttribute('aria-pressed',String(voice));b.classList.toggle('on',voice);
 if(!voice){stopSpeech();if(playing){clearTimeout(timer);timer=setTimeout(next,dur)}}else say()}
$('#bplay').onclick=toggleAuto;$('#bnext').onclick=next;$('#bprev').onclick=prev;$('#bvoice').onclick=toggleVoice;

/* keyboard: → / space next · ← back · PageDown/PageUp slide · Home/End · 1–9, 0 = slide 10 · A auto · V voice */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'){e.preventDefault();prev()}
 else if(k==='PageDown')go(cur+1);else if(k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
 else if(/^[1-9]$/.test(k))go(+k-1);else if(k==='0')go(9);else if(k==='a'||k==='A')toggleAuto();else if(k==='v'||k==='V')toggleVoice()});
/* click anywhere on the slide to advance — but not on links, buttons or while selecting text */
let clickLock=0;
deckEl.addEventListener('click',e=>{if(e.button!==0||e.target.closest('button,a,input,select,textarea,label,.ctl,.tabs'))return;
 const sel=window.getSelection&&String(window.getSelection());if(sel&&sel.trim())return;const now=performance.now();if(now-clickLock<450)return;clickLock=now;next()});
/* links (HTML or SVG) never advance the slide: stop the event in the capture phase; the link still opens */
['click','pointerdown','mousedown','pointerup','mouseup'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('a[href]'))e.stopPropagation()},true));

/* small read-only hook for automated checks */
window.__deck={go,next,prev,toggleAuto,toggleVoice,slides:S.length,narrLen:i=>NARR[i].length,
 state:()=>({cur,line,playing,voice,voiceName:VOICE?VOICE.name:null,text:$('#ntxt').textContent})};

const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=S.length?h0-1:0);
})();
</script>
</body>
