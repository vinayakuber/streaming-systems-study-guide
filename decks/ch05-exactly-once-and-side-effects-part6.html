<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Counter Kept Twice</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",
     "    with no reference to dual_write or derived -- so a row has to agree with the program and",
     "    with the rule the program claims to implement.",
     "",
     "    The two cost columns are for the SAME input on BOTH designs, so each row shows which one",
     "    is cheaper for it.  `dual` counts durable writes (two per event, one for the event the",
     "    crash straddles).  `derv` counts the one write per event PLUS the rows each rebuild has to",
     "    re-read, because rebuild() sums the whole warehouse every time.  That is why the derived",
     "    design LOSES on every row that runs to the end with a rebuild, on the every-event rebuild",
     "    and on the long-stream rows: its correctness is free and its freshness is not, and a short",
     "    rebuild interval on a long stream is the expensive corner.  Where it wins, few or no",
     "    rebuilds had been paid for yet -- an early crash, or an interval longer than the stream.",
     "    The tally of the `cheaper` column is printed under the table rather than asserted here.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':40s} {'events':>6} {'design':>15} {'crash':>5} \"",
     "          f\"{'counter':>8} {'wh':>8} {'lag':>4} {'dual':>6} {'derv':>7} {'cheaper':>8}\")",
     "    tally = {'derived': 0, 'dual': 0, 'tie': 0}",
     "    for label, items, design, crash_at, want in EXAMPLES:",
     "        vals = [v for _, v in items]",
     "        n = len(items)",
     "        m = n if crash_at is None else min(crash_at, n)      # events that completed a row",
     "        every = int(design.split(\"@\")[1]) if \"@\" in design else REBUILD_EVERY",
     "",
     "        if design.startswith(\"derived\"):",
     "            counter, rows, lag = derived(items, crash_at, every)",
     "            wh = rebuild(rows)",
     "            caught = (m // every) * every",
     "            ref = (sum(vals[:caught]), sum(vals[:m]))",
     "            assert lag == m - caught, (label, lag, m - caught)",
     "        else:",

     "        assert (counter, wh) == want, (label, (counter, wh), want)",

     "        dual = 2 * m + (1 if m < n else 0)",
     "        r = m // every",
     "        derv = m + every * r * (r + 1) // 2",

     "    print(f\"cheaper: derived on {tally['derived']} rows, dual on {tally['dual']}, \"",
     "          f\"tie on {tally['tie']}\")",
     "    print()",
     "",
     "",

     "# down, precisely to show what it hides.",
     "ITEMS = [(0, 5), (1, 3), (2, 7), (3, 2), (4, 6), (5, 1), (6, 9), (7, 4), (8, 8)]",
     "CORRECT = sum(v for _, v in ITEMS)          # 45, the chapter's total",
     "N = len(ITEMS)",
     "",
     "# How many events between cache rebuilds, for the derived design.  3 is small enough to trace",
     "# and large enough that the cache is visibly behind.",
     "REBUILD_EVERY = 3",
     "",
     "# A stream with a zero-valued event, a one-event stream, an empty stream, and a 3,000-event",
     "# stream at scale.  These are inputs for the examples table, not alternative versions of the",
     "# problem.  The big stream's values are all equal, which is fine because those rows test SCALE",
     "# and not whether a wrong total identifies which event was lost.",
     "WITH_ZERO = ITEMS[:4] + [(99, 0)] + ITEMS[4:]",
     "ONE_EVENT = [(0, 5)]",
     "EMPTY_STREAM = []",
     "BIG_ITEMS = [(i, 7) for i in range(3_000)]",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, items, design, crash_at, (counter, warehouse total)).  \"derived@k\"",
     "# rebuilds the cache every k events.  Every row is asserted by show_examples() against the",
     "# program AND against an independent formula for the same pair, which is why the table is data",
     "# and not a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"counter-first, crash on the FIRST event\",  ITEMS,        \"counter_first\",   0,     (5, 0)),",
     "    (\"counter-first, ordinary middle event\",     ITEMS,        \"counter_first\",   4,     (23, 17)),",
     "    (\"counter-first, crash on the LAST event\",   ITEMS,        \"counter_first\",   8,     (45, 37)),",
     "    (\"counter-first, no crash at all\",           ITEMS,        \"counter_first\",   None,  (45, 45)),",
     "    (\"crash point past the end never fires\",     ITEMS,        \"counter_first\",   99,    (45, 45)),",
     "    (\"warehouse-first, FIRST event (sign flip)\", ITEMS,        \"warehouse_first\", 0,     (0, 5)),",
     "    (\"warehouse-first, crash on the LAST event\", ITEMS,        \"warehouse_first\", 8,     (37, 45)),",
     "    (\"derived@3, crash before anything ran\",     ITEMS,        \"derived@3\",       0,     (0, 0)),",
     "    (\"derived@3, middle event, lag 1\",           ITEMS,        \"derived@3\",       4,     (15, 17)),",
     "    (\"derived@3, LAST event, lag 2 (the bound)\", ITEMS,        \"derived@3\",       8,     (24, 37)),",
     "    (\"derived@3, no crash -> caught up\",         ITEMS,        \"derived@3\",       None,  (45, 45)),",
     "    (\"derived@1, rebuild every event, lag 0\",    ITEMS,        \"derived@1\",       8,     (37, 37)),",
     "    (\"derived@20, interval > whole stream\",      ITEMS,        \"derived@20\",      None,  (0, 45)),",
     "    (\"a ZERO-valued event: the pair AGREES\",     WITH_ZERO,    \"counter_first\",   4,     (17, 17)),",
     "    (\"one-event stream, crash on it\",            ONE_EVENT,    \"counter_first\",   0,     (5, 0)),",
     "    (\"empty stream: nothing to split\",           EMPTY_STREAM, \"counter_first\",   0,     (0, 0)),",
     "    (\"3,000 events, counter-first, midway\",      BIG_ITEMS,    \"counter_first\",   1500,  (10507, 10500)),",
     "    (\"3,000 events, derived@500, lag 200\",       BIG_ITEMS,    \"derived@500\",     1700,  (10500, 11900)),",
     "    (\"3,000 events, derived@500, no crash\",      BIG_ITEMS,    \"derived@500\",     None,  (21000, 21000)),",
     "]",
     "",
     "",
     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",
     "    out, run = [0], 0",
     "    for _, v in items:",
     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",
     "    with no reference to dual_write or derived -- so a row has to agree with the program and",
     "    with the rule the program claims to implement.",
     "",
     "    The two cost columns are for the SAME input on BOTH designs, so each row shows which one",
     "    is cheaper for it.  `dual` counts durable writes (two per event, one for the event the",
     "    crash straddles).  `derv` counts the one write per event PLUS the rows each rebuild has to",
     "    re-read, because rebuild() sums the whole warehouse every time.  That is why the derived",
     "    design LOSES on every row that runs to the end with a rebuild, on the every-event rebuild",
     "    and on the long-stream rows: its correctness is free and its freshness is not, and a short",
     "    rebuild interval on a long stream is the expensive corner.  Where it wins, few or no",
     "    rebuilds had been paid for yet -- an early crash, or an interval longer than the stream.",
     "    The tally of the `cheaper` column is printed under the table rather than asserted here.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':40s} {'events':>6} {'design':>15} {'crash':>5} \"",
     "          f\"{'counter':>8} {'wh':>8} {'lag':>4} {'dual':>6} {'derv':>7} {'cheaper':>8}\")",
     "    tally = {'derived': 0, 'dual': 0, 'tie': 0}",
     "    for label, items, design, crash_at, want in EXAMPLES:",
     "        vals = [v for _, v in items]",
     "        n = len(items)",
     "        m = n if crash_at is None else min(crash_at, n)      # events that completed a row",
     "        every = int(design.split(\"@\")[1]) if \"@\" in design else REBUILD_EVERY",
     "",
     "        if design.startswith(\"derived\"):",
     "            counter, rows, lag = derived(items, crash_at, every)",
     "            wh = rebuild(rows)",
     "            caught = (m // every) * every",
     "            ref = (sum(vals[:caught]), sum(vals[:m]))",
     "            assert lag == m - caught, (label, lag, m - caught)",
     "        else:",
     "            first = design == \"counter_first\"",
     "            counter, wh, rows = dual_write(items, crash_at, counter_first=first)",
     "            lag = 0",
     "            if m < n:                                        # the crash really landed",
     "                ahead, behind = sum(vals[:m + 1]), sum(vals[:m])",
     "                ref = (ahead, behind) if first else (behind, ahead)",
     "            else:",
     "                ref = (sum(vals), sum(vals))",
     "",
     "        assert (counter, wh) == want, (label, (counter, wh), want)",
     "        assert ref == want, (label, 'the rule disagrees', ref, want)",
     "        assert wh == sum(v for _, v in rows), (label, wh, rows)",
     "",
     "        dual = 2 * m + (1 if m < n else 0)",
     "        r = m // every",
     "        derv = m + every * r * (r + 1) // 2",
     "        cheaper = 'derived' if derv < dual else 'dual' if dual < derv else 'tie'",
     "        tally[cheaper] += 1",
     "        crash = 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:40s} {n:>6} {design:>15} {crash:>5} \"",
     "              f\"{counter:>8} {wh:>8} {lag:>4} {dual:>6} {derv:>7} {cheaper:>8}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the prefix sums of their own stream\")",
     "    assert sum(tally.values()) == len(EXAMPLES), tally",
     "    print(f\"cheaper: derived on {tally['derived']} rows, dual on {tally['dual']}, \"",
     "          f\"tie on {tally['tie']}\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    legal = prefixes(ITEMS)",
     "    print(\"ITEMS =\", \"  \".join(f\"{e}:{v}\" for e, v in ITEMS), f\"  total {CORRECT}\")",
     "    print(f\"the {len(legal)} totals the stream legitimately passes through: {legal}\\n\")",
     "",
     "    # ---- the dual write, at every crash point and in both orders",
     "    print(f\"  {'crash':>5}  {'counter-first':>22}  {'warehouse-first':>22}\")",
     "    split_c, split_w = [], []",
     "    for c in range(N):",
     "        cc, wc, _ = dual_write(ITEMS, c, counter_first=True)",
     "        cw, ww, _ = dual_write(ITEMS, c, counter_first=False)",
     "        split_c.append((cc, wc))",
     "        split_w.append((cw, ww))",
     "        print(f\"  {c:>5}  counter {cc:>3}  wh {wc:>3} ({cc - wc:+d})  \"",
     "              f\"counter {cw:>3}  wh {ww:>3} ({cw - ww:+d})\")",
     "    assert all(a - b == ITEMS[c][1] for c, (a, b) in enumerate(split_c)), split_c",
     "    assert all(b - a == ITEMS[c][1] for c, (a, b) in enumerate(split_w)), split_w",
     "    print(f\"\\n  the gap is always exactly the straddling event's value, and its SIGN is the write\")",
     "    print(f\"  order: counter-first leaves the dashboard high, warehouse-first leaves it low.\")",
     "    # and no crash point escapes, in either order",
     "    assert not any(a == b for a, b in split_c) and not any(a == b for a, b in split_w)",
     "    assert max(a - b for a, b in split_c) == 9 == max(v for _, v in ITEMS)",
     "",
     "    # ---- the precise difference between inconsistency and staleness",
     "    impossible = [(c, p) for c, p in enumerate(split_c) if p[0] != p[1]]",
     "    not_a_moment = [(c, p) for c, p in enumerate(split_c)",
     "                    if not any(p[0] == t and p[1] == t for t in legal)]",
     "    print(f\"\\n  of the {N} dual-write crash states, {len(not_a_moment)} correspond to NO moment in the\")",
     "    print(f\"  stream: the pair (counter, warehouse) is not (T, T) for any legal total T.\")",
     "    assert len(not_a_moment) == N and len(impossible) == N",
     "    # the derived design: every crash state is a PAST moment, which is the whole claim",
     "    lags = []",
     "    for c in range(N + 1):",
     "        cnt, rows, lag = derived(ITEMS, c if c < N else None)",
     "        wh = rebuild(rows)",
     "        assert cnt in legal and wh in legal, (c, cnt, wh)",
     "        assert cnt <= wh, (c, cnt, wh)",
     "        assert legal.index(cnt) == legal.index(wh) - lag, (c, cnt, wh, lag)",
     "        lags.append(lag)",
     "    print(f\"  of the {N} derived crash states and the uninterrupted run, ALL are a legal total\")",
     "    print(f\"  paired with an earlier legal total -- the counter is behind by {min(lags)} to {max(lags)}\")",
     "    print(f\"  events and never wrong.\")",
     "    assert max(lags) == REBUILD_EVERY - 1, (lags, REBUILD_EVERY)",
     "    assert min(lags) == 0, lags",
     "    print(f\"  the lag is bounded by the rebuild interval ({REBUILD_EVERY}), so it is a number you choose,\")",
     "    print(f\"  not a number you discover after an incident.\")",
     "    # the bound is the parameter, measured across several intervals",
     "    for every in (1, 2, 3, 5, 9, 20):",
     "        worst = max(derived(ITEMS, c, every)[2] for c in range(N + 1))",
     "        assert worst == min(every - 1, N), (every, worst)",
     "    print(f\"  rebuild every 1,2,3,5,9,20 events -> worst lag 0,1,2,4,8,{min(20 - 1, N)} events: exactly the\")",
     "    print(f\"  interval minus one, until the interval exceeds the stream.\")",
     "",
     "    # ---- the retry, which is the fix everybody reaches for",
     "    r_counter, r_wh, r_rows = retry_until_written(ITEMS, crash_at=4, attempts=2)",
     "    print(f\"\\n  retrying the writes for event 4 twice: counter {r_counter}, warehouse {r_wh}\")",
     "    assert r_wh == CORRECT, r_wh",

     "    print(f\"  the warehouse is still {r_wh} because its row is keyed by event id, so writing it\")",
     "    print(f\"  twice is writing it once.  The counter is {r_counter}, high by {r_counter - CORRECT} -- an increment\")",
     "    print(f\"  has no key, so a retry is a second event.  THAT asymmetry is what decides which\")",
     "    print(f\"  store can be the source of truth: the one whose write can be repeated safely.\")",
     "    for c in range(N):",
     "        assert retry_until_written(ITEMS, c, attempts=2)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[0] == CORRECT + 2 * ITEMS[c][1], c",
     "    print(f\"  at every crash point and for 2 or 3 attempts: the warehouse is always {CORRECT}, and the\")",
     "    print(f\"  counter is high by one or two copies of the retried event.\")",
     "",
     "    # ---- reconciliation, and which direction it has to run",
     "    for c in range(N):",
     "        cc, wc, rows = dual_write(ITEMS, c, counter_first=True)",
     "        g_cnt, g_total, g_rows = reconcile(cc, rows, \"from_warehouse\")",
     "        b_cnt, b_total, b_rows = reconcile(cc, rows, \"from_counter\")",
     "        assert g_cnt == g_total == rebuild(g_rows) and g_total in legal, (c, g_total)",
     "        assert b_cnt == b_total, \"writing the counter into the warehouse does make them agree\"",

     "        # total -- what was illegal was the PAIR, not either number.  The real damage is one",

     "",
     "    # ---- the boundary a zero-valued event creates",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 3 — the counter in two places (looks like analytics). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    event      -- one thing that happened, carrying a number to count.  Events are numbered",
     "                  0, 1, 2, ... in arrival order; here their values are 5, 3, 7, 2, 6, 1, 9,",
     "                  4, 8, which add up to 45.",
     "    counter    -- a single running total in a fast store, read by the live dashboard.",
     "    warehouse  -- an append-only table of rows, one per event, read by the monthly report.",
     "                  \"The warehouse total\" means the sum of the rows it holds.",
     "    the answer -- always a PAIR: (what the counter says, what the warehouse total says).",
     "                  They agree only when both writes for every event landed.",
     "    crash at k -- the worker is killed between its TWO writes for event k, so one store has",
     "                  event k and the other does not.  \"No crash\" means it ran to the end.",
     "    derived@m  -- the alternative design: only the warehouse is written per event, and the",
     "                  counter is REBUILT from it every m events.  Its disagreement is a lag.",
     "",
     "  Every event has to increment the counter, for the dashboard, and append a row to the",
     "  warehouse, for the report, and the two live in different systems so there is no",
     "  transaction to put them in.  BOTH MUST AGREE.  The nine events above let the stream pass",
     "  legitimately through exactly ten totals: 0, 5, 8, 15, 17, 23, 24, 33, 37, 45.",
     "",
     "  GIVEN A CRASH POINT AND A DESIGN, WHAT DOES EACH STORE SAY AFTERWARDS?",
     "",
     "  Worked, as (counter, warehouse) on the nine events above -- which between them define",
     "  crash points 0..8 only:",
     "    counter first, crash at 0   -> (5, 0)      the earliest crash: the counter has the first",
     "                                               event and the warehouse has nothing",
     "    counter first, crash at 4   -> (23, 17)    an ordinary middle crash.  BOTH numbers are",
     "                                               legitimate totals, and the pair is not: no",
     "                                               moment in the stream ever had those two",
     "    counter first, crash at 8   -> (45, 37)    the last event there is: the dashboard is",
     "                                               complete and the report is one event short",
     "    counter first, no crash     -> (45, 45)    they agree, which is the only acceptable end",
     "    counter first, crash at 99  -> (45, 45)    off the end: there is no event 99, so the",
     "                                               kill never fires.  The honest answer is the",
     "                                               uninterrupted run, NOT the last real crash's",
     "                                               pair -- a crash that cannot happen does nothing",
     "    warehouse first, crash at 0 -> (0, 5)      the same crash, the other write order: the",
     "                                               disagreement flips sign and does not go away",
     "    derived@3, crash at 8       -> (24, 37)    the cache is two events behind, which is its",
     "                                               bound, and 24 was a real total two events ago",
     "    derived@20, no crash        -> (0, 45)     a rebuild interval longer than the whole",
     "                                               stream: the cache never ran, and is honestly",
     "                                               stale rather than wrong",
     "    a ZERO-valued event, crash at 4 -> (17, 17)   split exactly as above, and the two stores",
     "                                               AGREE anyway -- so agreement does not prove",
     "                                               the two writes both landed",
     "  And on 3,000 events of 7 each (21,000 in all):",
     "    counter first, crash at 1500 -> (10507, 10500)   off by one event out of three thousand",
     "    derived@500, crash at 1700   -> (10500, 11900)   200 events of lag, inside its bound of",
     "                                                      499 (the interval minus one)",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the program and against an independent formula for the same pair -- so these",
     "  answers cannot drift from what the program returns.",
     "",
     "Two outputs rather than one output and a position, so there is no store the bookkeeping can",
     "live in and the chapter's transaction is genuinely unavailable -- `together` has nothing to be",
     "together IN.  The honest answer is that it cannot be made exact, and the useful answer is to",
     "pick one store as the source of truth and DERIVE the other from it: the fast counter becomes a",
     "cache rebuilt from the warehouse rather than a second authority, so disagreement becomes",
     "STALENESS instead of INCONSISTENCY.  The difference is made precise below -- a dual-written",
     "pair can land in a state that corresponds to no moment in the event stream at all, while a",
     "derived pair always corresponds to some earlier moment.  The skill is noticing that \"both must",
     "agree\" is a request to have two sources of truth, and declining it.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 19 input/output pairs -- the first and last",
     "event of the stream as crash points, an ordinary middle one, both sides of the crash boundary",
     "(the last event versus no crash at all) in both write orders, a crash point past the end that",
     "never fires, the rebuild interval on both sides of the staleness bound (every event, every 3,",
     "and an interval longer than the whole stream), the zero-valued event that makes the two stores",
     "AGREE while still being split, a one-event stream, an empty stream that has nothing to split,",
     "and a 3,000-event stream at scale; each row prints what both designs cost for that same input.",
     "",
     "Run it:  python3 programs/ch05_v3.py",
     "\"\"\"",
     "",
     "import random",
     "",
     "# The chapter's nine items, unchanged.  All values DISTINCT and none zero, for the chapter's",
     "# reason: an event with no effect would make a disagreement invisible, and two equal values",
     "# would stop a wrong total from identifying which event was lost.  A zero IS injected further",
     "# down, precisely to show what it hides.",
     "ITEMS = [(0, 5), (1, 3), (2, 7), (3, 2), (4, 6), (5, 1), (6, 9), (7, 4), (8, 8)]",
     "CORRECT = sum(v for _, v in ITEMS)          # 45, the chapter's total",
     "N = len(ITEMS)",
     "",
     "# How many events between cache rebuilds, for the derived design.  3 is small enough to trace",
     "# and large enough that the cache is visibly behind.",
     "REBUILD_EVERY = 3",
     "",
     "# A stream with a zero-valued event, a one-event stream, an empty stream, and a 3,000-event",
     "# stream at scale.  These are inputs for the examples table, not alternative versions of the",
     "# problem.  The big stream's values are all equal, which is fine because those rows test SCALE",
     "# and not whether a wrong total identifies which event was lost.",
     "WITH_ZERO = ITEMS[:4] + [(99, 0)] + ITEMS[4:]",
     "ONE_EVENT = [(0, 5)]",
     "EMPTY_STREAM = []",
     "BIG_ITEMS = [(i, 7) for i in range(3_000)]",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, items, design, crash_at, (counter, warehouse total)).  \"derived@k\"",
     "# rebuilds the cache every k events.  Every row is asserted by show_examples() against the",
     "# program AND against an independent formula for the same pair, which is why the table is data",
     "# and not a comment: a comment can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"counter-first, crash on the FIRST event\",  ITEMS,        \"counter_first\",   0,     (5, 0)),",
     "    (\"counter-first, ordinary middle event\",     ITEMS,        \"counter_first\",   4,     (23, 17)),",
     "    (\"counter-first, crash on the LAST event\",   ITEMS,        \"counter_first\",   8,     (45, 37)),",
     "    (\"counter-first, no crash at all\",           ITEMS,        \"counter_first\",   None,  (45, 45)),",
     "    (\"crash point past the end never fires\",     ITEMS,        \"counter_first\",   99,    (45, 45)),",
     "    (\"warehouse-first, FIRST event (sign flip)\", ITEMS,        \"warehouse_first\", 0,     (0, 5)),",
     "    (\"warehouse-first, crash on the LAST event\", ITEMS,        \"warehouse_first\", 8,     (37, 45)),",
     "    (\"derived@3, crash before anything ran\",     ITEMS,        \"derived@3\",       0,     (0, 0)),",
     "    (\"derived@3, middle event, lag 1\",           ITEMS,        \"derived@3\",       4,     (15, 17)),",
     "    (\"derived@3, LAST event, lag 2 (the bound)\", ITEMS,        \"derived@3\",       8,     (24, 37)),",
     "    (\"derived@3, no crash -> caught up\",         ITEMS,        \"derived@3\",       None,  (45, 45)),",
     "    (\"derived@1, rebuild every event, lag 0\",    ITEMS,        \"derived@1\",       8,     (37, 37)),",
     "    (\"derived@20, interval > whole stream\",      ITEMS,        \"derived@20\",      None,  (0, 45)),",
     "    (\"a ZERO-valued event: the pair AGREES\",     WITH_ZERO,    \"counter_first\",   4,     (17, 17)),",
     "    (\"one-event stream, crash on it\",            ONE_EVENT,    \"counter_first\",   0,     (5, 0)),",
     "    (\"empty stream: nothing to split\",           EMPTY_STREAM, \"counter_first\",   0,     (0, 0)),",
     "    (\"3,000 events, counter-first, midway\",      BIG_ITEMS,    \"counter_first\",   1500,  (10507, 10500)),",
     "    (\"3,000 events, derived@500, lag 200\",       BIG_ITEMS,    \"derived@500\",     1700,  (10500, 11900)),",
     "    (\"3,000 events, derived@500, no crash\",      BIG_ITEMS,    \"derived@500\",     None,  (21000, 21000)),",
     "]",
     "",
     "",
     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",
     "    CONSISTENT only if both hold one of these, and the SAME one; it is stale if they hold two",
     "    different ones, and impossible if either holds something not in this list.\"\"\"",
     "    out, run = [0], 0",
     "    for _, v in items:",
     "        run += v",
     "        out.append(run)",
     "    return out",
     "",
     "",
     "def dual_write(items, crash_at, counter_first=True):",
     "    \"\"\"Two writes per event to two different systems, with no transaction available.",
     "",
     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",
     "    `attempts` replays the increment, which is where the asymmetry shows: incrementing twice",
     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def reconcile(counter, rows, direction):",
     "    \"\"\"A repair pass over a split pair.  Returns (counter, reported_warehouse_total, rows).",
     "",
     "    \"from_warehouse\" recomputes the counter from the rows: the pair agrees AND the reported",
     "    total still equals the sum of the detail.",
     "    \"from_counter\" writes the counter's value into the warehouse's reported total and leaves",
     "    the rows alone.  The pair agrees too -- and the warehouse's own total no longer matches its",
     "    own rows, which is a worse condition than being behind, because nothing downstream can",
     "    detect it by comparing stores.  Both are one line, and one of them is the derived design",
     "    with extra steps.\"\"\"",
     "    if direction == \"from_warehouse\":",
     "        return rebuild(rows), rebuild(rows), rows",
     "    return counter, counter, rows",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, twice over.",
     "",
     "    The second check is an independent formula for the pair -- prefix sums of the values,",
     "    with no reference to dual_write or derived -- so a row has to agree with the program and",
     "    with the rule the program claims to implement.",
     "",
     "    The two cost columns are for the SAME input on BOTH designs, so each row shows which one",
     "    is cheaper for it.  `dual` counts durable writes (two per event, one for the event the",
     "    crash straddles).  `derv` counts the one write per event PLUS the rows each rebuild has to",
     "    re-read, because rebuild() sums the whole warehouse every time.  That is why the derived",
     "    design LOSES on every row that runs to the end with a rebuild, on the every-event rebuild",
     "    and on the long-stream rows: its correctness is free and its freshness is not, and a short",
     "    rebuild interval on a long stream is the expensive corner.  Where it wins, few or no",
     "    rebuilds had been paid for yet -- an early crash, or an interval longer than the stream.",
     "    The tally of the `cheaper` column is printed under the table rather than asserted here.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':40s} {'events':>6} {'design':>15} {'crash':>5} \"",
     "          f\"{'counter':>8} {'wh':>8} {'lag':>4} {'dual':>6} {'derv':>7} {'cheaper':>8}\")",
     "    tally = {'derived': 0, 'dual': 0, 'tie': 0}",
     "    for label, items, design, crash_at, want in EXAMPLES:",
     "        vals = [v for _, v in items]",
     "        n = len(items)",
     "        m = n if crash_at is None else min(crash_at, n)      # events that completed a row",
     "        every = int(design.split(\"@\")[1]) if \"@\" in design else REBUILD_EVERY",
     "",
     "        if design.startswith(\"derived\"):",
     "            counter, rows, lag = derived(items, crash_at, every)",
     "            wh = rebuild(rows)",
     "            caught = (m // every) * every",
     "            ref = (sum(vals[:caught]), sum(vals[:m]))",
     "            assert lag == m - caught, (label, lag, m - caught)",
     "        else:",
     "            first = design == \"counter_first\"",
     "            counter, wh, rows = dual_write(items, crash_at, counter_first=first)",
     "            lag = 0",
     "            if m < n:                                        # the crash really landed",
     "                ahead, behind = sum(vals[:m + 1]), sum(vals[:m])",
     "                ref = (ahead, behind) if first else (behind, ahead)",
     "            else:",
     "                ref = (sum(vals), sum(vals))",
     "",
     "        assert (counter, wh) == want, (label, (counter, wh), want)",
     "        assert ref == want, (label, 'the rule disagrees', ref, want)",
     "        assert wh == sum(v for _, v in rows), (label, wh, rows)",
     "",
     "        dual = 2 * m + (1 if m < n else 0)",
     "        r = m // every",
     "        derv = m + every * r * (r + 1) // 2",
     "        cheaper = 'derived' if derv < dual else 'dual' if dual < derv else 'tie'",
     "        tally[cheaper] += 1",
     "        crash = 'none' if crash_at is None else str(crash_at)",
     "        print(f\"{label:40s} {n:>6} {design:>15} {crash:>5} \"",
     "              f\"{counter:>8} {wh:>8} {lag:>4} {dual:>6} {derv:>7} {cheaper:>8}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the prefix sums of their own stream\")",
     "    assert sum(tally.values()) == len(EXAMPLES), tally",
     "    print(f\"cheaper: derived on {tally['derived']} rows, dual on {tally['dual']}, \"",
     "          f\"tie on {tally['tie']}\")",
     "    print()",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    legal = prefixes(ITEMS)",
     "    print(\"ITEMS =\", \"  \".join(f\"{e}:{v}\" for e, v in ITEMS), f\"  total {CORRECT}\")",
     "    print(f\"the {len(legal)} totals the stream legitimately passes through: {legal}\\n\")",
     "",
     "    # ---- the dual write, at every crash point and in both orders",
     "    print(f\"  {'crash':>5}  {'counter-first':>22}  {'warehouse-first':>22}\")",
     "    split_c, split_w = [], []",
     "    for c in range(N):",
     "        cc, wc, _ = dual_write(ITEMS, c, counter_first=True)",
     "        cw, ww, _ = dual_write(ITEMS, c, counter_first=False)",
     "        split_c.append((cc, wc))",
     "        split_w.append((cw, ww))",
     "        print(f\"  {c:>5}  counter {cc:>3}  wh {wc:>3} ({cc - wc:+d})  \"",
     "              f\"counter {cw:>3}  wh {ww:>3} ({cw - ww:+d})\")",
     "    assert all(a - b == ITEMS[c][1] for c, (a, b) in enumerate(split_c)), split_c",
     "    assert all(b - a == ITEMS[c][1] for c, (a, b) in enumerate(split_w)), split_w",
     "    print(f\"\\n  the gap is always exactly the straddling event's value, and its SIGN is the write\")",
     "    print(f\"  order: counter-first leaves the dashboard high, warehouse-first leaves it low.\")",
     "    # and no crash point escapes, in either order",
     "    assert not any(a == b for a, b in split_c) and not any(a == b for a, b in split_w)",
     "    assert max(a - b for a, b in split_c) == 9 == max(v for _, v in ITEMS)",
     "",
     "    # ---- the precise difference between inconsistency and staleness",
     "    impossible = [(c, p) for c, p in enumerate(split_c) if p[0] != p[1]]",
     "    not_a_moment = [(c, p) for c, p in enumerate(split_c)",
     "                    if not any(p[0] == t and p[1] == t for t in legal)]",
     "    print(f\"\\n  of the {N} dual-write crash states, {len(not_a_moment)} correspond to NO moment in the\")",
     "    print(f\"  stream: the pair (counter, warehouse) is not (T, T) for any legal total T.\")",
     "    assert len(not_a_moment) == N and len(impossible) == N",
     "    # the derived design: every crash state is a PAST moment, which is the whole claim",
     "    lags = []",
     "    for c in range(N + 1):",
     "        cnt, rows, lag = derived(ITEMS, c if c < N else None)",
     "        wh = rebuild(rows)",
     "        assert cnt in legal and wh in legal, (c, cnt, wh)",
     "        assert cnt <= wh, (c, cnt, wh)",
     "        assert legal.index(cnt) == legal.index(wh) - lag, (c, cnt, wh, lag)",
     "        lags.append(lag)",
     "    print(f\"  of the {N} derived crash states and the uninterrupted run, ALL are a legal total\")",
     "    print(f\"  paired with an earlier legal total -- the counter is behind by {min(lags)} to {max(lags)}\")",
     "    print(f\"  events and never wrong.\")",
     "    assert max(lags) == REBUILD_EVERY - 1, (lags, REBUILD_EVERY)",
     "    assert min(lags) == 0, lags",
     "    print(f\"  the lag is bounded by the rebuild interval ({REBUILD_EVERY}), so it is a number you choose,\")",
     "    print(f\"  not a number you discover after an incident.\")",
     "    # the bound is the parameter, measured across several intervals",
     "    for every in (1, 2, 3, 5, 9, 20):",
     "        worst = max(derived(ITEMS, c, every)[2] for c in range(N + 1))",
     "        assert worst == min(every - 1, N), (every, worst)",
     "    print(f\"  rebuild every 1,2,3,5,9,20 events -> worst lag 0,1,2,4,8,{min(20 - 1, N)} events: exactly the\")",
     "    print(f\"  interval minus one, until the interval exceeds the stream.\")",
     "",
     "    # ---- the retry, which is the fix everybody reaches for",
     "    r_counter, r_wh, r_rows = retry_until_written(ITEMS, crash_at=4, attempts=2)",
     "    print(f\"\\n  retrying the writes for event 4 twice: counter {r_counter}, warehouse {r_wh}\")",
     "    assert r_wh == CORRECT, r_wh",
     "    assert r_counter == CORRECT + ITEMS[4][1], (r_counter, CORRECT)",
     "    print(f\"  the warehouse is still {r_wh} because its row is keyed by event id, so writing it\")",
     "    print(f\"  twice is writing it once.  The counter is {r_counter}, high by {r_counter - CORRECT} -- an increment\")",
     "    print(f\"  has no key, so a retry is a second event.  THAT asymmetry is what decides which\")",
     "    print(f\"  store can be the source of truth: the one whose write can be repeated safely.\")",
     "    for c in range(N):",
     "        assert retry_until_written(ITEMS, c, attempts=2)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[1] == CORRECT, c",
     "        assert retry_until_written(ITEMS, c, attempts=3)[0] == CORRECT + 2 * ITEMS[c][1], c",
     "    print(f\"  at every crash point and for 2 or 3 attempts: the warehouse is always {CORRECT}, and the\")",
     "    print(f\"  counter is high by one or two copies of the retried event.\")",
     "",
     "    # ---- reconciliation, and which direction it has to run",
     "    for c in range(N):",
     "        cc, wc, rows = dual_write(ITEMS, c, counter_first=True)",
     "        g_cnt, g_total, g_rows = reconcile(cc, rows, \"from_warehouse\")",
     "        b_cnt, b_total, b_rows = reconcile(cc, rows, \"from_counter\")",
     "        assert g_cnt == g_total == rebuild(g_rows) and g_total in legal, (c, g_total)",
     "        assert b_cnt == b_total, \"writing the counter into the warehouse does make them agree\"",
     "        # CORRECTED.  The expectation was that this lands on a total the stream never had.  It",
     "        # does not: counter-first leaves the counter holding prefix total c+1, which IS a legal",
     "        # total -- what was illegal was the PAIR, not either number.  The real damage is one",
     "        # level down: the warehouse's reported total no longer equals the sum of its own rows,",
     "        # so the corruption is invisible to any check that compares the two stores.",
     "        assert b_total in legal, (c, b_total)",
     "        assert b_total != rebuild(b_rows), (c, b_total, rebuild(b_rows))",
     "        assert b_total - rebuild(b_rows) == ITEMS[c][1], (c, b_total)",
     "    print(f\"\\n  repairing the {N} split pairs: recomputing the counter FROM the warehouse makes the\")",
     "    print(f\"  pair agree and leaves the warehouse's total equal to the sum of its own rows.\")",
     "    print(f\"  Copying the counter INTO the warehouse also makes the pair agree, on a total that\")",
     "    print(f\"  is even a legal one -- but the warehouse's total is then high by the missing row's\")",
     "    print(f\"  value at every crash point, so comparing the two stores can no longer detect it.\")",
     "    print(f\"  and note what the working repair reads: the warehouse.  It was the source of\")",
     "    print(f\"  truth all along, and the reconcile job is the derived design with extra steps.\")",
     "",
     "    # ---- the boundary a zero-valued event creates",
     "    with_zero = ITEMS[:4] + [(99, 0)] + ITEMS[4:]",
     "    zc, zw, _ = dual_write(with_zero, 4, counter_first=True)",
     "    print(f\"\\n  inject one event with value 0 and crash on it: counter {zc}, warehouse {zw} -- they\")",
     "    print(f\"  AGREE, and the process still died between two writes.\")",
     "    assert zc == zw, (zc, zw)",
     "    assert dual_write(with_zero, 4)[0] == dual_write(with_zero, 4)[1]",
     "    # ...and the agreement is not consistency: the row is missing from the warehouse",
     "    _, _, zrows = dual_write(with_zero, 4, counter_first=True)",
     "    assert (99, 0) not in zrows, zrows",
     "    assert len(zrows) == 4, zrows",
     "    print(f\"  the row {(99, 0)} is missing from the warehouse all the same, so the row COUNT is\")",
     "    print(f\"  wrong while the total is right.  Equal totals are evidence of nothing, which is\")",
     "    print(f\"  why the chapter's items are all non-zero and distinct.\")",
     "",
     "    # ---- many streams, every crash point, both designs",
     "    rng = random.Random(20260303)",
     "    for _ in range(400):",
     "        n = rng.randint(1, 12)",
     "        items = [(i, rng.randint(1, 40)) for i in range(n)]",
     "        legal_i = prefixes(items)",
     "        for c in range(n):",

     "def prefixes(items):",
     "    \"\"\"Every total the stream legitimately passes through, in order.  A pair of stores is",

     "    \"\"\"Two writes per event to two different systems, with no transaction available.",

     "    `crash_at` kills the process between the two writes of that event, which is the only",
     "    instant that matters.  Returns (counter, warehouse_total, rows).  Whichever store is",
     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",
     "                break",
     "            counter += v",
     "    return counter, sum(v for _, v in rows), rows",
     "",
     "",
     "def rebuild(rows):",
     "    \"\"\"The cache, computed from the warehouse.  This is the whole of the derived design: one",
     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",
     "",
     "",
     "def derived(items, crash_at, rebuild_every=REBUILD_EVERY):",
     "    \"\"\"One durable write per event -- the warehouse row -- and a counter REBUILT from it.",
     "",
     "    There is no second authority to fall out of step, so a crash cannot split anything: the",
     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",
     "    where lag is how many events the counter is behind at the end.\"\"\"",
     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",
     "        rows.append((eid, v))                  # the one durable write",
     "        since += 1",
     "        if since >= rebuild_every:",
     "            counter = rebuild(rows)            # the cache catches up",
     "            since = 0",
     "    return counter, rows, since",
     "",
     "",
     "def retry_until_written(items, crash_at, attempts=2):",
     "    \"\"\"The appealing fix: if the second write fails, RETRY it.",
     "",
     "    It closes the gap whenever the process survives long enough to retry, and it does nothing",
     "    for a crash, because a crash is not a failed call -- there is nobody left to retry.",

     "    counts twice, while appending a keyed row twice is the same row.\"\"\"",
     "    counter, rows = 0, []",
     "    for i, (eid, v) in enumerate(items):",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            counter += v                       # NOT idempotent: each retry moves the balance",
     "        for _ in range(attempts if i == crash_at else 1):",
     "            rows = [r for r in rows if r[0] != eid] + [(eid, v)]   # keyed: idempotent",
     "    return counter, sum(v for _, v in rows), rows",
     "",

     "    with extra steps.\"\"\"",

     "    \"\"\"Two writes per event to two different systems, with no transaction available.",

     "    written first ends up ahead, so the ORDER chooses which store lies, and nothing chooses",
     "    whether one does.\"\"\"",

     "    for i, (eid, v) in enumerate(items):",
     "        if counter_first:",
     "            counter += v",
     "            if i == crash_at:",
     "                break",
     "            rows.append((eid, v))",
     "        else:",
     "            rows.append((eid, v))",
     "            if i == crash_at:",

     "            counter += v",

     "    function, no state of its own, and nothing it can disagree with.\"\"\"",
     "    return sum(v for _, v in rows)",

     "    counter either shows the current total or an earlier one.  Returns (counter, rows, lag),",

     "    rows, counter, since = [], 0, 0",
     "    for i, (eid, v) in enumerate(items):",
     "        if i == crash_at:",
     "            break",

     "        if since >= rebuild_every:",
