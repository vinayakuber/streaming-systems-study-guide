     "def true_scores(signals):",
     "    \"\"\"The requirement, written out directly: every point an account ever earned.\"\"\"",
     "    out = {}",
     "    for acct, pts, _ in signals:",
     "        out[acct] = out.get(acct, 0) + pts",
     "    return out",
     "",
     "",
     "def score_in_memory_forever(signals):",
     "    \"\"\"Answer one: keep every account's score in memory and never release it.",
     "",
     "    Correct, and it is the answer the requirement literally asks for, which is why it is the",
     "    one to put first.  Its state is one number per account EVER SEEN, and that count only",
     "    rises, so the process is a slow leak with a correct output.  Returns (scores, peak_held).",
     "    \"\"\"",
     "    acc, peak = {}, 0",
     "    for acct, pts, _ in signals:",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        peak = max(peak, len(acc))",
     "    return acc, peak",
     "",
     "",
     "def score_with_expiry(signals, ttl):",
     "    \"\"\"Answer two: the chapter's bound, applied to the score.",
     "",
     "    Memory becomes bounded by active accounts, and a dormant account's score is deleted.  The",
     "    next event from it looks like a first event, so the score restarts at zero -- which is not",
     "    a degraded answer but the WRONG answer to the question asked, and an answer an adversary",
     "    can arrange.  Returns (scores_in_memory, peak_held, restarts).",
     "    \"\"\"",
     "    acc, last, restarts, peak = {}, {}, 0, 0",
     "    seen_before = set()",
     "    for acct, pts, t in signals:",
     "        for old in [k for k in acc if t - last[k] > ttl]:",
     "            del acc[old]",
     "            del last[old]",
     "        if acct not in acc and acct in seen_before:",
     "            restarts += 1",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        last[acct] = t",
     "        seen_before.add(acct)",
     "        peak = max(peak, len(acc))",
     "    return acc, peak, restarts",
     "",
     "",
     "def score_in_a_store(signals):",
     "    \"\"\"Answer three: the score is not stream state.  Read it, add to it, write it back, and",
     "    hold nothing.",
     "",
     "    The mechanism is that the streaming layer's memory no longer depends on the account count",
     "    at all -- between two events it holds zero scores, so there is no quantity to bound and",
     "    the memory question has been dissolved rather than answered.  The cost moves to the store:",
     "    one read and one write per event.  Returns (store, held_between_events, store_ops).",
     "    \"\"\"",
     "    store, high_water, ops = {}, 0, 0",
     "    for acct, pts, _ in signals:",
     "        held = {}                                  # the streaming layer, between events",
     "        high_water = max(high_water, len(held))",
     "        held[acct] = store.get(acct, 0) + pts      # read",
     "        ops += 1",
     "        store[acct] = held.pop(acct)               # update, write, forget",
     "        ops += 1",
     "    return store, high_water, ops",
     "",
     "",
     "def score_with_cache(signals, capacity):",
     "    \"\"\"Answer three with the obvious optimisation: a cache of `capacity` accounts in front of",
     "    the store, evicting the least recently used.",
     "",
     "    This is the chapter's bound again -- a fixed number of accounts in memory and the rest",
     "    dropped -- and it is CORRECT at every capacity, including zero.  The difference is one",
     "    line: an evicted account is written to the store on its way out, so the next event for it",
     "    reads the score back rather than starting from nothing.  A miss costs a read; an expiry",
     "    cost the answer.  Returns (scores, store_reads, store_writes, peak_held).",
     "    \"\"\"",
     "    store, cache = {}, {}",
     "    reads = writes = peak = 0",
     "    for acct, pts, _ in signals:",
     "        if acct in cache:",
     "            val = cache.pop(acct)                  # a hit, and it becomes most-recent below",
     "        else:",
     "            reads += 1",
     "            val = store.get(acct, 0)               # a miss: the score is still there",
     "        cache[acct] = val + pts",
     "        while len(cache) > capacity:",
     "            oldest = next(iter(cache))             # dicts keep insertion order: LRU first",
     "            store[oldest] = cache.pop(oldest)",
     "            writes += 1",
     "        peak = max(peak, len(cache))",
     "    for acct, val in cache.items():",
     "        store[acct] = val",
     "        writes += 1",
     "    return store, reads, writes, peak",
     "",
     "",
     "def held_at(signals, ttl, t):",
     "    \"\"\"How many scores an expiring memory holds on day t, if nothing arrives then.  Counting",
     "    at the end of the run is the wrong measurement, because an expiry is immediately followed",
     "    by the event that re-creates the entry.\"\"\"",
     "    last = {}",
     "    for acct, _, at in signals:",
     "        if at <= t:",
     "            last[acct] = at",
     "    return sum(1 for a in last if t - last[a] <= ttl)",
     "",

     "def score_in_memory_forever(signals):",

     "    return acc, peak",

     "            del last[old]",

     "        last[acct] = t",
     "        seen_before.add(acct)",

     "    for label, signals, ttl, cap, want_expiry, want_restarts in EXAMPLES:",
     "        truth = true_scores(signals)",
     "        forever, _ = score_in_memory_forever(signals)",
     "        stored, held_between, _ = score_in_a_store(signals)",
     "        cached, reads, writes, _ = score_with_cache(signals, cap)",
     "        expired, _, restarts = score_with_expiry(signals, ttl)",
     "        day = max((t for *_, t in signals), default=0)",
     "        held = held_at(signals, INFINITY, day)",
     "        held_ttl = held_at(signals, ttl, day)",
     "        true_total = sum(truth.values())",
     "        assert sum(expired.values()) == want_expiry, (label, sum(expired.values()), want_expiry)",
     "        assert restarts == want_restarts, (label, restarts, want_restarts)",
     "        assert forever == truth, (label, \"keeping everything must be exact\")",
     "        assert stored == truth, (label, \"the store must be exact\")",
     "        assert cached == truth, (label, \"and so must the cache, at every capacity\")",
     "        assert held_between == 0, (label, \"the streaming layer holds nothing between events\")",
     "        for acct in truth:",
     "            assert expired.get(acct, 0) <= truth[acct], (label, acct)   # only ever too low",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",

     "              f\"{held - held_ttl:>6,} {reads:>6,} {writes:>7,}\")",

     "",
     "def true_scores(signals):",
     "    \"\"\"The requirement, written out directly: every point an account ever earned.\"\"\"",
     "    out = {}",
     "    for acct, pts, _ in signals:",
     "        out[acct] = out.get(acct, 0) + pts",
     "    return out",
     "",
     "",
     "def score_in_memory_forever(signals):",
     "    \"\"\"Answer one: keep every account's score in memory and never release it.",
     "",
     "    Correct, and it is the answer the requirement literally asks for, which is why it is the",
     "    one to put first.  Its state is one number per account EVER SEEN, and that count only",
     "    rises, so the process is a slow leak with a correct output.  Returns (scores, peak_held).",
     "    \"\"\"",
     "    acc, peak = {}, 0",
     "    for acct, pts, _ in signals:",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        peak = max(peak, len(acc))",
     "    return acc, peak",
     "",
     "",
     "def score_with_expiry(signals, ttl):",
     "    \"\"\"Answer two: the chapter's bound, applied to the score.",
     "",
     "    Memory becomes bounded by active accounts, and a dormant account's score is deleted.  The",
     "    next event from it looks like a first event, so the score restarts at zero -- which is not",
     "    a degraded answer but the WRONG answer to the question asked, and an answer an adversary",
     "    can arrange.  Returns (scores_in_memory, peak_held, restarts).",
     "    \"\"\"",
     "    acc, last, restarts, peak = {}, {}, 0, 0",
     "    seen_before = set()",
     "    for acct, pts, t in signals:",
     "        for old in [k for k in acc if t - last[k] > ttl]:",
     "            del acc[old]",
     "            del last[old]",
     "        if acct not in acc and acct in seen_before:",
     "            restarts += 1",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        last[acct] = t",
     "        seen_before.add(acct)",
     "        peak = max(peak, len(acc))",
     "    return acc, peak, restarts",
     "",
     "",
     "def score_in_a_store(signals):",
     "    \"\"\"Answer three: the score is not stream state.  Read it, add to it, write it back, and",
     "    hold nothing.",
     "",
     "    The mechanism is that the streaming layer's memory no longer depends on the account count",
     "    at all -- between two events it holds zero scores, so there is no quantity to bound and",
     "    the memory question has been dissolved rather than answered.  The cost moves to the store:",
     "    one read and one write per event.  Returns (store, held_between_events, store_ops).",
     "    \"\"\"",
     "    store, high_water, ops = {}, 0, 0",
     "    for acct, pts, _ in signals:",
     "        held = {}                                  # the streaming layer, between events",
     "        high_water = max(high_water, len(held))",
     "        held[acct] = store.get(acct, 0) + pts      # read",
     "        ops += 1",
     "        store[acct] = held.pop(acct)               # update, write, forget",
     "        ops += 1",
     "    return store, high_water, ops",
     "",
     "",
     "def score_with_cache(signals, capacity):",
     "    \"\"\"Answer three with the obvious optimisation: a cache of `capacity` accounts in front of",
     "    the store, evicting the least recently used.",
     "",
     "    This is the chapter's bound again -- a fixed number of accounts in memory and the rest",
     "    dropped -- and it is CORRECT at every capacity, including zero.  The difference is one",
     "    line: an evicted account is written to the store on its way out, so the next event for it",
     "    reads the score back rather than starting from nothing.  A miss costs a read; an expiry",
     "    cost the answer.  Returns (scores, store_reads, store_writes, peak_held).",
     "    \"\"\"",
     "    store, cache = {}, {}",
     "    reads = writes = peak = 0",
     "    for acct, pts, _ in signals:",
     "        if acct in cache:",
     "            val = cache.pop(acct)                  # a hit, and it becomes most-recent below",
     "        else:",
     "            reads += 1",
     "            val = store.get(acct, 0)               # a miss: the score is still there",
     "        cache[acct] = val + pts",
     "        while len(cache) > capacity:",
     "            oldest = next(iter(cache))             # dicts keep insertion order: LRU first",
     "            store[oldest] = cache.pop(oldest)",
     "            writes += 1",
     "        peak = max(peak, len(cache))",
     "    for acct, val in cache.items():",
     "        store[acct] = val",
     "        writes += 1",
     "    return store, reads, writes, peak",
     "",
     "",
     "def held_at(signals, ttl, t):",
     "    \"\"\"How many scores an expiring memory holds on day t, if nothing arrives then.  Counting",
     "    at the end of the run is the wrong measurement, because an expiry is immediately followed",
     "    by the event that re-creates the entry.\"\"\"",
     "    last = {}",
     "    for acct, _, at in signals:",
     "        if at <= t:",
     "            last[acct] = at",
     "    return sum(1 for a in last if t - last[a] <= ttl)",
     "",
     "",

     "      ttl = 295             -> (24, 0)   the pair is kept together",
     "      ttl = 294             -> (4, 1)    one day tighter and the 20 is WASHED: the same",
     "                                         bound that merely costs time in the cache is a",
     "                                         published laundering schedule here",

     "    ttl = 100, cache 64     -> (301, 0)      1,899 accounts out of memory and 1,899 histories",
     "                                             thrown away; at the nine-signal size above, the",
     "                                             same expiry saves 1 account ('b', whose",

     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted three",
     "  ways -- against the true score, the store and the cache -- so these answers cannot drift",

     "",
     "The requirement forbids every bound, which makes this the one variation where the chapter's",
     "answer is simply unavailable -- and the useful response is to stop treating the score as",
     "stream state at all.  It belongs in a store keyed by account, read and written per event, so",
     "the streaming layer holds NOTHING between events and the memory question disappears: state",
     "that must outlive the stream is not stream state.  What makes this worth running rather than",
     "asserting is the sequel.  A store read per event is expensive, so a bounded CACHE goes in",
     "front of it -- and that cache is bounded by exactly the rule the chapter used on the state,",
     "with the opposite consequence, because a cache miss RE-READS and a state expiry RESTARTS.",
     "The same bound is safe in one place and a published laundering schedule in the other.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",
     "nine signals, both sides of the 295-day dormancy the expiry turns on, a laundering pair that",
     "is washed on one side of it and kept on the other, an empty stream, a single signal, a cache",

     "table cannot drift from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch07_v4.py",
     "\"\"\"",
     "import random",
     "",
     "# The chapter's nine seed events, read as risk signals: (account, points, day).  The points",
     "# are the chapter's values, so the true lifetime scores are its 24 and 21.  Account 'a' is",
     "# silent for 295 days -- the chapter's longest gap -- which is the dormancy the requirement",
     "# is about.",
     "SIGNALS = [(\"a\", 5, 1), (\"a\", 3, 3), (\"b\", 4, 50), (\"b\", 7, 90), (\"a\", 2, 130),",
     "           (\"b\", 9, 220), (\"a\", 6, 245), (\"b\", 1, 260), (\"a\", 8, 540)]",
     "TRUE = {\"a\": 24, \"b\": 21}",

     "INFINITY = float(\"inf\")",

     "ONEOFF = 2_000",
     "BIG_TTL = 100",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty stream, one",
     "# signal, the laundering pair the dormancy allowance decides, and the asymptotic stream -- the",
     "# same shape main() measures below, built here so the table can reach it too.",
     "NO_SIGNALS = []",
     "ONE_SIGNAL = [(\"solo\", 7, 0)]",
     "LAUNDERING = [(\"mule\", 20, 0), (\"mule\", 4, DORMANCY)]",
     "BIG_SIGNALS = sorted([(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "                     + [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)],",
     "                     key=lambda e: e[2])",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, signals, ttl, cache capacity, points the EXPIRY still has, restarts).",
     "# The expiry's total is the expected value because it is the only one that moves: the store",
     "# and every cache capacity return the true score on every row, which is the point.  Every row",
     "# is asserted by show_examples(), which is why the table is data and not a comment: a comment",
     "# can go stale silently, and this cannot.",
     "EXAMPLES = [",

     "    (\"ttl = 295, the dormancy itself\",       SIGNALS,     DORMANCY,    1,  45,   0),",
     "    (\"ttl = 294, one day tighter\",           SIGNALS,   DORMANCY - 1,  1,  29,   1),",
     "    (\"ttl = 100: four restarts\",             SIGNALS,          100,    2,   8,   4),",
     "    (\"ttl = 0: the last event only\",         SIGNALS,            0,    0,   8,   7),",
     "    (\"an empty stream -> no score at all\",   NO_SIGNALS,  INFINITY,    5,   0,   0),",
     "    (\"a single signal\",                      ONE_SIGNAL,  INFINITY,    0,   7,   0),",
     "    (\"the mule at ttl = 294: washed\",        LAUNDERING, DORMANCY - 1, 1,   4,   1),",
     "    (\"the mule at ttl = 295: kept\",          LAUNDERING,  DORMANCY,    1,  24,   0),",
     "    (\"cache of 0 slots: write-through\",      SIGNALS,     INFINITY,    0,  45,   0),",
     "    (\"cache bigger than the data\",           SIGNALS,     INFINITY,   10,  45,   0),",
     "    (\"2,000 accounts, ttl 100, 64 slots\",    BIG_SIGNALS,      100,   64, 301,   0),",
     "    (\"2,000 accounts, ttl 0, no cache\",      BIG_SIGNALS,        0,    0,   1, 199),",
     "]",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, three ways.",
     "",
     "    `true_scores` is the requirement written out, so it is the reference that cannot be wrong;",
     "    every row is checked against it, against the store, and against the cache at that row's",
     "    capacity.  The cost columns are printed per row so the reader can see what each answer",
     "    buys: `saved` is the scores the expiry stops holding -- at most 1 at the chapter's scale, where",
     "    the expiry has already cost 16 of account 'a''s 24 points, and 1,899 and 2,000 on the last",
     "    two rows -- against the `reads` and `writes` the cache pays to be right at every one of them.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':36s} {'events':>7} {'ttl':>6} {'cap':>4} {'true':>6} \"",
     "          f\"{'expiry':>7} {'restarts':>9} {'held':>6} {'+ttl':>6} {'saved':>6} \"",
     "          f\"{'reads':>6} {'writes':>7}\")",
     "    for label, signals, ttl, cap, want_expiry, want_restarts in EXAMPLES:",
     "        truth = true_scores(signals)",
     "        forever, _ = score_in_memory_forever(signals)",
     "        stored, held_between, _ = score_in_a_store(signals)",
     "        cached, reads, writes, _ = score_with_cache(signals, cap)",
     "        expired, _, restarts = score_with_expiry(signals, ttl)",
     "        day = max((t for *_, t in signals), default=0)",
     "        held = held_at(signals, INFINITY, day)",
     "        held_ttl = held_at(signals, ttl, day)",
     "        true_total = sum(truth.values())",
     "        assert sum(expired.values()) == want_expiry, (label, sum(expired.values()), want_expiry)",
     "        assert restarts == want_restarts, (label, restarts, want_restarts)",
     "        assert forever == truth, (label, \"keeping everything must be exact\")",
     "        assert stored == truth, (label, \"the store must be exact\")",
     "        assert cached == truth, (label, \"and so must the cache, at every capacity\")",
     "        assert held_between == 0, (label, \"the streaming layer holds nothing between events\")",
     "        for acct in truth:",
     "            assert expired.get(acct, 0) <= truth[acct], (label, acct)   # only ever too low",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:36s} {len(signals):>7,} {ttl_s:>6} {cap:>4} {true_total:>6,} \"",
     "              f\"{sum(expired.values()):>7,} {restarts:>9,} {held:>6,} {held_ttl:>6,} \"",
     "              f\"{held - held_ttl:>6,} {reads:>6,} {writes:>7,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true lifetime score\")",
     "    print()",
     "",
     "",
     "def true_scores(signals):",
     "    \"\"\"The requirement, written out directly: every point an account ever earned.\"\"\"",
     "    out = {}",
     "    for acct, pts, _ in signals:",
     "        out[acct] = out.get(acct, 0) + pts",
     "    return out",
     "",
     "",
     "def score_in_memory_forever(signals):",
     "    \"\"\"Answer one: keep every account's score in memory and never release it.",
     "",
     "    Correct, and it is the answer the requirement literally asks for, which is why it is the",
     "    one to put first.  Its state is one number per account EVER SEEN, and that count only",
     "    rises, so the process is a slow leak with a correct output.  Returns (scores, peak_held).",
     "    \"\"\"",
     "    acc, peak = {}, 0",
     "    for acct, pts, _ in signals:",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        peak = max(peak, len(acc))",
     "    return acc, peak",
     "",
     "",
     "def score_with_expiry(signals, ttl):",
     "    \"\"\"Answer two: the chapter's bound, applied to the score.",
     "",
     "    Memory becomes bounded by active accounts, and a dormant account's score is deleted.  The",
     "    next event from it looks like a first event, so the score restarts at zero -- which is not",
     "    a degraded answer but the WRONG answer to the question asked, and an answer an adversary",
     "    can arrange.  Returns (scores_in_memory, peak_held, restarts).",
     "    \"\"\"",
     "    acc, last, restarts, peak = {}, {}, 0, 0",
     "    seen_before = set()",
     "    for acct, pts, t in signals:",
     "        for old in [k for k in acc if t - last[k] > ttl]:",
     "            del acc[old]",
     "            del last[old]",
     "        if acct not in acc and acct in seen_before:",
     "            restarts += 1",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        last[acct] = t",
     "        seen_before.add(acct)",
     "        peak = max(peak, len(acc))",
     "    return acc, peak, restarts",
     "",
     "",
     "def score_in_a_store(signals):",
     "    \"\"\"Answer three: the score is not stream state.  Read it, add to it, write it back, and",
     "    hold nothing.",
     "",
     "    The mechanism is that the streaming layer's memory no longer depends on the account count",
     "    at all -- between two events it holds zero scores, so there is no quantity to bound and",
     "    the memory question has been dissolved rather than answered.  The cost moves to the store:",
     "    one read and one write per event.  Returns (store, held_between_events, store_ops).",
     "    \"\"\"",
     "    store, high_water, ops = {}, 0, 0",
     "    for acct, pts, _ in signals:",
     "        held = {}                                  # the streaming layer, between events",
     "        high_water = max(high_water, len(held))",
     "        held[acct] = store.get(acct, 0) + pts      # read",
     "        ops += 1",
     "        store[acct] = held.pop(acct)               # update, write, forget",
     "        ops += 1",
     "    return store, high_water, ops",
     "",
     "",
     "def score_with_cache(signals, capacity):",
     "    \"\"\"Answer three with the obvious optimisation: a cache of `capacity` accounts in front of",
     "    the store, evicting the least recently used.",
     "",
     "    This is the chapter's bound again -- a fixed number of accounts in memory and the rest",
     "    dropped -- and it is CORRECT at every capacity, including zero.  The difference is one",
     "    line: an evicted account is written to the store on its way out, so the next event for it",
     "    reads the score back rather than starting from nothing.  A miss costs a read; an expiry",
     "    cost the answer.  Returns (scores, store_reads, store_writes, peak_held).",
     "    \"\"\"",
     "    store, cache = {}, {}",
     "    reads = writes = peak = 0",
     "    for acct, pts, _ in signals:",
     "        if acct in cache:",
     "            val = cache.pop(acct)                  # a hit, and it becomes most-recent below",
     "        else:",
     "            reads += 1",
     "            val = store.get(acct, 0)               # a miss: the score is still there",
     "        cache[acct] = val + pts",
     "        while len(cache) > capacity:",
     "            oldest = next(iter(cache))             # dicts keep insertion order: LRU first",
     "            store[oldest] = cache.pop(oldest)",
     "            writes += 1",
     "        peak = max(peak, len(cache))",
     "    for acct, val in cache.items():",
     "        store[acct] = val",
     "        writes += 1",
     "    return store, reads, writes, peak",
     "",
     "",
     "def held_at(signals, ttl, t):",
     "    \"\"\"How many scores an expiring memory holds on day t, if nothing arrives then.  Counting",
     "    at the end of the run is the wrong measurement, because an expiry is immediately followed",
     "    by the event that re-creates the entry.\"\"\"",
     "    last = {}",
     "    for acct, _, at in signals:",
     "        if at <= t:",
     "            last[acct] = at",
     "    return sum(1 for a in last if t - last[a] <= ttl)",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    truth = true_scores(SIGNALS)",
     "    print(\"SIGNALS =\", \"  \".join(f\"{a}@{t}:+{p}\" for a, p, t in SIGNALS))",
     "    print(f\"  true lifetime scores {truth};  account 'a' is dormant for {DORMANCY} days\\n\")",
     "",
     "    forever, peak_forever = score_in_memory_forever(SIGNALS)",
     "    expired, peak_exp, restarts = score_with_expiry(SIGNALS, DORMANCY - 1)",
     "    stored, held_between, ops = score_in_a_store(SIGNALS)",
     "    cached, reads, writes, peak_cache = score_with_cache(SIGNALS, capacity=1)",
     "    print(f\"  in memory forever   : {forever}   ({peak_forever} scores held, grows forever)\")",
     "    print(f\"  with a {DORMANCY - 1}-day expiry : {expired}   ({peak_exp} held, {restarts} restart)   WRONG\")",
     "    print(f\"  in a store          : {stored}   ({held_between} held between events, {ops} store ops)\")",
     "    print(f\"  store + 1-slot cache: {cached}   ({peak_cache} held, {reads} reads, {writes} writes)\")",
     "",
     "    assert forever == truth == {\"a\": 24, \"b\": 21}, forever",
     "    assert stored == truth, \"the store must be exact; that is the only reason to accept it\"",
     "    assert cached == truth, \"and a one-account cache must not change the answer\"",
     "    assert expired != truth and expired[\"a\"] == 8, expired",
     "    assert restarts == 1 and truth[\"a\"] - expired[\"a\"] == 16",
     "    assert held_between == 0, \"the streaming layer must hold nothing between events\"",
     "    assert ops == 2 * len(SIGNALS), ops",
     "    print(f\"\\n  the expiry lost {truth['a'] - expired['a']} of account 'a''s {truth['a']} points because it was quiet for {DORMANCY}\")",
     "    print(f\"  days and the allowance was {DORMANCY - 1}.  The store holds {held_between} scores between events, so its\")",
     "    print(f\"  memory does not depend on the account count at all -- the question is dissolved,\")",
     "    print(f\"  not answered, and the price is {ops} store operations for {len(SIGNALS)} events.\")",
     "",
     "    # the expiry's error is one-directional, and that direction is the whole problem",
     "    for acct in truth:",
     "        assert expired.get(acct, 0) <= truth[acct], acct",
     "    assert not any(expired.get(a, 0) > truth[a] for a in truth), \"it can only understate\"",
     "    laundering = [(\"mule\", 20, 0), (\"mule\", 4, DORMANCY)]",
     "    washed, _, _ = score_with_expiry(laundering, DORMANCY - 1)",
     "    kept, _, _ = score_with_expiry(laundering, DORMANCY)",
     "    assert washed == {\"mule\": 4} and kept == {\"mule\": 24}, (washed, kept)",
     "    print(f\"\\n  and the direction matters: a score can only come out too LOW.  An account that\")",
     "    print(f\"  earns 20 points, waits {DORMANCY} days and earns 4 more scores {washed['mule']} at a {DORMANCY - 1}-day allowance\")",
     "    print(f\"  and {kept['mule']} at a {DORMANCY}-day one -- so the allowance is a published schedule for\")",
     "    print(f\"  resetting a risk score, which is the one thing a risk score must not have.\")",
     "",
     "    # the cache is the same bound with the opposite consequence, at every capacity",
     "    print(f\"\\n  the same bound, on a cache instead of on the state:\")",
     "    print(f\"    {'capacity':>9} {'scores':>18} {'held':>5} {'reads':>6} {'writes':>7}\")",
     "    sweep = []",
     "    for cap in (0, 1, 2, 3, 10):",
     "        got, r, w, pk = score_with_cache(SIGNALS, cap)",
     "        sweep.append((cap, r, w, pk))",
     "        print(f\"    {cap:>9} {str(got):>18} {pk:>5} {r:>6} {w:>7}\")",
     "        assert got == truth, (cap, got)",
     "    assert all(sweep[i][1] >= sweep[i + 1][1] for i in range(len(sweep) - 1)), sweep",
     "    assert sweep[0][1] == len(SIGNALS), \"capacity 0 means every event reads the store\"",
     "    assert sweep[-1][1] == len(truth), \"a cache bigger than the data reads once per account\"",
     "    assert sweep[0][3] == 0 and sweep[-1][3] == len(truth)",
     "    print(f\"    every capacity is EXACT, and the reads fall from {sweep[0][1]} to {sweep[-1][1]} as the cache grows.\")",
     "    print(f\"    Bounding the cache costs store reads; bounding the state cost the answer.  The\")",
     "    print(f\"    difference is one line -- the evicted score is written out instead of deleted.\")",
     "",
     "    # ...including for the dormant account the whole requirement is about",
     "    cap1, _, _, _ = score_with_cache(SIGNALS, 1)",
     "    assert cap1[\"a\"] == TRUE[\"a\"] if False else cap1[\"a\"] == truth[\"a\"]",
     "    assert cap1[\"a\"] == 24, cap1",
     "    print(f\"\\n  account 'a' is evicted from a 1-slot cache repeatedly and still scores {cap1['a']}: its\")",
     "    print(f\"  dormancy evicts it from MEMORY and not from the store, which is the distinction\")",
     "    print(f\"  the word 'expire' was hiding.\")",
     "",
     "    # boundaries",
     "    assert score_in_a_store([]) == ({}, 0, 0), \"an empty stream has no scores and no ops\"",
     "    assert score_with_cache([], 5)[0] == {}, \"and no cache contents\"",
     "    assert score_with_expiry(SIGNALS, 0)[0] == {\"a\": 8}, score_with_expiry(SIGNALS, 0)[0]",
     "    assert score_with_cache(SIGNALS, 0)[0] == truth, \"a zero-capacity cache is write-through\"",
     "    one_event = [(\"solo\", 7, 0)]",
     "    assert score_in_a_store(one_event)[0] == {\"solo\": 7}",
     "    assert score_with_cache(one_event, 0) == ({\"solo\": 7}, 1, 1, 0)",
     "    print(f\"\\n  boundaries: an empty stream gives no scores and no store operations; a ttl of 0\")",
     "    print(f\"  reduces the expiring version to {score_with_expiry(SIGNALS, 0)[0]}, i.e. the last event only, while a\")",
     "    print(f\"  zero-capacity cache is a write-through store and is still exact.\")",
     "",
     "    # many inputs: the cache is exact at every capacity, the expiry never is safe",
     "    rng = random.Random(20260303)",
     "    exact_runs, wrong_runs = 0, 0",
     "    for _ in range(400):",
     "        n = rng.randint(1, 18)",
     "        ev = sorted(((rng.choice(\"abcde\"), rng.randint(1, 9), rng.randint(0, 400))",
     "                     for _ in range(n)), key=lambda e: e[2])",
     "        want = true_scores(ev)",
     "        assert score_in_memory_forever(ev)[0] == want, ev",
     "        assert score_in_a_store(ev)[0] == want, ev",
     "        prev_reads = None",
     "        for cap in range(0, 7):",
     "            got, r, w, pk = score_with_cache(ev, cap)",
     "            assert got == want, (ev, cap)",
     "            assert pk <= cap, (ev, cap, pk)",
     "            if prev_reads is not None:",
     "                assert r <= prev_reads, (ev, cap, r, prev_reads)   # LRU: more cache, fewer reads",
     "            prev_reads = r",
     "        for ttl in (0, 5, 50, 400):",
     "            got, _, _ = score_with_expiry(ev, ttl)",
     "            assert all(got.get(a, 0) <= want[a] for a in want), (ev, ttl)",
     "            if got == want:",
     "                exact_runs += 1",
     "            else:",
     "                wrong_runs += 1",
     "    print(f\"\\n  400 random signal streams: the store and every cache capacity from 0 to 6 returned\")",
     "    print(f\"  the true lifetime score every single time, with reads falling monotonically as the\")",
     "    print(f\"  cache grew.  The expiring version was right in {exact_runs:,} of {exact_runs + wrong_runs:,} runs and too low in {wrong_runs:,},\")",
     "    print(f\"  never once too high -- so it is not noisy, it is biased, and biased the way an\")",
     "    print(f\"  attacker would choose.\")",
     "    assert (exact_runs, wrong_runs) == (481, 1119), (exact_runs, wrong_runs)",
     "    assert wrong_runs > 0 and exact_runs > 0",
     "",
     "    # the scale that forces the decision",
     "    big = [(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "    big += [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)]",
     "    big.sort(key=lambda e: e[2])",
     "    big_true = true_scores(big)",
     "    big_end = max(t for *_, t in big)",
     "    unbounded_held = held_at(big, INFINITY, big_end)",
     "    bounded_held = held_at(big, BIG_TTL, big_end)",
     "    _, store_held, store_ops = score_in_a_store(big)",
     "    _, cache_reads, cache_writes, cache_peak = score_with_cache(big, 64)",
     "    big_expired, _, big_restarts = score_with_expiry(big, BIG_TTL)",
     "    print(f\"\\n  at {ONEOFF:,} accounts seen once plus one regular, on day {big_end}:\")",
     "    print(f\"    in memory forever : {unbounded_held:,} scores held\")",
     "    print(f\"    with a {BIG_TTL}-day expiry: {bounded_held} held, {big_restarts} restarts -- and every score still in\")",
     "    print(f\"      memory is CORRECT, while {len(big_true) - len(big_expired):,} accounts' scores are simply gone\")",
     "    print(f\"    in a store        : {store_held} held between events, {store_ops:,} store operations\")",
     "    print(f\"    64-slot cache     : {cache_peak} held, {cache_reads:,} reads, {cache_writes:,} writes\")",
     "    assert (unbounded_held, bounded_held) == (2001, 102), (unbounded_held, bounded_held)",
     "    assert store_held == 0 and store_ops == 2 * len(big)",
     "    assert cache_peak == 64 and cache_reads < store_ops // 2",
     "    assert score_with_cache(big, 64)[0] == big_true, \"exact at scale\"",
     "    assert big_expired.get(\"regular\") == big_true[\"regular\"], \"the regular account is never idle\"",
     "    # MEASURED, and it is the uncomfortable half of the story: at this scale the expiry",
     "    # restarts NOTHING and every score it still holds is exact, because an account seen once",
     "    # cannot be restarted and the regular account never goes quiet.  So the scale that",
     "    # justifies the bound is precisely the scale at which its cost is invisible -- the damage",
     "    # needs a dormant-then-returning account, which is the small example, not this one.",
     "    assert big_restarts == 0, big_restarts",

     "def true_scores(signals):",
     "    \"\"\"The requirement, written out directly: every point an account ever earned.\"\"\"",
     "    out = {}",
     "    for acct, pts, _ in signals:",
     "        out[acct] = out.get(acct, 0) + pts",
     "    return out",
     "",
     "",
     "def score_in_memory_forever(signals):",
     "    \"\"\"Answer one: keep every account's score in memory and never release it.",
     "",
     "    Correct, and it is the answer the requirement literally asks for, which is why it is the",
     "    one to put first.  Its state is one number per account EVER SEEN, and that count only",
     "    rises, so the process is a slow leak with a correct output.  Returns (scores, peak_held).",
     "    \"\"\"",
     "    acc, peak = {}, 0",
     "    for acct, pts, _ in signals:",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        peak = max(peak, len(acc))",
     "    return acc, peak",
     "",
     "",
     "def score_with_expiry(signals, ttl):",
     "    \"\"\"Answer two: the chapter's bound, applied to the score.",
     "",
     "    Memory becomes bounded by active accounts, and a dormant account's score is deleted.  The",
     "    next event from it looks like a first event, so the score restarts at zero -- which is not",
     "    a degraded answer but the WRONG answer to the question asked, and an answer an adversary",
     "    can arrange.  Returns (scores_in_memory, peak_held, restarts).",
     "    \"\"\"",
     "    acc, last, restarts, peak = {}, {}, 0, 0",
     "    seen_before = set()",
     "    for acct, pts, t in signals:",
     "        for old in [k for k in acc if t - last[k] > ttl]:",
     "            del acc[old]",
     "            del last[old]",
     "        if acct not in acc and acct in seen_before:",
     "            restarts += 1",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        last[acct] = t",
     "        seen_before.add(acct)",
     "        peak = max(peak, len(acc))",
     "    return acc, peak, restarts",
     "",
     "",
     "def score_in_a_store(signals):",
     "    \"\"\"Answer three: the score is not stream state.  Read it, add to it, write it back, and",
     "    hold nothing.",
     "",
     "    The mechanism is that the streaming layer's memory no longer depends on the account count",
     "    at all -- between two events it holds zero scores, so there is no quantity to bound and",
     "    the memory question has been dissolved rather than answered.  The cost moves to the store:",
     "    one read and one write per event.  Returns (store, held_between_events, store_ops).",
     "    \"\"\"",
     "    store, high_water, ops = {}, 0, 0",
     "    for acct, pts, _ in signals:",
     "        held = {}                                  # the streaming layer, between events",
     "        high_water = max(high_water, len(held))",
     "        held[acct] = store.get(acct, 0) + pts      # read",
     "        ops += 1",
     "        store[acct] = held.pop(acct)               # update, write, forget",
     "        ops += 1",
     "    return store, high_water, ops",
     "",
     "",
     "def score_with_cache(signals, capacity):",
     "    \"\"\"Answer three with the obvious optimisation: a cache of `capacity` accounts in front of",
     "    the store, evicting the least recently used.",
     "",
     "    This is the chapter's bound again -- a fixed number of accounts in memory and the rest",
     "    dropped -- and it is CORRECT at every capacity, including zero.  The difference is one",
     "    line: an evicted account is written to the store on its way out, so the next event for it",
     "    reads the score back rather than starting from nothing.  A miss costs a read; an expiry",
     "    cost the answer.  Returns (scores, store_reads, store_writes, peak_held).",
     "    \"\"\"",
     "    store, cache = {}, {}",
     "    reads = writes = peak = 0",
     "    for acct, pts, _ in signals:",
     "        if acct in cache:",
     "            val = cache.pop(acct)                  # a hit, and it becomes most-recent below",
     "        else:",
     "            reads += 1",
     "            val = store.get(acct, 0)               # a miss: the score is still there",
     "        cache[acct] = val + pts",
     "        while len(cache) > capacity:",
     "            oldest = next(iter(cache))             # dicts keep insertion order: LRU first",
     "            store[oldest] = cache.pop(oldest)",
     "            writes += 1",
     "        peak = max(peak, len(cache))",
     "    for acct, val in cache.items():",
     "        store[acct] = val",
     "        writes += 1",
     "    return store, reads, writes, peak",
     "",
     "",

     "    at the end of the run is the wrong measurement, because an expiry is immediately followed",
     "    by the event that re-creates the entry.\"\"\"",
     "    last = {}",
     "    for acct, _, at in signals:",
     "        if at <= t:",
     "            last[acct] = at",
     "    return sum(1 for a in last if t - last[a] <= ttl)",
     "",

     "def true_scores(signals):",
     "    \"\"\"The requirement, written out directly: every point an account ever earned.\"\"\"",
     "    out = {}",
     "    for acct, pts, _ in signals:",
     "        out[acct] = out.get(acct, 0) + pts",
     "    return out",
     "",
     "",
     "def score_in_memory_forever(signals):",
     "    \"\"\"Answer one: keep every account's score in memory and never release it.",
     "",
     "    Correct, and it is the answer the requirement literally asks for, which is why it is the",
     "    one to put first.  Its state is one number per account EVER SEEN, and that count only",
     "    rises, so the process is a slow leak with a correct output.  Returns (scores, peak_held).",
     "    \"\"\"",
     "    acc, peak = {}, 0",
     "    for acct, pts, _ in signals:",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        peak = max(peak, len(acc))",
     "    return acc, peak",
     "",
     "",
     "def score_with_expiry(signals, ttl):",
     "    \"\"\"Answer two: the chapter's bound, applied to the score.",
     "",
     "    Memory becomes bounded by active accounts, and a dormant account's score is deleted.  The",
     "    next event from it looks like a first event, so the score restarts at zero -- which is not",
     "    a degraded answer but the WRONG answer to the question asked, and an answer an adversary",
     "    can arrange.  Returns (scores_in_memory, peak_held, restarts).",
     "    \"\"\"",
     "    acc, last, restarts, peak = {}, {}, 0, 0",
     "    seen_before = set()",
     "    for acct, pts, t in signals:",
     "        for old in [k for k in acc if t - last[k] > ttl]:",
     "            del acc[old]",
     "            del last[old]",
     "        if acct not in acc and acct in seen_before:",
     "            restarts += 1",
     "        acc[acct] = acc.get(acct, 0) + pts",
     "        last[acct] = t",
     "        seen_before.add(acct)",
     "        peak = max(peak, len(acc))",
     "    return acc, peak, restarts",
     "",
     "",
     "def score_in_a_store(signals):",
     "    \"\"\"Answer three: the score is not stream state.  Read it, add to it, write it back, and",
     "    hold nothing.",
     "",
     "    The mechanism is that the streaming layer's memory no longer depends on the account count",
     "    at all -- between two events it holds zero scores, so there is no quantity to bound and",
     "    the memory question has been dissolved rather than answered.  The cost moves to the store:",
     "    one read and one write per event.  Returns (store, held_between_events, store_ops).",
     "    \"\"\"",
     "    store, high_water, ops = {}, 0, 0",
     "    for acct, pts, _ in signals:",
     "        held = {}                                  # the streaming layer, between events",
     "        high_water = max(high_water, len(held))",
     "        held[acct] = store.get(acct, 0) + pts      # read",
     "        ops += 1",
     "        store[acct] = held.pop(acct)               # update, write, forget",
     "        ops += 1",
     "    return store, high_water, ops",
     "",
     "",
     "def score_with_cache(signals, capacity):",
     "    \"\"\"Answer three with the obvious optimisation: a cache of `capacity` accounts in front of",
     "    the store, evicting the least recently used.",
     "",
     "    This is the chapter's bound again -- a fixed number of accounts in memory and the rest",
     "    dropped -- and it is CORRECT at every capacity, including zero.  The difference is one",
     "    line: an evicted account is written to the store on its way out, so the next event for it",
     "    reads the score back rather than starting from nothing.  A miss costs a read; an expiry",
     "    cost the answer.  Returns (scores, store_reads, store_writes, peak_held).",
     "    \"\"\"",
     "    store, cache = {}, {}",
     "    reads = writes = peak = 0",
     "    for acct, pts, _ in signals:",
     "        if acct in cache:",
     "            val = cache.pop(acct)                  # a hit, and it becomes most-recent below",
     "        else:",
     "            reads += 1",
     "            val = store.get(acct, 0)               # a miss: the score is still there",
     "        cache[acct] = val + pts",
     "        while len(cache) > capacity:",
     "            oldest = next(iter(cache))             # dicts keep insertion order: LRU first",
     "            store[oldest] = cache.pop(oldest)",
     "            writes += 1",
     "        peak = max(peak, len(cache))",
     "    for acct, val in cache.items():",
     "        store[acct] = val",
     "        writes += 1",
     "    return store, reads, writes, peak",
     "",
     "",
     "def held_at(signals, ttl, t):",
     "    \"\"\"How many scores an expiring memory holds on day t, if nothing arrives then.  Counting",
     "    at the end of the run is the wrong measurement, because an expiry is immediately followed",
     "    by the event that re-creates the entry.\"\"\"",
     "    last = {}",
     "    for acct, _, at in signals:",
     "        if at <= t:",
     "            last[acct] = at",
     "    return sum(1 for a in last if t - last[a] <= ttl)",
     "",
     "",

function runPacket(g,e,gen){if(gen!==g.gen)return;const c=document.createElementNS(NS,'circle');c.setAttribute('r',5.5);c.setAttribute('class','pkt');
 c.setAttribute('fill',css(KIND_VAR[e.kind]||'--acc'));$('.pkts',g.svg).appendChild(c);
 const D=Math.max(900,e.len*3.2),t0=performance.now();
 (function f(n){if(gen!==g.gen){c.remove();return}const q=Math.min(1,(n-t0)/D),ez=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
  const P=e.el.getPointAtLength(e.len*ez);c.setAttribute('cx',P.x);c.setAttribute('cy',P.y);c.setAttribute('opacity',q>.92?(1-q)*12:1);
  if(q<1)requestAnimationFrame(f);else c.remove()})(t0)}
function svgLink(el,v){const s=srcInfo(v);if(!s||el.closest('a'))return null;
 const a=document.createElementNS(NS,'a');a.setAttribute('href',s.url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener');
 const ti=document.createElementNS(NS,'title');ti.textContent='Source: '+s.label+(s.unv?' · UNVERIFIED: '+s.unv:'');a.appendChild(ti);
 el.parentNode.insertBefore(a,el);a.appendChild(el);return a}
function svgText(parent,x,y,cls,txt,anc){const t=document.createElementNS(NS,'text');t.setAttribute('class',cls);t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anc||'end');t.textContent=txt;parent.appendChild(t);return t}

/* ---------------- sequence engine ---------------- */
function buildSeq(svg,cfg){const A=cfg.actors,M=cfg.messages,W=1500,sp=W/A.length,bw=Math.min(170,sp-16),rh=cfg.rowHeight||38,H=92+M.length*rh+10;
 svg.setAttribute('viewBox','0 0 '+W+' '+H);const X=i=>sp*(i+.5),idx={};A.forEach((a,i)=>idx[a.name]=i);let h='';
 A.forEach((a,i)=>{h+='<g class="actor'+(a.highlight?' new':'')+'"><rect x="'+(X(i)-bw/2)+'" y="8" width="'+bw+'" height="48" rx="3"/><text x="'+X(i)+'" y="29" text-anchor="middle" font-weight="600">'+esc(a.name)+'</text><text class="lbl" x="'+X(i)+'" y="46" text-anchor="middle">'+esc(a.sub||'')+'</text></g><line class="life" x1="'+X(i)+'" x2="'+X(i)+'" y1="56" y2="'+(H-6)+'"/>'});
 M.forEach((m,i)=>{const a=idx[m.from],b=idx[m.to];if(a==null||b==null||a===b){console.warn('[deck] bad sequence message',m);return}
  const y=92+i*rh,x1=X(a),x2=X(b),k=m.step||0;
  h+='<path class="msg" data-k="'+k+'" data-m="'+i+'" d="M'+x1+','+y+' L'+(x2+(x2>x1?-6:6))+','+y+'"/><text class="mt lbl" data-k="'+k+'" data-m="'+i+'" x="'+((x1+x2)/2)+'" y="'+(y-8)+'" text-anchor="middle">'+(i+1)+'. '+esc(m.label)+'</text>'});
 svg.innerHTML=h+'<g class="ahs"></g>';
 let ah='';const f=v=>v.toFixed(2);
 $$('.msg',svg).forEach(p=>{const L=p.getTotalLength();p.style.setProperty('--len',Math.ceil(L)+4);
  const E=p.getPointAtLength(L),P=p.getPointAtLength(Math.max(0,L-1));let ux=E.x-P.x,uy=E.y-P.y;const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n;
  const tx=E.x+ux*1.3,ty=E.y+uy*1.3,bx=tx-ux*12.6,by=ty-uy*12.6;
  ah+='<path class="ah" data-k="'+p.dataset.k+'" d="M'+f(tx)+','+f(ty)+'L'+f(bx-uy*6.3)+','+f(by+ux*6.3)+'L'+f(bx+uy*6.3)+','+f(by-ux*6.3)+'z"/>'});
 $('.ahs',svg).innerHTML=ah;
 $$('.actor',svg).forEach((g,i)=>{const v=A[i].src;if(!v)return;const r=g.querySelector('rect');
  svgText(g,+r.getAttribute('x')+(+r.getAttribute('width'))-5,+r.getAttribute('y')+11,Array.isArray(v)?'unvt':'lnk',Array.isArray(v)?'UNVERIFIED ↗':'↗');svgLink(g,v)});
 $$('.mt',svg).forEach(t=>{const v=M[+t.dataset.m].src;if(v)svgLink(t,v)})}

/* ---------------- counters ---------------- */
function count(el){const t=+el.dataset.count,d=+el.dataset.dec||0,p=el.dataset.pre||'',s=el.dataset.suf||'';
 const t0=performance.now(),D=+el.dataset.ms||1900;const host=el.closest('.v')||el;host.classList.add('ticking');host.classList.remove('landed');
 (function f(n){if(!el._run)return;const q=Math.min(1,(n-t0)/D),e=1-Math.pow(1-q,4);el.textContent=fmt(t*e,d,p,s);
  if(q<1)requestAnimationFrame(f);else{el.textContent=fmt(t,d,p,s);host.classList.remove('ticking');host.classList.add('landed')}})(t0)}
function counters(slide,k){$$('[data-count]',slide).forEach(c=>{const host=c.closest('[data-st]');const on=host?+host.dataset.st<=k:k>=0;
 if(on&&!c._run){c._run=1;count(c)}else if(!on&&c._run){c._run=0;c.textContent=fmt(0,+c.dataset.dec||0,c.dataset.pre||'',c.dataset.suf||'')}})}

/* ---------------- build the deck from DECK ---------------- */
document.title=DECK.title||document.title;$('#deckEyebrow').innerHTML=rich(DECK.eyebrow||'');
const deckEl=$('#deck');
DECK.slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.dataset.title=s.title||('Slide '+(i+1));
 const r=RENDER[s.layout];if(!r){console.warn('[deck] unknown layout "'+s.layout+'" on slide '+(i+1));sec.innerHTML=head(s)}else sec.innerHTML=r(s);deckEl.appendChild(sec)});
const S=$$('.slide',deckEl);
const NARR=DECK.slides.map(s=>(s.narration&&s.narration.length?s.narration:['']).map(String));
const SPEECH=DECK.slides.map(s=>s.speech||[]);   // optional per-line spoken text, if it should differ from the bar
/* per-slide hooks for diagrams that need JS: stage(k) shows step k, reset() clears */
DECK.slides.forEach((s,i)=>{const sec=S[i];sec._hooks=[];
 if(s.layout==='graph'){const g=buildGraph($('svg.g',sec),s.graph);sec._hooks.push({stage:k=>graphStage(g,k),reset:()=>{g.gen++;clearTimeout(g.timer);graphStage(g,-1)}})}
 if(s.layout==='sequence'){const svg=$('svg.seq',sec);buildSeq(svg,s.sequence);
  const lit=k=>$$('.msg,.mt,.ah',svg).forEach(e=>e.classList.toggle('lit',+e.dataset.k<=k));sec._hooks.push({stage:lit,reset:()=>lit(-1)})}
 if(s.layout==='timeline'){const ms=$$('.ms',sec),T=s.timeline||[],fill=$('.fillbar',sec),tk=$$('.tkt',sec),sp=s.strip;
  sec._hooks.push({stage:k=>{let c=-1;T.forEach((m,j)=>{if((m.step||0)<=k)c=j});
    ms.forEach((m,j)=>{const state=j<c?'done':j===c?'now':'next';m.classList.remove('done','now','next');m.classList.add(state);const ch=$('.state',m);ch.textContent=state;ch.className='chip state'+(state==='done'?' u':state==='now'?' a':'')});
    fill.style.width=c<0?'0':(tlPos(c,T.length)-8)+'%';
    if(sp){if(k>=sp.step&&!sec._dropped){sec._dropped=1;tk.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),300+j*520)})}
     else if(k<sp.step){sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}}},
   reset:()=>{sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')});fill.style.width='0';ms.forEach(m=>m.classList.remove('done','now'))}})}
 if(s.layout==='cards'&&(s.tokens||s.bars)){const tks=$$('.tk',sec),fills=$$('.bars .fill',sec);
  sec._hooks.push({stage:k=>{if(s.tokens){if(k>=s.tokens.step&&!sec._tok){sec._tok=1;tks.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),j*90)})}
     else if(k<s.tokens.step){sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}
     tks.forEach(t=>t.classList.toggle('fade',s.tokens.fadeStep!=null&&k>=s.tokens.fadeStep))}
    if(s.bars)fills.forEach(f=>f.style.width=(k>=s.bars.step?f.dataset.w:0)+'%')},
   reset:()=>{sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in','fade')});fills.forEach(f=>f.style.width='0')}})}
 /* extension: ask — answering is the only way past the question step */
 if(s.question){const q=s.question,fb=$('.fb',sec),bs=$$('.opt',sec),L=j=>String.fromCharCode(65+j);
  const reset=()=>{sec._answered=false;bs.forEach(b=>{b.className='opt';b.disabled=false});fb.innerHTML=''};
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();if(sec._answered)return;const j=+b.dataset.j,o=q.options[j],ok=!!o.correct,ci=q.options.findIndex(x=>x.correct),c=q.options[ci];
   sec._answered=true;bs.forEach((x,m)=>{x.disabled=true;x.classList.add(q.options[m].correct?'right':m===j?'wrong':'dim')});
   fb.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</p><p>'+rich(o.why)+'</p>'+(ok?'':'<p><b>The answer is '+L(ci)+'.</b> '+rich(c.why)+'</p>');
   if(voice&&HAS_TTS)speakLine((ok?'Right. ':'Not quite. ')+plain(o.why)+(ok?'':' The answer is '+plain(c.text)+'. '+plain(c.why)));
   else if(playing){clearTimeout(timer);timer=setTimeout(next,Math.max(4000,plain(fb.textContent).length*55))}});
  sec._hooks.push({stage:()=>{},reset})}
 /* extension: code — keep the newest lines in view as they appear */
 if(s.layout==='code'){const pane=$('.codep',sec),fr=$$('.ln.fresh',sec);
  sec._hooks.push({stage:k=>{const first=fr.find(e=>e.classList.contains('lit')||!e.hasAttribute('data-st'));
    if(first&&pane)pane.scrollTop=Math.max(0,first.offsetTop-pane.offsetTop-pane.clientHeight*0.25)},
   reset:()=>{if(pane)pane.scrollTop=0}})}
 /* extension: array — show, pick and sweep, each tied to a narration step */
 if(s.layout==='array'){const a=s.array,A=a.actions||[],cell=(r,c)=>$('.ac[data-r="'+r+'"][data-c="'+c+'"]',sec),M=$$('.am b',sec);
  let gen=0;const fmt0=v=>Number(v).toLocaleString('en-US'),setM=(i,v)=>{if(i!=null&&M[i])M[i].textContent=fmt0(v)};
  const rowsOf=x=>x.rows!=null?x.rows:x.row!=null?[x.row]:a.rows.map((_,r)=>r);
  const clear=()=>{gen++;$$('.ac',sec).forEach(e=>e.classList.remove('in','seen','hit','pick','ptr'));$$('.ai',sec).forEach(e=>e.classList.remove('pick'));M.forEach(m=>m.textContent='0')};
  const sweepTo=(x,upto)=>{const r=x.row,vals=a.rows[r].values;let read=0,acc=0,hits=0;
   for(let c=0;c<=upto;c++){const el=cell(r,c),v=Number(vals[c]);read++;el.classList.add('seen');
    if(x.mode==='sum')acc+=v;else if(x.mode==='match'&&String(vals[c])===String(x.match)){hits++;el.classList.add('hit')}}
   setM(x.readMeter,read);if(x.mode==='sum')setM(x.resultMeter,acc);if(x.mode==='match')setM(x.resultMeter,hits)};
  const stageA=k=>{clear();const g=gen;
   A.filter(x=>x.step<=k).forEach(x=>{const live=x.step===k;
    if(x.do==='show')rowsOf(x).forEach(r=>a.rows[r].values.forEach((_,c)=>{const el=cell(r,c);if(live){el._t=setTimeout(()=>{if(g===gen)el.classList.add('in')},c*45+r*120)}else el.classList.add('in')}));
    if(x.do==='pick')(x.slots||[]).forEach(c=>{rowsOf(x).forEach(r=>cell(r,c).classList.add('pick'));const i=$('.ai[data-c="'+c+'"]',sec);if(i)i.classList.add('pick')});
    if(x.do==='sweep'){const n=a.rows[x.row].values.length;
     if(!live)sweepTo(x,n-1);else{let c=0;(function tick(){if(g!==gen)return;$$('.ac.ptr',sec).forEach(e=>e.classList.remove('ptr'));
      if(c>=n)return;sweepTo(x,c);cell(x.row,c).classList.add('ptr');c++;setTimeout(tick,x.speed||140)})()}}})};
  sec._hooks.push({stage:stageA,reset:clear})}
});
/* authoring check: warns (console only) when a step number has no narration line */
DECK.slides.forEach((s,i)=>{let mx=-1;JSON.stringify(s,(k,v)=>{if((k==='step'||k==='fadeStep')&&typeof v==='number')mx=Math.max(mx,v);return v});
 if(mx>=NARR[i].length)console.warn('[deck] slide '+(i+1)+' uses step '+mx+' but has only '+NARR[i].length+' narration lines')});

/* ---------------- scaling, theme, tabs ---------------- */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
fit();addEventListener('resize',fit);
const tt=$('#tt');function setTheme(m){document.documentElement.dataset.theme=m;tt.textContent=m==='dark'?'Light':'Dark'}
setTheme(DECK.theme==='dark'?'dark':'light');tt.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const tabs=$('#tabs');S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+esc(s.dataset.title);b.onclick=()=>go(i);tabs.appendChild(b)});

/* ---------------- voice-over ----------------
   Fixed voice by name (any word order), silent fallback through DECK.voice.fallbackLangs, then the
   browser default. Voices load asynchronously in Chrome, so the choice is redone on "voiceschanged".
   Each sentence is spoken as its own utterance (avoids Chrome cutting long utterances off). */
const V=DECK.voice||{},AUTO=DECK.auto||{},HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
const WANT=String(V.preferred||'').toLowerCase().split(/\s+/).filter(Boolean);
const isPreferred=v=>{const n=(v.name||'').toLowerCase();return WANT.length>0&&WANT.every(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))};
const normLang=l=>String(l||'').toLowerCase().replace('_','-');
function chooseVoice(list){const p=list.find(isPreferred);if(p)return p;
 for(const lang of (V.fallbackLangs||[])){const L=normLang(lang),m=list.find(v=>normLang(v.lang)===L||normLang(v.lang).startsWith(L+'-')||normLang(v.lang).startsWith(L));if(m)return m}
 return null}   // null = let the browser use its default voice
function loadVoices(){if(!HAS_TTS)return;VOICE=chooseVoice(speechSynthesis.getVoices()||[])}
if(HAS_TTS){loadVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);else speechSynthesis.onvoiceschanged=loadVoices}
function speakable(s){let t=String(s);Object.entries(V.sayAs||{}).forEach(([a,b])=>{t=t.split(a).join(b)});
 return t.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d+(?:\.\d+)?)%/g,'$1 percent')}
function rateFor(v){const R=V.rate||{};if(v&&/^google/i.test(v.name))return R.google||1;if(v&&/^microsoft/i.test(v.name))return R.microsoft||1;return R.other||1}
let speechGen=0,pauseT=null;
function stopSpeech(){speechGen++;clearTimeout(pauseT);if(HAS_TTS)speechSynthesis.cancel()}
function speakLine(text){stopSpeech();const gen=speechGen;if(!VOICE)loadVoices();const v=VOICE;
 const parts=speakable(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[text];let i=0;
 (function nextSentence(){if(gen!==speechGen)return;
  if(i>=parts.length){if(playing)timer=setTimeout(next,AUTO.afterSpeechMs==null?700:AUTO.afterSpeechMs);return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());if(v){u.voice=v;u.lang=v.lang}u.rate=rateFor(v);u.pitch=V.pitch||1;u.volume=1;
  const pause=/[?!]["')]*$/.test(u.text)?(V.questionPauseMs||420):(V.sentencePauseMs||320);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(gen!==speechGen)return;pauseT=setTimeout(nextSentence,pause)};
  const wd=setTimeout(fin,Math.max(8000,u.text.length*200));   // watchdog: some browsers never fire "end"
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})()}

/* ---------------- stepping, narration bar, auto-play ---------------- */
let cur=0,line=0,playing=false,timer=null,t0=0,dur=1,voice=false,sayGen=0;
function stage(i,k){const s=S[i];$$('[data-st]',s).forEach(e=>e.classList.toggle('lit',+e.dataset.st<=k));counters(s,k);s._hooks.forEach(h=>h.stage(k))}
function dots(){$('#ndots').innerHTML=NARR[cur].map((_,j)=>'<i class="'+(j<=line?'on':'')+'"></i>').join('')}
function go(i,startLine){if(i<0||i>=S.length)return;stopSpeech();clearTimeout(timer);
 S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);s._hooks.forEach(h=>h.reset())});
 $$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 $$('[data-st]',S[i]).forEach(e=>e.classList.remove('lit'));counters(S[i],-1);
 cur=i;line=Math.max(0,Math.min(startLine||0,NARR[i].length-1));history.replaceState(null,'','#'+(i+1));
 const g=++sayGen;setTimeout(()=>{if(g===sayGen)say()},350)}
function say(){clearTimeout(timer);const g=++sayGen,L=NARR[cur],tx=$('#ntxt');tx.style.opacity=0;
 setTimeout(()=>{if(g!==sayGen)return;tx.textContent=L[line];tx.style.opacity=1;
  $('#ncount').textContent='slide '+(cur+1)+'/'+S.length+' · step '+(line+1)+'/'+L.length;dots();stage(cur,line);
  dur=Math.max(AUTO.minStepMs||5200,L[line].length*(AUTO.msPerChar||62));t0=performance.now();
  if(voice&&HAS_TTS)speakLine(SPEECH[cur][line]||L[line]);else if(playing)timer=setTimeout(next,dur)},250)}
/* extension: an unanswered question holds the deck on its question step */
function blocked(){const s=DECK.slides[cur];return !!s.question&&line===s.question.step&&!S[cur]._answered}
function nudge(){const s=S[cur];s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge');
 const fb=$('.fb',s);if(fb&&!fb.textContent.trim())fb.innerHTML='<p class="hint">Choose an answer to carry on.</p>'}
function next(){if(blocked()){nudge();return}stopSpeech();if(line<NARR[cur].length-1){line++;say()}else if(cur<S.length-1)go(cur+1);else{playing=false;upd()}}
function prev(){stopSpeech();if(line>0){line--;say()}else if(cur>0)go(cur-1,NARR[cur-1].length-1)}
(function prog(){const p=playing?Math.min(1,(performance.now()-t0)/dur):0;$('#nprog').style.width=(p*100)+'%';requestAnimationFrame(prog)})();
function upd(){$('#bplay').textContent=playing?'❚❚ auto':'▶ auto';$('#bplay').classList.toggle('on',playing)}
function toggleAuto(){playing=!playing;upd();clearTimeout(timer);if(playing){if(voice&&HAS_TTS)say();else timer=setTimeout(next,AUTO.firstStepDelayMs||1200)}}
function toggleVoice(){voice=!voice;const b=$('#bvoice');b.textContent=voice?'Voice on':'Voice off';b.setAttribute('aria-pressed',String(voice));b.classList.toggle('on',voice);
 if(!voice){stopSpeech();if(playing){clearTimeout(timer);timer=setTimeout(next,dur)}}else say()}
$('#bplay').onclick=toggleAuto;$('#bnext').onclick=next;$('#bprev').onclick=prev;$('#bvoice').onclick=toggleVoice;

/* keyboard: → / space next · ← back · PageDown/PageUp slide · Home/End · 1–9, 0 = slide 10 · A auto · V voice */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'){e.preventDefault();prev()}
 else if(k==='PageDown')go(cur+1);else if(k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
 else if(/^[1-9]$/.test(k))go(+k-1);else if(k==='0')go(9);else if(k==='a'||k==='A')toggleAuto();else if(k==='v'||k==='V')toggleVoice()});
/* click anywhere on the slide to advance — but not on links, buttons or while selecting text */
let clickLock=0;
deckEl.addEventListener('click',e=>{if(e.button!==0||e.target.closest('button,a,input,select,textarea,label,.ctl,.tabs'))return;
 const sel=window.getSelection&&String(window.getSelection());if(sel&&sel.trim())return;const now=performance.now();if(now-clickLock<450)return;clickLock=now;next()});
/* links (HTML or SVG) never advance the slide: stop the event in the capture phase; the link still opens */
['click','pointerdown','mousedown','pointerup','mouseup'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('a[href]'))e.stopPropagation()},true));

/* small read-only hook for automated checks */
window.__deck={go,next,prev,toggleAuto,toggleVoice,slides:S.length,narrLen:i=>NARR[i].length,
 state:()=>({cur,line,playing,voice,voiceName:VOICE?VOICE.name:null,text:$('#ntxt').textContent})};

const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=S.length?h0-1:0);
})();
</script>
