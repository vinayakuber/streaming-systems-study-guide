<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Abandoned Cart</title>
<!-- OPTIONAL web fonts. Delete these three lines to be 100% offline; the deck falls back to
     Georgia / Helvetica / Menlo and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   THEME — change colours here. Light theme first, dark theme below.
   ===================================================================== */
:root{--ink:#141b28;--soft:#48566e;--faint:#7b879e;--paper:#eceef3;--sheet:#fbfcfe;
 --panel:#f3f5f9;--rule:#ccd3e0;--hair:#e0e5ee;--acc:#4338ca;--acc-soft:#ecebfb;
 --up:#0d9488;--dn:#b45309;--upbg:#d7efec;--dnbg:#fae7d3;--nbg:#e7eaf0;--code:#f5f7fb;
 --warn:#b42318;--warnbg:#fbe3e1;
 /* diagram box kinds: main = in use, change = in use but changing, new = new, ext = outside */
 --g-main:#0d9488;--g-change:#b45309;--g-new:#4338ca;--g-ext:#7b879e;
 --shadow:0 2px 8px rgba(20,27,40,.06);
 --f-sans:Archivo,"Helvetica Neue",Arial,sans-serif;--f-serif:Newsreader,Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme="dark"]{--ink:#e7ebf4;--soft:#a6b0c6;--faint:#74809a;--paper:#0b1018;
 --sheet:#161d29;--panel:#121924;--rule:#2a3444;--hair:#222b39;--acc:#a7a2ff;
 --acc-soft:#1e1d3a;--up:#1f9e91;--dn:#cc7d12;--upbg:#0e3a35;--dnbg:#3a2a10;
 --nbg:#222b39;--code:#101722;--warn:#e06a60;--warnbg:#3a1a18;
 --g-main:#2dd4bf;--g-change:#f0a14a;--g-new:#a7a2ff;--g-ext:#8b97b0;--shadow:0 2px 8px rgba(0,0,0,.35)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* The whole deck is drawn at 1600x900 and scaled to fit the window (see fit()). */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;background:var(--paper);overflow:hidden}
.mast{position:absolute;top:0;left:0;right:0;height:60px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:0 28px;z-index:5}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:0;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.tabs button{font:inherit;font-size:11.5px;color:var(--soft);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tabs button i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-right:5px}
.tabs button.on{color:var(--acc);background:var(--acc-soft);border-color:var(--acc);font-weight:600}
.tabs button.on i{color:var(--acc)}
.tt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);color:var(--soft);background:var(--sheet)}
.tt:hover{color:var(--acc);border-color:var(--acc)}
.deck{position:absolute;top:60px;left:0;right:0;height:744px}
/* slide-in / slide-out between slides */
.slide{position:absolute;inset:0;padding:22px 40px 18px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity .6s,transform .6s;display:flex;flex-direction:column;gap:12px}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-48px)}
.hd{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 36px}
.hd .eyebrow{grid-column:1/-1}
h1{font-family:var(--f-serif);font-weight:600;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.stand{font-family:var(--f-serif);font-size:18px;line-height:1.42;color:var(--soft);margin:0;max-width:70ch}
.stand em{color:var(--ink);font-style:italic}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:1.4}
.card{background:var(--sheet);border:1px solid var(--hair);box-shadow:var(--shadow);padding:14px 16px;min-width:0;min-height:0}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--nbg);color:var(--soft);border:1px solid var(--hair);margin:0 4px 4px 0;white-space:nowrap}
.chip.u{background:var(--upbg);color:var(--up);border-color:var(--up)}
.chip.d{background:var(--dnbg);color:var(--dn);border-color:var(--dn)}
.chip.a{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.chip.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);line-height:1.45}
code{font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.note{font-size:12.5px;line-height:1.38;color:var(--soft)} .note b{color:var(--ink)}

/* ---- BUILD STEPS: anything with data-st="N" is a ghost until step N, then fades/rises in ---- */
[data-st]{opacity:.13;filter:grayscale(1);transition:opacity .7s,filter .7s}
[data-st].lit{opacity:1;filter:none;animation:rise .7s ease}
@keyframes rise{0%{transform:translateY(8px)}100%{transform:none}}
/* counters glow while they count, then "land" */
.ticking{color:var(--acc)!important;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.landed{animation:land .6s ease}
@keyframes land{0%{transform:scale(1.06)}100%{transform:none}}

/* ---- layout: title ---- */
.tl{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr);gap:26px}
.tl .l,.tl .r{display:flex;flex-direction:column;gap:14px;min-height:0}
.tl h1{font-size:54px;margin:4px 0 8px}
.hero{position:relative;flex:none;padding:12px 18px 10px;border-left:4px solid var(--acc);overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;width:200px;height:100%;background:radial-gradient(circle at 100% 0,var(--acc-soft),transparent 68%);pointer-events:none}
.hero p{margin:0;font-family:var(--f-serif);font-size:17px;line-height:1.42;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tiles>div{background:var(--sheet);padding:14px 18px 12px;min-width:0}
.tiles .v{font-family:var(--f-serif);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.tiles .d{font-size:12.5px;color:var(--faint);line-height:1.38;margin-top:6px}
.steps{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;gap:8px}
.steps .card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;border-left:4px solid var(--acc);position:relative}
.steps .n{font-family:var(--f-serif);font-size:40px;font-weight:700;color:var(--acc);text-align:center;line-height:1}
.steps b{font-size:17px} .steps span.x{display:block;font-size:13.5px;color:var(--soft);line-height:1.38;margin-top:2px}
/* the coloured bar that "runs" down a card's left edge when it lights up */
.steps .card::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;background:var(--up);transform:scaleY(0);transform-origin:top}
.steps .card.lit::after{animation:run 1.1s ease forwards}
@keyframes run{to{transform:scaleY(1)}}

/* ---- layout: graph (system map / hub, flow / swimlane, state machine) ---- */
.gwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 8px;gap:6px}
.glegend{display:flex;align-items:center;gap:20px;font-size:12.5px;color:var(--soft);margin:0 0 2px;flex-wrap:wrap}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{display:inline-block;width:24px;height:0;border-top:3px solid}
.glegend i.main{border-color:var(--g-main)} .glegend i.change{border-color:var(--g-change)} .glegend i.new{border-color:var(--g-new);border-top-style:dashed} .glegend i.ext{border-color:var(--g-ext);border-top-style:dotted}
svg.g{flex:1;min-height:0;width:100%;display:block}
svg.g .glane{fill:var(--panel);stroke:var(--hair)}
svg.g .gnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2;transition:fill .6s,stroke .6s}
svg.g .gnode{opacity:.14;transition:opacity .7s}
svg.g .gnode.lit{opacity:1}
svg.g .gnode.k-main.lit rect{stroke:var(--g-main);fill:color-mix(in srgb,var(--g-main) 9%,var(--sheet))}
svg.g .gnode.k-change.lit rect{stroke:var(--g-change);fill:color-mix(in srgb,var(--g-change) 10%,var(--sheet))}
svg.g .gnode.k-new.lit rect{stroke:var(--g-new);fill:color-mix(in srgb,var(--g-new) 9%,var(--sheet));stroke-dasharray:5 3}
svg.g .gnode.k-ext.lit rect{stroke:var(--g-ext);fill:var(--panel);stroke-dasharray:2 3}
/* boxes introduced on the CURRENT step pulse */
svg.g .gnode.pulse rect:not(.hubring){animation:npulse 1.8s ease-in-out infinite}
@keyframes npulse{0%,100%{stroke-width:1.6}50%{stroke-width:3.8}}
svg.g .gnode text{font-family:var(--f-sans);font-size:14px;font-weight:600;fill:var(--ink)}
svg.g .gnode text.s{font-family:var(--f-mono);font-size:10.3px;font-weight:400;fill:var(--faint)}
svg.g .gnode text.val{font-family:var(--f-serif);font-size:24px;font-weight:700;fill:var(--ink)}
svg.g .gnode.k-hub rect{fill:var(--acc);stroke:none}
svg.g .gnode.k-hub text{fill:#fff;font-family:var(--f-serif);font-size:28px;font-weight:700}
svg.g .gnode.k-hub text.s{font-family:var(--f-mono);font-size:10.5px;font-weight:400;fill:#fff;opacity:.85}
svg.g .hubring{fill:none!important;stroke:var(--acc)!important;stroke-width:2;opacity:0}
svg.g .hubring.go{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
/* arrows "draw" themselves in (dash offset), new arrows keep marching */
svg.g .gedge{fill:none;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
svg.g .gedge.lit{stroke-dashoffset:0}
svg.g .gedge.k-main{stroke:var(--g-main)} svg.g .gedge.k-change{stroke:var(--g-change)} svg.g .gedge.k-new{stroke:var(--g-new)} svg.g .gedge.k-ext{stroke:var(--g-ext)} svg.g .gedge.k-hub{stroke:var(--acc)}
svg.g .gedge.k-new.lit{stroke-dasharray:6 5;animation:march 1.2s linear infinite}
svg.g .gedge.hot{stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
svg.g .gah{opacity:0;transition:opacity .2s 1s} svg.g .gah.lit{opacity:1}
svg.g .gah.k-main{fill:var(--g-main)} svg.g .gah.k-change{fill:var(--g-change)} svg.g .gah.k-new{fill:var(--g-new)} svg.g .gah.k-ext{fill:var(--g-ext)} svg.g .gah.k-hub{fill:var(--acc)}
svg.g .glbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .6s .4s}
svg.g .glbl.lit{opacity:1} svg.g .glbl.hot{fill:var(--ink);font-weight:600}
svg.g .gcol{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;fill:var(--faint)}
svg.g .pkt{stroke:var(--sheet);stroke-width:1.5;pointer-events:none}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.row2>div{background:var(--sheet);padding:7px 12px;font-size:12.3px;line-height:1.36;color:var(--soft)}
.row2 b{color:var(--ink)}

/* ---- layout: sequence ---- */
svg.seq{flex:1;min-height:0;width:100%}
svg.seq text{font-family:var(--f-sans);font-size:13px;fill:var(--ink)}
svg.seq .lbl{font-family:var(--f-mono);font-size:11px;fill:var(--soft)}
svg.seq .life{stroke:var(--hair);stroke-dasharray:3 4}
svg.seq .msg{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s}
svg.seq .msg.lit{stroke-dashoffset:0}
svg.seq .mt{opacity:0;transition:opacity .6s .5s} svg.seq .mt.lit{opacity:1}
svg.seq .ah{fill:var(--acc);opacity:0} svg.seq .ah.lit{opacity:1;transition:opacity .15s .9s}
svg.seq .actor rect{fill:var(--panel);stroke:var(--rule)}
svg.seq .actor.new rect{fill:var(--acc-soft);stroke:var(--acc)}

/* ---- layout: table / enum ---- */
.cols{flex:1;min-height:0;display:grid;gap:12px}
.cols .card{display:flex;flex-direction:column;gap:8px;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
table.t th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 6px;font-weight:500}
table.t td{padding:9px 8px;border-top:1px solid var(--hair);vertical-align:top;color:var(--soft)}
table.t td:first-child{color:var(--ink);font-weight:600}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{color:var(--g-main);border-color:var(--g-main);background:var(--upbg)}
.tag.new{color:var(--g-new);border-color:var(--g-new);background:var(--acc-soft)}
.tag.unv{color:var(--dn);border-color:var(--dn);background:var(--dnbg)}
ul.l{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45;color:var(--soft)} ul.l li{margin:0 0 6px} ul.l b{color:var(--ink)}

/* ---- layout: timeline + status strip ---- */
.tline{position:relative;height:150px;margin:18px 10px 4px}
.tline .track,.tline .fillbar{position:absolute;left:8%;top:44px;height:6px;border-radius:3px}
.tline .track{right:8%;background:var(--hair)}
.tline .fillbar{width:0;background:var(--acc);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ms{position:absolute;top:0;width:240px;transform:translateX(-50%);text-align:center}
.ms .t{font-family:var(--f-mono);font-size:12px;color:var(--faint);height:18px}
.ms .dot{position:relative;width:24px;height:24px;border-radius:50%;margin:3px auto 10px;background:var(--sheet);border:3px solid var(--rule);transition:background .5s,border-color .5s}
.ms.done .dot{background:var(--up);border-color:var(--up)}
.ms.now .dot{background:var(--acc);border-color:var(--acc)}
.ms.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s ease-out infinite}
.ms b{display:block;font-size:17px} .ms span{display:block;font-size:13px;color:var(--soft);line-height:1.35}
.ms .state{display:inline-block;margin-top:6px}
.strip{display:flex;gap:8px;align-items:stretch;margin:6px 0}
/* tickets drop in with a little bounce */
.tkt{flex:1;border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;font-size:13px;line-height:1.3;opacity:0;transform:translateY(-18px) rotate(-3deg);transition:opacity .4s,transform .55s cubic-bezier(.3,1.6,.5,1)}
.tkt.in{opacity:1;transform:none}
.tkt b{display:block;font-family:var(--f-serif);font-size:28px;line-height:1;color:var(--acc)}
.tkt.warn b{color:var(--warn)} .tkt.ok b{color:var(--up)}

/* ---- layout: cards (+ token wall + bars) ---- */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.grid .card{display:flex;flex-direction:column;gap:6px}
.grid .card h3{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.15}
.grid .card p{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc);opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s,filter .6s}
.tk.in{opacity:1;transform:none} .tk.fade{opacity:.3;filter:grayscale(1)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bars .track{position:relative;height:18px;background:var(--hair)}
.bars .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .num{font-family:var(--f-mono);font-size:13px;text-align:right}

/* ---- narration bar ---- */
.narr{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:0 40px;z-index:5}
.narr .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.narr .txt{font-family:var(--f-serif);font-size:19px;line-height:1.33;color:var(--ink);transition:opacity .35s;min-height:52px;max-width:122ch}
.narr .prog{position:absolute;left:0;top:-1px;height:3px;background:var(--acc);width:0}
.dots{display:flex;gap:6px;margin-top:5px}
.dots i{width:22px;height:4px;background:var(--rule)} .dots i.on{background:var(--acc)}
.ctl{display:flex;gap:6px}
.ctl button{font-family:var(--f-mono);font-size:11px;padding:8px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--soft);cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--acc);border-color:var(--acc)}

/* ---- source links + unverified tags ---- */
a.sl{display:inline-block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--acc);text-decoration:none;margin:0 0 0 3px;padding:1px 3px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:3px;vertical-align:1px;background:var(--sheet)}
a.sl:hover,a.sl:focus-visible{background:var(--acc);color:#fff;outline:none}
a.srcl{color:inherit;text-decoration:underline dotted;text-underline-offset:2px} a.srcl:hover{color:var(--acc)}
svg a{cursor:pointer}
svg a:hover .gnode.lit rect{stroke-width:2.4}
svg a .glbl,svg.seq a .lbl{text-decoration:underline dotted}
svg text.lnk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--acc)}
svg.g .k-hub text.lnk{fill:#fff}
svg text.unvt{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;fill:var(--dn)}
/* ---- extension: ask + array layouts ---- */
.askwrap,.arrwrap{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.askq .qtext{font-family:var(--f-serif);font-size:24px;line-height:1.35;color:var(--ink);margin:0 0 14px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.35;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--acc);outline:none}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--acc);border:1px solid var(--acc);padding:1px 7px;flex:none}
.opt.right{border-color:var(--up);background:var(--upbg)} .opt.right i{color:var(--up);border-color:var(--up)}
.opt.wrong{border-color:var(--dn);background:var(--dnbg)} .opt.wrong i{color:var(--dn);border-color:var(--dn)}
.opt.dim{opacity:.45} .opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:15px;line-height:1.45;color:var(--ink);min-height:22px} .fb p{margin:0 0 6px;max-width:100ch}
.fb .verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fb .verdict.ok{color:var(--up)} .fb .verdict.no{color:var(--dn)} .fb .hint{color:var(--acc);font-family:var(--f-mono);font-size:12px}
.slide.nudge .opts{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr .agrid{display:grid;gap:3px;align-items:center}

     "        assert kept == want_kept, (label, kept, want_kept)",
     "        assert held - held_ttl == want_saved, (label, held - held_ttl, want_saved)",
     "        assert stored == truth, (label, \"the store must reproduce the true cart\")",
     "        for s, items in plain.items():",
     "            assert is_suffix(items, truth[s]), (label, s, items)   # only ever a suffix",
     "        assert kept <= true_value, (label, kept, true_value)",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:37s} {len(additions):>7,} {ttl_s:>6} {hour:>6,} {true_value:>6,} \"",
     "              f\"{kept:>6,} {held:>6,} {held_ttl:>6,} {held - held_ttl:>6,} {reloads:>8,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true cart\")",
     "    print()",
     "",
     "",
     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",
     "    shoppers rather than a derivation from anything.\"\"\"",
     "    worst, prev = 0, None",
     "    for s, _, t in additions:",
     "        if s == shopper:",
     "            if prev is not None:",
     "                worst = max(worst, t - prev)",
     "            prev = t",
     "    return worst",
     "",
     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",
     "            expire_by_deleting(carts, last, t, ttl)",
     "        else:",
     "            expire_by_writing_out(carts, last, store, t, ttl)",
     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",
     "",
     "",
     "def final_carts(additions, ttl, use_store):",
     "    \"\"\"What each shopper is shown the next time they look, which is memory plus whatever is",
     "    in the store -- the only measurement the shopper can actually make.\"\"\"",
     "    store = {} if use_store else None",
     "    carts, store, peak, reloads = run(additions, ttl, store)",
     "    out = {s: list(items) for s, items in carts.items()}",
     "    if store:",
     "        for s, items in store.items():",
     "            out[s] = items + out.get(s, [])",
     "    return out, peak, reloads",
     "",
     "",
     "def carts_held_at(additions, ttl, t):",
     "    \"\"\"How many carts memory holds at hour t, if nothing arrives then.",
     "",
     "    Counting at the end of the run is the wrong measurement: an expiry is immediately followed",
     "    by the addition that re-creates the cart, so the saving is invisible there.  A quiet moment",
     "    shows it.\"\"\"",
     "    last = {}",
     "    for s, _, at in additions:",
     "        if at <= t:",
     "            last[s] = at",
     "    return sum(1 for s in last if t - last[s] <= ttl)",
     "",
     "",
     "def is_suffix(part, whole):",
     "    \"\"\"Whether `part` is a tail of `whole`.  The precise shape of the damage a deletion does:",
     "    the shopper keeps what they added after the cart was dropped and nothing before it.\"\"\"",
     "    return part == whole[len(whole) - len(part):] if part else True",
     "",
     "",
     "def main():",
     "    show_examples()",

     "    # the boundary the comparison decides",

     "    print(f\"  The comparison is `now - last > ttl`, so a silence EQUAL to the allowance is\")",

     "    # the memory saving at this scale, measured at every hour -- and measured twice, because",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 3 -- the abandoned shopping cart (looks like commerce). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    addition  -- one item going into a cart: (shopper, the item's price, the hour).  Hours",

     "",
     "  GIVEN AN ALLOWANCE AND AN HOUR TO LOOK AT, HOW MUCH CART VALUE SURVIVES, AND HOW MANY",

     "                                            is still there when they return",
     "    ttl = 294, at hour 540     -> (29, 0)   one hour tighter, the other side of that edge:",
     "                                            'a's first four items are gone, 16 of value lost",
     "    ttl = 168, at hour 540     -> (8, 1)    the week the product actually chose: 'a' comes",
     "                                            back to a cart holding only the item they just",
     "                                            added, and 37 of value has been thrown away",
     "    ttl = 168, at hour 413     -> (8, 0)    the SAME allowance, looked at 127 hours earlier:",
     "                                            it has saved NOTHING yet",
     "    ttl = 168, at hour 429     -> (8, 2)    sixteen hours later, both carts are out of",
     "                                            memory -- so \"how much does the expiry save\" has",
     "                                            no answer without an hour attached to it",
     "    ttl = 0, at hour 540       -> (8, 1)    one cart at a time, the tightest allowance",
     "    an EMPTY stream, at hour 0 -> (0, 0)    no additions, so no carts.  0, not an error",
     "    a single addition, at hour 0 -> (5, 0)  the smallest real stream",
     "    two additions 10 hours apart, ttl = 10 -> (8, 0)   the gap equals the allowance: kept",
     "    the same two, ttl = 9                  -> (3, 0)   one hour short: the first item is gone",
     "  And on 2,000 shoppers who visit once plus one who never leaves:",
     "    ttl = 100, at hour 2000 -> (301, 1899)   1,899 carts out of memory, and 1,899 shoppers",
     "                                             who would find their cart empty",
     "    ttl = 0,   at hour 2000 -> (1, 2000)     everything saved, everything lost",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the true cart and against the store -- so these answers cannot drift from what the",
     "  program returns.  (Looking at an hour outside the stream is defined too and reported by",
     "  the same function: hour 0 holds 0 carts because nothing has arrived, and hour 10000 holds",
     "  0 because everything has expired -- neither is an error.)",
     "",
     "Here the expiry is the FEATURE, not the compromise -- the chapter's silent restart is the",
     "specified behaviour -- and that inverts the whole problem, leaving one real contradiction:",
     "the cart must be bounded in memory and unbounded in time.  The move is to notice that EXPIRE",
     "and FORGET were conflated.  Dropping a cart from memory writes it out; a shopper who comes",
     "back reads it in.  Then memory is bounded by ACTIVE shoppers and correctness is bounded by",
     "nothing -- and the honest price, measured below, is that durable storage is now bounded by",
     "nothing either.  The fix does not shrink the data, it moves it to where growth is affordable.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",
     "nine additions, both sides of the 295-hour silence the sweep turns on, both sides of the hour",
     "at which a week-long allowance starts saving anything, an empty stream, a single addition, a",
     "cart erased with nothing to come back to, and two generated streams at 2,000 one-visit",
     "shoppers.  Every row is ASSERTED twice, against the true cart and against the store, so the",
     "table cannot drift from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch07_v3.py",
     "\"\"\"",
     "import random",
     "",
     "# The chapter's nine seed events, read as cart additions: (shopper, item_price, hour).  The",
     "# prices are the chapter's values, so the true cart totals are its 24 and 21.  Shopper 'a' is",
     "# silent from hour 245 to hour 540 -- the chapter's longest gap, 295 hours, which is 12 days 7 hours",
     "# and is exactly the shopper the product requirement is about.",
     "ADDITIONS = [(\"a\", 5, 1), (\"a\", 3, 3), (\"b\", 4, 50), (\"b\", 7, 90), (\"a\", 2, 130),",
     "             (\"b\", 9, 220), (\"a\", 6, 245), (\"b\", 1, 260), (\"a\", 8, 540)]",
     "WEEK = 168                 # the inactivity allowance the product chose: a week in hours",
     "TRUE_CARTS = {\"a\": [5, 3, 2, 6, 8], \"b\": [4, 7, 9, 1]}",
     "TRUE_VALUE = {\"a\": 24, \"b\": 21}",
     "INFINITY = float(\"inf\")",
     "# The scale at which bounding memory is worth anything, from the chapter's asymptotic case:",
     "# many shoppers who visit once, plus one who never leaves.",
     "ONEOFF = 2_000",
     "BIG_TTL = 100",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty stream, one",
     "# addition, a pair of additions ten hours apart (so one allowance sits on each side of the",
     "# gap), and the asymptotic stream -- the same shape main() measures below, built here so the",
     "# table can reach it too.",
     "NO_ADDITIONS = []",
     "ONE_ADDITION = [(\"x\", 5, 0)]",
     "TWO_ADDITIONS = [(\"x\", 5, 0), (\"x\", 3, 10)]",
     "BIG_ADDITIONS = sorted([(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "                       + [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)],",
     "                       key=lambda e: e[2])",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, additions, ttl, hour observed, cart value kept by DELETING, carts saved",
     "# at that hour).  The hour is an input and not a detail: `carts_held_at` only reports what",
     "# memory holds at the moment you look, and the same allowance saves 0 carts at hour 413 and 2",
     "# at hour 429 -- so a table without the hour in it would be reporting an opinion.  Every row",
     "# is asserted by show_examples(), which is why the table is data and not a comment: a comment",
     "# can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"never expire: the whole cart\",          ADDITIONS,     INFINITY, 540,  45, 0),",
     "    (\"ttl = 295, the longest silence\",        ADDITIONS,          295, 540,  45, 0),",
     "    (\"ttl = 294, one hour tighter\",           ADDITIONS,          294, 540,  29, 0),",
     "    (\"ttl = a week, at the last addition\",    ADDITIONS,          168, 540,   8, 1),",
     "    (\"ttl = a week, at hour 413: saves 0\",    ADDITIONS,          168, 413,   8, 0),",
     "    (\"ttl = a week, at hour 429: saves 2\",    ADDITIONS,          168, 429,   8, 2),",
     "    (\"ttl = 0: one cart at a time\",           ADDITIONS,            0, 540,   8, 1),",
     "    (\"an empty stream -> no carts at all\",    NO_ADDITIONS,  INFINITY,   0,   0, 0),",
     "    (\"a single addition\",                     ONE_ADDITION,  INFINITY,   0,   5, 0),",
     "    (\"one gap of 10, ttl = 10: kept\",         TWO_ADDITIONS,       10,  10,   8, 0),",
     "    (\"one gap of 10, ttl = 9: restarted\",     TWO_ADDITIONS,        9,  10,   3, 0),",
     "    (\"2,000 one-visit shoppers, ttl = 100\",   BIG_ADDITIONS,      100, 2000, 301, 1899),",
     "    (\"2,000 one-visit shoppers, ttl = 0\",     BIG_ADDITIONS,        0, 2000,   1, 2000),",
     "]",

     "",
     "def truth_of(additions):",
     "    \"\"\"The true cart per shopper: every item, in arrival order.  The brute-force reference the",
     "    examples table checks the store against -- it is the requirement written out, so it cannot",
     "    be wrong, and anything that disagrees with it is the thing that is broken.\"\"\"",
     "    out = {}",
     "    for s, price, _ in additions:",
     "        out.setdefault(s, []).append(price)",
     "    return out",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `truth_of` -- the brute-force cart, which cannot be wrong --",
     "    and against the store, which must reproduce it exactly on every row.  The two cost",
     "    columns are printed per row so the reader can see where the bound is worth anything: at",
     "    the chapter's scale the allowance saves at most 2 carts, and only by dropping carts whose",
     "    value is then lost -- up to 37 of the 45 units of cart value; the saving only becomes large",
     "    (1,899 and 2,000) at the asymptotic scale on the last two rows.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'events':>7} {'ttl':>6} {'hour':>6} {'true':>6} \"",
     "          f\"{'kept':>6} {'held':>6} {'+ttl':>6} {'saved':>6} {'reloads':>8}\")",
     "    for label, additions, ttl, hour, want_kept, want_saved in EXAMPLES:",
     "        plain, peak, _ = final_carts(additions, ttl, use_store=False)",
     "        stored, peak_s, reloads = final_carts(additions, ttl, use_store=True)",
     "        truth = truth_of(additions)",
     "        kept = sum(sum(items) for items in plain.values())",
     "        true_value = sum(sum(items) for items in truth.values())",
     "        held = carts_held_at(additions, INFINITY, hour)",
     "        held_ttl = carts_held_at(additions, ttl, hour)",
     "        assert kept == want_kept, (label, kept, want_kept)",
     "        assert held - held_ttl == want_saved, (label, held - held_ttl, want_saved)",
     "        assert stored == truth, (label, \"the store must reproduce the true cart\")",
     "        for s, items in plain.items():",
     "            assert is_suffix(items, truth[s]), (label, s, items)   # only ever a suffix",
     "        assert kept <= true_value, (label, kept, true_value)",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:37s} {len(additions):>7,} {ttl_s:>6} {hour:>6,} {true_value:>6,} \"",
     "              f\"{kept:>6,} {held:>6,} {held_ttl:>6,} {held - held_ttl:>6,} {reloads:>8,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true cart\")",
     "    print()",
     "",
     "",
     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",
     "    shoppers rather than a derivation from anything.\"\"\"",
     "    worst, prev = 0, None",
     "    for s, _, t in additions:",
     "        if s == shopper:",
     "            if prev is not None:",
     "                worst = max(worst, t - prev)",
     "            prev = t",
     "    return worst",
     "",
     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",
     "            expire_by_deleting(carts, last, t, ttl)",
     "        else:",
     "            expire_by_writing_out(carts, last, store, t, ttl)",
     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",
     "",
     "",
     "def final_carts(additions, ttl, use_store):",
     "    \"\"\"What each shopper is shown the next time they look, which is memory plus whatever is",
     "    in the store -- the only measurement the shopper can actually make.\"\"\"",
     "    store = {} if use_store else None",
     "    carts, store, peak, reloads = run(additions, ttl, store)",
     "    out = {s: list(items) for s, items in carts.items()}",
     "    if store:",
     "        for s, items in store.items():",
     "            out[s] = items + out.get(s, [])",
     "    return out, peak, reloads",
     "",
     "",
     "def carts_held_at(additions, ttl, t):",
     "    \"\"\"How many carts memory holds at hour t, if nothing arrives then.",
     "",
     "    Counting at the end of the run is the wrong measurement: an expiry is immediately followed",
     "    by the addition that re-creates the cart, so the saving is invisible there.  A quiet moment",
     "    shows it.\"\"\"",
     "    last = {}",
     "    for s, _, at in additions:",
     "        if at <= t:",
     "            last[s] = at",
     "    return sum(1 for s in last if t - last[s] <= ttl)",
     "",
     "",
     "def is_suffix(part, whole):",
     "    \"\"\"Whether `part` is a tail of `whole`.  The precise shape of the damage a deletion does:",
     "    the shopper keeps what they added after the cart was dropped and nothing before it.\"\"\"",
     "    return part == whole[len(whole) - len(part):] if part else True",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    silences = {s: longest_silence(ADDITIONS, s) for s in (\"a\", \"b\")}",
     "    print(\"ADDITIONS =\", \"  \".join(f\"{s}@{t}:{p}\" for s, p, t in ADDITIONS))",
     "    print(f\"  true carts {TRUE_CARTS}, values {TRUE_VALUE}\")",
     "    print(f\"  longest silence per shopper {silences}, allowance {WEEK} hours (a week)\\n\")",
     "",
     "    deleting, peak_del, _ = final_carts(ADDITIONS, WEEK, use_store=False)",
     "    writing, peak_wr, reloads = final_carts(ADDITIONS, WEEK, use_store=True)",
     "    keeping, peak_keep, _ = final_carts(ADDITIONS, INFINITY, use_store=False)",
     "    print(f\"  never expire          : {keeping}   ({peak_keep} carts held)\")",
     "    print(f\"  expire by deleting    : {deleting}   ({peak_del} carts held)\")",
     "    print(f\"  expire by writing out : {writing}   ({peak_wr} carts held, {reloads} reload)\")",
     "",
     "    assert keeping == TRUE_CARTS, keeping",
     "    assert writing == TRUE_CARTS, \"writing the cart out and reading it back must be exact\"",
     "    assert deleting != TRUE_CARTS, \"deleting must lose the cart, or there is no problem here\"",
     "    # CORRECTED CLAIM.  The first expectation was {\"a\": [8], \"b\": [4, 7, 9, 1]} -- shopper 'b'",
     "    # untouched, because b's longest silence (130) is inside the allowance.  The measurement",
     "    # refused it: b's LAST addition is at hour 260 and the sweep runs when a's addition",
     "    # arrives at hour 540, so b has been quiet 280 hours by then and the cart is swept.  There",
     "    # are two distinct losses here, not one: 'a' is dropped and comes back, which restarts the",
     "    # cart, and 'b' is dropped and does not come back, which erases it.  A silence inside the",
     "    # allowance is no protection -- what matters is the silence at the moment somebody else's",
     "    # event triggers the sweep.",
     "    assert deleting == {\"a\": [8]}, deleting",
     "    assert \"b\" not in deleting, \"b's cart is swept when a's hour-540 addition arrives\"",
     "    assert reloads == 1, reloads",
     "    lost_a = TRUE_CARTS[\"a\"][:-1]",
     "    quiet_b = 540 - 260",
     "    assert sum(lost_a) == 16 and sum(deleting[\"a\"]) == 8",
     "    print(f\"\\n  shopper 'a' was silent {silences['a']} hours, {silences['a'] - WEEK} past the allowance, so they return to a\")",
     "    print(f\"  cart holding {sum(deleting['a'])} instead of {TRUE_VALUE['a']}: {len(lost_a)} items worth {sum(lost_a)} silently gone.\")",
     "    print(f\"  shopper 'b''s longest silence is only {silences['b']} hours and the cart is lost anyway: by the\")",
     "    print(f\"  time a's hour-540 addition triggers a sweep, b has been quiet {quiet_b} hours, so b's\")",
     "    print(f\"  whole cart is erased with nothing to come back to.  Two different losses -- a\")",
     "    print(f\"  restart and an erasure -- and only the first one looks like the chapter's.\")",
     "    assert quiet_b > WEEK and silences[\"b\"] <= WEEK, (quiet_b, silences[\"b\"])",
     "",
     "    # the damage has a shape, and it is always this shape",
     "    for s, items in deleting.items():   # only 'a' survives in memory at all",
     "        assert is_suffix(items, TRUE_CARTS[s]), (s, items)",
     "        assert sum(items) <= TRUE_VALUE[s], (s, items)",
     "    assert not is_suffix([5, 3], TRUE_CARTS[\"a\"]), \"a prefix is NOT what survives\"",
     "    print(f\"\\n  what survives is always a SUFFIX of the true cart -- the items added since the\")",
     "    print(f\"  drop -- so the error is one-directional: a cart can only ever be too small.\")",
     "",
     "    # and the store makes it exact at ANY allowance, including none at all",
     "    for ttl in (0, 1, WEEK, silences[\"a\"] - 1, INFINITY):",
     "        got, peak, _ = final_carts(ADDITIONS, ttl, use_store=True)",
     "        assert got == TRUE_CARTS, (ttl, got)",
     "    zero, zero_peak, zero_reloads = final_carts(ADDITIONS, 0, use_store=True)",
     "    assert zero == TRUE_CARTS and zero_peak == 1, (zero, zero_peak)",
     "    print(f\"  with a store, every allowance from 0 to never is exact; at ttl = 0 memory holds\")",
     "    print(f\"  {zero_peak} cart at a time and the answer is still {zero['a'] == TRUE_CARTS['a'] and 'right' or 'wrong'} after {zero_reloads} reloads.\")",
     "    assert zero_reloads == 7, zero_reloads",
     "",
     "    # the boundary the comparison decides",
     "    tight, _, _ = final_carts(ADDITIONS, silences[\"a\"] - 1, use_store=False)",
     "    exact, _, _ = final_carts(ADDITIONS, silences[\"a\"], use_store=False)",
     "    assert exact == TRUE_CARTS, \"an allowance equal to the longest silence drops nobody\"",
     "    assert tight != TRUE_CARTS, tight",
     "    # and this allowance isolates the two failure modes: at 294 hours only 'a' is dropped and",
     "    # restarted, while 'b' -- quiet 280 hours when the sweep runs -- is still inside it.  The",
     "    # erasure of 'b' needs an allowance tighter than 280, which the week-long one is.",
     "    assert tight == {\"a\": [8], \"b\": [4, 7, 9, 1]}, tight",
     "    print(f\"\\n  boundary: ttl = {silences['a']} (the silence itself) keeps every cart; ttl = {silences['a'] - 1} loses one.\")",
     "    print(f\"  The comparison is `now - last > ttl`, so a silence EQUAL to the allowance is\")",
     "    print(f\"  inside it -- one hour decides whether a shopper's cart exists.  At {silences['a'] - 1} hours only\")",
     "    print(f\"  'a' is lost: {tight}, with 'b' kept because 280 hours of\")",
     "    print(f\"  quiet is inside a 294-hour allowance and outside a 168-hour one.\")",
     "",
     "    # the memory saving at this scale, measured at every hour -- and measured twice, because",
     "    # where you stop looking changes the number.",
     "    end = max(t for *_, t in ADDITIONS)",
     "    def saving_at(ttl, horizon):",
     "        return max(carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t)",
     "                   for t in range(horizon + 1))",
     "    def best_hour(ttl, horizon):",
     "        return max(range(horizon + 1),",
     "                   key=lambda t: carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t))",
     "    beyond = end + WEEK + 2",
     "    print(f\"\\n  carts the allowance saves, as a maximum over every hour:\")",
     "    print(f\"    {'allowance':>12} {'up to hour ' + str(end):>16} {'up to hour ' + str(beyond):>16}\")",
     "    for ttl in (WEEK, 294):",
     "        print(f\"    {ttl:>12} {saving_at(ttl, end):>16} {saving_at(ttl, beyond):>16}\")",
     "    # MEASURED, and the first write-up of this said ZERO on the strength of the chapter's",
     "    # figure.  Both halves are true and they are different allowances: at the chapter's",
     "    # 294-hour allowance the saving really is 0 for every hour up to the last addition, which",
     "    # is the chapter's own measurement reproduced.  At the week-long allowance the saving is 2,",
     "    # reached at hour {h} -- and the hour is the whole story, because by then BOTH carts have",
     "    # already been erased.  The memory the bound reclaims is the cart the shopper lost, so the",
     "    # saving and the damage are one measurement seen from two sides.",
     "    h = best_hour(WEEK, end)",
     "    assert saving_at(294, end) == 0, saving_at(294, end)",
     "    assert saving_at(294, beyond) == 1, saving_at(294, beyond)",
     "    assert saving_at(WEEK, end) == 2, saving_at(WEEK, end)",
     "    assert h == 429, h",
     "    assert carts_held_at(ADDITIONS, WEEK, h) == 0 and carts_held_at(ADDITIONS, INFINITY, h) == 2",
     "    assert h > 245 + WEEK and h > 260 + WEEK, \"both carts are already past their allowance\"",
     "    print(f\"  at the chapter's 294-hour allowance the saving is 0 for every hour up to the last\")",
     "    print(f\"  addition -- the chapter's own figure -- so the correctness cost arrives before any\")",
     "    print(f\"  memory benefit.  At the week-long allowance it is 2, reached at hour {h}, and the hour\")",
     "    print(f\"  is the whole story: shopper 'a' expired at {245 + WEEK + 1} and 'b' at {260 + WEEK + 1}, so the two carts the\")",
     "    print(f\"  bound has stopped holding are precisely the two the shoppers no longer have.  A\")",
     "    print(f\"  saving visible only after the data is gone is the damage, measured from the other\")",
     "    print(f\"  side.  The real case for the bound is asymptotic, and the honest thing is to go\")",
     "    print(f\"  and measure it there.\")",
     "",
     "    # ...measured there",
     "    big = [(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "    big += [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)]",
     "    big.sort(key=lambda e: e[2])",
     "    big_end = max(t for *_, t in big)",
     "    unbounded = carts_held_at(big, INFINITY, big_end)",
     "    bounded = carts_held_at(big, BIG_TTL, big_end)",
     "    big_del, _, _ = final_carts(big, BIG_TTL, use_store=False)",
     "    big_store_carts, big_peak, big_reloads = final_carts(big, BIG_TTL, use_store=True)",
     "    truth_big = {}",
     "    for s, p, _ in big:",
     "        truth_big.setdefault(s, []).append(p)",
     "    print(f\"\\n  at {ONEOFF:,} one-visit shoppers plus one regular, observed at hour {big_end}:\")",
     "    print(f\"    never expire : {unbounded:,} carts in memory\")",

     "    \"\"\"The true cart per shopper: every item, in arrival order.  The brute-force reference the",

     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",

     "    for s, _, t in additions:",

     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",

     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",

     "            out[s] = items + out.get(s, [])",

     "    be wrong, and anything that disagrees with it is the thing that is broken.\"\"\"",
     "    out = {}",
     "    for s, price, _ in additions:",
     "        out.setdefault(s, []).append(price)",
     "    return out",

     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `truth_of` -- the brute-force cart, which cannot be wrong --",
     "    and against the store, which must reproduce it exactly on every row.  The two cost",
     "    columns are printed per row so the reader can see where the bound is worth anything: at",
     "    the chapter's scale the allowance saves at most 2 carts, and only by dropping carts whose",
     "    value is then lost -- up to 37 of the 45 units of cart value; the saving only becomes large",
     "    (1,899 and 2,000) at the asymptotic scale on the last two rows.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'events':>7} {'ttl':>6} {'hour':>6} {'true':>6} \"",
     "          f\"{'kept':>6} {'held':>6} {'+ttl':>6} {'saved':>6} {'reloads':>8}\")",
     "    for label, additions, ttl, hour, want_kept, want_saved in EXAMPLES:",
     "        plain, peak, _ = final_carts(additions, ttl, use_store=False)",
     "        stored, peak_s, reloads = final_carts(additions, ttl, use_store=True)",
     "        truth = truth_of(additions)",
     "        kept = sum(sum(items) for items in plain.values())",
     "        true_value = sum(sum(items) for items in truth.values())",
     "        held = carts_held_at(additions, INFINITY, hour)",
     "        held_ttl = carts_held_at(additions, ttl, hour)",
     "        assert kept == want_kept, (label, kept, want_kept)",
     "        assert held - held_ttl == want_saved, (label, held - held_ttl, want_saved)",
     "        assert stored == truth, (label, \"the store must reproduce the true cart\")",
     "        for s, items in plain.items():",
     "            assert is_suffix(items, truth[s]), (label, s, items)   # only ever a suffix",
     "        assert kept <= true_value, (label, kept, true_value)",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:37s} {len(additions):>7,} {ttl_s:>6} {hour:>6,} {true_value:>6,} \"",
     "              f\"{kept:>6,} {held:>6,} {held_ttl:>6,} {held - held_ttl:>6,} {reloads:>8,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true cart\")",
     "    print()",

     "",
     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",
     "    shoppers rather than a derivation from anything.\"\"\"",
     "    worst, prev = 0, None",
     "    for s, _, t in additions:",
     "        if s == shopper:",
     "            if prev is not None:",
     "                worst = max(worst, t - prev)",
     "            prev = t",
     "    return worst",
     "",
     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",
     "            expire_by_deleting(carts, last, t, ttl)",
     "        else:",
     "            expire_by_writing_out(carts, last, store, t, ttl)",
     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",
     "",
     "",
     "def final_carts(additions, ttl, use_store):",
     "    \"\"\"What each shopper is shown the next time they look, which is memory plus whatever is",
     "    in the store -- the only measurement the shopper can actually make.\"\"\"",
     "    store = {} if use_store else None",
     "    carts, store, peak, reloads = run(additions, ttl, store)",
     "    out = {s: list(items) for s, items in carts.items()}",
     "    if store:",
     "        for s, items in store.items():",
     "            out[s] = items + out.get(s, [])",
     "    return out, peak, reloads",
     "",
     "",
     "def carts_held_at(additions, ttl, t):",
     "    \"\"\"How many carts memory holds at hour t, if nothing arrives then.",
     "",
     "    Counting at the end of the run is the wrong measurement: an expiry is immediately followed",
     "    by the addition that re-creates the cart, so the saving is invisible there.  A quiet moment",
     "    shows it.\"\"\"",
     "    last = {}",
     "    for s, _, at in additions:",
     "        if at <= t:",
     "            last[s] = at",
     "    return sum(1 for s in last if t - last[s] <= ttl)",
     "",
     "",
     "def is_suffix(part, whole):",
     "    \"\"\"Whether `part` is a tail of `whole`.  The precise shape of the damage a deletion does:",
     "    the shopper keeps what they added after the cart was dropped and nothing before it.\"\"\"",
     "    return part == whole[len(whole) - len(part):] if part else True",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    silences = {s: longest_silence(ADDITIONS, s) for s in (\"a\", \"b\")}",

     "    print(f\"  expire by writing out : {writing}   ({peak_wr} carts held, {reloads} reload)\")",
     "",
     "    assert keeping == TRUE_CARTS, keeping",
     "    assert writing == TRUE_CARTS, \"writing the cart out and reading it back must be exact\"",
     "    assert deleting != TRUE_CARTS, \"deleting must lose the cart, or there is no problem here\"",
     "    # CORRECTED CLAIM.  The first expectation was {\"a\": [8], \"b\": [4, 7, 9, 1]} -- shopper 'b'",
     "    # untouched, because b's longest silence (130) is inside the allowance.  The measurement",
     "    # refused it: b's LAST addition is at hour 260 and the sweep runs when a's addition",

     "    assert \"b\" not in deleting, \"b's cart is swept when a's hour-540 addition arrives\"",

     "",
     "    # the damage has a shape, and it is always this shape",

     "    print(f\"  drop -- so the error is one-directional: a cart can only ever be too small.\")",
     "",
     "    # and the store makes it exact at ANY allowance, including none at all",
     "    for ttl in (0, 1, WEEK, silences[\"a\"] - 1, INFINITY):",
     "        got, peak, _ = final_carts(ADDITIONS, ttl, use_store=True)",
     "        assert got == TRUE_CARTS, (ttl, got)",
     "    zero, zero_peak, zero_reloads = final_carts(ADDITIONS, 0, use_store=True)",
     "    assert zero == TRUE_CARTS and zero_peak == 1, (zero, zero_peak)",
     "    print(f\"  with a store, every allowance from 0 to never is exact; at ttl = 0 memory holds\")",
     "    print(f\"  {zero_peak} cart at a time and the answer is still {zero['a'] == TRUE_CARTS['a'] and 'right' or 'wrong'} after {zero_reloads} reloads.\")",
     "    assert zero_reloads == 7, zero_reloads",
     "",
     "    # the boundary the comparison decides",
     "    tight, _, _ = final_carts(ADDITIONS, silences[\"a\"] - 1, use_store=False)",
     "    exact, _, _ = final_carts(ADDITIONS, silences[\"a\"], use_store=False)",
     "    assert exact == TRUE_CARTS, \"an allowance equal to the longest silence drops nobody\"",
     "    assert tight != TRUE_CARTS, tight",
     "    # and this allowance isolates the two failure modes: at 294 hours only 'a' is dropped and",
     "    # restarted, while 'b' -- quiet 280 hours when the sweep runs -- is still inside it.  The",
     "    # erasure of 'b' needs an allowance tighter than 280, which the week-long one is.",
     "    assert tight == {\"a\": [8], \"b\": [4, 7, 9, 1]}, tight",
     "    print(f\"\\n  boundary: ttl = {silences['a']} (the silence itself) keeps every cart; ttl = {silences['a'] - 1} loses one.\")",
     "    print(f\"  The comparison is `now - last > ttl`, so a silence EQUAL to the allowance is\")",
     "    print(f\"  inside it -- one hour decides whether a shopper's cart exists.  At {silences['a'] - 1} hours only\")",

     "",
     "    # the memory saving at this scale, measured at every hour -- and measured twice, because",
     "    # where you stop looking changes the number.",
     "    end = max(t for *_, t in ADDITIONS)",

     "",

     "    allowance (ttl) -- how long a cart survives inactivity, in hours.  A week is 168.  A gap",
     "                 of exactly ttl still keeps the cart; one hour more and it is expired.",
     "    expire    -- what happens when the allowance runs out.  Two different things are being",
     "                 conflated and the problem turns on separating them: DELETING the cart, so",
     "                 the items are gone, versus WRITING IT OUT to durable storage, so memory is",
     "                 freed and the shopper can still have their items back.",
     "    carts saved -- how many carts memory is NOT holding at the hour you look.  It has to be",
     "                 measured at a named hour: an expiry is usually followed straight away by",
     "                 the addition that re-creates the cart, so counting at the end shows nothing.",
     "",
     "  Nine additions arrive: a adds a 5 at hour 1 and a 3 at hour 3; b adds a 4 at hour 50 and a",
     "  7 at hour 90; a adds a 2 at hour 130; b adds a 9 at hour 220; a adds a 6 at hour 245; b",
     "  adds a 1 at hour 260; and a adds an 8 at hour 540.  The true carts are a = 5+3+2+6+8 = 24",
     "  and b = 4+7+9+1 = 21, so 45 of value in all.  Shopper 'a' goes quiet from hour 245 to hour",
     "  540 -- 295 hours, which is just over twelve days -- and then comes back expecting their cart.",
     "",
     "  GIVEN AN ALLOWANCE AND AN HOUR TO LOOK AT, HOW MUCH CART VALUE SURVIVES, AND HOW MANY",
     "  CARTS HAS MEMORY BEEN SPARED?",
     "",
     "  Worked, as (value kept by deleting, carts saved) on the nine additions above -- which",
     "  between them cover hours 1..540:",
     "    never expire, at hour 540  -> (45, 0)   nothing is ever dropped, so nothing is lost and",
     "                                            nothing is saved: the baseline",
     "    ttl = 295, at hour 540     -> (45, 0)   exactly the length of 'a's silence, so the cart",
     "                                            is still there when they return",
     "    ttl = 294, at hour 540     -> (29, 0)   one hour tighter, the other side of that edge:",
     "                                            'a's first four items are gone, 16 of value lost",
     "    ttl = 168, at hour 540     -> (8, 1)    the week the product actually chose: 'a' comes",
     "                                            back to a cart holding only the item they just",
     "                                            added, and 37 of value has been thrown away",
     "    ttl = 168, at hour 413     -> (8, 0)    the SAME allowance, looked at 127 hours earlier:",
     "                                            it has saved NOTHING yet",
     "    ttl = 168, at hour 429     -> (8, 2)    sixteen hours later, both carts are out of",
     "                                            memory -- so \"how much does the expiry save\" has",
     "                                            no answer without an hour attached to it",
     "    ttl = 0, at hour 540       -> (8, 1)    one cart at a time, the tightest allowance",
     "    an EMPTY stream, at hour 0 -> (0, 0)    no additions, so no carts.  0, not an error",
     "    a single addition, at hour 0 -> (5, 0)  the smallest real stream",
     "    two additions 10 hours apart, ttl = 10 -> (8, 0)   the gap equals the allowance: kept",
     "    the same two, ttl = 9                  -> (3, 0)   one hour short: the first item is gone",
     "  And on 2,000 shoppers who visit once plus one who never leaves:",
     "    ttl = 100, at hour 2000 -> (301, 1899)   1,899 carts out of memory, and 1,899 shoppers",
     "                                             who would find their cart empty",
     "    ttl = 0,   at hour 2000 -> (1, 2000)     everything saved, everything lost",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the true cart and against the store -- so these answers cannot drift from what the",
     "  program returns.  (Looking at an hour outside the stream is defined too and reported by",
     "  the same function: hour 0 holds 0 carts because nothing has arrived, and hour 10000 holds",
     "  0 because everything has expired -- neither is an error.)",
     "",
     "Here the expiry is the FEATURE, not the compromise -- the chapter's silent restart is the",
     "specified behaviour -- and that inverts the whole problem, leaving one real contradiction:",
     "the cart must be bounded in memory and unbounded in time.  The move is to notice that EXPIRE",
     "and FORGET were conflated.  Dropping a cart from memory writes it out; a shopper who comes",
     "back reads it in.  Then memory is bounded by ACTIVE shoppers and correctness is bounded by",
     "nothing -- and the honest price, measured below, is that durable storage is now bounded by",
     "nothing either.  The fix does not shrink the data, it moves it to where growth is affordable.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",

     "shoppers.  Every row is ASSERTED twice, against the true cart and against the store, so the",
     "table cannot drift from the code: change an answer and this file stops running.",
     "",

     "\"\"\"",
     "import random",
     "",
     "# The chapter's nine seed events, read as cart additions: (shopper, item_price, hour).  The",

     "INFINITY = float(\"inf\")",
     "# The scale at which bounding memory is worth anything, from the chapter's asymptotic case:",
     "# many shoppers who visit once, plus one who never leaves.",
     "ONEOFF = 2_000",
     "BIG_TTL = 100",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty stream, one",

     "                       + [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)],",

     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, additions, ttl, hour observed, cart value kept by DELETING, carts saved",
     "# at that hour).  The hour is an input and not a detail: `carts_held_at` only reports what",
     "# memory holds at the moment you look, and the same allowance saves 0 carts at hour 413 and 2",

     "# is asserted by show_examples(), which is why the table is data and not a comment: a comment",

     "    (\"ttl = a week, at the last addition\",    ADDITIONS,          168, 540,   8, 1),",
     "    (\"ttl = a week, at hour 413: saves 0\",    ADDITIONS,          168, 413,   8, 0),",
     "    (\"ttl = a week, at hour 429: saves 2\",    ADDITIONS,          168, 429,   8, 2),",
     "    (\"ttl = 0: one cart at a time\",           ADDITIONS,            0, 540,   8, 1),",
     "    (\"an empty stream -> no carts at all\",    NO_ADDITIONS,  INFINITY,   0,   0, 0),",
     "    (\"a single addition\",                     ONE_ADDITION,  INFINITY,   0,   5, 0),",
     "    (\"one gap of 10, ttl = 10: kept\",         TWO_ADDITIONS,       10,  10,   8, 0),",
     "    (\"one gap of 10, ttl = 9: restarted\",     TWO_ADDITIONS,        9,  10,   3, 0),",
     "    (\"2,000 one-visit shoppers, ttl = 100\",   BIG_ADDITIONS,      100, 2000, 301, 1899),",
