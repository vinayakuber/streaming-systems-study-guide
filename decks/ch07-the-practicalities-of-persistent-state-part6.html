     "    return out",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `truth_of` -- the brute-force cart, which cannot be wrong --",
     "    and against the store, which must reproduce it exactly on every row.  The two cost",
     "    columns are printed per row so the reader can see where the bound is worth anything: at",
     "    the chapter's scale the allowance saves at most 2 carts, and only by dropping carts whose",
     "    value is then lost -- up to 37 of the 45 units of cart value; the saving only becomes large",
     "    (1,899 and 2,000) at the asymptotic scale on the last two rows.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'events':>7} {'ttl':>6} {'hour':>6} {'true':>6} \"",
     "          f\"{'kept':>6} {'held':>6} {'+ttl':>6} {'saved':>6} {'reloads':>8}\")",
     "    for label, additions, ttl, hour, want_kept, want_saved in EXAMPLES:",
     "        plain, peak, _ = final_carts(additions, ttl, use_store=False)",
     "        stored, peak_s, reloads = final_carts(additions, ttl, use_store=True)",
     "        truth = truth_of(additions)",
     "        kept = sum(sum(items) for items in plain.values())",
     "        true_value = sum(sum(items) for items in truth.values())",
     "        held = carts_held_at(additions, INFINITY, hour)",
     "        held_ttl = carts_held_at(additions, ttl, hour)",
     "        assert kept == want_kept, (label, kept, want_kept)",
     "        assert held - held_ttl == want_saved, (label, held - held_ttl, want_saved)",
     "        assert stored == truth, (label, \"the store must reproduce the true cart\")",
     "        for s, items in plain.items():",
     "            assert is_suffix(items, truth[s]), (label, s, items)   # only ever a suffix",
     "        assert kept <= true_value, (label, kept, true_value)",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:37s} {len(additions):>7,} {ttl_s:>6} {hour:>6,} {true_value:>6,} \"",
     "              f\"{kept:>6,} {held:>6,} {held_ttl:>6,} {held - held_ttl:>6,} {reloads:>8,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true cart\")",
     "    print()",
     "",
     "",
     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",
     "    shoppers rather than a derivation from anything.\"\"\"",
     "    worst, prev = 0, None",
     "    for s, _, t in additions:",
     "        if s == shopper:",
     "            if prev is not None:",
     "                worst = max(worst, t - prev)",
     "            prev = t",
     "    return worst",
     "",
     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",
     "            expire_by_deleting(carts, last, t, ttl)",
     "        else:",
     "            expire_by_writing_out(carts, last, store, t, ttl)",
     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",
     "",
     "",
     "def final_carts(additions, ttl, use_store):",
     "    \"\"\"What each shopper is shown the next time they look, which is memory plus whatever is",
     "    in the store -- the only measurement the shopper can actually make.\"\"\"",
     "    store = {} if use_store else None",
     "    carts, store, peak, reloads = run(additions, ttl, store)",
     "    out = {s: list(items) for s, items in carts.items()}",
     "    if store:",
     "        for s, items in store.items():",
     "            out[s] = items + out.get(s, [])",
     "    return out, peak, reloads",
     "",
     "",
     "def carts_held_at(additions, ttl, t):",
     "    \"\"\"How many carts memory holds at hour t, if nothing arrives then.",
     "",
     "    Counting at the end of the run is the wrong measurement: an expiry is immediately followed",
     "    by the addition that re-creates the cart, so the saving is invisible there.  A quiet moment",
     "    shows it.\"\"\"",
     "    last = {}",
     "    for s, _, at in additions:",
     "        if at <= t:",
     "            last[s] = at",
     "    return sum(1 for s in last if t - last[s] <= ttl)",
     "",
     "",
     "def is_suffix(part, whole):",
     "    \"\"\"Whether `part` is a tail of `whole`.  The precise shape of the damage a deletion does:",
     "    the shopper keeps what they added after the cart was dropped and nothing before it.\"\"\"",
     "    return part == whole[len(whole) - len(part):] if part else True",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    silences = {s: longest_silence(ADDITIONS, s) for s in (\"a\", \"b\")}",
     "    print(\"ADDITIONS =\", \"  \".join(f\"{s}@{t}:{p}\" for s, p, t in ADDITIONS))",
     "    print(f\"  true carts {TRUE_CARTS}, values {TRUE_VALUE}\")",
     "    print(f\"  longest silence per shopper {silences}, allowance {WEEK} hours (a week)\\n\")",
     "",
     "    deleting, peak_del, _ = final_carts(ADDITIONS, WEEK, use_store=False)",
     "    writing, peak_wr, reloads = final_carts(ADDITIONS, WEEK, use_store=True)",
     "    keeping, peak_keep, _ = final_carts(ADDITIONS, INFINITY, use_store=False)",
     "    print(f\"  never expire          : {keeping}   ({peak_keep} carts held)\")",
     "    print(f\"  expire by deleting    : {deleting}   ({peak_del} carts held)\")",
     "    print(f\"  expire by writing out : {writing}   ({peak_wr} carts held, {reloads} reload)\")",
     "",
     "    assert keeping == TRUE_CARTS, keeping",
     "    assert writing == TRUE_CARTS, \"writing the cart out and reading it back must be exact\"",
     "    assert deleting != TRUE_CARTS, \"deleting must lose the cart, or there is no problem here\"",
     "    # CORRECTED CLAIM.  The first expectation was {\"a\": [8], \"b\": [4, 7, 9, 1]} -- shopper 'b'",
     "    # untouched, because b's longest silence (130) is inside the allowance.  The measurement",
     "    # refused it: b's LAST addition is at hour 260 and the sweep runs when a's addition",
     "    # arrives at hour 540, so b has been quiet 280 hours by then and the cart is swept.  There",
     "    # are two distinct losses here, not one: 'a' is dropped and comes back, which restarts the",
     "    # cart, and 'b' is dropped and does not come back, which erases it.  A silence inside the",
     "    # allowance is no protection -- what matters is the silence at the moment somebody else's",
     "    # event triggers the sweep.",
     "    assert deleting == {\"a\": [8]}, deleting",
     "    assert \"b\" not in deleting, \"b's cart is swept when a's hour-540 addition arrives\"",
     "    assert reloads == 1, reloads",
     "    lost_a = TRUE_CARTS[\"a\"][:-1]",
     "    quiet_b = 540 - 260",
     "    assert sum(lost_a) == 16 and sum(deleting[\"a\"]) == 8",
     "    print(f\"\\n  shopper 'a' was silent {silences['a']} hours, {silences['a'] - WEEK} past the allowance, so they return to a\")",
     "    print(f\"  cart holding {sum(deleting['a'])} instead of {TRUE_VALUE['a']}: {len(lost_a)} items worth {sum(lost_a)} silently gone.\")",
     "    print(f\"  shopper 'b''s longest silence is only {silences['b']} hours and the cart is lost anyway: by the\")",
     "    print(f\"  time a's hour-540 addition triggers a sweep, b has been quiet {quiet_b} hours, so b's\")",
     "    print(f\"  whole cart is erased with nothing to come back to.  Two different losses -- a\")",
     "    print(f\"  restart and an erasure -- and only the first one looks like the chapter's.\")",
     "    assert quiet_b > WEEK and silences[\"b\"] <= WEEK, (quiet_b, silences[\"b\"])",
     "",
     "    # the damage has a shape, and it is always this shape",
     "    for s, items in deleting.items():   # only 'a' survives in memory at all",
     "        assert is_suffix(items, TRUE_CARTS[s]), (s, items)",
     "        assert sum(items) <= TRUE_VALUE[s], (s, items)",
     "    assert not is_suffix([5, 3], TRUE_CARTS[\"a\"]), \"a prefix is NOT what survives\"",
     "    print(f\"\\n  what survives is always a SUFFIX of the true cart -- the items added since the\")",
     "    print(f\"  drop -- so the error is one-directional: a cart can only ever be too small.\")",
     "",
     "    # and the store makes it exact at ANY allowance, including none at all",
     "    for ttl in (0, 1, WEEK, silences[\"a\"] - 1, INFINITY):",
     "        got, peak, _ = final_carts(ADDITIONS, ttl, use_store=True)",
     "        assert got == TRUE_CARTS, (ttl, got)",
     "    zero, zero_peak, zero_reloads = final_carts(ADDITIONS, 0, use_store=True)",
     "    assert zero == TRUE_CARTS and zero_peak == 1, (zero, zero_peak)",
     "    print(f\"  with a store, every allowance from 0 to never is exact; at ttl = 0 memory holds\")",
     "    print(f\"  {zero_peak} cart at a time and the answer is still {zero['a'] == TRUE_CARTS['a'] and 'right' or 'wrong'} after {zero_reloads} reloads.\")",
     "    assert zero_reloads == 7, zero_reloads",
     "",
     "    # the boundary the comparison decides",
     "    tight, _, _ = final_carts(ADDITIONS, silences[\"a\"] - 1, use_store=False)",
     "    exact, _, _ = final_carts(ADDITIONS, silences[\"a\"], use_store=False)",
     "    assert exact == TRUE_CARTS, \"an allowance equal to the longest silence drops nobody\"",
     "    assert tight != TRUE_CARTS, tight",
     "    # and this allowance isolates the two failure modes: at 294 hours only 'a' is dropped and",
     "    # restarted, while 'b' -- quiet 280 hours when the sweep runs -- is still inside it.  The",
     "    # erasure of 'b' needs an allowance tighter than 280, which the week-long one is.",
     "    assert tight == {\"a\": [8], \"b\": [4, 7, 9, 1]}, tight",
     "    print(f\"\\n  boundary: ttl = {silences['a']} (the silence itself) keeps every cart; ttl = {silences['a'] - 1} loses one.\")",
     "    print(f\"  The comparison is `now - last > ttl`, so a silence EQUAL to the allowance is\")",
     "    print(f\"  inside it -- one hour decides whether a shopper's cart exists.  At {silences['a'] - 1} hours only\")",
     "    print(f\"  'a' is lost: {tight}, with 'b' kept because 280 hours of\")",
     "    print(f\"  quiet is inside a 294-hour allowance and outside a 168-hour one.\")",
     "",
     "    # the memory saving at this scale, measured at every hour -- and measured twice, because",
     "    # where you stop looking changes the number.",
     "    end = max(t for *_, t in ADDITIONS)",
     "    def saving_at(ttl, horizon):",
     "        return max(carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t)",
     "                   for t in range(horizon + 1))",
     "    def best_hour(ttl, horizon):",
     "        return max(range(horizon + 1),",
     "                   key=lambda t: carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t))",
     "    beyond = end + WEEK + 2",
     "    print(f\"\\n  carts the allowance saves, as a maximum over every hour:\")",
     "    print(f\"    {'allowance':>12} {'up to hour ' + str(end):>16} {'up to hour ' + str(beyond):>16}\")",
     "    for ttl in (WEEK, 294):",
     "        print(f\"    {ttl:>12} {saving_at(ttl, end):>16} {saving_at(ttl, beyond):>16}\")",
     "    # MEASURED, and the first write-up of this said ZERO on the strength of the chapter's",
     "    # figure.  Both halves are true and they are different allowances: at the chapter's",
     "    # 294-hour allowance the saving really is 0 for every hour up to the last addition, which",
     "    # is the chapter's own measurement reproduced.  At the week-long allowance the saving is 2,",
     "    # reached at hour {h} -- and the hour is the whole story, because by then BOTH carts have",
     "    # already been erased.  The memory the bound reclaims is the cart the shopper lost, so the",
     "    # saving and the damage are one measurement seen from two sides.",
     "    h = best_hour(WEEK, end)",
     "    assert saving_at(294, end) == 0, saving_at(294, end)",
     "    assert saving_at(294, beyond) == 1, saving_at(294, beyond)",
     "    assert saving_at(WEEK, end) == 2, saving_at(WEEK, end)",
     "    assert h == 429, h",
     "    assert carts_held_at(ADDITIONS, WEEK, h) == 0 and carts_held_at(ADDITIONS, INFINITY, h) == 2",
     "    assert h > 245 + WEEK and h > 260 + WEEK, \"both carts are already past their allowance\"",
     "    print(f\"  at the chapter's 294-hour allowance the saving is 0 for every hour up to the last\")",
     "    print(f\"  addition -- the chapter's own figure -- so the correctness cost arrives before any\")",
     "    print(f\"  memory benefit.  At the week-long allowance it is 2, reached at hour {h}, and the hour\")",
     "    print(f\"  is the whole story: shopper 'a' expired at {245 + WEEK + 1} and 'b' at {260 + WEEK + 1}, so the two carts the\")",
     "    print(f\"  bound has stopped holding are precisely the two the shoppers no longer have.  A\")",
     "    print(f\"  saving visible only after the data is gone is the damage, measured from the other\")",
     "    print(f\"  side.  The real case for the bound is asymptotic, and the honest thing is to go\")",
     "    print(f\"  and measure it there.\")",
     "",
     "    # ...measured there",
     "    big = [(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "    big += [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)]",

     "#!/usr/bin/env python3",
     "\"\"\"Variation 3 -- the abandoned shopping cart (looks like commerce). Standalone and runnable.",
     "",
     "  WHAT THE WORDS MEAN, before any of them is used:",
     "    addition  -- one item going into a cart: (shopper, the item's price, the hour).  Hours",
     "                 count from 0, so hour 168 is a week in and hour 540 is twenty-two days in.",
     "    cart      -- every item that shopper has added, in order.  \"Cart value\" is the sum of",
     "                 its prices, and the answer below adds up the value still held across ALL",
     "                 shoppers -- 45 when nothing has been lost.",
     "    inactive  -- a shopper is inactive at hour t if their last addition was before t.  The",
     "                 gap is t minus that hour.",
     "    allowance (ttl) -- how long a cart survives inactivity, in hours.  A week is 168.  A gap",
     "                 of exactly ttl still keeps the cart; one hour more and it is expired.",
     "    expire    -- what happens when the allowance runs out.  Two different things are being",
     "                 conflated and the problem turns on separating them: DELETING the cart, so",
     "                 the items are gone, versus WRITING IT OUT to durable storage, so memory is",
     "                 freed and the shopper can still have their items back.",
     "    carts saved -- how many carts memory is NOT holding at the hour you look.  It has to be",
     "                 measured at a named hour: an expiry is usually followed straight away by",
     "                 the addition that re-creates the cart, so counting at the end shows nothing.",
     "",
     "  Nine additions arrive: a adds a 5 at hour 1 and a 3 at hour 3; b adds a 4 at hour 50 and a",
     "  7 at hour 90; a adds a 2 at hour 130; b adds a 9 at hour 220; a adds a 6 at hour 245; b",
     "  adds a 1 at hour 260; and a adds an 8 at hour 540.  The true carts are a = 5+3+2+6+8 = 24",
     "  and b = 4+7+9+1 = 21, so 45 of value in all.  Shopper 'a' goes quiet from hour 245 to hour",
     "  540 -- 295 hours, which is just over twelve days -- and then comes back expecting their cart.",
     "",
     "  GIVEN AN ALLOWANCE AND AN HOUR TO LOOK AT, HOW MUCH CART VALUE SURVIVES, AND HOW MANY",
     "  CARTS HAS MEMORY BEEN SPARED?",
     "",
     "  Worked, as (value kept by deleting, carts saved) on the nine additions above -- which",
     "  between them cover hours 1..540:",
     "    never expire, at hour 540  -> (45, 0)   nothing is ever dropped, so nothing is lost and",
     "                                            nothing is saved: the baseline",
     "    ttl = 295, at hour 540     -> (45, 0)   exactly the length of 'a's silence, so the cart",
     "                                            is still there when they return",
     "    ttl = 294, at hour 540     -> (29, 0)   one hour tighter, the other side of that edge:",
     "                                            'a's first four items are gone, 16 of value lost",
     "    ttl = 168, at hour 540     -> (8, 1)    the week the product actually chose: 'a' comes",
     "                                            back to a cart holding only the item they just",
     "                                            added, and 37 of value has been thrown away",
     "    ttl = 168, at hour 413     -> (8, 0)    the SAME allowance, looked at 127 hours earlier:",
     "                                            it has saved NOTHING yet",
     "    ttl = 168, at hour 429     -> (8, 2)    sixteen hours later, both carts are out of",
     "                                            memory -- so \"how much does the expiry save\" has",
     "                                            no answer without an hour attached to it",
     "    ttl = 0, at hour 540       -> (8, 1)    one cart at a time, the tightest allowance",
     "    an EMPTY stream, at hour 0 -> (0, 0)    no additions, so no carts.  0, not an error",
     "    a single addition, at hour 0 -> (5, 0)  the smallest real stream",
     "    two additions 10 hours apart, ttl = 10 -> (8, 0)   the gap equals the allowance: kept",
     "    the same two, ttl = 9                  -> (3, 0)   one hour short: the first item is gone",
     "  And on 2,000 shoppers who visit once plus one who never leaves:",
     "    ttl = 100, at hour 2000 -> (301, 1899)   1,899 carts out of memory, and 1,899 shoppers",
     "                                             who would find their cart empty",
     "    ttl = 0,   at hour 2000 -> (1, 2000)     everything saved, everything lost",
     "",
     "  Every line above is a row in the EXAMPLES table below, and every row is asserted twice --",
     "  against the true cart and against the store -- so these answers cannot drift from what the",
     "  program returns.  (Looking at an hour outside the stream is defined too and reported by",
     "  the same function: hour 0 holds 0 carts because nothing has arrived, and hour 10000 holds",
     "  0 because everything has expired -- neither is an error.)",
     "",
     "Here the expiry is the FEATURE, not the compromise -- the chapter's silent restart is the",
     "specified behaviour -- and that inverts the whole problem, leaving one real contradiction:",
     "the cart must be bounded in memory and unbounded in time.  The move is to notice that EXPIRE",
     "and FORGET were conflated.  Dropping a cart from memory writes it out; a shopper who comes",
     "back reads it in.  Then memory is bounded by ACTIVE shoppers and correctness is bounded by",
     "nothing -- and the honest price, measured below, is that durable storage is now bounded by",
     "nothing either.  The fix does not shrink the data, it moves it to where growth is affordable.",
     "",
     "WORKED EXAMPLES: the EXAMPLES table below holds 13 input/output pairs -- the chapter's own",
     "nine additions, both sides of the 295-hour silence the sweep turns on, both sides of the hour",
     "at which a week-long allowance starts saving anything, an empty stream, a single addition, a",
     "cart erased with nothing to come back to, and two generated streams at 2,000 one-visit",
     "shoppers.  Every row is ASSERTED twice, against the true cart and against the store, so the",
     "table cannot drift from the code: change an answer and this file stops running.",
     "",
     "Run it:  python3 programs/ch07_v3.py",
     "\"\"\"",
     "import random",
     "",
     "# The chapter's nine seed events, read as cart additions: (shopper, item_price, hour).  The",
     "# prices are the chapter's values, so the true cart totals are its 24 and 21.  Shopper 'a' is",
     "# silent from hour 245 to hour 540 -- the chapter's longest gap, 295 hours, which is 12 days 7 hours",
     "# and is exactly the shopper the product requirement is about.",
     "ADDITIONS = [(\"a\", 5, 1), (\"a\", 3, 3), (\"b\", 4, 50), (\"b\", 7, 90), (\"a\", 2, 130),",
     "             (\"b\", 9, 220), (\"a\", 6, 245), (\"b\", 1, 260), (\"a\", 8, 540)]",
     "WEEK = 168                 # the inactivity allowance the product chose: a week in hours",
     "TRUE_CARTS = {\"a\": [5, 3, 2, 6, 8], \"b\": [4, 7, 9, 1]}",
     "TRUE_VALUE = {\"a\": 24, \"b\": 21}",
     "INFINITY = float(\"inf\")",
     "# The scale at which bounding memory is worth anything, from the chapter's asymptotic case:",
     "# many shoppers who visit once, plus one who never leaves.",
     "ONEOFF = 2_000",
     "BIG_TTL = 100",
     "",
     "# Inputs for the examples table, not alternative versions of the problem: an empty stream, one",
     "# addition, a pair of additions ten hours apart (so one allowance sits on each side of the",
     "# gap), and the asymptotic stream -- the same shape main() measures below, built here so the",
     "# table can reach it too.",
     "NO_ADDITIONS = []",
     "ONE_ADDITION = [(\"x\", 5, 0)]",
     "TWO_ADDITIONS = [(\"x\", 5, 0), (\"x\", 3, 10)]",
     "BIG_ADDITIONS = sorted([(f\"once{i}\", 1, i) for i in range(1, ONEOFF + 1)]",
     "                       + [(\"regular\", 1, t) for t in range(5, ONEOFF, 10)],",
     "                       key=lambda e: e[2])",
     "",
     "# ------------------------------------------------------------------- WORKED EXAMPLES",
     "# (what it exercises, additions, ttl, hour observed, cart value kept by DELETING, carts saved",
     "# at that hour).  The hour is an input and not a detail: `carts_held_at` only reports what",
     "# memory holds at the moment you look, and the same allowance saves 0 carts at hour 413 and 2",
     "# at hour 429 -- so a table without the hour in it would be reporting an opinion.  Every row",
     "# is asserted by show_examples(), which is why the table is data and not a comment: a comment",
     "# can go stale silently, and this cannot.",
     "EXAMPLES = [",
     "    (\"never expire: the whole cart\",          ADDITIONS,     INFINITY, 540,  45, 0),",
     "    (\"ttl = 295, the longest silence\",        ADDITIONS,          295, 540,  45, 0),",
     "    (\"ttl = 294, one hour tighter\",           ADDITIONS,          294, 540,  29, 0),",
     "    (\"ttl = a week, at the last addition\",    ADDITIONS,          168, 540,   8, 1),",
     "    (\"ttl = a week, at hour 413: saves 0\",    ADDITIONS,          168, 413,   8, 0),",
     "    (\"ttl = a week, at hour 429: saves 2\",    ADDITIONS,          168, 429,   8, 2),",
     "    (\"ttl = 0: one cart at a time\",           ADDITIONS,            0, 540,   8, 1),",
     "    (\"an empty stream -> no carts at all\",    NO_ADDITIONS,  INFINITY,   0,   0, 0),",
     "    (\"a single addition\",                     ONE_ADDITION,  INFINITY,   0,   5, 0),",
     "    (\"one gap of 10, ttl = 10: kept\",         TWO_ADDITIONS,       10,  10,   8, 0),",
     "    (\"one gap of 10, ttl = 9: restarted\",     TWO_ADDITIONS,        9,  10,   3, 0),",
     "    (\"2,000 one-visit shoppers, ttl = 100\",   BIG_ADDITIONS,      100, 2000, 301, 1899),",
     "    (\"2,000 one-visit shoppers, ttl = 0\",     BIG_ADDITIONS,        0, 2000,   1, 2000),",
     "]",
     "",
     "",
     "def truth_of(additions):",
     "    \"\"\"The true cart per shopper: every item, in arrival order.  The brute-force reference the",
     "    examples table checks the store against -- it is the requirement written out, so it cannot",
     "    be wrong, and anything that disagrees with it is the thing that is broken.\"\"\"",
     "    out = {}",
     "    for s, price, _ in additions:",
     "        out.setdefault(s, []).append(price)",
     "    return out",
     "",
     "",
     "def show_examples():",
     "    \"\"\"Print the examples table and assert every row, two ways.",
     "",
     "    Each row is checked against `truth_of` -- the brute-force cart, which cannot be wrong --",
     "    and against the store, which must reproduce it exactly on every row.  The two cost",
     "    columns are printed per row so the reader can see where the bound is worth anything: at",
     "    the chapter's scale the allowance saves at most 2 carts, and only by dropping carts whose",
     "    value is then lost -- up to 37 of the 45 units of cart value; the saving only becomes large",
     "    (1,899 and 2,000) at the asymptotic scale on the last two rows.",
     "    \"\"\"",
     "    print(f\"{'what it exercises':37s} {'events':>7} {'ttl':>6} {'hour':>6} {'true':>6} \"",
     "          f\"{'kept':>6} {'held':>6} {'+ttl':>6} {'saved':>6} {'reloads':>8}\")",
     "    for label, additions, ttl, hour, want_kept, want_saved in EXAMPLES:",
     "        plain, peak, _ = final_carts(additions, ttl, use_store=False)",
     "        stored, peak_s, reloads = final_carts(additions, ttl, use_store=True)",
     "        truth = truth_of(additions)",
     "        kept = sum(sum(items) for items in plain.values())",
     "        true_value = sum(sum(items) for items in truth.values())",
     "        held = carts_held_at(additions, INFINITY, hour)",
     "        held_ttl = carts_held_at(additions, ttl, hour)",
     "        assert kept == want_kept, (label, kept, want_kept)",
     "        assert held - held_ttl == want_saved, (label, held - held_ttl, want_saved)",
     "        assert stored == truth, (label, \"the store must reproduce the true cart\")",
     "        for s, items in plain.items():",
     "            assert is_suffix(items, truth[s]), (label, s, items)   # only ever a suffix",
     "        assert kept <= true_value, (label, kept, true_value)",
     "        ttl_s = \"never\" if ttl == INFINITY else str(ttl)",
     "        print(f\"{label:37s} {len(additions):>7,} {ttl_s:>6} {hour:>6,} {true_value:>6,} \"",
     "              f\"{kept:>6,} {held:>6,} {held_ttl:>6,} {held - held_ttl:>6,} {reloads:>8,}\")",
     "    print(f\"all {len(EXAMPLES)} examples agree with the true cart\")",
     "    print()",
     "",
     "",
     "def longest_silence(additions, shopper):",
     "    \"\"\"The longest gap between two additions by one shopper.  A property of the DATA, not of",
     "    the design, and knowable only afterwards -- which is why the week is a guess about",
     "    shoppers rather than a derivation from anything.\"\"\"",
     "    worst, prev = 0, None",
     "    for s, _, t in additions:",
     "        if s == shopper:",
     "            if prev is not None:",
     "                worst = max(worst, t - prev)",
     "            prev = t",
     "    return worst",
     "",
     "",
     "def add(carts, last, event):",
     "    \"\"\"One item onto one cart.  The whole computation, and never the problem.\"\"\"",
     "    s, price, t = event",
     "    carts.setdefault(s, []).append(price)",
     "    last[s] = t",
     "",
     "",
     "def expire_by_deleting(carts, last, now, ttl):",
     "    \"\"\"The expiry as written when \"expire\" is read as \"forget\": the cart is deleted.",
     "",
     "    It needs `last`, a second number per live cart whose only purpose is this comparison.",
     "    Afterwards a shopper who returns is indistinguishable from a new one, because the thing",
     "    that would have told them apart is what was deleted.  Returns the carts dropped.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s in gone:",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def expire_by_writing_out(carts, last, store, now, ttl):",
     "    \"\"\"The same expiry with one line changed: the cart is written to durable storage on its",
     "    way out of memory.",
     "",
     "    Nothing about the bound changes -- memory still holds only active shoppers -- but the",
     "    deletion has become a MOVE, so the information needed to recognise a returning shopper",
     "    still exists somewhere.  Returns the carts moved.",
     "    \"\"\"",
     "    gone = {s: carts[s] for s in list(carts) if now - last[s] > ttl}",
     "    for s, items in gone.items():",
     "        store[s] = store.get(s, []) + items",
     "        del carts[s]",
     "        del last[s]",
     "    return gone",
     "",
     "",
     "def run(additions, ttl, store=None):",
     "    \"\"\"The whole stream at one allowance, with or without a store behind it.",
     "",
     "    Without a store, a returning shopper starts from an empty cart.  With one, a cart absent",
     "    from memory is read back before the item is added, which is the only difference and is the",
     "    entire answer.  Returns (carts_in_memory, store, peak_carts_held, reloads).",
     "    \"\"\"",
     "    carts, last, reloads = {}, {}, 0",
     "    peak = 0",
     "    for event in additions:",
     "        s, _, t = event",
     "        if store is None:",
     "            expire_by_deleting(carts, last, t, ttl)",
     "        else:",
     "            expire_by_writing_out(carts, last, store, t, ttl)",
     "            if s not in carts and s in store:",
     "                carts[s] = store.pop(s)        # the shopper came back: read the cart in",
     "                reloads += 1",
     "        add(carts, last, event)",
     "        peak = max(peak, len(carts))",
     "    return carts, store, peak, reloads",
     "",
     "",
     "def final_carts(additions, ttl, use_store):",
     "    \"\"\"What each shopper is shown the next time they look, which is memory plus whatever is",
     "    in the store -- the only measurement the shopper can actually make.\"\"\"",
     "    store = {} if use_store else None",
     "    carts, store, peak, reloads = run(additions, ttl, store)",
     "    out = {s: list(items) for s, items in carts.items()}",
     "    if store:",
     "        for s, items in store.items():",
     "            out[s] = items + out.get(s, [])",
     "    return out, peak, reloads",
     "",
     "",
     "def carts_held_at(additions, ttl, t):",
     "    \"\"\"How many carts memory holds at hour t, if nothing arrives then.",
     "",
     "    Counting at the end of the run is the wrong measurement: an expiry is immediately followed",
     "    by the addition that re-creates the cart, so the saving is invisible there.  A quiet moment",
     "    shows it.\"\"\"",
     "    last = {}",
     "    for s, _, at in additions:",
     "        if at <= t:",
     "            last[s] = at",
     "    return sum(1 for s in last if t - last[s] <= ttl)",
     "",
     "",
     "def is_suffix(part, whole):",
     "    \"\"\"Whether `part` is a tail of `whole`.  The precise shape of the damage a deletion does:",
     "    the shopper keeps what they added after the cart was dropped and nothing before it.\"\"\"",
     "    return part == whole[len(whole) - len(part):] if part else True",
     "",
     "",
     "def main():",
     "    show_examples()",
     "    silences = {s: longest_silence(ADDITIONS, s) for s in (\"a\", \"b\")}",
     "    print(\"ADDITIONS =\", \"  \".join(f\"{s}@{t}:{p}\" for s, p, t in ADDITIONS))",
     "    print(f\"  true carts {TRUE_CARTS}, values {TRUE_VALUE}\")",
     "    print(f\"  longest silence per shopper {silences}, allowance {WEEK} hours (a week)\\n\")",
     "",
     "    deleting, peak_del, _ = final_carts(ADDITIONS, WEEK, use_store=False)",
     "    writing, peak_wr, reloads = final_carts(ADDITIONS, WEEK, use_store=True)",
     "    keeping, peak_keep, _ = final_carts(ADDITIONS, INFINITY, use_store=False)",
     "    print(f\"  never expire          : {keeping}   ({peak_keep} carts held)\")",
     "    print(f\"  expire by deleting    : {deleting}   ({peak_del} carts held)\")",
     "    print(f\"  expire by writing out : {writing}   ({peak_wr} carts held, {reloads} reload)\")",
     "",
     "    assert keeping == TRUE_CARTS, keeping",
     "    assert writing == TRUE_CARTS, \"writing the cart out and reading it back must be exact\"",
     "    assert deleting != TRUE_CARTS, \"deleting must lose the cart, or there is no problem here\"",
     "    # CORRECTED CLAIM.  The first expectation was {\"a\": [8], \"b\": [4, 7, 9, 1]} -- shopper 'b'",
     "    # untouched, because b's longest silence (130) is inside the allowance.  The measurement",
     "    # refused it: b's LAST addition is at hour 260 and the sweep runs when a's addition",
     "    # arrives at hour 540, so b has been quiet 280 hours by then and the cart is swept.  There",
     "    # are two distinct losses here, not one: 'a' is dropped and comes back, which restarts the",
     "    # cart, and 'b' is dropped and does not come back, which erases it.  A silence inside the",
     "    # allowance is no protection -- what matters is the silence at the moment somebody else's",
     "    # event triggers the sweep.",
     "    assert deleting == {\"a\": [8]}, deleting",
     "    assert \"b\" not in deleting, \"b's cart is swept when a's hour-540 addition arrives\"",
     "    assert reloads == 1, reloads",
     "    lost_a = TRUE_CARTS[\"a\"][:-1]",
     "    quiet_b = 540 - 260",
     "    assert sum(lost_a) == 16 and sum(deleting[\"a\"]) == 8",
     "    print(f\"\\n  shopper 'a' was silent {silences['a']} hours, {silences['a'] - WEEK} past the allowance, so they return to a\")",
     "    print(f\"  cart holding {sum(deleting['a'])} instead of {TRUE_VALUE['a']}: {len(lost_a)} items worth {sum(lost_a)} silently gone.\")",
     "    print(f\"  shopper 'b''s longest silence is only {silences['b']} hours and the cart is lost anyway: by the\")",
     "    print(f\"  time a's hour-540 addition triggers a sweep, b has been quiet {quiet_b} hours, so b's\")",
     "    print(f\"  whole cart is erased with nothing to come back to.  Two different losses -- a\")",
     "    print(f\"  restart and an erasure -- and only the first one looks like the chapter's.\")",
     "    assert quiet_b > WEEK and silences[\"b\"] <= WEEK, (quiet_b, silences[\"b\"])",
     "",
     "    # the damage has a shape, and it is always this shape",
     "    for s, items in deleting.items():   # only 'a' survives in memory at all",
     "        assert is_suffix(items, TRUE_CARTS[s]), (s, items)",
     "        assert sum(items) <= TRUE_VALUE[s], (s, items)",
     "    assert not is_suffix([5, 3], TRUE_CARTS[\"a\"]), \"a prefix is NOT what survives\"",
     "    print(f\"\\n  what survives is always a SUFFIX of the true cart -- the items added since the\")",
     "    print(f\"  drop -- so the error is one-directional: a cart can only ever be too small.\")",
     "",
     "    # and the store makes it exact at ANY allowance, including none at all",
     "    for ttl in (0, 1, WEEK, silences[\"a\"] - 1, INFINITY):",
     "        got, peak, _ = final_carts(ADDITIONS, ttl, use_store=True)",
     "        assert got == TRUE_CARTS, (ttl, got)",
     "    zero, zero_peak, zero_reloads = final_carts(ADDITIONS, 0, use_store=True)",
     "    assert zero == TRUE_CARTS and zero_peak == 1, (zero, zero_peak)",
     "    print(f\"  with a store, every allowance from 0 to never is exact; at ttl = 0 memory holds\")",
     "    print(f\"  {zero_peak} cart at a time and the answer is still {zero['a'] == TRUE_CARTS['a'] and 'right' or 'wrong'} after {zero_reloads} reloads.\")",
     "    assert zero_reloads == 7, zero_reloads",
     "",
     "    # the boundary the comparison decides",
     "    tight, _, _ = final_carts(ADDITIONS, silences[\"a\"] - 1, use_store=False)",
     "    exact, _, _ = final_carts(ADDITIONS, silences[\"a\"], use_store=False)",
     "    assert exact == TRUE_CARTS, \"an allowance equal to the longest silence drops nobody\"",
     "    assert tight != TRUE_CARTS, tight",
     "    # and this allowance isolates the two failure modes: at 294 hours only 'a' is dropped and",
     "    # restarted, while 'b' -- quiet 280 hours when the sweep runs -- is still inside it.  The",
     "    # erasure of 'b' needs an allowance tighter than 280, which the week-long one is.",
     "    assert tight == {\"a\": [8], \"b\": [4, 7, 9, 1]}, tight",
     "    print(f\"\\n  boundary: ttl = {silences['a']} (the silence itself) keeps every cart; ttl = {silences['a'] - 1} loses one.\")",
     "    print(f\"  The comparison is `now - last > ttl`, so a silence EQUAL to the allowance is\")",
     "    print(f\"  inside it -- one hour decides whether a shopper's cart exists.  At {silences['a'] - 1} hours only\")",
     "    print(f\"  'a' is lost: {tight}, with 'b' kept because 280 hours of\")",
     "    print(f\"  quiet is inside a 294-hour allowance and outside a 168-hour one.\")",
     "",
     "    # the memory saving at this scale, measured at every hour -- and measured twice, because",
     "    # where you stop looking changes the number.",
     "    end = max(t for *_, t in ADDITIONS)",
     "    def saving_at(ttl, horizon):",
     "        return max(carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t)",
     "                   for t in range(horizon + 1))",
     "    def best_hour(ttl, horizon):",
     "        return max(range(horizon + 1),",
     "                   key=lambda t: carts_held_at(ADDITIONS, INFINITY, t) - carts_held_at(ADDITIONS, ttl, t))",
     "    beyond = end + WEEK + 2",
     "    print(f\"\\n  carts the allowance saves, as a maximum over every hour:\")",
     "    print(f\"    {'allowance':>12} {'up to hour ' + str(end):>16} {'up to hour ' + str(beyond):>16}\")",
     "    for ttl in (WEEK, 294):",
     "        print(f\"    {ttl:>12} {saving_at(ttl, end):>16} {saving_at(ttl, beyond):>16}\")",
     "    # MEASURED, and the first write-up of this said ZERO on the strength of the chapter's",
     "    # figure.  Both halves are true and they are different allowances: at the chapter's",
     "    # 294-hour allowance the saving really is 0 for every hour up to the last addition, which",
     "    # is the chapter's own measurement reproduced.  At the week-long allowance the saving is 2,",
     "    # reached at hour {h} -- and the hour is the whole story, because by then BOTH carts have",
     "    # already been erased.  The memory the bound reclaims is the cart the shopper lost, so the",
     "    # saving and the damage are one measurement seen from two sides.",
     "    h = best_hour(WEEK, end)",

 $$('.mt',svg).forEach(t=>{const v=M[+t.dataset.m].src;if(v)svgLink(t,v)})}

/* ---------------- counters ---------------- */
function count(el){const t=+el.dataset.count,d=+el.dataset.dec||0,p=el.dataset.pre||'',s=el.dataset.suf||'';
 const t0=performance.now(),D=+el.dataset.ms||1900;const host=el.closest('.v')||el;host.classList.add('ticking');host.classList.remove('landed');
 (function f(n){if(!el._run)return;const q=Math.min(1,(n-t0)/D),e=1-Math.pow(1-q,4);el.textContent=fmt(t*e,d,p,s);
  if(q<1)requestAnimationFrame(f);else{el.textContent=fmt(t,d,p,s);host.classList.remove('ticking');host.classList.add('landed')}})(t0)}
function counters(slide,k){$$('[data-count]',slide).forEach(c=>{const host=c.closest('[data-st]');const on=host?+host.dataset.st<=k:k>=0;
 if(on&&!c._run){c._run=1;count(c)}else if(!on&&c._run){c._run=0;c.textContent=fmt(0,+c.dataset.dec||0,c.dataset.pre||'',c.dataset.suf||'')}})}

/* ---------------- build the deck from DECK ---------------- */
document.title=DECK.title||document.title;$('#deckEyebrow').innerHTML=rich(DECK.eyebrow||'');
const deckEl=$('#deck');
DECK.slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.dataset.title=s.title||('Slide '+(i+1));
 const r=RENDER[s.layout];if(!r){console.warn('[deck] unknown layout "'+s.layout+'" on slide '+(i+1));sec.innerHTML=head(s)}else sec.innerHTML=r(s);deckEl.appendChild(sec)});
const S=$$('.slide',deckEl);
const NARR=DECK.slides.map(s=>(s.narration&&s.narration.length?s.narration:['']).map(String));
const SPEECH=DECK.slides.map(s=>s.speech||[]);   // optional per-line spoken text, if it should differ from the bar
/* per-slide hooks for diagrams that need JS: stage(k) shows step k, reset() clears */
DECK.slides.forEach((s,i)=>{const sec=S[i];sec._hooks=[];
 if(s.layout==='graph'){const g=buildGraph($('svg.g',sec),s.graph);sec._hooks.push({stage:k=>graphStage(g,k),reset:()=>{g.gen++;clearTimeout(g.timer);graphStage(g,-1)}})}
 if(s.layout==='sequence'){const svg=$('svg.seq',sec);buildSeq(svg,s.sequence);
  const lit=k=>$$('.msg,.mt,.ah',svg).forEach(e=>e.classList.toggle('lit',+e.dataset.k<=k));sec._hooks.push({stage:lit,reset:()=>lit(-1)})}
 if(s.layout==='timeline'){const ms=$$('.ms',sec),T=s.timeline||[],fill=$('.fillbar',sec),tk=$$('.tkt',sec),sp=s.strip;
  sec._hooks.push({stage:k=>{let c=-1;T.forEach((m,j)=>{if((m.step||0)<=k)c=j});
    ms.forEach((m,j)=>{const state=j<c?'done':j===c?'now':'next';m.classList.remove('done','now','next');m.classList.add(state);const ch=$('.state',m);ch.textContent=state;ch.className='chip state'+(state==='done'?' u':state==='now'?' a':'')});
    fill.style.width=c<0?'0':(tlPos(c,T.length)-8)+'%';
    if(sp){if(k>=sp.step&&!sec._dropped){sec._dropped=1;tk.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),300+j*520)})}
     else if(k<sp.step){sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}}},
   reset:()=>{sec._dropped=0;tk.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')});fill.style.width='0';ms.forEach(m=>m.classList.remove('done','now'))}})}
 if(s.layout==='cards'&&(s.tokens||s.bars)){const tks=$$('.tk',sec),fills=$$('.bars .fill',sec);
  sec._hooks.push({stage:k=>{if(s.tokens){if(k>=s.tokens.step&&!sec._tok){sec._tok=1;tks.forEach((t,j)=>{clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('in'),j*90)})}
     else if(k<s.tokens.step){sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in')})}
     tks.forEach(t=>t.classList.toggle('fade',s.tokens.fadeStep!=null&&k>=s.tokens.fadeStep))}
    if(s.bars)fills.forEach(f=>f.style.width=(k>=s.bars.step?f.dataset.w:0)+'%')},
   reset:()=>{sec._tok=0;tks.forEach(t=>{clearTimeout(t._t);t.classList.remove('in','fade')});fills.forEach(f=>f.style.width='0')}})}
 /* extension: ask — answering is the only way past the question step */
 if(s.question){const q=s.question,fb=$('.fb',sec),bs=$$('.opt',sec),L=j=>String.fromCharCode(65+j);
  const reset=()=>{sec._answered=false;bs.forEach(b=>{b.className='opt';b.disabled=false});fb.innerHTML=''};
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();if(sec._answered)return;const j=+b.dataset.j,o=q.options[j],ok=!!o.correct,ci=q.options.findIndex(x=>x.correct),c=q.options[ci];
   sec._answered=true;bs.forEach((x,m)=>{x.disabled=true;x.classList.add(q.options[m].correct?'right':m===j?'wrong':'dim')});
   fb.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</p><p>'+rich(o.why)+'</p>'+(ok?'':'<p><b>The answer is '+L(ci)+'.</b> '+rich(c.why)+'</p>');
   if(voice&&HAS_TTS)speakLine((ok?'Right. ':'Not quite. ')+plain(o.why)+(ok?'':' The answer is '+plain(c.text)+'. '+plain(c.why)));
   else if(playing){clearTimeout(timer);timer=setTimeout(next,Math.max(4000,plain(fb.textContent).length*55))}});
  sec._hooks.push({stage:()=>{},reset})}
 /* extension: code — keep the newest lines in view as they appear */
 if(s.layout==='code'){const pane=$('.codep',sec),fr=$$('.ln.fresh',sec);
  sec._hooks.push({stage:k=>{const first=fr.find(e=>e.classList.contains('lit')||!e.hasAttribute('data-st'));
    if(first&&pane)pane.scrollTop=Math.max(0,first.offsetTop-pane.offsetTop-pane.clientHeight*0.25)},
   reset:()=>{if(pane)pane.scrollTop=0}})}
 /* extension: array — show, pick and sweep, each tied to a narration step */
 if(s.layout==='array'){const a=s.array,A=a.actions||[],cell=(r,c)=>$('.ac[data-r="'+r+'"][data-c="'+c+'"]',sec),M=$$('.am b',sec);
  let gen=0;const fmt0=v=>Number(v).toLocaleString('en-US'),setM=(i,v)=>{if(i!=null&&M[i])M[i].textContent=fmt0(v)};
  const rowsOf=x=>x.rows!=null?x.rows:x.row!=null?[x.row]:a.rows.map((_,r)=>r);
  const clear=()=>{gen++;$$('.ac',sec).forEach(e=>e.classList.remove('in','seen','hit','pick','ptr'));$$('.ai',sec).forEach(e=>e.classList.remove('pick'));M.forEach(m=>m.textContent='0')};
  const sweepTo=(x,upto)=>{const r=x.row,vals=a.rows[r].values;let read=0,acc=0,hits=0;
   for(let c=0;c<=upto;c++){const el=cell(r,c),v=Number(vals[c]);read++;el.classList.add('seen');
    if(x.mode==='sum')acc+=v;else if(x.mode==='match'&&String(vals[c])===String(x.match)){hits++;el.classList.add('hit')}}
   setM(x.readMeter,read);if(x.mode==='sum')setM(x.resultMeter,acc);if(x.mode==='match')setM(x.resultMeter,hits)};
  const stageA=k=>{clear();const g=gen;
   A.filter(x=>x.step<=k).forEach(x=>{const live=x.step===k;
    if(x.do==='show')rowsOf(x).forEach(r=>a.rows[r].values.forEach((_,c)=>{const el=cell(r,c);if(live){el._t=setTimeout(()=>{if(g===gen)el.classList.add('in')},c*45+r*120)}else el.classList.add('in')}));
    if(x.do==='pick')(x.slots||[]).forEach(c=>{rowsOf(x).forEach(r=>cell(r,c).classList.add('pick'));const i=$('.ai[data-c="'+c+'"]',sec);if(i)i.classList.add('pick')});
    if(x.do==='sweep'){const n=a.rows[x.row].values.length;
     if(!live)sweepTo(x,n-1);else{let c=0;(function tick(){if(g!==gen)return;$$('.ac.ptr',sec).forEach(e=>e.classList.remove('ptr'));
      if(c>=n)return;sweepTo(x,c);cell(x.row,c).classList.add('ptr');c++;setTimeout(tick,x.speed||140)})()}}})};
  sec._hooks.push({stage:stageA,reset:clear})}
});
/* authoring check: warns (console only) when a step number has no narration line */
DECK.slides.forEach((s,i)=>{let mx=-1;JSON.stringify(s,(k,v)=>{if((k==='step'||k==='fadeStep')&&typeof v==='number')mx=Math.max(mx,v);return v});
 if(mx>=NARR[i].length)console.warn('[deck] slide '+(i+1)+' uses step '+mx+' but has only '+NARR[i].length+' narration lines')});

/* ---------------- scaling, theme, tabs ---------------- */
function fit(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/900))}
fit();addEventListener('resize',fit);
const tt=$('#tt');function setTheme(m){document.documentElement.dataset.theme=m;tt.textContent=m==='dark'?'Light':'Dark'}
setTheme(DECK.theme==='dark'?'dark':'light');tt.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const tabs=$('#tabs');S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+esc(s.dataset.title);b.onclick=()=>go(i);tabs.appendChild(b)});

/* ---------------- voice-over ----------------
   Fixed voice by name (any word order), silent fallback through DECK.voice.fallbackLangs, then the
   browser default. Voices load asynchronously in Chrome, so the choice is redone on "voiceschanged".
   Each sentence is spoken as its own utterance (avoids Chrome cutting long utterances off). */
const V=DECK.voice||{},AUTO=DECK.auto||{},HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
const WANT=String(V.preferred||'').toLowerCase().split(/\s+/).filter(Boolean);
const isPreferred=v=>{const n=(v.name||'').toLowerCase();return WANT.length>0&&WANT.every(w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(n))};
const normLang=l=>String(l||'').toLowerCase().replace('_','-');
function chooseVoice(list){const p=list.find(isPreferred);if(p)return p;
 for(const lang of (V.fallbackLangs||[])){const L=normLang(lang),m=list.find(v=>normLang(v.lang)===L||normLang(v.lang).startsWith(L+'-')||normLang(v.lang).startsWith(L));if(m)return m}
 return null}   // null = let the browser use its default voice
function loadVoices(){if(!HAS_TTS)return;VOICE=chooseVoice(speechSynthesis.getVoices()||[])}
if(HAS_TTS){loadVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);else speechSynthesis.onvoiceschanged=loadVoices}
function speakable(s){let t=String(s);Object.entries(V.sayAs||{}).forEach(([a,b])=>{t=t.split(a).join(b)});
 return t.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d+(?:\.\d+)?)%/g,'$1 percent')}
function rateFor(v){const R=V.rate||{};if(v&&/^google/i.test(v.name))return R.google||1;if(v&&/^microsoft/i.test(v.name))return R.microsoft||1;return R.other||1}
let speechGen=0,pauseT=null;
function stopSpeech(){speechGen++;clearTimeout(pauseT);if(HAS_TTS)speechSynthesis.cancel()}
function speakLine(text){stopSpeech();const gen=speechGen;if(!VOICE)loadVoices();const v=VOICE;
 const parts=speakable(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[text];let i=0;
 (function nextSentence(){if(gen!==speechGen)return;
  if(i>=parts.length){if(playing)timer=setTimeout(next,AUTO.afterSpeechMs==null?700:AUTO.afterSpeechMs);return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());if(v){u.voice=v;u.lang=v.lang}u.rate=rateFor(v);u.pitch=V.pitch||1;u.volume=1;
  const pause=/[?!]["')]*$/.test(u.text)?(V.questionPauseMs||420):(V.sentencePauseMs||320);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(gen!==speechGen)return;pauseT=setTimeout(nextSentence,pause)};
  const wd=setTimeout(fin,Math.max(8000,u.text.length*200));   // watchdog: some browsers never fire "end"
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)})()}

/* ---------------- stepping, narration bar, auto-play ---------------- */
let cur=0,line=0,playing=false,timer=null,t0=0,dur=1,voice=false,sayGen=0;
function stage(i,k){const s=S[i];$$('[data-st]',s).forEach(e=>e.classList.toggle('lit',+e.dataset.st<=k));counters(s,k);s._hooks.forEach(h=>h.stage(k))}
function dots(){$('#ndots').innerHTML=NARR[cur].map((_,j)=>'<i class="'+(j<=line?'on':'')+'"></i>').join('')}
function go(i,startLine){if(i<0||i>=S.length)return;stopSpeech();clearTimeout(timer);
 S.forEach((s,j)=>{s.classList.toggle('on',j===i);s.classList.toggle('prev',j<i);s._hooks.forEach(h=>h.reset())});
 $$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 $$('[data-st]',S[i]).forEach(e=>e.classList.remove('lit'));counters(S[i],-1);
 cur=i;line=Math.max(0,Math.min(startLine||0,NARR[i].length-1));history.replaceState(null,'','#'+(i+1));
 const g=++sayGen;setTimeout(()=>{if(g===sayGen)say()},350)}
function say(){clearTimeout(timer);const g=++sayGen,L=NARR[cur],tx=$('#ntxt');tx.style.opacity=0;
 setTimeout(()=>{if(g!==sayGen)return;tx.textContent=L[line];tx.style.opacity=1;
  $('#ncount').textContent='slide '+(cur+1)+'/'+S.length+' · step '+(line+1)+'/'+L.length;dots();stage(cur,line);
  dur=Math.max(AUTO.minStepMs||5200,L[line].length*(AUTO.msPerChar||62));t0=performance.now();
  if(voice&&HAS_TTS)speakLine(SPEECH[cur][line]||L[line]);else if(playing)timer=setTimeout(next,dur)},250)}
/* extension: an unanswered question holds the deck on its question step */
function blocked(){const s=DECK.slides[cur];return !!s.question&&line===s.question.step&&!S[cur]._answered}
function nudge(){const s=S[cur];s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge');
 const fb=$('.fb',s);if(fb&&!fb.textContent.trim())fb.innerHTML='<p class="hint">Choose an answer to carry on.</p>'}
function next(){if(blocked()){nudge();return}stopSpeech();if(line<NARR[cur].length-1){line++;say()}else if(cur<S.length-1)go(cur+1);else{playing=false;upd()}}
function prev(){stopSpeech();if(line>0){line--;say()}else if(cur>0)go(cur-1,NARR[cur-1].length-1)}
(function prog(){const p=playing?Math.min(1,(performance.now()-t0)/dur):0;$('#nprog').style.width=(p*100)+'%';requestAnimationFrame(prog)})();
function upd(){$('#bplay').textContent=playing?'❚❚ auto':'▶ auto';$('#bplay').classList.toggle('on',playing)}
function toggleAuto(){playing=!playing;upd();clearTimeout(timer);if(playing){if(voice&&HAS_TTS)say();else timer=setTimeout(next,AUTO.firstStepDelayMs||1200)}}
function toggleVoice(){voice=!voice;const b=$('#bvoice');b.textContent=voice?'Voice on':'Voice off';b.setAttribute('aria-pressed',String(voice));b.classList.toggle('on',voice);
 if(!voice){stopSpeech();if(playing){clearTimeout(timer);timer=setTimeout(next,dur)}}else say()}
$('#bplay').onclick=toggleAuto;$('#bnext').onclick=next;$('#bprev').onclick=prev;$('#bvoice').onclick=toggleVoice;

/* keyboard: → / space next · ← back · PageDown/PageUp slide · Home/End · 1–9, 0 = slide 10 · A auto · V voice */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();next()}else if(k==='ArrowLeft'){e.preventDefault();prev()}
 else if(k==='PageDown')go(cur+1);else if(k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(S.length-1);
 else if(/^[1-9]$/.test(k))go(+k-1);else if(k==='0')go(9);else if(k==='a'||k==='A')toggleAuto();else if(k==='v'||k==='V')toggleVoice()});
/* click anywhere on the slide to advance — but not on links, buttons or while selecting text */
let clickLock=0;
deckEl.addEventListener('click',e=>{if(e.button!==0||e.target.closest('button,a,input,select,textarea,label,.ctl,.tabs'))return;
 const sel=window.getSelection&&String(window.getSelection());if(sel&&sel.trim())return;const now=performance.now();if(now-clickLock<450)return;clickLock=now;next()});
/* links (HTML or SVG) never advance the slide: stop the event in the capture phase; the link still opens */
['click','pointerdown','mousedown','pointerup','mouseup'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('a[href]'))e.stopPropagation()},true));

/* small read-only hook for automated checks */
window.__deck={go,next,prev,toggleAuto,toggleVoice,slides:S.length,narrLen:i=>NARR[i].length,
 state:()=>({cur,line,playing,voice,voiceName:VOICE?VOICE.name:null,text:$('#ntxt').textContent})};

const h0=parseInt((location.hash||'').slice(1),10);go(h0>=1&&h0<=S.length?h0-1:0);
})();
</script>
</body>
